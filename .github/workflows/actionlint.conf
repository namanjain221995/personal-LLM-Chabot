# actionlint configuration (YAML content, deliberately NOT a .yml/.yaml name).
#
# It has to live outside `.github/workflows/*.y*ml`, because BOTH GitHub
# Actions and actionlint treat every .yml/.yaml directly in that directory as
# a workflow file — a config named actionlint.yaml there is reported as a
# broken workflow by both. The .conf extension keeps it next to the pipeline
# it configures while being invisible to the workflow scanner; the `policy`
# job passes it explicitly with -config-file.
#
# Declaring the self-hosted runner's labels is not cosmetic: with them
# declared, actionlint FAILS on a typo in `runs-on`, and a typo there means a
# deploy job that silently never runs instead of one that deploys.
self-hosted-runner:
  labels:
    - dgx-spark
