# Tests every push and pull request. Nothing here needs a GPU, the model
# weights, the Salesforce org, or any secret: all four suites are offline by
# design, so this runs on free GitHub-hosted runners.
#
# What is deliberately NOT here:
#   * `npm run lint` - `next lint` was removed in Next 16 and the pinned
#     eslint-config-next is still 15.x. `tsc --noEmit` is the type gate.
#   * building the CUDA orchestrator image - its base is ~20 GB and a hosted
#     runner has ~14 GB free. The DGX builds it at deploy time instead.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher:
    name: launcher (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shim pins 3.12; 3.11 is what the containers run. The launcher is
        # standard-library only, so both must stay green.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show the Compose version the overlay tests need
        # test_compose_overlays.py renders every host fixture through REAL
        # `docker compose config`; it skips silently below v2.24, so print it.
        run: docker compose version
      - name: Run the launcher suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # TECHSARA_MODEL_CACHE must not leak in from the environment: it changes
        # the cache path the tests assert on.
        run: |
          env -u TECHSARA_MODEL_CACHE PYTHONPATH=launcher \
            python -m unittest discover -s launcher/tests -v 2>&1 | tail -30

  orchestrator:
    name: orchestrator
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major and the same initdb settings as production. Both matter:
        # conftest refuses a database whose LC_COLLATE is not C, and an
        # SQL_ASCII database makes psycopg fail to encode the migration DDL
        # (there is an em-dash in it) with UnicodeEncodeError on every test.
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techsara_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d techsara_test -q"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt
      - run: python -m pip install -q -r orchestrator/requirements-dev.txt
      - name: Run the orchestrator suite
        working-directory: orchestrator
        env:
          # conftest refuses any database name that is not unmistakably test-only.
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/techsara_test
        run: python -m pytest tests -q

  sync-worker:
    name: sync-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync-worker/requirements-dev.txt
      - run: python -m pip install -q -r sync-worker/requirements-dev.txt
      - working-directory: sync-worker
        run: python -m pytest tests -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build

  # A single required check to protect main with, instead of six.
  ci-ok:
    name: CI passed
    if: always()
    needs: [launcher, orchestrator, sync-worker, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every suite succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
