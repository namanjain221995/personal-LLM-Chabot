# Deploys main to the DGX Spark after CI has gone green.
#
# This runs on a SELF-HOSTED runner on the box itself, because the deploy
# target is this machine: it owns the GPU, the 41 GB model cache, the named
# volumes, and the .env with the production Salesforce credentials. Nothing is
# copied to a cloud runner and no secret is needed by this workflow.
#
# It is triggered by `workflow_run` rather than `push` so that a merge to main
# can never deploy code whose tests did not pass.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to deploy (must exist on the remote)"
        default: "main"
      full:
        description: "Recreate EVERY container, including the models (+6-10 min)"
        type: boolean
        default: false
      branch:
        description: "Branch to leave the production checkout on (blank = repo variable DEPLOY_BRANCH; '-' = detached HEAD)"
        default: ""

# Never let two deploys touch the same box. Queue, do not cancel: cancelling a
# half-finished `techsara up` is how you get a partially recreated stack.
concurrency:
  group: deploy-dgx-spark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch has no workflow_run context, hence the second clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, dgx-spark]
    # Optional: add required reviewers to this environment in repo settings to
    # turn every production deploy into an approval gate.
    environment: production
    timeout-minutes: 45
    steps:
      # Check out the commit being deployed, so the deploy SCRIPT is the one that
      # commit ships. Running it out of the production checkout is a bootstrap
      # trap: that checkout is by definition still at the OLD commit, so on the
      # very first deploy scripts/deploy.sh did not exist there yet and the job
      # died with "No such file or directory".
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || 'main' }}

      - name: What triggered this
        run: |
          echo "event      : ${{ github.event_name }}"
          echo "CI run     : ${{ github.event.workflow_run.html_url || 'n/a (manual)' }}"
          echo "head sha   : ${{ github.event.workflow_run.head_sha || 'origin/main' }}"

      - name: Deploy and health-gate
        env:
          # The production checkout, NOT the runner workspace: that is where
          # .env, .runtime/ and the model cache live.
          TECHSARA_DEPLOY_ROOT: ${{ vars.TECHSARA_DEPLOY_ROOT || '/home/techsphere/Documents/project/personal-LLM-Chabot' }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || 'origin/main' }}
          # Repository variable (Settings -> Secrets and variables -> Actions ->
          # Variables). Set DEPLOY_FULL=true - 1, yes and on are accepted too -
          # to recreate EVERY container on every merge, including the five
          # model servers. Costs ~10-15 min per deploy
          # because the main model reloads; the model images are pinned upstream and
          # contain none of this repo's code, so it only matters when you want a
          # guaranteed-clean slate rather than a correct one.
          DEPLOY_FULL: ${{ vars.DEPLOY_FULL }}
          # Repository variable DEPLOY_BRANCH: the branch the production
          # checkout should be left ON, fast-forwarded to the deployed commit.
          # That checkout is also the machine owner's working directory, and a
          # bare deploy leaves it in "detached HEAD", which is confusing to walk
          # into. Empty (the default) keeps that detached-HEAD behaviour. The
          # deploy only ever FAST-FORWARDS this branch; if it cannot, the branch
          # is left untouched and the deploy detaches with a warning.
          # A one-off dispatch can override it; "-" forces a detached HEAD.
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || vars.DEPLOY_BRANCH }}
        run: |
          set -euo pipefail
          cd "$TECHSARA_DEPLOY_ROOT"
          FLAGS=""
          # Accept the spellings a human actually types into a repo variable.
          # An exact-match on "true" silently does nothing for DEPLOY_FULL=1,
          # and the failure mode is invisible: the merge deploys, goes green,
          # and the model containers are simply never recreated.
          case "$(printf '%s' "${DEPLOY_FULL:-}" | tr 'A-Z' 'a-z')" in
            true|1|yes|on) WANT_FULL=1 ;;
            *)             WANT_FULL=0 ;;
          esac
          if [ "${{ github.event.inputs.full }}" = "true" ] || [ "$WANT_FULL" = 1 ]; then
            FLAGS="--full"
            echo "full restart requested (inputs.full or vars.DEPLOY_FULL)"
          fi
          # Recorded for the summary step, which runs even when this one fails.
          echo "DEPLOY_WAS_FULL=${FLAGS:+true}" >> "$GITHUB_ENV"

          # "-" is the only way a dispatch can ask for a detached HEAD while the
          # repo variable is set, because an empty input falls back to the var.
          if [ "${DEPLOY_BRANCH:-}" = "-" ]; then DEPLOY_BRANCH=""; fi
          export DEPLOY_BRANCH
          echo "checkout will land on: ${DEPLOY_BRANCH:-<detached HEAD>}"

          # From the workspace (the new commit), targeting the production root.
          "$GITHUB_WORKSPACE/scripts/deploy.sh" --ref "$DEPLOY_REF" $FLAGS

      - name: Report what is now serving
        if: always()
        env:
          TECHSARA_DEPLOY_ROOT: ${{ vars.TECHSARA_DEPLOY_ROOT || '/home/techsphere/Documents/project/personal-LLM-Chabot' }}
        run: |
          cd "$TECHSARA_DEPLOY_ROOT" || exit 0
          echo "### Deployed commit" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty='- `%h` %s' >> "$GITHUB_STEP_SUMMARY"

          # `--abbrev-ref HEAD` prints the literal "HEAD" when detached.
          ON="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
          if [ "$ON" = "HEAD" ]; then
            echo "- checkout is on a **detached HEAD** (no DEPLOY_BRANCH, or the branch could not be fast-forwarded - see the log below)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- checkout is on branch **\`$ON\`**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${DEPLOY_WAS_FULL:-}" = "true" ]; then
            echo "- **every container was recreated** (\`--full\`: the models reloaded too)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- only containers whose definition changed were recreated; the model servers kept running (set the repo variable \`DEPLOY_FULL=true\`, or re-run with **full**, to recreate everything)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "### Containers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker ps --filter label=com.docker.compose.project=sf-local-ai \
            --format 'table {{.Names}}\t{{.Status}}' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 .runtime/logs/deploy-*.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
