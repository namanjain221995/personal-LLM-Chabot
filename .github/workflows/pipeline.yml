# ONE pipeline: validate -> test -> scan -> gate -> deploy -> verify, visible as
# a single graph.
#
# It used to be two workflows chained by workflow_run (CI, then Deploy), which
# worked but read as two disconnected runs in the Actions tab — a deploy's
# tests were always "somewhere else". Same guarantees, one page:
#
#   * every push and PR runs validation, the four test suites, the schema
#     fresh-vs-upgrade proof, the supply-chain scans and the image builds, all
#     on free hosted runners, all in parallel;
#   * `CI passed` is the single aggregate gate. It asserts POSITIVELY that
#     every one of those reported `success`; see .github/workflows/scripts/
#     ci_gate.py for why `always()` plus "no failures" is not a gate;
#   * deployment runs on the self-hosted DGX runner (the box itself owns the
#     GPU, the model cache and the credentials — nothing is copied to a cloud
#     runner, no secret enters this file). It is DELIBERATELY NOT automatic:
#     see "THE DEPLOY GATE" below;
#   * the deploy is ROLLING and MODEL-PRESERVING: only containers whose
#     definition changed are recreated, and the main vLLM engine is probed
#     and left running even then (TECHSARA_PRESERVE_MAIN_MODEL, set by
#     scripts/deploy.sh for every non---full deploy). Blue-green in the
#     textbook sense is not honest on this hardware — the 35B model fills the
#     GPUs, so a second "green" stack cannot exist — but the property
#     blue-green buys, deploys that never take the product down, is exactly
#     what preserve + rolling recreate + the verify stage deliver;
#   * a verify stage then proves from the box that the site, the API, the
#     model and the monitoring plane are actually answering — including a REAL
#     completion whose token counter must move, because a wedged vLLM engine
#     serves a green /health for hours — and writes the evidence into the run
#     summary. A failure raises diagnostics rather than firing a second
#     unattended `techsara up`.
#
# ---------------------------------------------------------------- THE DEPLOY GATE
# This repository is PUBLIC and its self-hosted runner is the production box.
# Two rules follow, and both are enforced mechanically by the `policy` job:
#
#   1. no `pull_request`-triggered job may ever land on [self-hosted, dgx-spark];
#   2. every path to that runner — push AND workflow_dispatch — must be
#      restricted to refs/heads/main. A dispatch clause without a ref check is
#      a branch-restriction bypass: `workflow_dispatch` deploys whatever branch
#      it was fired from.
#
# On top of those, deployment does not happen on a branch push unless it is
# switched on explicitly:
#
#   * `workflow_dispatch` on main with the `deploy` input ticked  -> deploys;
#   * a push to main                                              -> deploys
#     ONLY if the repository variable DEPLOY_ON_PUSH is true/1/yes/on.
#
# With DEPLOY_ON_PUSH unset (the default), merging a PR into main runs the
# tests and stops. That is on purpose: this box serves live traffic and runs
# GPU benchmarks, and an unattended `techsara up` racing either of those is a
# worse outcome than a deploy that waits for a human. Set the variable when
# continuous deployment is wanted again; nothing else has to change.
#
# The `production` environment is also declared on the deploy job. Adding
# required reviewers and a deployment-branch policy to it in repo settings
# turns every deploy into an approval gate — recommended, and independent of
# everything above.
#
# ------------------------------------------------------------ WHAT IS NOT HERE
#   * `paths-ignore` / `paths` filters. A required check that is SKIPPED counts
#     as SATISFIED by branch protection, so a path filter on a required job is
#     a way to merge untested code. Everything runs on everything.
#   * building the CUDA orchestrator image - its base is ~20 GB and a hosted
#     runner has ~14 GB free. The DGX builds it at deploy time instead; the
#     `images` job proves the OTHER images build and that no Dockerfile has an
#     x86 assumption in it, which is the part a hosted runner can prove.
#
# --------------------------------------------------------- JOB DISPLAY NAMES
# Every job's `name:` is plain ASCII, and it stays that way: workflow_policy.py
# P8 fails the run on a non-ASCII display name. A job name is not decoration.
# It is the string branch protection matches a required check against, the
# string the checks API and every notification integration report, and the
# string an auditor reads in an exported run - none of which handle emoji
# predictably, and none of which are improved by them. Status glyphs inside a
# step's SUMMARY output are a different thing and are kept.
#
# The names were changed on 2026-09-12. `CI passed` was deliberately NOT
# changed: it is the one name branch protection has to reference, and renaming
# a required check silently un-protects the branch until somebody edits the
# rule. See the header of the `ci-ok` job.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy to the DGX (leave OFF to run tests only)"
        type: boolean
        default: false
      full:
        description: "Recreate EVERY container, including the models (+15-25 min: the main model reloads)"
        type: boolean
        default: false
      branch:
        description: "Branch to leave the production checkout on (blank = the branch being deployed; '-' = detached HEAD)"
        default: ""

# A newer push to the same branch makes an in-flight TEST run pointless — but
# never cancel main: a cancelled half-finished deploy is a partially recreated
# stack. Main queues; everything else supersedes.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege by construction: the token starts with NOTHING, and every job
# adds back only what it needs (in practice `contents: read`, for checkout).
# A job that forgets to declare permissions therefore gets a useless token
# rather than the repository default — and the `policy` job fails the run.
permissions: {}

jobs:
  # ==========================================================================
  # 1. VALIDATION, LINT AND TYPES
  # ==========================================================================
  policy:
    name: Policy validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Lint, static checks and the gate scripts' own tests: nothing here builds,
    # pulls a large image or waits on a service, so a quarter of an hour is
    # already generous. Every job in this file carries an explicit ceiling —
    # one without it inherits GitHub's SIX HOUR default, and workflow_policy.py
    # P7 fails the run if any job is missing one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Every workflow file is valid YAML
        run: |
          python -m pip install -q "PyYAML>=6"
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"  ok  {p}")
              except yaml.YAMLError as exc:
                  print(f"  FAIL {p}: {exc}", file=sys.stderr); bad += 1
          sys.exit(1 if bad else 0)
          PY

      # actionlint understands expression syntax, context availability, shell
      # quoting inside `run:` and runner-label typos — the class of mistake
      # that otherwise only shows up as a failed run. Pinned by DIGEST, and it
      # is a container rather than an action, so nothing is added to the
      # supply-chain surface that the `policy` job itself audits.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color \
            -config-file .github/workflows/actionlint.conf \
            -ignore 'SC2016' -ignore 'SC2129'

      # The repository's own rules: SHA pins, no pull_request_target, no fork
      # code on the DGX, least-privilege tokens, no script injection. See the
      # script's docstring for what each one is defending against.
      - name: Workflow policy (pins, triggers, permissions, injection)
        run: python .github/workflows/scripts/workflow_policy.py --default-branch main

      # E9/F63/F7/F82 only: syntax errors, comparisons that cannot mean what
      # they look like, and names that do not exist. A CORRECTNESS gate, not a
      # style gate — line width does not get to block a security fix.
      #
      # The wrapper carries a two-way baseline: a NEW finding fails, and a
      # baseline entry that stops being reported ALSO fails, so the list cannot
        # quietly become a place bugs live. It is currently EMPTY. The one entry
        # it held was a real pre-existing NameError risk in
        # orchestrator/app/core/sf_dictionary.py that this gate found on the day it
        # was switched on; it was fixed and the entry deleted the same day.
      - name: Python syntax and undefined names
        run: |
          python -m pip install -q ruff==0.14.0
          python .github/workflows/scripts/ruff_gate.py \
            orchestrator sync-worker launcher scripts .github/workflows/scripts

      - name: Shell scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "  FAIL $f"; fail=1; }
          done < <(git ls-files '*.sh' 'techsara')
          exit "$fail"

      # The gate scripts are the only code in this repository whose failure
      # mode is "everything looks green". They get tests like anything else,
      # and they run in the FIRST job so a broken gate is caught before the
      # suites it is supposed to be gating have finished.
      #
      # Run through unittest_gate.py rather than `unittest discover`, so this
      # step is also the proof that the gate refuses an empty suite — the same
      # protection the launcher job depends on, exercised on every commit.
      #
      # The floor counts tests that EXECUTED, not tests discovery collected
      # (2026-09-13): 102 run today, and a module that skips itself at import
      # no longer counts towards it.
      - name: The CI gate scripts have tests, and they pass
        run: |
          python .github/workflows/scripts/unittest_gate.py \
            --label "workflow scripts" \
            --start .github/workflows/scripts/tests \
            --min-tests 95

      - name: Migration table invariants (no database needed)
        run: |
          python -m pip install -q "psycopg[binary,pool]>=3.2,<4"
          python .github/workflows/scripts/schema_parity.py invariants

      # ---------------------------------------------------------- ROLLBACK
      # scripts/deploy-rollback.sh was reachable from nothing: `bash -n` above
      # proved it PARSES, and the recovery job printed a hand-typed command
      # that nobody had executed. A rollback path that CI never touches is a
      # rollback path nobody finds out is broken until 3 a.m.
      #
      # 2026-09-12 this step ran `--help` and grepped the text for the flag
      # names. That asserted the script's DOCUMENTATION: `--help` is an awk
      # over the header comment, so deleting the `--dry-run)` case, deleting
      # the dry run's `exit 0`, or softening the schema refusal into a warning
      # all left it green (2026-09-13 CI review). rollback_rehearsal.py runs
      # the REAL argument parsing and the REAL schema check against a sandboxed
      # deploy root with a recorded release, `docker` and `curl` stubbed to
      # answer only read verbs, and stdin closed. It asserts each scenario's
      # exit code and the sentence that proves which branch ran, that no
      # mutating docker verb was reached, and that no deploy lock was taken.
      # Nothing it does can touch a machine. Its own tests (in the step above)
      # prove it fails on each of those three mutations.
      #
      # The DGX half (the actual recorded releases) is in the `recovery` job,
      # because only the box knows them.
      - name: The rollback path parses its real arguments, and its dry run changes nothing
        run: |
          set -euo pipefail
          python .github/workflows/scripts/rollback_rehearsal.py \
            --script scripts/deploy-rollback.sh \
            --summary "$GITHUB_STEP_SUMMARY"
          {
            echo "### Rollback"
            echo ""
            echo "| step | command |"
            echo "| --- | --- |"
            echo "| see what can be rolled back to | \`scripts/deploy-rollback.sh --list\` |"
            echo "| rehearse one, changing nothing | \`scripts/deploy-rollback.sh --to <release> --dry-run\` |"
            echo "| do it | \`scripts/deploy-rollback.sh --to <release> --yes\` |"
            echo ""
            echo "It restores **images only**. There are no down migrations, so it"
            echo "refuses to roll back to code that predates a migration the database"
            echo "has already applied, and it never restores a database dump — doing"
            echo "that would delete every row written since the deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 2. TEST SUITES
  #
  # The job IDs below (`launcher`, `orchestrator`, `sync-worker`, `frontend`)
  # are load-bearing and do NOT change: `ci-ok` names them in `needs:` and
  # passes the same list to ci_gate.py --require, and that script refuses to
  # pass if the two lists ever disagree. The DISPLAY names were rewritten on
  # 2026-09-12; only `CI passed` is referenced by branch protection, and it
  # was left alone.
  # ==========================================================================
  launcher:
    name: Launcher tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The shim pins 3.12; 3.11 is what the containers run. The launcher is
        # standard-library only, so both must stay green.
        python: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Show the Compose version the overlay tests need
        # test_compose_overlays.py renders every host fixture through REAL
        # `docker compose config`; it skips silently below v2.24, so print it.
        run: docker compose version
      - name: Run the launcher suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # TECHSARA_MODEL_CACHE must not leak in from the environment: it changes
        # the cache path the tests assert on.
        #
        # No `-v`, and NO pipe. This used to be `... -v 2>&1 | tail -30`, and a
        # pipeline reports the LAST command's status: tail's. Runs 33583764792,
        # 33586072369, 33587032363 and 33641066132 each logged "FAILED
        # (failures=6)", this job reported success, ci-ok passed and the DGX
        # deployed. tail also kept only 30 of ~90 traceback lines, so the log
        # named 2 of the 6 failures. Unpiped, a failure is the step's exit code
        # and every traceback survives; without -v a green run is ~60 lines.
        #
        # And it goes through unittest_gate.py rather than `unittest discover`,
        # because `discover` reports OK on ZERO tests on Python 3.11 (3.12
        # added the NO TESTS RAN exit code; 3.11, which is what the containers
        # run, did not). This matrix runs both, so a discovery that stopped
        # working was red on one leg and green on the other — which reads as
        # flakiness, not as "the suite is gone". The floor is a real number,
        # not 1: 535 tests execute today, and a whole module dropping out
        # of discovery is the quiet version of the same failure. Lower it in
        # the same commit if tests are deliberately deleted.
        #
        # Since 2026-09-13 the floor counts tests that EXECUTED, not tests
        # that were collected: test_compose_overlays.py skips its whole module
        # when Compose v2.24+ is missing, and a skipped test used to count
        # towards the 450 exactly as a passing one did.
        run: |
          env -u TECHSARA_MODEL_CACHE PYTHONPATH=launcher \
            python .github/workflows/scripts/unittest_gate.py \
              --label "launcher" --start launcher/tests --min-tests 450

      # The monitoring deliverable ships 35 offline tests
      # (monitoring/developer-api/tests) that NOTHING in this file discovered:
      # only launcher/tests and .github/workflows/scripts/tests were gated, so
      # a dashboard panel querying an undeclared metric, an alert without a
      # runbook, a metric contract out of step with the rules, or a host-guard
      # writer that reported "missing" when it merely could not look, all
      # reached main green. They need no Prometheus, no Grafana, no container
      # and no root, and the whole suite runs in under a second.
      #
      # It runs HERE, as a step of the launcher job, rather than in a job of
      # its own -- the same argument the shard check in `orchestrator` makes:
      # a separate job would be one more `needs:` edge that can SKIP, and a
      # skipped upstream job is exactly the shape `ci-ok` exists to refuse. As
      # a step inside a job the gate already requires, its failure is an
      # ordinary red. The launcher job is the right host because this suite,
      # like the launcher's, is offline and standard-library-shaped, and the
      # 3.11/3.12 matrix then proves it on both interpreters for free.
      #
      # PyYAML is NOT in the standard library and setup-python does not bring
      # it. Without it seven of the 35 tests -- every AlertRuleTests case and
      # the contract cross-check in MetricStatusTests -- skip themselves, and
      # the run prints `OK (skipped=7)` in green. Installing it explicitly
      # (same pin as the policy job's YAML step) is what makes those seven run;
      # the floor below is what makes their absence RED instead of green,
      # because unittest_gate.py counts tests that executed, not tests that
      # were collected.
      #
      # The floor is 33 against the 35 that execute today: close enough that
      # any class dropping out of discovery fails the job, with just enough
      # slack that it is not edited every time a test is added. Lower it in
      # the same commit if tests are ever deliberately deleted.
      - name: The monitoring deliverable's tests have a gate too
        run: |
          python -m pip install -q "PyYAML>=6"
          python .github/workflows/scripts/unittest_gate.py \
            --label "monitoring" \
            --start monitoring/developer-api/tests \
            --min-tests 33

  orchestrator:
    # SHARDED (2026-09-22). The job ID stays `orchestrator`, which is what
    # `ci-ok` names in `needs:` and passes to ci_gate.py --require. A MATRIX
    # job rolls its legs up into ONE `needs.orchestrator.result`, and that
    # roll-up is `success` only when every leg succeeded: one failing shard
    # makes it `failure`, a cancelled shard makes it `cancelled`, and a matrix
    # that expanded to nothing makes it `skipped`. ci_gate.py refuses all
    # three (see its docstring on the `always()` trap), so the gate requires
    # ALL shards without a single line changing in `ci-ok`. Adding a fourth
    # entry to the matrix below is therefore covered by the gate the moment it
    # exists — which is the opposite of a separate job per shard, where the
    # gate would keep passing until somebody remembered to add it to both
    # lists.
    name: Backend quality (orchestrator, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Never fail-fast. The point of three shards is three answers: with
      # fail-fast the surviving shards are CANCELLED on the first failure, and
      # a developer fixing one broken test discovers the next one a run later.
      # The roll-up is `failure` either way, so nothing about the gate changes.
      fail-fast: false
      matrix:
        # THE SHARD COUNT IS NOT REALLY HERE. It is SHARDS in
        # .github/workflows/scripts/shard_tests.py, and every step below passes
        # `--of ${{ strategy.job-total }}` — the size GitHub actually expanded
        # this matrix to. The script refuses to run when the two disagree, so
        # editing this list alone fails all shards loudly instead of quietly
        # leaving one shard's files unrun.
        shard: [1, 2, 3]
    env:
      # One database per shard, on that shard's own ephemeral service
      # container. Not a nicety: conftest TRUNCATEs every table before EVERY
      # test, so two shards sharing a database would delete each other's
      # fixtures mid-run.
      #
      # The name ends in `_test` deliberately. conftest's `_assert_safe_test_dsn`
      # accepts only `test`, `test_…`/`test-…` or `…_test`/`…-test`, so the
      # obvious `techsara_orchestrator_test_1` would be REFUSED before a single
      # test ran. orchestrator/tests/test_ci_shards.py runs that same guard
      # over the DSN below so this cannot rot.
      SHARD_DB: techsara_orchestrator_shard${{ matrix.shard }}_test
    services:
      postgres:
        # PINNED BY DIGEST TO THE IMAGE PRODUCTION IS RUNNING. Verified on the
        # box with `docker inspect sf-local-ai-postgres-1`: same digest, and
        # the container reports PG_MAJOR=18 / PG_VERSION=18.4. It is a
        # multi-arch index, so this same digest is the aarch64 image on the DGX
        # and the x86_64 image here — one identity, two architectures.
        #
        # The initdb settings matter as much as the version: conftest refuses a
        # database whose LC_COLLATE is not C, and an SQL_ASCII database makes
        # psycopg fail to encode the migration DDL (there is an em-dash in it)
        # with UnicodeEncodeError on every test.
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techsara_orchestrator_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d techsara_orchestrator_test -q"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # 40 per shard, replacing the 90 the single job needed.
    #
    # The history: 45 was raised to 60 (2026-09-15, ~8,400 tests, cancelled at
    # 98%), and 60 to 90 (2026-09-21, release 2, cancelled at 79% after
    # 1h0m16s with nothing failing). A cancelled job reports as a FAILURE with
    # no failing test in the log, which reads like a broken build and is not
    # one, so the number kept being raised instead of the suite being split.
    # That commit (40bd49d) wrote the sharding requirement down; this is it.
    #
    # The measurement, from the two runs the 90 was sized on — 35646527143 and
    # 35653694304, step "Run the orchestrator suite": 3985 s and 3861 s of
    # pytest inside 67- and 65-minute jobs. Everything that is NOT pytest cost
    # 51 s and 49 s: container 11 s, checkout 3 s, setup-python 4 s, apt 9 s,
    # pip 23 s. pytest itself then spends ~60 s before its first test on
    # imports, CREATE DATABASE and the migrations. A third of 3985 s is 22.1
    # min, so a shard is ~24 min and three of them replace ~66 with ~24.
    #
    # 40 leaves ~65% headroom over that, which is wider than the 1.2-1.35x the
    # old ceiling ran at, on purpose: a hosted runner has been measured 4%
    # apart run-to-run on identical work and the point of a ceiling is to kill
    # a WEDGED job, not to be the thing a slow morning trips over. A shard that
    # needs 40 minutes is a regression worth a red build.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt

      # THE GUARD, and it runs FIRST — before apt and before pip, on the
      # standard library alone, so a broken split is red about ten seconds into
      # the job instead of forty minutes into it.
      #
      # A hand-rolled split fails QUIETLY: a file that no shard claims leaves
      # every shard green, and the run reports success for tests that never
      # executed. That is strictly worse than the slow suite this replaces,
      # and it is the reason 40bd49d refused to shard without this step. The
      # check re-derives the whole assignment and asserts positively that every
      # file pytest would collect under orchestrator/tests is in exactly one
      # shard, that no shard is empty, and that discovery found a plausible
      # number of files at all — an EMPTY file list satisfies "every file is in
      # exactly one shard" vacuously, and would be three green jobs that ran
      # nothing.
      #
      # It runs in every shard rather than in a job of its own on purpose. A
      # separate job would be one more `needs:` edge that can SKIP, and a
      # skipped upstream job is exactly the shape `ci-ok` exists to refuse;
      # here it is an ordinary failing step inside a job the gate already
      # requires.
      - name: Every orchestrator test file is in exactly one shard
        env:
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          python .github/workflows/scripts/shard_tests.py --check --of "$SHARD_TOTAL"

      # WeasyPrint's native libraries, so the PDF renderer suites RUN here
      # instead of skipping (until 2026-09-12 this job reported "45 skipped":
      # every PDF-producing test, quietly). The Python package itself comes
      # from requirements-dev.txt, pinned to the version the image runs.
      - name: WeasyPrint native libraries (Pango, Cairo, GDK-PixBuf)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 \
            libgdk-pixbuf-2.0-0 libcairo2 libffi8 fonts-liberation fonts-dejavu-core
      - run: python -m pip install -q -r orchestrator/requirements-dev.txt
      # Print the server version into the log. The digest above is pinned to
      # production's, but a pin is a claim; this is the evidence. If these two
      # ever diverge, a test that passes here proves nothing about the box.
      # Kept in EVERY shard. The digest above is pinned to production's, but a
      # pin is a claim and this is the evidence; each shard gets its own
      # service container, so each one's claim needs its own proof. It costs
      # under a second.
      - name: Prove the server major matches production (18.x)
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          v="$(psql -h 127.0.0.1 -U test -d techsara_orchestrator_test -tAc 'SHOW server_version')"
          echo "postgres server_version = $v"
          case "$v" in 18.*) ;; *) echo "expected PostgreSQL 18.x, got $v"; exit 1 ;; esac

      # conftest's `_ensure_database` would create this itself, with exactly
      # this statement. It is spelled out here anyway, because the locale is
      # the part that silently goes wrong: a bare `CREATE DATABASE` inherits
      # template1, and template1 is only LC_COLLATE=C because of the
      # POSTGRES_INITDB_ARGS line on the service above. Naming template0 and
      # the locale explicitly means the shard databases cannot drift away from
      # production's collation if that line is ever edited — and collation is
      # not cosmetic here: it decides what lower() folds and how ILIKE behaves,
      # which the username-uniqueness index and every search test rest on.
      # conftest re-reads pg_database.datcollate at session start and refuses
      # anything but 'C', so a mistake here is a hard error, not a wrong pass.
      #
      # Verified against a real PostgreSQL 18.6: datcollate=C, datctype=C,
      # encoding=UTF8.
      - name: One database per shard (conftest TRUNCATEs, so they cannot share)
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U test -d techsara_orchestrator_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"$SHARD_DB\" TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C' ENCODING 'UTF8'"
          psql -h 127.0.0.1 -U test -d "$SHARD_DB" -v ON_ERROR_STOP=1 \
            -tAc "SELECT current_database(), datcollate, pg_encoding_to_char(encoding) FROM pg_database WHERE datname = current_database()"
      - name: Run this shard of the orchestrator suite
        working-directory: orchestrator
        env:
        # An EPHEMERAL service container, and a database no other job and no
        # other SHARD uses.
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/${{ env.SHARD_DB }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        # The only thing that changed about this invocation is WHICH FILES it
        # is given. `-q -rs` is untouched: -rs lists every skip with its
        # reason, so a suite that stops running for real is visible in the log
        # instead of hiding in a count.
        #
        # mapfile, not `xargs`: xargs may split a long list into SEVERAL pytest
        # invocations (which would pay the schema setup twice and interleave
        # two sessions on one database) and it reports 123 rather than pytest's
        # own exit code. An array is one process and one status.
        run: |
          set -euo pipefail
          python ../.github/workflows/scripts/shard_tests.py \
            --shard "$SHARD" --of "$SHARD_TOTAL" > "$RUNNER_TEMP/shard-files.txt"
          mapfile -t SHARD_FILES < "$RUNNER_TEMP/shard-files.txt"
          echo "shard $SHARD of $SHARD_TOTAL: ${#SHARD_FILES[@]} test files"
          # An empty array would make the line below `pytest -q -rs` with no
          # paths at all, which collects the WHOLE repository from the rootdir
          # and would look like a pass. --check already refuses an empty shard;
          # this is the second lock on the same door.
          test "${#SHARD_FILES[@]}" -gt 0
          python -m pytest "${SHARD_FILES[@]}" -q -rs
      # Kept in EVERY shard. It costs one second, each shard builds its own
      # environment from apt and pip, and the PDF/office renderer tests are
      # spread across all three — so "the libraries are importable" is a claim
      # each shard has to make for itself. Until 2026-09-12 this job reported
      # "45 skipped": every PDF-producing test, quietly.
      - name: The renderer suites ran (no skip hides them)
        working-directory: orchestrator
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          for mod in ("weasyprint", "pypdfium2", "docx", "pptx", "openpyxl", "matplotlib"):
              importlib.import_module(mod)
          print("every renderer library imports in CI")
          PY

  sync-worker:
    name: Backend quality (sync worker)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sync-worker/requirements-dev.txt
      - run: python -m pip install -q -r sync-worker/requirements-dev.txt
      - working-directory: sync-worker
        run: python -m pytest tests -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # npm ci, unit tests, eslint, tsc and a real `next build`.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Lint
        # `next lint` was removed in Next 16 and the pinned eslint-config-next
        # is still 15.x — but package.json's `lint` script calls eslint
        # DIRECTLY (eslint 8 + .eslintrc.json), which works. Warnings do not
        # fail the build; errors do.
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build

  # ==========================================================================
  # 3. SCHEMA: a fresh install must land on the same schema as an upgrade
  # ==========================================================================
  schema:
    name: Schema and migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as the orchestrator job and as production — a schema
        # proof against a different major would prove nothing about this box.
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techsara_schema_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d techsara_schema_test -q"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: test
      PGPASSWORD: test
      FRESH_DSN: postgresql://test:test@127.0.0.1:5432/fresh_install_test
      UPGRADE_DSN: postgresql://test:test@127.0.0.1:5432/upgraded_from_old_test
    # Four full migration runs against two databases.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt
      - run: python -m pip install -q -r orchestrator/requirements-dev.txt

      # Two databases on one server: each is created empty here and used by
      # exactly one arm of the proof, so neither can contaminate the other.
      - name: Create the two isolated databases
        run: |
          psql -d techsara_schema_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE fresh_install_test TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C' ENCODING 'UTF8'"
          psql -d techsara_schema_test -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE upgraded_from_old_test TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C' ENCODING 'UTF8'"

      - name: A — fresh install runs every migration at once
        working-directory: orchestrator
        env:
          APP_DATABASE_URL: ${{ env.FRESH_DSN }}
        run: python ../.github/workflows/scripts/schema_parity.py --orchestrator . upgrade

      # V20 is a deliberate choice, not an arbitrary one: it is old enough to
      # predate the migrations most likely to assume a fresh shape (V21-V27,
      # the extractor/chunker versioning and the durable crawl frontier) and
      # new enough to be a state this box has actually been in.
      - name: B1 — stage an OLD database at V20
        working-directory: orchestrator
        env:
          APP_DATABASE_URL: ${{ env.UPGRADE_DSN }}
        run: python ../.github/workflows/scripts/schema_parity.py --orchestrator . stage --to 20

      - name: B2 — upgrade it the way a deploy does
        working-directory: orchestrator
        env:
          APP_DATABASE_URL: ${{ env.UPGRADE_DSN }}
        run: python ../.github/workflows/scripts/schema_parity.py --orchestrator . upgrade

      - name: A must equal B — same tables, columns, constraints, indexes
        run: |
          python .github/workflows/scripts/schema_parity.py compare \
            --a "$FRESH_DSN" --b "$UPGRADE_DSN"

      - name: Re-running the upgrade changes nothing (idempotence)
        working-directory: orchestrator
        env:
          APP_DATABASE_URL: ${{ env.UPGRADE_DSN }}
        run: python ../.github/workflows/scripts/schema_parity.py --orchestrator . upgrade

  # ==========================================================================
  # 4. SUPPLY CHAIN: dependencies, secrets, container images
  # ==========================================================================
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # gitleaks over the full history, two dependency audits and two trivy
    # passes, each pulling its own scanner image.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
        # Full history: the secret scan looks at what was COMMITTED, not just
        # at what survives in the tip. A credential deleted in a later commit
        # is still a leaked credential.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---- secrets: BLOCKING. A leaked credential is not advisory. ----------
      # Blocking, with a reviewed fingerprint baseline. See
      # .github/workflows/scripts/secret_gate.py for the three ways a naive
      # secret-scan step reports "clean" when it is not — all three were
      # reproduced on this repository on 2026-09-07 and all three are closed.
      - name: Secret scan (full git history)
        run: |
          set -euo pipefail
          mkdir -p .ci-reports
          # --redact: findings carry rule, file and line, never the value. A CI
          # log on a PUBLIC repository is not a place to reproduce a credential.
          # The report needs a WRITABLE mount of its own: the source is bind
          # mounted read-only, and a report path that cannot be written silently
          # produces an empty report next to a non-zero exit code.
          # GIT_CONFIG_*: the container runs as root against a checkout owned by
          # the runner user, and git refuses "dubious ownership" repositories —
          # without it gitleaks exits non-zero having scanned nothing.
          set +e
          docker run --rm \
            -v "$PWD:/repo:ro" -v "$PWD/.ci-reports:/out" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --redact --no-banner --report-format json --report-path /out/gitleaks.json
          rc=$?
          set -e
          python .github/workflows/scripts/secret_gate.py \
            --report .ci-reports/gitleaks.json \
            --baseline .github/workflows/gitleaks-baseline.json \
            --exit-code "$rc"

      # ---- dependencies: ADVISORY. Reported every run, never a silent pass,
      #      but a transitive advisory with no fixed release must not be able
      #      to block a security fix from shipping. -----------------------------
      # `continue-on-error: true` makes the step ADVISORY: `outcome` records
      # what really happened, `conclusion` is forced to success, and the job
      # carries on. That only works if the step can actually exit non-zero —
      # and until 2026-09-12 it could not, because every pip-audit call ended
      # in `|| echo "FINDINGS in $req"`, which is a successful echo. So the
      # summary table below reported `success` for "advisory python deps" on
      # every run ever, whether or not there were findings, which is the
      # worst kind of green: one that is printed next to the word "outcome".
      #
      # Now the findings are collected and re-raised at the end of the step.
      # The loop still visits BOTH requirement files (an early exit would hide
      # the second one), and the job still does not fail: a transitive
      # advisory with no fixed release must never be able to block a security
      # fix from shipping.
      - name: Python dependency audit (advisory)
        id: pipaudit
        continue-on-error: true
        run: |
          set -uo pipefail
          python -m pip install -q pip-audit==2.10.1 || {
            echo "pip-audit itself could not be installed"; exit 2; }
          findings=0
          for req in orchestrator/requirements-dev.txt sync-worker/requirements.txt; do
            echo "::group::pip-audit $req"
            if ! pip-audit --progress-spinner off -r "$req"; then
              echo "FINDINGS in $req"
              findings=1
            fi
            echo "::endgroup::"
          done
          if [ "$findings" -ne 0 ]; then
            echo "::warning title=Python dependency advisories::pip-audit reported findings; see the group above. Advisory, not blocking."
          fi
          exit "$findings"

      - name: npm dependency audit (advisory)
        id: npmaudit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

      # ---- container images: CRITICAL-with-a-fix is BLOCKING. --------------
      - name: Image and filesystem vulnerability scan
        run: |
          set -o pipefail
          mkdir -p "$PWD/.trivy-cache"
          scan() { # scan <scanners> <severity> <exit-code>
            docker run --rm \
              -v "$PWD:/src:ro" -v "$PWD/.trivy-cache:/root/.cache/trivy" \
              aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
              filesystem --scanners "$1" --no-progress \
              --skip-dirs /src/node_modules --skip-dirs /src/frontend/node_modules \
              --skip-dirs /src/.venv --skip-dirs /src/.runtime --skip-dirs /src/backups \
              --severity "$2" --exit-code "$3" --ignore-unfixed /src
          }
          echo "::group::advisory — vulnerabilities and Dockerfile/compose misconfig"
          scan vuln,misconfig CRITICAL,HIGH,MEDIUM 0 || true
          echo "::endgroup::"
          # BLOCKING, and deliberately narrow: a CRITICAL *vulnerability* that
          # has a fixed version available is a patch we are choosing not to
          # apply. Misconfiguration findings are NOT in the blocking pass —
          # they are opinions about hardening, and an opinion must not be able
          # to stop a security fix from reaching the box.
          scan vuln CRITICAL 1

      - name: Report what was advisory
        if: always()
        env:
          # Through `env:` rather than interpolated into the shell. These two
          # are a fixed enum and carry no injection risk, but a `run:` body
          # that reads `${{ }}` is the shape the policy job exists to keep out
          # of this file, and a reviewer should not have to work out which
          # instances are the safe ones.
          PIPAUDIT: ${{ steps.pipaudit.outcome }}
          NPMAUDIT: ${{ steps.npmaudit.outcome }}
        run: |
          {
            echo "### Supply chain"
            echo "| scan | policy | outcome |"
            echo "| --- | --- | --- |"
            echo "| secrets (gitleaks) | blocking | see above |"
            echo "| python deps (pip-audit) | advisory | \`${PIPAUDIT}\` |"
            echo "| npm deps (npm audit) | advisory | \`${NPMAUDIT}\` |"
            echo "| images/fs (trivy) | CRITICAL+fixed blocking | see above |"
            echo ""
            echo "An advisory scan reports \`failure\` here when it found something."
            echo "That is information, not a broken build: the job is green either way,"
            echo "on purpose, so an unfixable transitive advisory cannot block a"
            echo "security fix from reaching the box."
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 5. IMAGES: they must build for aarch64, and carry the revision they are
  # ==========================================================================
  images:
    name: Container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # QEMU: this runner is x86_64 and production is aarch64. Without it,
      # `--platform linux/arm64` silently is not an option.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Cheap and total: catches the base image that has no aarch64 manifest at
      # all, and the `x86_64` download URL — the two ways this repository can
      # produce an image the DGX cannot run. Covers the CUDA Dockerfile too,
      # which is far too large to build here.
      - name: aarch64 compatibility gate (all Dockerfiles)
        run: |
          python .github/workflows/scripts/arm64_gate.py \
            orchestrator/Dockerfile orchestrator/Dockerfile.cpu \
            sync-worker/Dockerfile frontend/Dockerfile \
            --skip-base nvcr.io/

      - name: Record what these images are
        run: |
          {
            echo "REV=${{ github.sha }}"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SRC=${{ github.server_url }}/${{ github.repository }}"
          } >> "$GITHUB_ENV"

      # Native builds prove the Dockerfiles are sound and are fast enough to
      # run on every push. Every image carries org.opencontainers.image.*, so
      # `docker inspect` on the box answers "which commit is this?" without a
      # tag, a manifest or a guess. The labels are applied at BUILD time, so no
      # Dockerfile has to be changed to gain them.
      - name: Build (native) with the source revision baked in
        run: |
          set -euo pipefail
          build() { # build <name> <context> [dockerfile]
            local name="$1" ctx="$2" df="${3:-}"
            echo "::group::build $name"
            docker buildx build --load --platform linux/amd64 \
              ${df:+--file "$df"} \
              --label org.opencontainers.image.revision="$REV" \
              --label org.opencontainers.image.source="$SRC" \
              --label org.opencontainers.image.created="$CREATED" \
              --label org.opencontainers.image.version="${REV:0:12}" \
              --label com.techsara.pipeline.run="${{ github.run_id }}" \
              --tag "ci-$name:${REV:0:12}" "$ctx"
            echo "::endgroup::"
          }
          build sync-worker sync-worker
          build orchestrator-cpu orchestrator orchestrator/Dockerfile.cpu
          build frontend frontend

      # A real linux/arm64 build, under emulation, of the image whose
      # dependency set is small enough to make that affordable. It is the only
      # place in CI where aarch64 wheels are actually resolved and installed —
      # the static gate above cannot see a package that has no aarch64 wheel.
      # The frontend and CUDA images are NOT emulated on purpose: `next build`
      # and a 20 GB CUDA base under QEMU cost more than the signal is worth,
      # and both are built natively on the DGX at deploy time.
      - name: Build sync-worker for linux/arm64 (emulated)
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/arm64 \
            --label org.opencontainers.image.revision="$REV" \
            --label org.opencontainers.image.source="$SRC" \
            --label org.opencontainers.image.created="$CREATED" \
            --tag "ci-sync-worker-arm64:${REV:0:12}" sync-worker

      - name: Every image records the commit it was built from
        run: |
          set -euo pipefail
          fail=0
          for img in "ci-sync-worker:${REV:0:12}" "ci-orchestrator-cpu:${REV:0:12}" \
                     "ci-frontend:${REV:0:12}" "ci-sync-worker-arm64:${REV:0:12}"; do
            got="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$img")"
            arch="$(docker image inspect --format '{{.Architecture}}' "$img")"
            if [ "$got" = "$REV" ]; then
              echo "  ok  $img  arch=$arch  revision=$got"
            else
              echo "  FAIL $img records revision '$got', expected '$REV'"; fail=1
            fi
          done
          {
            echo "### Images"
            echo '```'
            docker image ls --filter 'reference=ci-*' --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

  # ==========================================================================
  # 6. THE PUBLIC API CONTRACT
  #
  # CONTRACT-3 §7 fixes what an API key can reach, and §7 also lists what is
  # deliberately NOT exposed: Salesforce, RAG and web search, deep research,
  # uploads, artifacts, memory, conversation history, admin analytics. The
  # difference between those two lists is the whole security argument for the
  # developer platform, and it is one careless `include_router` away from
  # being wrong.
  #
  # So this job regenerates the PUBLIC OpenAPI document and asserts two things
  # that nothing else in CI asserts:
  #
  #   * it is well-formed OpenAPI 3.1 — a client generator is the first thing
  #     a developer points at it, and a document that is secretly still 3.0
  #     (`nullable: true` is the tell) breaks at THEIR build, not ours;
  #   * its operation set is exactly the one written down in
  #     .github/workflows/scripts/public-api-surface.txt. Adding a public
  #     endpoint means editing that file in the same commit, where a reviewer
  #     reads the line.
  #
  # WHY IT IS A JOB AND NOT AN `if:`
  # orchestrator/app/publicapi/ arrives partway through this programme, so the
  # gate has to cope with not existing yet. A job that SKIPPED until then would
  # be worse than nothing twice over: branch protection counts a skipped
  # required check as satisfied, and ci_gate.py correctly treats a skipped
  # dependency as a failure. So the job always RUNS and api_contract.py
  # decides — with no package it prints a banner, raises a ::warning::
  # annotation and writes "NOT ENFORCED YET" into the run summary, then
  # passes. The moment the package lands it becomes blocking on its own, with
  # no edit to this file and no switch for anyone to remember to flip.
  #
  # The corollary, so it is not a surprise on the day: between the package
  # landing and it exposing `app.publicapi.openapi:public_openapi`, this job
  # is RED. That is the intended reading of "the public surface is half-built"
  # — and the failure names the exact entry point to add. The publicapi wave
  # should land its document generator in the same change as its router.
  # ==========================================================================
  api-contract:
    name: API contract (public OpenAPI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements-dev.txt

      # The install is the expensive part, and it is pointless while the
      # package is absent. This step is allowed to skip; the CHECK below is
      # not, which is what keeps the job's own result honest.
      - name: Is there a public API package to check yet?
        id: probe
        run: |
          set -euo pipefail
          if [ -d orchestrator/app/publicapi ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the orchestrator's dependencies
        if: steps.probe.outputs.present == 'true'
        run: python -m pip install -q -r orchestrator/requirements-dev.txt

      - name: The public OpenAPI document is valid 3.1 and is the agreed surface
        run: |
          python .github/workflows/scripts/api_contract.py \
            --orchestrator orchestrator \
            --expected .github/workflows/scripts/public-api-surface.txt

  # ==========================================================================
  # 6b. END TO END: run the product before production does
  #
  # Everything above this job proves something ABOUT the tree: the tests pass,
  # the schema converges, the images build, the public OpenAPI document is the
  # agreed surface. Nothing above it RUNS the product. The artifact that
  # serves a user their first request has, until now, never handled a request
  # before production was pointed at it, and the only proof afterwards is HTTP
  # health plus one completion.
  #
  # So this job builds the orchestrator-cpu and frontend images, starts them
  # against a genuinely empty database and an in-repo stub engine, and walks
  # the product the way a person does (e2e/platform, 40-odd checks in a real
  # headless Chrome plus plain HTTP).
  #
  # WHAT IT CATCHES THAT NOTHING ELSE IN THIS FILE CAN
  #   * migrations running to LATEST_SCHEMA_VERSION inside the IMAGE's startup
  #     path against a fresh database. The `schema` job proves the SQL from the
  #     checkout; it never boots the image;
  #   * sign-in, sign-out, and a session that is dead SERVER-side afterwards;
  #   * who may open what while signed out, including `/v1` correctly ignoring
  #     cookies;
  #   * the send handshake as the BROWSER performs it, and what the server then
  #     holds: the stored answer keyed by the stream's generation_id, the
  #     stored question carrying the send intent, the intent reaching
  #     `completed`, and one answer after a reload. See the withdrawal below
  #     for what this is NOT;
  #   * a chunked upload that RESUMES across a dropped connection;
  #   * API key create and revoke, with `/v1` refusing a revoked key at once;
  #   * the PUBLIC MODEL CATALOGUE against a running deployment: `/v1/models`
  #     listing all six ids and each one resolving. api_contract.py cannot see
  #     this — the catalogue is filtered at run time by which engines the
  #     deployment is configured with (app/publicapi/registry.py), and the
  #     first local run of this stage caught exactly that: five of the six were
  #     missing because every engine URL in ci.env named one address.
  #
  # AND IT HAS TO BE RELIABLY GREEN, which it was not at first. Independent
  # verification ran the stage five times and one of the five was RED with
  # "FAIL console.playground — expected one playground execute call, saw 0"
  # after 0.4 s (41/1/1, exit 1). A job that is red one run in five is a job
  # people learn to ignore, which defeats this one's purpose, so the race is
  # closed rather than labelled: e2e/platform/suites/console.js now waits for
  # the intercepted execute call before asserting on it, and its wait for the
  # rendered answer excludes the placeholder that Playground.tsx:527 renders
  # INSIDE the output pane — which made the old wait true BEFORE the run
  # started. Measured 2026-09-27 in headless Chrome against a fixture of that
  # pane: the old predicate was true with the placeholder showing and true again
  # mid-stream, and its "has stopped running" half keyed on
  # `button[aria-label="Stop"], button.stop`, which matches NOTHING the
  # component renders (0 matches, against 1 for a match on the button's text).
  # e2e/ci/tests/playground-wait.test.js fails if either half comes back.
  #
  # WHAT ITS GREEN DOES NOT MEAN — repeated in the run summary so nobody reads
  # more into it than is there. Every item below is MEASURED from local runs of
  # this stack on 2026-09-27, not inferred: the first run of the stage as
  # committed reported 41 pass, 1 fail, 1 skip of 43 and is what found the
  # catalogue defect; after the catalogue fix and the playground fix, two full
  # local cycles against a dropped-and-recreated database were 42 pass, 0 fail,
  # 1 skip, exit 0:
  #   * nothing about the CUDA image: this runs Dockerfile.cpu, production
  #     runs Dockerfile.cuda;
  #   * nothing about aarch64: hosted runners are x86_64 and the DGX is not;
  #   * nothing about the engine, token timing or the 15-second SSE heartbeat:
  #     the stub serves a whole stream in one write;
  #   * NOT the orchestrator's SSE writer, and not its /chat worker. This is a
  #     WITHDRAWN CLAIM: in `--chat-mode stub` the suite intercepts
  #     `POST /api/chat` IN THE BROWSER (e2e/platform/suites/chat.js:22) and
  #     answers it from its own fixture (lib/stubs.js:41), so the orchestrator
  #     never writes a chat stream during this stage. Conversation titling and
  #     the API console's playground execute call are intercepted the same way
  #     (chat.js:47, suites/console.js:231), so the router path and
  #     `/v1/responses` streaming are not exercised either;
  #   * nothing about the orchestrator's own persist of an answer, which the
  #     suite's README already documents as outside stub mode;
  #   * `artifacts.panel` SKIPS itself in stub mode ("no conversation with
  #     artifacts, so the panel is not reachable without a model generation"),
  #     so the artifacts panel is not covered here at all;
  #   * NOT the public OpenAPI document. An earlier version of this comment
  #     claimed it; no check in e2e/platform fetches it. `api_contract` above
  #     is still the only proof of that surface, from the imported module;
  #   * very little of e2e/ci/engine.js. RE-MEASURED 2026-09-27 on the tree
  #     that ships: the earlier figure here ("13 requests: 7 GET /health, 3 GET
  #     /v1/models and 3 POST /score") was taken BEFORE the same change pinned
  #     ENGINE_CONTROLLER_URL at the stub, and it is wrong in both directions.
  #     Over two whole local cycles — bring-up plus the 43-check suite, each
  #     against a dropped-and-recreated database — the stub served 53 requests
  #     in 233 s of container life and 40 in 166 s, and the route it serves by
  #     far the most is the one nothing in the suite asks for:
  #       46 / 33 GET /state   the orchestrator's controller poll. Both work out
  #                        at one every 5.0 s (46/233 = 0.197/s, 33/166 =
  #                        0.199/s), which is ENGINE_STATE_POLL_S's default
  #                        (app/config.py:2184), for as long as the stack is up.
  #                        It answers 200 MONITORING_UNKNOWN (engine.js:413-432),
  #                        which app/engine_state.py excludes from both SERVING
  #                        (:87) and OPENS_BREAKER (:81), so no breaker, queue or
  #                        admission decision is made from it;
  #        5 / 5 GET /health    the orchestrator's own probe;
  #        1 / 1 GET /v1/models;
  #        1 / 1 POST /score    the reranker canary (app/rerank.py:159).
  #     The total is therefore a function of how long the stack is up, not of
  #     the suite: only the last three lines are the suite's, and they were
  #     identical in both cycles. chat,
  #     completions, embeddings and tokenize were never called through the
  #     product — zero UNIMPLEMENTED lines in the stub's log, and no such route
  #     in it at all. They are covered by e2e/ci/tests/engine.test.js and by
  #     nothing else in this job.
  #
  # NO SECRETS. The two account passwords are generated per run with
  # `openssl rand -hex 24`, written under $RUNNER_TEMP and passed by FILE
  # PATH, which e2e/platform/lib/config.js:183,187 already read through
  # readSecret(..., '<NAME>_FILE', env). They are not a GitHub Secret and must
  # not become one: a throwaway stack does not need a durable credential, and
  # a durable one on a public repository's hosted runners is a liability.
  #
  # NOT IN `CI passed` YET. It is deliberately absent from ci-ok's `needs:` and
  # from ci_gate.py --require: this stage has the largest unproven surface in
  # the pipeline (see "UNMEASURED" below), and a stage nobody has watched run
  # does not get to block a merge. Promotion is its own change, after real runs.
  #
  # WHAT IS MEASURED NOW, and what is still not (2026-09-27, local run of this
  # exact stack on the aarch64 box; `docker compose` untouched, own Postgres):
  #   * `node --test e2e/ci/tests/`      0.2 s (34 cases)
  #   * `stack.sh up`                    9.4-10.0 s over three runs — stub
  #     engine ready after 1 s, orchestrator after 4 s WITH every migration run
  #     to schema V41 against an empty database (the database was dropped and
  #     recreated between runs), frontend after 2 s, then both account seeds
  #   * `node e2e/platform/run.js`       2 m 17.6 s / 2 m 29.7 s / 2 m 21.5 s
  #     (43 checks; the middle run under a load average of 7)
  # so bring-up plus the suite is 2.5 minutes, on a 20-core box whose load
  # average was between 1.0 and 9.1 across the three runs. Peak container
  # memory with the stack up and the suite finished: orchestrator 301 MiB,
  # frontend 85 MiB, stub engine 9 MiB, Postgres 67 MiB.
  #
  # STILL UNMEASURED, and it must stay labelled: the two IMAGE BUILDS on a
  # 4-vCPU hosted runner (cache hits on every local attempt — 2.9 s and 0.3 s
  # when this was written, 2.6 s and 0.5 s again on 2026-09-27 — so the local
  # numbers say nothing), this job's peak memory, and its disk high-water mark.
  # The nearest real evidence for the build half is the `images` job on the same
  # runner class: run 35788196359, whose "Container images" job took 9 m 00 s of
  # wall clock (21:43:02Z -> 21:52:02Z, from the Actions API) for FOUR images
  # against a ceiling of 45 minutes. A "4 m 24 s" split for the "Build (native)"
  # step alone was quoted here earlier; the step log could not be retrieved to
  # confirm it, so it is UNVERIFIED and is not repeated.
  # `timeout-minutes` below is therefore still a CEILING TO KILL A
  # WEDGED JOB rather than a measurement, and it is deliberately NOT lowered on
  # the strength of a run on different hardware: the "Runner capacity" step
  # prints nproc, free -g, df -h / and docker stats with the stack up, and that
  # is what the ceiling gets re-sized on the first time this runs for real.
  # ==========================================================================
  e2e-hosted:
    name: End-to-end (hosted)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # See "WHAT IS MEASURED NOW" above: bring-up plus the suite is 2 m 27 s
    # measured locally; the two image builds on a hosted runner are not.
    timeout-minutes: 60
    services:
      postgres:
        # The SAME digest the orchestrator and schema jobs pin, which is the
        # image and major (18.4) production runs. A migration proof against a
        # different major would prove nothing about the box.
        image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techsara_e2e_ci_test
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d techsara_e2e_ci_test -q"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # BASE URL PINNING, and this is a security control rather than a default.
      # e2e/platform/lib/config.js:160 resolves the base from --base, then
      # E2E_BASE_URL, then loopback, and :170 reads allowRemote from
      # E2E_ALLOW_REMOTE === '1'. The suite WRITES: conversations, a 92 MiB
      # upload, a public share link, an API project that cannot be deleted, an
      # API key, and one failed sign-in that counts toward a per-address
      # lockout which then refuses EVERY sign-in through that frontend, other
      # people's included. So the address it writes to is a literal here and
      # is NEVER read from `inputs.` or `vars.`.
      #
      # workflow_policy.py P6 would NOT catch a mistake here: its injection
      # check walks `run:` bodies only, not `env:` blocks. The specific rule
      # that does is .github/workflows/scripts/tests/test_e2e_ci_policy.py,
      # which parses this job and asserts exactly that.
      E2E_BASE_URL: http://127.0.0.1:3901
      E2E_ALLOW_REMOTE: "0"
      # NEVER `live` in CI: there is no path from a hosted runner to this
      # deployment's engines that does not mean opening them.
      E2E_CHAT_MODE: stub
      E2E_LABEL: hosted CI
      E2E_ADMIN_EMAIL: e2e-ci-admin@test.local
      E2E_MEMBER_EMAIL: e2e-ci-member@test.local
      # The throwaway database's password, the same literal the orchestrator
      # and schema jobs use for their ephemeral service containers. It is not
      # a credential: the server exists for the length of this job and is
      # reachable only from this runner.
      STACK_PG_PASSWORD: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/platform/package-lock.json

      # FIRST, and on the standard library alone: a stub engine whose wire
      # format is wrong fails this stage in a way that reads like a product
      # defect, and a redactor that stopped working is invisible until the run
      # that uploads a password. Ten seconds here, before anything is built.
      - name: The stub engine and the redactor pass their own tests
        run: node --test e2e/ci/tests/

      - name: Per-run credentials, generated here and stored nowhere
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 24 > "$RUNNER_TEMP/e2e-admin.pw"
          openssl rand -hex 24 > "$RUNNER_TEMP/e2e-member.pw"
          # ::add-mask:: hides these in the LOG. It does NOT touch the bytes
          # actions/upload-artifact uploads — that is what e2e/ci/redact.js is
          # for, and why the redaction step below cannot be removed on the
          # grounds that "masking covers it".
          echo "::add-mask::$(cat "$RUNNER_TEMP/e2e-admin.pw")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/e2e-member.pw")"
          {
            echo "E2E_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/e2e-admin.pw"
            echo "E2E_MEMBER_PASSWORD_FILE=$RUNNER_TEMP/e2e-member.pw"
            # $RUNNER_TEMP, not `runner.temp`: the runner context is not
            # available in a job-level `env:` block, only in steps.
            echo "E2E_OUT=$RUNNER_TEMP/e2e-out"
          } >> "$GITHUB_ENV"

      # This job builds its own images rather than reusing the `images` job's.
      # A `--load`ed image does not cross a job boundary, and nothing publishes
      # them; rebuilding also keeps this job's diff disjoint from that one's.
      - name: Build the orchestrator-cpu and frontend images this stage runs
        env:
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file orchestrator/Dockerfile.cpu \
            --tag "e2e-ci-orchestrator:${REV:0:12}" orchestrator
          docker build --file frontend/Dockerfile \
            --tag "e2e-ci-frontend:${REV:0:12}" frontend
          {
            echo "E2E_CI_ORCH_IMAGE=e2e-ci-orchestrator:${REV:0:12}"
            echo "E2E_CI_FRONT_IMAGE=e2e-ci-frontend:${REV:0:12}"
          } >> "$GITHUB_ENV"

      - name: The suite's own dependencies (puppeteer-core, no browser download)
        working-directory: e2e/platform
        run: npm ci --no-audit --no-fund

      # UNMEASURED: the hosted image is documented to carry Google Chrome, and
      # this step is where that stops being an assumption. A missing browser
      # must say so in one line rather than as 14 timed-out checks.
      - name: Resolve the browser the suite launches
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo "no Google Chrome on this runner; e2e/platform launches the system browser by path"
            exit 1
          fi
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Bring up the throwaway stack (stub engine, orchestrator, frontend)
        run: bash e2e/ci/stack.sh up

      # A CAPACITY relaxation, and only capacity: the Files store refuses below
      # 250 GiB and the public API's disk guard below 20 GiB, and a hosted
      # runner has neither. e2e/ci/ci.env sets both explicitly; this step
      # proves the CONTAINER got the values it was given, rather than trusting
      # that an env file reached it. No auth, scope, rate limit, quota or
      # lockout threshold is relaxed anywhere in this stage.
      - name: The container reports the capacity values it was given
        run: |
          set -euo pipefail
          # `-i`, and it is load-bearing: without it docker exec gives the
          # container an empty stdin, `python3 -` reads an empty program and
          # exits 0, and the two asserts below never run. Measured today
          # 2026-09-27 on this branch with a heredoc whose only statements
          # print and then `exit 7`: without -i nothing printed and rc was 0,
          # with -i the line printed and rc was 7. e2e/ci/stack.sh:195 carries
          # the same -i for the same reason, and
          # test_e2e_ci_policy.py::TheStepsThatRunAProgramInsideTheContainer
          # fails if any docker exec in this job feeds a heredoc without it.
          docker exec -i techsara-e2e-ci-orchestrator python3 - <<'PY'
          from app.apifiles import limits
          from app.publicapi import disk_ledger
          gib = 1024 ** 3
          files, disk = limits.min_free_bytes(), disk_ledger.min_free_bytes()
          print(f"PUBLIC_API_FILES_MIN_FREE_GIB  -> {files} bytes")
          print(f"PUBLIC_API_MIN_FREE_DISK_BYTES -> {disk} bytes")
          assert files == gib, f"the Files store floor is {files}, not the 1 GiB ci.env sets"
          assert disk == gib, f"the disk guard is {disk}, not the 1 GiB ci.env sets"
          PY

      # THE NUMBERS THE CEILING MUST BE SIZED ON. Every other ceiling in this
      # file names the runs it was measured from; this one cannot until this
      # step has printed once on a real runner with the stack up.
      - name: Runner capacity, with the stack running (UNMEASURED until it runs)
        run: |
          set -euo pipefail
          {
            echo "nproc: $(nproc)"
            free -g
            df -h /
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
          } | tee "$RUNNER_TEMP/runner-capacity.txt"

      # Everything, including auth.login-wrong-password. That check is skipped
      # on the SHARED box stack because one failed sign-in counts toward a
      # per-address lockout that would refuse other people's sign-ins; this
      # stack is created and destroyed inside this job and nobody else signs in
      # through it, so the lockout counter is real signal here and is kept at
      # its production threshold.
      - name: Run the platform suite against the stub
        run: node e2e/platform/run.js --chat-mode stub

      # Counts and check IDS only. The report itself is NOT written into the
      # summary: a run summary on a public repository is readable by anyone
      # with the run URL, and the report keeps failures verbatim.
      - name: The verdict, in one line
        if: always()
        run: |
          set -euo pipefail
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');
          const file = path.join(process.env.E2E_OUT || '', 'results.json');
          let text = '';
          try {
            text = fs.readFileSync(file, 'utf8');
          } catch {
            console.log('### End-to-end (hosted)\n\nThe suite produced no results.json: it did not get as far as running.');
            process.exit(0);
          }
          const { results } = JSON.parse(text);
          const count = (s) => results.filter((r) => r.status === s).length;
          const failing = results.filter((r) => r.status === 'fail').map((r) => r.id);
          console.log('### End-to-end (hosted)');
          console.log('');
          console.log(`${count('pass')} passed, ${count('fail')} failed, ${count('skip')} skipped of ${results.length}.`);
          if (failing.length) {
            console.log('');
            console.log(`Failing checks: ${failing.map((id) => '`' + id + '`').join(', ')}`);
          }
          JS

      - name: What this green does NOT mean
        if: always()
        run: |
          {
            echo ""
            echo "Not proven by this stage:"
            echo "- nothing about the CUDA image: this runs \`Dockerfile.cpu\`, production runs \`Dockerfile.cuda\`"
            echo "- nothing about aarch64: hosted runners are x86_64"
            echo "- nothing about the engine, token timing or the 15 s SSE heartbeat: the stub serves the whole stream at once"
            echo "- NOT the orchestrator's SSE writer: in stub mode the suite answers \`POST /api/chat\` in the browser from its own fixture (\`suites/chat.js\`, \`lib/stubs.js\`). Conversation titling and the console playground are intercepted the same way"
            echo "- nothing about the orchestrator's own persist of an answer, which stub mode does not cover"
            echo "- \`artifacts.panel\` skips itself in stub mode: the artifacts panel is not covered"
            echo "- NOT the public OpenAPI document: no check in \`e2e/platform\` fetches it; \`api_contract\` remains the only proof of that surface"
            echo "- little of the stub engine itself. Measured over two whole local cycles on 2026-09-27: 53 requests in 233 s and 40 in 166 s, of which 46 and 33 were the orchestrator's \`GET /state\` controller poll (one every 5.0 s for as long as the stack is up, answered \`MONITORING_UNKNOWN\`). What the SUITE drove was the same in both: 5 \`GET /health\`, 1 \`GET /v1/models\` and 1 \`POST /score\` (the reranker canary). Chat, completions, embeddings and tokenize were never reached through the product"
          } >> "$GITHUB_STEP_SUMMARY"

      # FAILURE ONLY, REDACTED, AND SHORT-LIVED. e2e/platform keeps failures
      # verbatim (lib/harness.js:164 and :175 write r.error and every
      # consoleErrors entry), suites/console.js interpolates real API response
      # bodies into its assertion messages, and the suite creates a real API
      # key on every run. The only redaction the suite itself does is for
      # SCREENSHOTS. Everything uploaded goes through e2e/ci/redact.js first,
      # including the per-run passwords BY LITERAL VALUE — the auth suite signs
      # in with them, so a failing sign-in check writes one into the report.
      - name: Collect and redact everything before it leaves the runner
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p "$E2E_OUT/logs"
          bash e2e/ci/stack.sh logs techsara-e2e-ci-orchestrator 400 > "$E2E_OUT/logs/orchestrator.log" || true
          bash e2e/ci/stack.sh logs techsara-e2e-ci-frontend 200 > "$E2E_OUT/logs/frontend.log" || true
          bash e2e/ci/stack.sh logs techsara-e2e-ci-engine 200 > "$E2E_OUT/logs/stub-engine.log" || true
          cp "$RUNNER_TEMP/runner-capacity.txt" "$E2E_OUT/" 2>/dev/null || true
          # EVERY GENERATED SECRET, not only the two account passwords
          # (2026-09-27). stack.sh also generates the session signing key and
          # the API key pepper per run and puts them in the orchestrator's
          # environment, so a traceback that prints settings, or a log line
          # that echoes the environment, writes them into the file collected
          # just above. A pattern cannot catch a random hex string; only the
          # value can, which is the whole argument of e2e/ci/redact.js.
          #
          # Built as a LIST of files that exist: a missing one must not be the
          # reason the other literals go unredacted. redact.js also no longer
          # returns before doing the work when a named file cannot be read,
          # because `actions/upload-artifact` below runs on `if: failure()` and
          # would have uploaded the untouched report.
          # `if`, not `[ -s "$f" ] && …`: under `set -e` a failing AND-list as
          # the last command in a loop body ends the step, and a missing file
          # here is the normal case, not an error.
          secret_args=()
          for f in "$RUNNER_TEMP/e2e-admin.pw" "$RUNNER_TEMP/e2e-member.pw" \
                   "$RUNNER_TEMP/e2e-ci-session.key" "$RUNNER_TEMP/e2e-ci-pepper.key"; do
            if [ -s "$f" ]; then
              secret_args+=(--secrets-file "$f")
            else
              echo "redact: no $f on this runner; its literal value is not in the rule set"
            fi
          done
          node e2e/ci/redact.js "${secret_args[@]+"${secret_args[@]}"}" "$E2E_OUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-hosted-failure
          path: ${{ runner.temp }}/e2e-out
          retention-days: 3
          if-no-files-found: ignore

      - name: Tear the stack down
        if: always()
        run: bash e2e/ci/stack.sh down

  # ==========================================================================
  # 7. THE AGGREGATE RELEASE GATE
  #
  # One required check to protect main with, instead of eleven. The NAME is
  # load-bearing — branch protection references it — so it does not change even
  # though what it now covers has grown.
  #
  # `if: always()` is REQUIRED and is NOT SUFFICIENT, and the difference is the
  # whole point of this job:
  #
  #   * required, because a gate that is itself SKIPPED when an upstream job
  #     fails does not block anything: branch protection treats a skipped
  #     required check as satisfied. The gate has to run in order to say no.
  #
  #   * not sufficient, because `always()` only decides whether this job runs.
  #     The old assertion here was
  #         contains(needs.*.result,'failure') || contains(needs.*.result,'cancelled')
  #     which passes when a dependency is `skipped` — and a job skips whenever
  #     its own `if:` is false, its dependency failed, its matrix expanded to
  #     nothing, or someone deleted it from `needs:`. Proven locally: with the
  #     old expression, [success, skipped, success] reports SUCCESS.
  #
  # ci_gate.py therefore asserts POSITIVELY: every named job must be present in
  # `needs`, and every one must have result == 'success'. failure, cancelled,
  # skipped and missing are all refusals, and a job in `needs` that is not in
  # --require is also a refusal, so the two lists cannot drift apart.
  # ==========================================================================
  ci-ok:
    name: CI passed
    if: always()
    needs: [policy, launcher, orchestrator, sync-worker, frontend, schema, security, images, api-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # It reads a JSON payload and writes a table. If this takes ten minutes,
    # something is wrong with the runner, not with the gate.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Every required suite must have reported success
        env:
        # Through the environment, not interpolated into the script: the
        # payload is JSON and a `run:` body is shell.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 .github/workflows/scripts/ci_gate.py \
            --title "CI passed" \
            --require policy,launcher,orchestrator,sync-worker,frontend,schema,security,images,api-contract

      # A skipped job reports NO reason — GitHub shows "skipped" and nothing
      # else — so a deploy that does not happen is otherwise a guessing game.
      # This states the inputs to that decision while they are still visible.
      - name: Will the deploy run?
        env:
          KILL_SWITCH: ${{ vars.DEPLOY_ON_PUSH }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "### Deploy decision"
            echo ""
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| event | \`${EVENT}\` |"
            echo "| ref | \`${REF}\` |"
            echo "| DEPLOY_ON_PUSH | \`${KILL_SWITCH:-<unset>}\` |"
            echo ""
            case "${EVENT}:${REF}:${KILL_SWITCH}" in
              push:refs/heads/main:false|push:refs/heads/main:0|push:refs/heads/main:no|push:refs/heads/main:off)
                echo "Deploy is **held**: the kill switch is set." ;;
              push:refs/heads/main:*)
                echo "Deploy **will run**." ;;
              *)
                echo "No deploy: this is not a push to main." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 6 + 8. TRUSTED HARDWARE: preflight, rollout, smoke test, recovery
  #
  # Everything below runs on [self-hosted, dgx-spark] — the production box.
  # The `if:` on each job is the security boundary, not a convenience:
  #   * `github.ref == 'refs/heads/main'` applies to BOTH the push and the
  #     workflow_dispatch path, so a dispatch cannot deploy an arbitrary
  #     branch. (`workflow_dispatch` runs from the ref it was fired on.)
  #   * pull_request is not in either clause, so fork code never reaches here.
  #   * a push DEPLOYS unless the repository variable DEPLOY_ON_PUSH is set
  #     to a falsey value — a kill switch, not an opt-in, so a deploy can be
  #     stopped mid-incident without a commit and a CI run. The manual path
  #     still needs the `deploy` input ticked.
  # ==========================================================================
  deploy:
    name: Deploy to production (rolling, model-preserving)
    needs: ci-ok
    # A push to main DEPLOYS (2026-09-08, at the owner's request): merging any
    # branch into main is the release action, so it should not also need a
    # second manual step that is easy to forget.
    #
    # The repository variable is now a KILL SWITCH rather than an opt-in —
    # set DEPLOY_ON_PUSH to false/0/no/off to stop automatic deploys without
    # editing this file, which matters when the box is mid-incident and
    # nobody wants to wait on a commit and a CI run to stop the bleeding.
    # Unset (the normal state) means deploy.
    #
    # `format('{0}', ...)` IS LOAD-BEARING. An unset repository variable is
    # `null`, not an empty string, and GitHub coerces mismatched types to a
    # number before comparing: 'false' becomes NaN, and EVERY comparison
    # against NaN is false — so `vars.DEPLOY_ON_PUSH != 'false'` is false
    # when the variable is unset, and the deploy silently never runs. That
    # cost three green pushes to main that deployed nothing, each reporting
    # only "skipped" with no reason. format() forces the string comparison
    # the condition is actually asking for.
    #
    # What still has to be true first: every CI job passed (`ci-ok`), the ref
    # is main, the preflight below is happy, and the health gate after the
    # rollout accepts the result — otherwise this rolls itself back.
    if: >-
      needs.ci-ok.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' &&
         !contains(fromJSON('["false","0","no","off"]'),
                   format('{0}', vars.DEPLOY_ON_PUSH)))
      )
    runs-on: [self-hosted, dgx-spark]
    permissions:
      contents: read
    # Add required reviewers and a deployment-branch policy to this environment
    # in repo settings to turn every production deploy into an approval gate.
    environment: production
    # Never let two deploys touch the same box, whatever branch they came
    # from. Queue, do not cancel. (scripts/deploy.sh also holds an flock, which
    # is what stops a HAND-RUN deploy from colliding with this one.)
    concurrency:
      group: deploy-dgx-spark
      cancel-in-progress: false
    timeout-minutes: 45
    # What `verify` needs in order to assert something real about the main
    # model rather than printing its status and calling that a check.
    # GITHUB_ENV does not cross a job boundary; job outputs do.
    outputs:
      was_full: ${{ steps.rollout.outputs.was_full }}
      started_at: ${{ steps.rollout.outputs.started_at }}
    env:
      # The production checkout, NOT the runner workspace: that is where
      # .env, .runtime/ and the model cache live.
      TECHSARA_DEPLOY_ROOT: ${{ vars.TECHSARA_DEPLOY_ROOT || '/home/techsphere/Documents/project/personal-LLM-Chabot' }}
      DEPLOY_REF: ${{ github.sha }}
      # Repository variable DEPLOY_FULL (true/1/yes/on): recreate EVERY
      # container on every deploy, models included (+15-25 min: the main
      # model reloads). The dispatch input asks for the same, once.
      DEPLOY_FULL: ${{ vars.DEPLOY_FULL }}
      # Never interpolated into a `run:` body — see the policy job's P6.
      INPUT_FULL: ${{ inputs.full }}
      # The branch the production checkout is left ON, fast-forwarded to the
      # deployed commit. The deploy only ever FAST-FORWARDS it; "-" forces a
      # detached HEAD, and scripts/deploy.sh validates the value before
      # handing it to git.
      #
      # DERIVED from the ref being deployed rather than read from a
      # repository variable. The `if:` above already pins deploys to main, so
      # the only branch this can sensibly be IS the one being deployed — and
      # a stale variable naming a DIFFERENT branch was a quiet foot-gun:
      # `dev` cannot fast-forward to a commit merged straight into main, so
      # every such deploy silently left the owner's own working directory on
      # a detached HEAD. The dispatch input still overrides it.
      DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      # Check out the commit being deployed, so the deploy SCRIPT is the one
      # that commit ships. Running it out of the production checkout is a
      # bootstrap trap: that checkout is by definition still at the OLD commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      # ---------------------------------------------------------- PREFLIGHT
      # Everything that can say "not today" BEFORE a container is touched.
      # All of it is read-only.
      - name: Preflight — is this box in a state to be deployed to?
        run: |
          set -euo pipefail
          fail=0
          note() { printf '  %-34s %s\n' "$1" "$2"; }
          check() { if eval "$2" >/dev/null 2>&1; then note "$1" "ok"; else note "$1" "FAIL"; fail=1; fi; }

          note "runner" "$(hostname) / $(uname -m)"
          [ "$(uname -m)" = "aarch64" ] || { note "architecture" "FAIL: expected aarch64, got $(uname -m)"; fail=1; }
          check "deploy root exists"      '[ -d "$TECHSARA_DEPLOY_ROOT" ]'
          check "is a TechSara checkout"  '[ -f "$TECHSARA_DEPLOY_ROOT/techsara" ]'
          check ".env present"            '[ -f "$TECHSARA_DEPLOY_ROOT/.env" ]'
          check "docker reachable"        'docker info'
          check "deploy script shipped"   '[ -x "$GITHUB_WORKSPACE/scripts/deploy.sh" ]'

          # A deploy that runs out of disk halfway through leaves a half-built
          # image set and a stack that will not come up. 20 GB is roughly one
          # orchestrator image plus headroom.
          free_gb="$(df -BG --output=avail "$TECHSARA_DEPLOY_ROOT" | tail -1 | tr -dc '0-9')"
          note "free disk" "${free_gb} GB"
          [ "${free_gb:-0}" -ge 20 ] || { note "free disk" "FAIL: under 20 GB"; fail=1; }

          # deploy.sh takes this lock for the whole run. If something else
          # already holds it, a hand-run deploy is in progress and this one
          # would queue behind it inside the script — better to say so now.
          if [ -e "$TECHSARA_DEPLOY_ROOT/.runtime/locks/deploy.lock" ]; then
            if flock -n "$TECHSARA_DEPLOY_ROOT/.runtime/locks/deploy.lock" true 2>/dev/null; then
              note "deploy lock" "free"
            else
              note "deploy lock" "FAIL: another deploy is running"; fail=1
            fi
          else
            note "deploy lock" "not created yet (first deploy)"
          fi

          # A dirty production tree aborts deploy.sh anyway; finding out here
          # costs seconds instead of minutes.
          dirty="$(git -C "$TECHSARA_DEPLOY_ROOT" status --porcelain --untracked-files=no || true)"
          if [ -n "$dirty" ]; then
            note "production tree" "FAIL: uncommitted tracked changes"
            printf '%s\n' "$dirty" | head -20
            fail=1
          else
            note "production tree" "clean"
          fi
          exit "$fail"

      # deploy.sh --dry-run resolves the ref, reports what HEAD and the
      # configured branch would do, and changes nothing. It is the last chance
      # to see "cannot fast-forward" before it happens.
      - name: Preflight — dry run the real deploy script
        run: |
          set -euo pipefail
          cd "$TECHSARA_DEPLOY_ROOT"
          "$GITHUB_WORKSPACE/scripts/deploy.sh" --ref "$DEPLOY_REF" --dry-run

      # ------------------------------------------------------------ ROLLOUT
      - name: Deploy and health-gate
        id: rollout
        run: |
          set -euo pipefail
          cd "$TECHSARA_DEPLOY_ROOT"
          # Captured BEFORE anything is recreated. `verify` compares the main
          # model container's start time against it to prove a rolling deploy
          # really did leave the engine alone.
          echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          FLAGS=""
          # Accept the spellings a human actually types into a repo variable.
          case "$(printf '%s' "${DEPLOY_FULL:-}" | tr '[:upper:]' '[:lower:]')" in
            true|1|yes|on) WANT_FULL=1 ;;
            *)             WANT_FULL=0 ;;
          esac
          if [ "${INPUT_FULL:-}" = "true" ] || [ "$WANT_FULL" = 1 ]; then
            FLAGS="--full"
            echo "full restart requested (inputs.full or vars.DEPLOY_FULL) - the models WILL reload"
          fi
          echo "DEPLOY_WAS_FULL=${FLAGS:+true}" >> "$GITHUB_ENV"
          echo "was_full=${FLAGS:+true}" >> "$GITHUB_OUTPUT"
          if [ "${DEPLOY_BRANCH:-}" = "-" ]; then DEPLOY_BRANCH=""; fi
          export DEPLOY_BRANCH
          echo "checkout will land on: ${DEPLOY_BRANCH:-<detached HEAD>}"
          "$GITHUB_WORKSPACE/scripts/deploy.sh" --ref "$DEPLOY_REF" $FLAGS

      - name: The box is serving the commit we asked for
        run: |
          set -euo pipefail
          head="$(git -C "$TECHSARA_DEPLOY_ROOT" rev-parse HEAD)"
          echo "requested $DEPLOY_REF"
          echo "checkout  $head"
          [ "$head" = "$DEPLOY_REF" ]

      - name: Report what is now serving
        if: always()
        run: |
          cd "$TECHSARA_DEPLOY_ROOT" || exit 0
          echo "### Deployed commit" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --pretty='- `%h` %s' >> "$GITHUB_STEP_SUMMARY"
          ON="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
          if [ "$ON" = "HEAD" ]; then
            echo "- checkout is on a **detached HEAD**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- checkout is on branch **\`$ON\`**" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${DEPLOY_WAS_FULL:-}" = "true" ]; then
            echo "- **every container was recreated** (\`--full\`: the models reloaded too)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- rolling deploy: only changed containers were recreated, and the **main model was probed and left running** (\`TECHSARA_PRESERVE_MAIN_MODEL\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Containers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker ps --filter label=com.docker.compose.project=sf-local-ai \
            --format 'table {{.Names}}\t{{.Status}}' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # This was `tail -40 .runtime/logs/deploy-*.log`, and it printed
          # NOTHING. GNU tail accepts the obsolescent `-N` form only with a
          # single file operand; with a glob that matches two or more it exits
          # 1 with "option used in invalid context -- 4", and the trailing
          # `|| true` swallowed that. Every deploy after the second one
          # therefore published a summary with no log in it — silently, which
          # is the only reason it survived this long.
          #
          # `-n 40` is the portable spelling, and the log wanted here is THIS
          # deploy's, not every deploy's concatenated. Same newest-first
          # selection the recovery job uses.
          newest="$(find .runtime/logs -maxdepth 1 -name 'deploy-*.log' -printf '%T@ %p\n' 2>/dev/null \
                    | sort -rn | head -1 | cut -d' ' -f2-)"
          if [ -n "$newest" ]; then
            {
              echo "### Deploy log — last 40 lines of \`$(basename "$newest")\`"
              echo '```'
              tail -n 40 "$newest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_no deploy log was written under .runtime/logs_" >> "$GITHUB_STEP_SUMMARY"
          fi

  # --------------------------------------------------------------------------
  # SMOKE TESTS. Deliberately not "did the port answer": on 2026-09-02 this
  # engine held a green /health for 5.5 hours with a dead engine behind it, and
  # the only signal that saw it was a real completion whose token counter never
  # moved. So the model check here IS a real completion, and it asserts the
  # counter advanced.
  # --------------------------------------------------------------------------
  verify:
    name: Verify production
    needs: deploy
    # Redundant with `needs` (a job with `needs` and no status function already
    # skips when its dependency fails) but stated anyway, because the `policy`
    # job requires every self-hosted job to carry its own branch restriction.
    # A guard that is only implied is a guard nobody can audit.
    if: >-
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dgx-spark]
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TECHSARA_DEPLOY_ROOT: ${{ vars.TECHSARA_DEPLOY_ROOT || '/home/techsphere/Documents/project/personal-LLM-Chabot' }}
    steps:
      # The main engine's address is READ, not assumed (audit F065, 2026-09-13).
      # This job used to curl 127.0.0.1:8000, which answers identically whether
      # the unauthenticated vLLM API is on loopback or on every interface — so
      # the gate could not see the exposure — and which stops answering at all
      # once the launcher binds the cluster head to the docker bridge gateway
      # (CLUSTER_API_BIND_ADDRESS), so it would have failed a CORRECT bind.
      #
      # The gate script comes from a checkout of the commit being verified,
      # the same way `deploy` runs its script: the production checkout may be
      # on another commit (deploy.sh rolls it back when its own health gate
      # fails), and a gate that is missing there must not be a gate that
      # silently does not run. Only generated.env is read from the deploy root.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - name: Where the main engine was told to listen
        id: engine
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/engine_bind.py resolve \
            --generated-env "$TECHSARA_DEPLOY_ROOT/.runtime/generated.env" \
            --github-output "$GITHUB_OUTPUT"

      - name: Every endpoint answers
        id: endpoints
        env:
          ENGINE_URL: ${{ steps.engine.outputs.url }}
        run: |
          set -u
          pass=0; fail=0
          check() { # name url expect [retries]
            local name="$1" url="$2" expect="$3" tries="${4:-6}" code=""
            for _ in $(seq 1 "$tries"); do
              code="$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$url" 2>/dev/null || echo 000)"
              [ "$code" = "$expect" ] && break
              sleep 10
            done
            if [ "$code" = "$expect" ]; then
              echo "| $name | ✅ $code |" >> "$GITHUB_STEP_SUMMARY"; pass=$((pass+1))
            else
              echo "| $name | ❌ $code (wanted $expect) |" >> "$GITHUB_STEP_SUMMARY"; fail=$((fail+1))
            fi
          }
          echo "### Post-deploy verification" >> "$GITHUB_STEP_SUMMARY"
          echo "| check | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          check "frontend /login"        "http://127.0.0.1:3000/login"        200
          check "orchestrator /health"   "http://127.0.0.1:8080/health"       200
          check "main model /v1/models"  "${ENGINE_URL}/v1/models"    200 9
          check "grafana /api/health"    "http://127.0.0.1:3300/api/health"   200
          check "prometheus /-/healthy"  "http://127.0.0.1:9090/-/healthy"    200
          [ "$fail" -eq 0 ]

      - name: The model actually generates (not just answers /health)
        env:
          ENGINE_URL: ${{ steps.engine.outputs.url }}
        run: |
          set -euo pipefail
          gen="$TECHSARA_DEPLOY_ROOT/.runtime/generated.env"
          model="$(grep -m1 '^MAIN_MODEL=' "$gen" | cut -d= -f2)"
          counter() {
            curl -fsS -m 15 "${ENGINE_URL}/metrics" \
              | awk '/^vllm:generation_tokens_total/ {s+=$2} END {printf "%.0f", s+0}'
          }
          before="$(counter)"
          reply="$(curl -fsS -m 180 -H 'Content-Type: application/json' \
            -d "{\"model\":\"${model}\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the single word: READY.\"}],\"max_tokens\":8,\"temperature\":0,\"chat_template_kwargs\":{\"enable_thinking\":false}}" \
            "${ENGINE_URL}/v1/chat/completions" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["choices"][0]["message"]["content"].strip()[:40])')"
          after="$(counter)"
          echo "reply=${reply@Q}  generation_tokens_total ${before} -> ${after}"
          {
            echo ""
            echo "- real completion: \`${reply}\`"
            echo "- \`vllm:generation_tokens_total\` ${before} → ${after}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$reply" ] || { echo "the engine returned an empty completion"; exit 1; }
          # THE check. A wedged engine keeps serving /health and /v1/models and
          # this counter stops moving; that is the only difference visible from
          # outside, and it is the one that mattered.
          [ "$after" -gt "$before" ] || {
            echo "generation_tokens_total did not advance: the API server answered but the engine did not generate"
            exit 1
          }

      # This step used to read the container's status into a variable, echo it
      # into the summary next to the words "a routine deploy must NOT have
      # reset this clock", and exit 0 — unconditionally, including when the
      # container was missing entirely (`|| echo '?'` saw to that). It claimed
      # to check the single property the whole rolling-deploy design exists to
      # deliver, and it could not fail. A step like that is worse than no step:
      # it is a green tick standing where a check is supposed to be.
      #
      # Now it asserts. `deploy` publishes the moment its rollout began and
      # whether `--full` was asked for; the engine's own start time decides.
      - name: A rolling deploy did not restart the main model
        env:
          DEPLOY_WAS_FULL: ${{ needs.deploy.outputs.was_full }}
          DEPLOY_STARTED_AT: ${{ needs.deploy.outputs.started_at }}
          VLLM_CONTAINER: sf-local-ai-vllm-1
        run: |
          set -euo pipefail

          started_iso="$(docker inspect -f '{{.State.StartedAt}}' "$VLLM_CONTAINER" 2>/dev/null || true)"
          running="$(docker inspect -f '{{.State.Running}}' "$VLLM_CONTAINER" 2>/dev/null || echo false)"
          if [ -z "$started_iso" ] || [ "$running" != "true" ]; then
            echo "- main model container \`${VLLM_CONTAINER}\`: **not running**" >> "$GITHUB_STEP_SUMMARY"
            echo "the main model container is not running after a deploy that reported success"
            exit 1
          fi

          started_at="$(date -u -d "$started_iso" +%s)"
          now="$(date -u +%s)"
          uptime_min=$(( (now - started_at) / 60 ))
          echo "container started at ${started_iso} (${uptime_min} min ago); rollout began at ${DEPLOY_STARTED_AT:-<not published>}"

          if [ "${DEPLOY_WAS_FULL:-}" = "true" ]; then
            # `--full` reloads the models on purpose. Asserting the clock did
            # not move would be asserting the opposite of what was asked for,
            # so the assertion here is only that the engine came back.
            echo "- main model: **deliberately reloaded** (\`--full\`), up ${uptime_min} min" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${DEPLOY_STARTED_AT:-}" ]; then
            # The deploy job publishes this before it touches a container. An
            # empty value means the rollout step never ran or its output was
            # lost, and passing on a missing input is how a check quietly stops
            # being one.
            echo "the deploy job published no rollout start time, so preservation cannot be proved"
            exit 1
          fi

          if [ "$started_at" -ge "$DEPLOY_STARTED_AT" ]; then
            echo "- main model: **RESTARTED during a rolling deploy** — up only ${uptime_min} min" >> "$GITHUB_STEP_SUMMARY"
            echo "the main model container started at ${started_iso}, which is AFTER this"
            echo "rollout began. TECHSARA_PRESERVE_MAIN_MODEL did not hold: a routine deploy"
            echo "took the 35B engine down and cost 15-25 minutes of reload."
            exit 1
          fi
          echo "- main model: **preserved** — running since \`${started_iso}\` (${uptime_min} min), older than this rollout" >> "$GITHUB_STEP_SUMMARY"

      # THE EXPOSURE ASSERTION (audit F065 / N023, CI half). The raw vLLM API
      # has no authentication, so the question is "can it be reached from
      # outside the cluster?", and this step answers it by BEHAVIOUR.
      #
      # Under owner option A (2026-09-13) the cluster head listens on every
      # interface on purpose: the worker's healthcheck and a second tenant
      # dial it over the RoCE fabric, the orchestrator over the docker bridge,
      # and a narrower bind takes the two-node engine down. The LAN and the
      # tailnet are closed by the host packet filter (scripts/host-guard.sh).
      # The old version of this step failed on any wildcard, so it was red
      # with or without the filter and only an outage bind could turn it green.
      #
      # Now: a listener on a specific address that is neither loopback nor the
      # configured one fails, as before. A wildcard listener (or a wildcard in
      # generated.env) passes ONLY if, from the worker over ssh (BatchMode), a
      # TCP connect to the head's cluster fabric address on the engine port
      # succeeds AND a connect to every other global address the kernel lists
      # on the head fails while the same address answers on a control port the
      # filter never judges. ssh failing, the fabric connect failing, a missing
      # tool, generated.env or worker: all FAIL, never pass. There is no
      # advisory mode and no variable that turns it off. The report names
      # roles and interface classes only -- this log is public, so no address,
      # hostname or ssh target is ever printed.
      #
      # It runs LAST and on `!cancelled()`, so a red exposure never hides the
      # endpoint evidence or the model-preservation verdict above it, and a
      # failure here fails `verify`, which triggers the recovery diagnostics.
      - name: The engine API cannot be reached from outside the cluster
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/engine_bind.py check \
            --generated-env "$TECHSARA_DEPLOY_ROOT/.runtime/generated.env" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # RECOVERY. It DIAGNOSES; it does not act.
  #
  # scripts/deploy.sh already owns automatic recovery for the case it can
  # judge: if its own health gate fails it rolls the checkout back to the
  # previous commit and brings the stack up again, and if THAT fails it says
  # the box needs a human. By the time `verify` runs, deploy.sh has already
  # declared the stack healthy — so a verify failure means something degraded
  # afterwards, and the right response is not a second unattended `techsara
  # up`. On this hardware a spurious rollback can reload a 35B model and take
  # the product down for 15-25 minutes to fix a flaky HTTP probe. So: collect
  # everything a human needs, print the exact command, and stop.
  # --------------------------------------------------------------------------
  recovery:
    name: Recovery diagnostics
    needs: [deploy, verify]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy.result == 'failure' || needs.verify.result == 'failure')
    runs-on: [self-hosted, dgx-spark]
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      TECHSARA_DEPLOY_ROOT: ${{ vars.TECHSARA_DEPLOY_ROOT || '/home/techsphere/Documents/project/personal-LLM-Chabot' }}
    steps:
      - name: Collect the state a human needs
        run: |
          set -u
          cd "$TECHSARA_DEPLOY_ROOT" || exit 0
          {
            echo "## Deploy/verify failed — diagnostics"
            echo ""
            echo "- deploy: \`${{ needs.deploy.result }}\`  ·  verify: \`${{ needs.verify.result }}\`"
            echo "- checkout HEAD: \`$(git rev-parse --short HEAD 2>/dev/null || echo '?')\` on \`$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')\`"
            echo ""
            echo "### Containers"
            echo '```'
            docker ps -a --filter label=com.docker.compose.project=sf-local-ai \
              --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}' 2>&1 | head -40
            echo '```'
            echo "### Orchestrator /health"
            echo '```json'
            curl -fsS -m 15 http://127.0.0.1:8080/health 2>&1 | head -60
            echo '```'
            echo "### Last deploy log"
            echo '```'
            newest="$(find .runtime/logs -maxdepth 1 -name 'deploy-*.log' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)"
            if [ -n "$newest" ]; then tail -80 "$newest"; else echo "no deploy log"; fi
            echo '```'
            echo "### What deploy.sh already did"
            if [ "${{ needs.deploy.result }}" = "failure" ]; then
              echo "The deploy script's own health gate failed, so it ALREADY attempted a"
              echo "rollback to the previously-live commit. Read the log above for whether"
              echo "the rollback came up healthy."
            else
              echo "deploy.sh passed its health gate and did NOT roll back; the stack"
              echo "degraded after it finished. Nothing has been changed automatically."
            fi
            echo ""
            echo "### To roll back by hand, from the box"
            echo '```bash'
            echo "cd $TECHSARA_DEPLOY_ROOT"
            echo "scripts/deploy.sh --ref <last-good-sha>      # health-gated, rolls itself back on failure"
            echo "scripts/cluster-status.sh                    # two-node fabric"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The line above says "<last-good-sha>", which at 3 a.m. is a question,
      # not an instruction. Only the box knows what was recorded, so ask it
      # here and print the real answers. `--list` is read-only: it does not
      # take the deploy lock, touch a container or move a tag.
      #
      # `|| true` throughout, deliberately. This job's contract is to collect
      # evidence and stop; a rollback listing that fails must not replace the
      # diagnostics above with a shell error.
      - name: What can actually be rolled back to
        if: always()
        run: |
          set -u
          cd "$TECHSARA_DEPLOY_ROOT" || exit 0
          {
            echo "### Recorded releases (\`scripts/deploy-rollback.sh --list\`)"
            echo '```'
            scripts/deploy-rollback.sh --list 2>&1 | head -30 || true
            echo '```'
            echo "Images only. There are no down migrations, so the script refuses"
            echo "to roll back to code that predates a migration this database has"
            echo "already applied, and it never restores a dump — that would delete"
            echo "every row written since the deploy."
            echo ""
            echo '```bash'
            echo "cd $TECHSARA_DEPLOY_ROOT"
            echo "scripts/deploy-rollback.sh --to <release-from-the-table> --dry-run"
            echo "scripts/deploy-rollback.sh --to <release-from-the-table> --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say plainly that nothing was changed automatically
        run: |
          echo "Diagnostics only. No container was restarted and no commit was moved by this job."
          exit 1
