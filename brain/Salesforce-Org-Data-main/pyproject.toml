[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-graphrag"
version = "0.1.0"
description = "Read-only GraphRAG indexer for Salesforce DX source"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
graphrag = "graphrag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
