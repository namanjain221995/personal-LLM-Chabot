# Compiled 2026-08-19 from brain/sources/customer-success-candidate-lifecycle-sop.txt
# ("SOP - Chartflow from Phase 1 to 7", a visual process-flow SOP).
#
# The source is deliberately schema-free: it says, repeatedly, that its business
# labels are NOT Salesforce field names and that any mapping must be verified
# separately against production before it is taught. So the mapping was done
# here, against the live warehouse (1,064 tables / 19,556 columns, read
# 2026-08-19) — every value quoted in `rules` is a real picklist value with its
# real production count. Where production has nothing, the rules say so instead
# of guessing.
#
# No `field_notes`: every field this SOP touches is already owned by another
# pack (Onboarding__c.Status__c by docusign-integration/kb-onboarding-hr,
# Account.Candidate_Status__c by kb-core-people, Interview__c.Interview_Outcome__c
# by kb-external-interviews, Internal_Interview__c.Human_Decision__c by
# internal-interview). Notes are global and last-write-wins in filename order,
# and `cs-*` sorts first, so a note here would silently shadow theirs.
name: cs-candidate-lifecycle
description: >-
  The Customer Success candidate-lifecycle SOP, Phase 1 to Phase 7: Sales
  screening, the Marketing intake gate, upfront payment and CS onboarding,
  the resume process and its auto-approval rules, Week 1/Week 2 training with
  a single retry, out-of-training confirmation and the marketing handoff,
  interview operations with readiness and rejection coaching, and the offer
  stage where credential release is gated on a CS confirmation that ACH is
  signed — plus which production record each business phase actually lands in.

