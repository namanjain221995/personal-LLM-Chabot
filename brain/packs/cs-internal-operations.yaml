# Compiled 2026-08-19 from brain/sources/customer-success-internal-operations-sop.txt
# (the internal Customer Success SOP PDF, converted to structured knowledge).
#
# This SOP is the one that explicitly tells CS to "change the Salesforce status
# to Service Agreement" and "change the status to Resume Creation" — while
# stating that the PDF names no object or field. Both labels turned out to be
# real production picklist values on Onboarding__c.Status__c, so the mapping is
# supplied here, verified against the live warehouse (read 2026-08-19), with
# real counts. Where the SOP describes work the org does not store at all (I-983
# tracks, USCIS cases, warning letters, TAT, kick-off calls), the rules say so
# rather than inventing a field.
#
# Companion pack: cs-candidate-lifecycle (the Phase 1-7 chart-flow SOP). The two
# sources overlap and disagree in places; see the "When the two Customer Success
# SOPs disagree" chunk below — the source itself forbids silently merging them.
#
# Only one `field_notes` entry, on the single field no other pack claims. Notes
# are global and last-write-wins in filename order, and `cs-*` sorts first, so
# anything else here would silently shadow the pack that owns it.
name: cs-internal-operations
description: >-
  The Customer Success internal-operations SOP: the welcome call and its status
  ladder, document verification and the 24-hour Team Lead assignment, resume
  follow-up, training allocation and the marketing handoff, the Initial OPT /
  STEM OPT / I-983 offer-letter tracks, case resolution and management
  escalation, the progressive-warning and immediate-behavioural termination
  paths, the offer-received checklist, EMI/ACH payment follow-up to Accounting
  confirmation, and the cross-cutting 24-hour TAT and documentation rules.

