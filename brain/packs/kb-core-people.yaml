    DS_City__c: Legal address for the agreement.
    DS_State_Province__c: Legal address for the agreement.
    DS_ZIP_Postal_Code__c: Legal address for the agreement.
    DS_Today_Date__c: Today's date formatted MM/DD/YYYY - merged into the generated
