    Candidate_Status__c: 'THE candidate lifecycle field: In Progress | Active |
      Hold | Paused | Placed | Terminate | Closed | Resigned. Set by users and by
      the marketing-sync flow (Marketing status changes mirror here) and the Pause/Stop
      and'
    Candidate_Status_Change_Reason__c: WHY the status changed - typed by the user,
      enforced >=50 chars for any non-Active change, then chattered by Candidate_Status_Change_Log.
    Reason_for_Hold__c: Reason the candidate is on Hold/Paused - written by the
      marketing-status sync flow (copying the Marketing record's hold/pause reasons)
      and by the Onboarding_record_Inactive screen flow.
    Assigned_Recruiter__c: The Techsara recruiter (Employee record, NOT a User)
      working this candidate. Auto-synced from the Marketing engagement by Marketing_Update_Assigned_Recruiter_on_Candidate.
    Candidate_Owner_Name__c: Owner.FirstName + Owner.LastName - a plain-text owner
      name for reports and for copying onto Onboarding at creation.
    Candidate_Referral__c: Self-lookup to the candidate who REFERRED this one. Set
      during lead conversion when the intake says "referred by an existing candidate".
      21% populated - referrals are a significant channel.
    Employee_Referral__c: Free-text name of the Techsara employee who referred the
      candidate (intake answer copied by the lead-conversion flow).
    Acquaintances_Using_Our_Services__c: 'Intake answer: names of friends/acquaintances
      already using Techsara - a referral-mining question from the lead form.'
    Application_Start_Date__c: The day active marketing (daily job applications)
      STARTED for this candidate - stamped by Marketing_Update_Application_Start_Date_on_
      Candidate when the Marketing status goes active.
    Days_since_application_started__c: TODAY() - Application_Start_Date__c. How
      long the candidate has been in active marketing.
    Expected_No_of_Interviews__c: 'The pacing target: 5 interviews within the first
      15 days of marketing, then +10 for every further 30 days. Compared against
      the interview rollups in reports to spot under-performing engagements.'
    Last_Alert_Sent__c: When the nightly AccountSchedulerJob last sent the "no interview
      scheduled" Slack/email alert for this candidate - the job uses it as a 15-day
      throttle so the same alert is not repeated daily.
    Internal_Interview__c: Pointer to a candidate's internal screening interview.
      Never populated in practice (0 records) - the reverse lookup from Internal_Interview__c.Candidate__c
      is what is actually used.
    Middle_Name__c: Candidate's middle name (standard person name has no middle-name
      slot the org uses; also feeds the DocuSign DS_ block).
    Date_of_Birth__c: Candidate DOB - synced from the Onboarding form; read-only
      on the candidate page for everyone. Sensitive - FLS-restricted. 42% populated.
      (Used instead of the standard PersonBirthdate.)
    Date_of_Arrival__c: When the candidate arrived in the US (most candidates are
      international students on OPT). Synced from the Onboarding form.
    Last_4_digits_of_SSN__c: Last four SSN digits for background-check / I-9 style
      verification. Synced from the Onboarding form. Sensitive - check FLS before
      exposing.
    Passport_Number__c: Passport number, again for verification paperwork. Synced
      from the Onboarding form; copied onto Onboarding at creation. Sensitive.
    Secondary_Email__c: Backup personal email (PersonEmail is primary). Copied to
      Onboarding.
    Secondary_Phone__c: Backup phone number. Copied to Onboarding.
    Email_replica__c: Formula copy of PersonEmail - exists so automation/reports
      that cannot read PersonEmail directly (or need a text type) can use it.
    Slack_User_Id__c: The person's Slack member ID. Populated on EMPLOYEE Person
      Accounts (the "Recruiter" record type flavor) by Create_Recruiter_Contact
      / Provision_Employee_Portal_User so Slack automations can @-mention them.
    Current_Address__c: The candidate's current US address - the primary address
      field, written at lead conversion, edited on the page, and pushed to QuickBooks
      as the customer billing address by the Send Invoice flow.
    Home_Address__c: Home-country / permanent address (distinct from the current
      US one).
    Address_Line_1__c: Legacy flat address parts predating the compound Current_Address__c.
      Kept for old records and form mappings.
    Complete_Address__c: Concatenates the Current_Address__c parts (street, city,
      state, zip) into one display line for reports/emails.
    Race_Ethnicity__c: 'Standard US EEO self-identification: American Indian or
      Alaska Native | Asian | Black or African American | Hispanic or Latino | Native
      Hawaiian or Other Pacific Islander | White | Two or More Races | Other (please'
    Military_Status__c: 'EEO question: Active Duty | Reserve or National Guard |
      Veteran | Retired Military | Military Spouse | No Military Service | Prefer
      not to say. Synced from Onboarding.'
    Disability_Status__c: 'EEO question: Yes, I have a disability or previously
      had a disability | No, I do not have a disability | Prefer not to say. Synced
      from Onboarding.'
    Criminal_Record_Declaration__c: 'Self-declaration from the intake form: "I do
      NOT have any criminal record" | "I have a criminal record". Captured at lead
      conversion.'
    Acknowledgement_Declaration__c: Candidate acknowledged the terms/declaration
      on the intake form. Currently 0 records checked - effectively unused (verify
      with team).
    Work_Authorization__c: 'THE operative work-auth field: CPT | OPT | H1B | H4
      | Green Card | USC | Other | OPT - Initial | OPT - STEM. Synced from the Onboarding
      form; read-only on the candidate page.'
    Work_Authorization_Expiry_Date__c: When the authorization expires (critical
      for OPT/CPT candidates whose placement clock is ticking). Synced from Onboarding;
      read-only on page.
    Current_Visa_Status__c: 'Older/parallel visa field from the lead intake: CPT
      | OPT | STEM OPT Extension | H1B | B2 | Green Card EAD | Green Card / Permanent
      Resident | US Citizen.'
    Authorized_To_Work_In_US__c: Simple yes/no work-auth flag from the intake form.
      Barely used (8 checked).
    Sponsorship_Required_For_VISA__c: Whether the candidate will need visa sponsorship
      from an employer. Barely used (3 checked).
    Active_CPT__c: Candidate currently holds active CPT work authorization (relevant
      for B2B submission screening). 3 checked.
    Technology__c: The candidate's professional track/role - a long picklist (Account
      Manager, AI/ML Engineer, Business Analyst, Data Engineer, DevOps, Financial
      Analyst, Full Stack Developer, Java Developer, and ~15 more).
    Niche__c: 'Newer, coarser niche classification: AI ML Engineer | Python Developer/Engineer
      | Java Fullstack Developer/Engineer | Product/ Project Manager | Marketing
      Manager | Finance Analyst | Other.'
    Niche_Other__c: Free-text niche when Niche__c = "Other".
    Targeted_Experience_Level__c: 'Seniority the marketing targets for this candidate:
      Entry Level | Associate | Mid-Senior level | Director | Executive (mirrors
      LinkedIn''s experience-level filter).'
    Total_Years_of_Experience__c: Years of professional experience (24% populated).
      Copied to Onboarding.
    Current_Job_Position__c: The candidate's current/most recent job title.
    Currently_Employed__c: Whether the candidate is employed right now (intake answer;
      3 checked - most candidates are job-seeking students).
    List_of_Certifications__c: Certifications the candidate holds (AWS, PMP, etc.)
      - resume material.
    Preferred_Job_Type__c: Remote | Hybrid | On-site (the candidate page's work-mode
      field).
    Preferred_Work_Mode__c: 'Near-duplicate of the above ("Remote | Hybrid | Onsite"
      - the value set even carries stray quote characters). Help text: Remote =
      fully remote, Hybrid = mix, Onsite = full time at client.'
    Preferred_Locations__c: Comma-separated preferred work locations ("New Jersey,
      New York, Texas" or "Remote Only" or "Open to Relocation") - help text gives
      exactly that example. Yet another generation of the location preference.
    Open_to_relocate__c: Willing to relocate for a job - synced from Onboarding.
      42% checked.
    Relocation_Readiness__c: 'Richer intake version: Yes, I am willing to relocate
      anywhere in the USA | Yes, but only within specific states (mention in comments)
      | No, I prefer remote / local positions only | Other. Set at lead conversion.'
    Relocation_Other__c: Free-text detail when Relocation Readiness = "Other".
    Notice_Period__c: 'How soon the candidate can start: Immediate | 1 Week | 2
      Weeks | 30 Days | 60 Days. Help text tells recruiters to keep it current.'
    Day_to_day_availability_for_interviews__c: Free-text availability windows the
      scheduling team uses when booking interviews (e.g. "after 2pm ET weekdays").
    Job_Seeking_Intensity__c: 1-digit score of how actively the candidate is job
      hunting - captured at lead conversion (screening call assessment).
    Communication_Skills_Rating__c: 1-digit communication rating from the screening
      call - set during lead conversion. ~10% populated.
    Salary_Expectations__c: Free-text salary expectation ("120k", "60/hr C2C") -
      synced from Onboarding.
    Current_Rate_Expectation__c: 'Numeric rate expectation: hourly for contractors,
      annual for full-time (per help text). The B2B submission flows read it when
      proposing rates.'
    No_of_Degrees__c: How many degrees the candidate holds - drives how many of
