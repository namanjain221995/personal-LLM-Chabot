    Default_Vendor__c: Default proxy-support vendor for this candidate's interviews.
      Populated on exactly 1 record - effectively unused.
    Interview_Support__c: Flags that the candidate generally receives interview
      support (5 checked). Not referenced by any flow/Apex in the snapshot (not
      fully documented - verify with team).
    Previously_Engaged_with_Other_Consultanc__c: 'Intake: has the candidate worked
      with another consultancy before? (API name truncated at 40 chars.) 1 checked.'
    Other_Consultancies_Name__c: Which consultancies, when the above is checked.
    Upfront_Amount__c: The upfront fee paid at enrollment (67% populated). Copied
