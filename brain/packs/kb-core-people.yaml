    Marketing_Email_Id__c: The dedicated email inbox Techsara creates/uses to apply
      to jobs ON BEHALF OF the candidate (separate from the candidate's personal
      PersonEmail). Synced from Onboarding; 51% populated.
    Marketing_Email_Password__c: Password for that marketing inbox - encrypted at
