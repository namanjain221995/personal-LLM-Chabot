# Compiled 2026-08-16 from brain/sources/techsara-org-knowledge-base.txt (preprod org documentation, 71 objects) by the brain ingestion pipeline: deterministic section/field parsing, every field name validated against the production dictionary + warehouse table list, rules distilled and adversarially verified. Fields the production warehouse lacks are only ever mentioned as explicit not-synced caveats.
# Domain: PART 1 — verifier verdict: ship_with_fixes.
name: kb-core-people
description: 'Teaches the people-and-companies core: the three-flavor Account hub
  (candidates vs employee portal identities vs B2B client companies), Lead intake
  and governed conversion, the Recruiter__c "Employee" staff registry and org chart,
  and why Contact and User are only platform plumbing.'
triggers:
- lead
- leads
- lead conversion
- convert lead
- prospect
- prospects
- lead source
- person account
- person accounts
- employee
- employees
- recruiter
- recruiters
- org chart
- reporting line
- headcount
- work authorization
- visa
- opt
- cpt
- h1b
- green card
- placed
- referral
- referrals
- portal user
- portal login
- candidate status
- assigned recruiter
- former employee
tables:
- Account
- Lead
- Recruiter__c
- User
- Contact
- AccountContactRelation
rules: 'A candidate = Account with IsPersonAccount and RecordType DeveloperName
  ''PersonAccount''; ''Recruiter''-type person accounts are employee portal logins,
  never candidates; B2B Client/Vendor types = client companies.

  Candidate_Status__c: In Progress|Active|Hold|Paused|Placed|Terminate|Closed|Resigned;
  employee ''Recruiter'' accounts are also ''Active'' - filter record type first.

  Interview counts: rollups Total_Number_of_Interview__c, Total_Number_of_Initial_Calls__c,
  Interviews_Ghosted__c, Interviews_Rejected__c; Total_Interviews__c, Total_Number_of_Interviews__c,
  Total_Number_of_Applications__c, Total_Training_Sessions__c are unmaintained -
  never use.

  On Account: Work_Authorization__c is the maintained work-auth column (OPT dominates);
  Current_Visa_Status__c is sparse legacy; candidate track = Technology__c (near-dupes
  like ''Ai/ML'').

  Lookups: Account.Assigned_Recruiter__c -> Recruiter__c (Employee, NOT User); Account.Candidate_Referral__c
  -> Account; Recruiter__c.Assigned_Sr_Recruiter__c -> Recruiter__c (org chart);
  Recruiter__c.Recruiter_Contact__c -> Account (their own person account).

  Recruiter__c (label ''Employee'') is the staff registry; current staff = Employment_Status__c
  ''Active Employee''. User is only the login (ManagerId empty on all).

  Candidate questions use Account, never Contact: Contacts are ~98% hidden person-account
  shadows for portal logins.

  Lead converted = Status ''Converted''; custom shadows Email__c, Lead_Status__c,
  Rating__c, Lead_Category__c are unused - use standard Email/Status/Rating; Company
  is trigger-blanked.

  ''Create Interview'' on Account/Lead creates Internal_Interview__c, not Interview__c.

  Current_State_in_USA__c (Account+Lead) is not synced to production - answer conceptually
  and say so.

  Never state preprod counts/percentages as production facts.'
glossary:
  person account: A person-shaped Account record; in this org it is either a candidate
    ('PersonAccount' record type) or an employee's portal identity ('Recruiter'
    record type), never a company.
  employee: The Recruiter__c object (label 'Employee') - Techsara's internal staff
    registry that all work assignment points at; distinct from the Salesforce User
    login.
  recruiter: Either a Techsara staff member working candidates (a Recruiter__c row)
    or the 'Recruiter' Account record type marking an employee's portal person account
    - never a job-seeking candidate.
  assigned recruiter: 'The employee working a candidate: Account.Assigned_Recruiter__c
    pointing at Recruiter__c, auto-synced from the candidate''s Marketing engagement.'
  placed: The success endpoint of Candidate_Status__c - the candidate landed a job;
    rare in preprod data so far.
  prospect: The legacy Lead record type holding nearly the whole historical B2C
    candidate-sales book; treat it as the same flavor as 'B2C Prospective Candidate'.
  conversion: Turning a Lead into a candidate Person Account via the governed Convert
    flow, which dedupes on email or phone; B2B client leads convert to business
    Accounts instead.
  org chart: The company reporting tree encoded by chaining Recruiter__c.Assigned_Sr_Recruiter__c
    ('Reporting to') self-lookups; active employees only.
  former employee: Employment_Status__c value for departed staff, who are kept in
    the database for history and excluded from the org chart.
  AIC portal: The Experience Cloud community most staff actually log in through;
    each portal User is enabled on the employee's own person account contact.
  marketing email: The dedicated inbox Techsara creates to apply to jobs on a candidate's
    behalf (Marketing_Email_Id__c), separate from the candidate's personal email.
  shadow contact: The hidden Contact automatically owned by every Person Account,
    existing only so portal logins can attach to it - never queried for candidate
    questions.
field_notes:
  Account:
    Name: For Person Accounts the name splits into FirstName/LastName (plus Salutation);
      for business accounts it is the company name. Required.
    FirstName: For Person Accounts the name splits into FirstName/LastName (plus
      Salutation); for business accounts it is the company name. Required.
    LastName: For Person Accounts the name splits into FirstName/LastName (plus
      Salutation); for business accounts it is the company name. Required.
    PersonEmail: THE candidate email (98% populated) - the identity key the lead-convert
      dedupe and the portals match on.
    Phone: Standard phone fields; Phone is the working number (75% populated).
    PersonMobilePhone: Standard phone fields; Phone is the working number (75% populated).
    PersonHomePhone: Standard phone fields; Phone is the working number (75% populated).
    PersonOtherPhone: Standard phone fields; Phone is the working number (75% populated).
    OwnerId: Record owner. Shown read-only on the candidate page. 378 records are
      owned by inactive users - a pending cleanup in the security redesign.
    RecordTypeId: Which of the six flavors this record is (read-only on the page).
    IsPersonAccount: TRUE for candidate/employee person records (1,002 of 1,013).
    ParentId: Standard account hierarchy - used with the "Child Account" action
      for business accounts.
    Industry: The candidate's target industry (read-only on the candidate page;
