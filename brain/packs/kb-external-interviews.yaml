- title: Interview_Incentive_Configuration__mdt — What This Object Is
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: 'Interview_Incentive_Configuration__mdt is the RATE CARD of the interview

    support incentive framework - a small configuration table with exactly one

    row per interview round (Initial, First, Second ... Fifteenth, Final) that

    says, for that round: the round multiplier (how much a completed supported

    interview of that round weighs), whether the round is incentivized at all,

    and the positive/negative incentive rates.


    It exists so admins can tune the incentive economics WITHOUT editing formula

    fields or redeploying code: the incentive flow on Interview__c looks up the

    row matching the interview''s round and stamps the configured multiplier onto

    the interview, replacing the older hard-coded Round_Multiplier__c formula.

    See the Interview__c section, Group K, for how the multiplier flows into

    Weighted Credit and the final incentive amount for the support person.'
- title: Interview_Incentive_Configuration__mdt — Kind Of Object
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: "- CUSTOM METADATA TYPE (__mdt), not a data object: its 17 rows are\n  configuration\
    \ records that deploy with the metadata (they live as files\n  under customMetadata/\
    \ in the repo), survive sandbox refreshes, and are\n  edited in Setup > Custom\
    \ Metadata Types - not through tabs, imports or\n  normal record CRUD. There\
    \ is no OwnerId, no sharing, no reports.\n- 5 custom fields, 0 record types,\
    \ 0 validation rules, 0 list views.\n- Visibility: Public (any code/flow in\
    \ the org can read it).\n- Referenced by exactly one piece of automation (the\
    \ incentive flow below);\n  no Apex class reads it."
- title: Interview_Incentive_Configuration__mdt — Record Types
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: 'None. Custom metadata types do not use record types; each row is simply
    one

    round''s configuration.'
- title: Interview_Incentive_Configuration__mdt — How It Is Used — The Business
    Process
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: "STEP 1 - CONFIGURATION. An admin maintains one row per round value of\n\
    \  Interview__c.Round__c (17 rows: Initial through Fifteenth plus Final).\n\
    \  Each row carries the multiplier and rates for that round. Changing a rate\n\
    \  is a config edit (or a source-file change deployed via the pipeline) - no\n\
    \  formula or flow edit needed.\n\nSTEP 2 - CONSUMPTION AT INTERVIEW COMPLETION.\
    \ When an Interview__c record\n  is updated to Interview_Status__c = \"Completed\"\
    , the record-triggered\n  before-save flow Interview_Incentive_Calculation_Framework\
    \ runs on the\n  interview: it fetches the single mdt row where Interview_Round__c\
    \ equals\n  the interview's Round__c, then stamps that row's Round_Multiplier__c\
    \ into\n  Interview__c.Round_Multiplier_New__c and sets Incentive_Calculated_On__c\n\
    \  to now. (If no row matches the round, the multiplier is left unchanged.)\n\
    \nSTEP 3 - DOWNSTREAM MATH ON THE INTERVIEW. Formula fields on Interview__c\n\
    \  take over: Weighted_Credit__c = Base_Credit (from duration) x the stamped\n\
    \  multiplier; Incentive_Type_Formula__c classifies the outcome (Positive\n\
    \  for Moved to Next Round / Offer Received, Negative for Rejected /\n  Ghosted);\
    \ Incentive_Amount_Formula__c = weighted credit x rate. So a\n  higher-round\
    \ interview earns proportionally more credit - and Initial\n  calls earn nothing\
    \ (multiplier 0)."
- title: Interview_Incentive_Configuration__mdt — How It Is Used — The Business
    Process (2)
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: "IMPORTANT NUANCE - ONLY THE MULTIPLIER IS WIRED UP TODAY. The flow reads\n\
    \  ONLY Round_Multiplier__c. The Positive/Negative rate fields and the\n  Incentivized\
    \ checkbox are defined and filled in, but no flow or Apex\n  reads them yet:\
    \ the live +400/-100 rates are still HARD-CODED in the\n  Interview__c formula\
    \ Incentive_Rate_Applied_Formula__c (the mdt rows\n  mirror those same numbers),\
    \ and \"Initial is not incentivized\" is\n  effectively enforced by its multiplier\
    \ of 0 rather than by the checkbox.\n  Changing a rate in the mdt alone would\
    \ therefore NOT change payouts today\n  - the formula would need to be rewired\
    \ first (verify with team before\n  relying on rate edits)."
- title: Interview_Incentive_Configuration__mdt — Connected Objects
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  text: 'None - the type has no relationship fields. Its only connection is BY VALUE:

    Interview_Round__c holds the same values as the Interview__c.Round__c

    picklist, and the incentive flow joins the two by simple equality at run

    time. Its output lands on Interview__c (Round_Multiplier_New__c and

    Incentive_Calculated_On__c).'
- title: Interview_Incentive_Configuration__mdt — Business Rules
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  - validation
  text: 'None. Integrity (one row per round, rates in sensible ranges) is maintained

    by admin discipline, not by validation.'
- title: Interview_Incentive_Configuration__mdt — Automation
  keywords:
  - interview
  - incentive
  - configuration
  - mdt
  - runs
  text: "Custom metadata cannot have triggers or record-triggered flows. This type\
    \ is\nonly READ, by exactly one consumer:\n\n- Interview_Incentive_Calculation_Framework\
    \ (record-triggered flow on\n  Interview__c, before save, on update, entry condition\
    \ Interview_Status__c\n  = \"Completed\", Active): gets the row matching the\
    \ interview's round and\n  stamps Round_Multiplier_New__c + Incentive_Calculated_On__c\
    \ on the\n  interview.\n\nNo Apex class, no other flow, and no report reads\
    \ it. (The +400/-100 rate\nfields are not yet consumed by anything - see part\
    \ 4.)"
