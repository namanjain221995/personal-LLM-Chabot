- title: AI_Assignment_Logs__c — Automation
  keywords:
  - assignment
  - logs
  - runs
  text: "Nothing triggers ON this object - no record-triggered flows, no Apex trigger,\n\
    and no Apex class references it at all. It is purely a WRITE TARGET of six\n\
    flows (each creates a row as part of its run):\n\n- Interview_Main_AI_Assignment_Schedular\
    \ (Scheduled flow, DRAFT - not\n  running): daily nightly-batch launcher; would\
    \ write the \"Main AI\n  Assignment scheduler\" columns and send a Slack + email\
    \ summary.\n- Main_AI_Assignment_Launcher_Flow (Screen flow, Active; embedded\
    \ on the\n  Main AI Assignment app page): manual batch run; writes the \"Manual\
    \ Main\n  AI Assignment\" columns.\n- Reassignment (Screen flow, Active; \"\
    Reassignment\" quick action on the\n  Interview record pages): writes the Reassignment\
    \ columns plus\n  Interview_ID__c and Last_Support_Person1__c.\n- Interview_Reshuffle\
    \ (Screen flow, Active; \"Reshuffle\" quick action):\n  writes the Reshuffle\
    \ columns.\n- Interview_Roll_Back (Screen flow, Active; \"Rollback\" quick action):\n\
    \  writes the Rollback columns.\n- Interview_Preferred_Support_Person (Screen\
    \ flow, marked Obsolete in this\n  snapshot; \"PSP\" quick action): writes the\
    \ preferred-support-person\n  columns plus Round__c, Round_Info__c and Last_Support_Person1__c.\n\
    \nThe Compass_R screen flow (Draft, also embedded on the Main AI Assignment\n\
    page) calls the shared HttpCalloutGeneric Apex but does NOT yet write a log\n\
    row - the Compass_R_scheduler_* columns wait for it to be finished."
