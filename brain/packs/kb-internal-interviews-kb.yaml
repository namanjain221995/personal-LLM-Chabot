- title: Section_Evaluation__c — What This Object Is
  keywords:
  - section
  - evaluation
  text: 'The PER-SECTION line items of an internal-interview evaluation: under one

    Interview_Evaluation__c verdict, one Section Evaluation per interview section

    holds that section''s score and comment. Together the rows explain HOW the

    evaluation''s total score was arrived at (e.g. "Coding 7.0, Communication

    6.0..."). It is the evaluation-side twin of Internal_Interview_Section_Log__c:

    the section LOG records what happened while running the section; the section

    EVALUATION records the judged result under the final verdict.'
