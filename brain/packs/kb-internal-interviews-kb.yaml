- title: Internal_Interview_Section_Log__c — What This Object Is
  keywords:
  - internal
  - interview
  - section
  - log
  text: 'One row per SECTION of an internal screening interview as it was actually
    run

    - the section-level companion to the question log. An internal interview is

    structured as a sequence of sections (topic blocks like coding, communication,

    domain knowledge, defined in the Section__c config object); when the conduct

    flow runs an interview, it writes one Section Log per section holding the

    interviewer''s SCORE and COMMENT for that section, where its questions came

    from (standard bank vs AI resume-based), its position in the interview, and

    any error the AI question generator threw for that section.


    Section scores entered here are the raw material for the interview''s Human

    Total Score and for the per-section Section_Evaluation__c breakdown.'
- title: Internal_Interview_Section_Log__c — Kind Of Object
  keywords:
  - internal
  - interview
  - section
  - log
  text: "- Custom object, MASTER-DETAIL CHILD OF Internal_Interview__c. Sharing\n\
    \  \"Controlled By Parent\"; no owner of its own.\n- 7 custom fields, 0 record\
    \ types, 0 validation rules, 1 list view.\n- Auto-number Name in the format\
    \ IISL-XXXXX.\n- Scale: 104 records in preprod (same June-July 2026 window as\
    \ its parent).\n- Has its own Lightning record page (Internal_Interview_Section_Log_Record_\n\
    \  Page) so a section log can be opened and inspected directly."
- title: Internal_Interview_Section_Log__c — How It Is Used — The Business Process
  keywords:
  - internal
  - interview
  - section
  - log
  text: "STEP 1 - CREATED WHEN A SECTION STARTS. As the Internal_Interview_Conduct_\n\
    \  Interview flow walks the interview's sections (from the template or from\n\
    \  Section/Section-Interview-Type config), it creates a Section Log per\n  section\
    \ with its sequence and question source. If the AI question callout\n  fails\
    \ for a section, the error detail is captured in Error_Log__c (and the\n  flow\
    \ can fall back / continue).\n\nSTEP 2 - SCORED DURING THE INTERVIEW. After\
    \ asking the section's questions\n  (each logged in Internal_Interview_Question_Log__c\
    \ pointing back at this\n  row), the interviewer enters a section score and\
    \ comment on the flow\n  screens; the flow UPDATES this row with them.\n\nSTEP\
    \ 3 - ROLLED UP. The section scores feed the interview's Human Total\n  Score\
    \ and the Interview_Evaluation__c / Section_Evaluation__c verdict\n  records.\
    \ The \"View logs of this interview\" button reads these rows back\n  for review."
