# Compiled 2026-08-16 from brain/sources/techsara-org-knowledge-base.txt (preprod org documentation, 71 objects) by the brain ingestion pipeline: deterministic section/field parsing, every field name validated against the production dictionary + warehouse table list, rules distilled and adversarially verified. Fields the production warehouse lacks are only ever mentioned as explicit not-synced caveats.
# Knowledge-only companion to internal-interview.yaml; field notes that pack already carries are excluded here.
name: kb-internal-interviews-kb
description: 'Internal interview platform documentation (object model, templates,
  flows) from the org knowledge base. Knowledge + field notes only: rules/triggers
  for this domain live in internal-interview.yaml.'
triggers: []
tables: []
rules: ''
glossary: {}
field_notes:
  Internal_Interview__c:
    Candidate__c: The candidate (Person Account) being screened. Set by the create
      flow from whichever Account page the "Create Interview" button was clicked
      on.
    Lead__c: The not-yet-converted Lead being screened - internal screening often
      happens BEFORE lead conversion. Set by the create flow from the Lead page.
      23% of records.
    Interview_Type__c: Which kind of internal screening this is, from the small
      Interview Type config object (essentially a named list with an active flag).
      Chosen in the create flow; 100% populated.
    Niche__c: The skill niche/domain the person is assessed for (Niche records carry
      a Tech / Non Tech domain type). Chosen at creation
    Template__c: The pre-built question template used when Launch mode = "Template"
      (Template -> Template Sections -> Template Section Questions). Stamped by
      the conduct flow. Only 1 record so far - template mode is barely used.
    Interviewer__c: The internal Techsara employee who conducts the interview. Chosen
      in the create flow. 301 of 302 populated. Note this points at Recruiter__c
      (the Employee object), not at the Salesforce User.
    Scheduled_Date__c: The date the internal interview is planned for. Entered in
      the create/ reschedule flow. 100% populated. (API name says "Scheduled", label
      says "Date Of Interview".)
    Time_Zone__c: The candidate's timezone the start/end times are quoted in. Chosen
      at creation. In practice almost always "ET (Eastern Time)" (295 of 302).
    Selected_Time_Zone_End_Time__c: Interview end time in the candidate's timezone,
      same slot list, same flow. 88 records (29%).
    Human_Total_Score__c: The interviewer's total score for the whole interview,
      written by the conduct flow from the per-section scores. Populated on the
      17 completed interviews only.
    AI_Total_score__c: Reserved for an AI-computed total score of the interview.
      NO automation writes it today - empty on all 302 records. The AI-evaluation
      half of this subsystem is modeled but not yet built.
    Combined_Score__c: Reserved blend of the human and AI scores. Plain stored number
      (not a formula); never populated; nothing writes it yet.
    Final_Decision_Date__c: When the final decision was made. Manual entry; never
      populated so far.
    Comment_Summary__c: The interviewer's overall written feedback for the interview,
      entered in the conduct flow's final screens and mirrored into the child Interview_Evaluation__c.
      Shown in the View-logs screen.
  Internal_Interview_Question_Log__c:
    Internal_Interview__c: The parent interview. Required, set by the conduct flow,
      100% populated. Controls sharing.
    Internal_Interview_Section_Log__c: The per-section log row this question sits
      under - links the question to the section score/comment it contributed to.
      Set by the conduct flow, 100% populated.
    Section__c: The master Section definition the question was asked in (the reusable
      config record, as opposed to the per-interview section LOG above). Set by
      the conduct flow, 100% populated.
    Question_Bank__c: The source bank question, when the question came from the
      standard Question Bank (difficulty level, evaluation criteria live there).
    Question_Text__c: The full question text as asked. For bank questions it is
      a copy of the bank text (frozen even if the bank is edited later); for AI
      questions it is the ONLY stored copy of what the Lambda generated.
    Evalation_Criteria_log__c: Snapshot of the question's evaluation criteria (what
      a good answer looks like), copied from Question_Bank__c.Evaluation_Criteria__c
      so the interviewer can grade against it. (Note the typo in the API name -
      "Evalation".)
    Question_Source_Used__c: 'Where the question came from: "Standard" (question
      bank / template - 338 rows, 79%) | "AI Resume Based" (generated by the Lambda
      from the resume - 90 rows, 21%).'
    Sequence__c: The order the question was asked in within its section (1, 2, 3...).
      Set by the conduct flow, 100% populated.
  Internal_Interview_Section_Log__c:
    Internal_Interview__c: The parent interview. Required, flow-set, 100% populated.
      Controls sharing.
    Section__c: The Section config record being executed (what topic block this
      was). Flow-set, 100% populated.
    Sequence__c: The section's position in the interview (1st, 2nd, 3rd block...).
      Flow-set, 100% populated.
    Section_Score__c: The interviewer's score for this section (one decimal, e.g.
      7.5). Entered on the conduct-flow screen and written by the flow. Populated
      on all 104 rows; average in live data is about 5.5.
    Section_Comment__c: The interviewer's free-text notes for this section (strengths,
      gaps, follow-ups) - entered in the conduct flow alongside the score.
    Question_Source_Used__c: 'Where this section''s questions came from: "Standard"
      (bank/template - 72 rows) | "AI Resume Based" (Lambda-generated - 30 rows);
      2 legacy rows are blank.'
    Error_Log__c: Technical error detail captured when something went wrong building
      this section - typically a failed AI question-generation callout (bad resume
      format, Lambda error).
  Interview_Evaluation__c:
    Internal_Interview__c: 'The internal interview this verdict belongs to. Required,
      flow-set, 100% populated, controls sharing. (Again: no link to Interview__c
      exists.)'
    Evaluation_Type__c: 'WHO kind of evaluator produced this verdict: "Human" (the
      interviewer - what the conduct flow always writes; 16 of 17 records) | "AI"
      (reserved for a future automated evaluator - 0 records).'
    Decision__c: 'The evaluator''s decision: Hire | NoHire | Retake | Pass | Fail
      | Needs Improvement (same value list as the parent''s Human Decision field).
      Live data: Pass 16, Fail 1 - the Hire/NoHire-style values are unused so far.'
    Total_Score__c: The overall score given in this evaluation (sum/roll-up of the
      section scores entered in the conduct flow). 100% populated; average about
      27.5 in live data (an absolute total across sections, not a percentage).
    Comment_Summary__c: The evaluator's overall written summary - same content the
      flow puts on the parent interview's Comment Summary.
  Section_Evaluation__c:
    Evaluation__c: The parent evaluation (verdict) this section score belongs to.
      Required, flow-set, 100% populated. Controls sharing.
    Section__c: The section definition being scored (coding, communication, etc.
      - the reusable config record). Flow-set, 100% populated.
    Score__c: The score this section earned within the evaluation (one decimal).
      Flow-written from the interviewer's input; 100% populated; average 6.5 across
      the 6 live rows.
    Comment__c: The evaluator's free-text comment for this section - why it scored
      the way it did.
  Template__c:
    Interview_Type__c: The interview type this template is designed for - lets the
      conduct flow offer only templates matching the screening being run.
    Niche__c: The skill niche the template's questions target (e.g. a technology
      track). Combined with Interview_Type, this is how the right template is found
      for a candidate.
    Is_Active__c: Whether the template is currently offered for use. Retiring a
      template = unchecking this (children also carry their own Is_Active flags
      for finer-grained retirement).
  Template_Section__c:
    Template__c: The parent template. Required; deleting the template deletes its
      sections.
    Section__c: Which reusable section definition this slot represents. The section
      master carries the name/meaning; this record just places it in the template.
    Sequence__c: The section's position in the template (1, 2, 3...). The conduct
      flow presents sections in this order.
    Is_Active__c: Whether this section is currently part of the template - unchecking
      retires the section without deleting its history.
  Template_Section_Question__c:
    Template_Section__c: The parent section slot. Required; cascades delete with
      the section/ template.
    Question__c: The question-bank entry to ask at this position. The bank record
      owns the question text; this record only selects and orders it.
    Sequence__c: The question's position within the section (1, 2, 3...).
    Is_Active__c: Whether this question is currently asked - unchecking removes
      it from future interviews without losing history.
knowledge:
- title: Internal_Interview__c — What This Object Is
  keywords:
  - internal
  - interview
  text: "Internal_Interview__c records ONE screening interview that TECHSARA ITSELF\n\
    conducts on a candidate or lead - the company assessing its own people, not\
    \ a\ncandidate meeting an outside employer. This is the head object of the INTERNAL\n\
    SCREENING subsystem: an internal Employee (Recruiter__c) interviews the person\n\
    using a structured set of sections and questions pulled from the org's question\n\
    bank, scores each section, and records a Hire/NoHire/Pass/Fail style decision.\n\
    \nTwo ways of building the question set exist (\"Launch mode\"):\n  a) \"Techsara's\
    \ Magic\" - the flow sends the person's RESUME to an AWS Lambda\n     AI service\
    \ which generates custom, resume-specific questions on the fly.\n  b) \"Template\"\
    \ - a pre-built Template__c (sections + fixed questions) drives\n     the interview;\
    \ standard sections can also draw random questions from the\n     Question_Bank__c.\n\
    \nEverything that happens during the interview is audited into two master-detail\n\
    child logs (Internal_Interview_Section_Log__c and\nInternal_Interview_Question_Log__c),\
    \ and the verdict is stored both on this\nrecord and in a child Interview_Evaluation__c\
    \ (with per-section\nSection_Evaluation__c breakdowns)."
- title: Internal_Interview__c — What This Object Is (2)
  keywords:
  - internal
  - interview
  text: 'DO NOT confuse this object with Interview__c: Interview__c = the candidate

    interviewing with an OUTSIDE company; Internal_Interview__c = Techsara

    screening the candidate internally. They share only the candidate - there is

    no direct link between the two objects.'
- title: Internal_Interview__c — Kind Of Object
  keywords:
  - internal
  - interview
  text: "- Custom object, head of the internal-screening cluster.\n- NOT a master-detail\
    \ child: it links to the person via plain LOOKUPS\n  (Candidate__c -> Account,\
    \ Lead__c -> Lead), has its own owner, and org-wide\n  sharing is Public Read/Write.\n\
    - 29 custom fields, 0 record types, 1 validation rule, 1 list view.\n- Auto-number\
    \ Name in the format INT-XXXXX (label \"Internal Interview Id\").\n- Scale:\
    \ 302 records in preprod, all created 2026-06-03 to today - this whole\n  subsystem\
    \ is brand new (about 10 weeks of live use).\n- Metadata drift warning: three\
    \ fields exist in the source snapshot but are\n  NOT queryable in the live preprod\
    \ org (Final_Decision_By__c,\n  Selected_Time_Zone_Start_Time__c, Selected_Timezone_End_Time__c)\
    \ - they\n  appear to be source-only / not deployed. Flagged again in section\
    \ 8."
- title: Internal_Interview__c — Record Types
  keywords:
  - internal
  - interview
  text: 'None. Every internal interview is the same shape; the "flavor" comes from
    the

    Interview_Type__c lookup (a small config object) and the Launch mode picklist,

    not from record types.'
- title: Internal_Interview__c — How It Is Used — The Business Process
  keywords:
  - internal
  - interview
  text: "STEP 1 - CREATION FROM THE CANDIDATE OR LEAD PAGE. A recruiter clicks the\n\
    \  \"Create Interview\" button on a Candidate (Account) or Lead record page\
    \ -\n  IMPORTANT: despite the generic button name, this creates an\n  INTERNAL_INTERVIEW__c,\
    \ not an Interview__c. The button runs the screen flow\n  Interview_Create_Reschedule_Flow,\
    \ which collects: interview type, the\n  internal interviewer (an Employee),\
    \ niche, timezone, date and start/end\n  times, and optionally a resume file\
    \ upload. It then creates:\n    - the Internal_Interview__c record (Candidate\
    \ OR Lead filled, never both),\n    - a Session__c with Purpose = \"Internal\
    \ Interview\" (the actual Zoom/\n      calendar-backed meeting record, linked\
    \ back via\n      Session__c.Internal_Interview__c),\n    - a Resume__c record\
    \ (status \"Uploaded\") holding the resume, when one was\n      provided, and\
    \ makes the uploaded file link visible to all users.\n  The button sits on the\
    \ Candidate Record Page, B2B Client Account and Vendor\n  Account pages, the\
    \ classic Account/Person Account layouts, and the Lead page."
- title: Internal_Interview__c — How It Is Used — The Business Process (2)
  keywords:
  - internal
  - interview
  text: "STEP 2 - SCHEDULING STATUS SYNC (AUTOMATIC). The interview's Status is\
    \ NOT\n  edited by hand (it is read-only on the layout). The record-triggered\
    \ flow\n  internal_interview_Status_Update watches Session__c: whenever a session\
    \ with\n  Purpose \"Internal Interview\" changes status, it mirrors the session's\n\
    \  Status, Start Time IST and End Time IST onto the linked internal interview.\n\
    \  So scheduling the session flips the interview Unscheduled -> Scheduled, etc."
- title: Internal_Interview__c — How It Is Used — The Business Process (3)
  keywords:
  - internal
  - interview
  text: "STEP 3 - CONDUCTING THE INTERVIEW. On the interview page the interviewer\n\
    \  clicks \"Start Interview\", which runs the large screen flow\n  Internal_Interview_Conduct_Interview\
    \ (17 screens). What it does:\n    - Determines the launch mode. In \"Techsara's\
    \ Magic\" mode it fetches the\n      resume file, converts it to base64 (Apex\
    \ GetResumeBase64 - PDF/DOC/DOCX\n      only), and calls the AWS Lambda service\
    \ (named credential\n      \"Internal Interview: Ai Resume Based Questions Lambda\"\
    , an API Gateway\n      endpoint in us-east-1, external service\n      InternalInterviewGenerateAiQuestions,\
    \ POST /dev/generate-questions with\n      question_count, section_name, interview_type,\
    \ niche and resume_base64)\n      to generate resume-specific questions per\
    \ section. In \"Template\" mode it\n      walks Template__c -> Template_Section__c\
    \ -> Template_Section_Question__c\n      for the fixed question list. Standard\
    \ sections draw active\n      Question_Bank__c questions, randomized by Apex\
    \ RandomizeQuestions\n      (Crypto-based true randomness).\n    - Steps the\
    \ interviewer through each section and question on screen; the\n      interviewer\
    \ enters a score and comment per section.\n    - Writes the audit trail: one\
    \ Internal_Interview_Section_Log__c per\n      section (score, comment, question\
    \ source, any AI error) and one\n      Internal_Interview_Question_Log__c per\
    \ question asked (text, evaluation"
- title: Internal_Interview__c — How It Is Used — The Business Process (4)
  keywords:
  - internal
  - interview
  text: "criteria, sequence, source).\n    - Records the verdict: creates an Interview_Evaluation__c\
    \ (Evaluation\n      Type = \"Human\") with the decision and total score, plus\n\
    \      Section_Evaluation__c rows for the per-section breakdown; stamps the\n\
    \      interview itself (Comment_Summary__c, Human_Decision__c,\n      Human_Total_Score__c,\
    \ Hired_Niche__c, Launch_mode__c, Template__c).\n    - Closes out the Session__c\
    \ (actual start/end times, host feedback,\n      status), which in turn syncs\
    \ Status = Completed back onto the interview\n      via the Step-2 flow.\n\n\
    STEP 4 - RESCHEDULING. The \"Reschedule Interview\" button re-runs\n  Interview_Create_Reschedule_Flow\
    \ in reschedule mode: it sets the old\n  interview and session to \"Rescheduled\"\
    , creates a NEW internal interview\n  (linked back through Previous_internal_interview__c)\
    \ and a new session with\n  the new date/times, and can delete-and-replace the\
    \ resume. Once a record's\n  status is Rescheduled it is LOCKED - the validation\
    \ rule blocks any further\n  edit - so the chain of Previous_internal_interview__c\
    \ links is the reschedule\n  history.\n\nSTEP 5 - REVIEWING. The \"View logs\
    \ of this interview\" button runs\n  View_Interview_Log_Flow - a read-only screen\
    \ that pulls the interview's\n  decision, scores, section logs, question logs\
    \ and evaluations into one view."
- title: Internal_Interview__c — How It Is Used — The Business Process (5)
  keywords:
  - internal
  - interview
  text: "STEP 6 - THE DECISION. In live data the human decisions used so far are\n\
    \  Pass/Fail (15 Pass, 2 Fail). A \"hire\" outcome also records WHICH niche\
    \ the\n  person was hired into (Hired_Niche__c). The final-decision fields\n\
    \  (Final Decision / Date / By) and the whole AI-EVALUATION half of the data\n\
    \  model (AI Decision, AI Total score, Combined Score, Evaluation Type \"AI\"\
    )\n  are built into the schema but NOT yet wired to any automation - nothing\
    \ in\n  the org writes them today and they are empty on all records."
- title: Internal_Interview__c — Connected Objects
  keywords:
  - internal
  - interview
  - each
  - relationship
  - means
  text: "WHO IS BEING SCREENED (exactly one of the two is filled):\n- Account (Candidate__c,\
    \ lookup): the candidate Person Account. 233 of 302\n  records (77%).\n- Lead\
    \ (Lead__c, lookup): the not-yet-converted lead being screened. 69 of\n  302\
    \ records (23%). Candidate + Lead counts add up to exactly 302 - in\n  practice\
    \ every record has exactly one of the two."
- title: Internal_Interview__c — Connected Objects (2)
  keywords:
  - internal
  - interview
  - each
  - relationship
  - means
  text: "CONFIG / SETUP LOOKUPS (the question-bank cluster):\n- Interview_Type__c\
    \ (Interview_Type__c): which kind of internal screening\n  this is (a tiny config\
    \ object - name + active flag). 100% populated.\n- Niche__c (Niche__c): the\
    \ skill niche (e.g. a tech domain) the person is\n  being assessed for; drives\
    \ which question-bank sections/questions apply.\n- Niche__c (Hired_Niche__c):\
    \ the niche the person was actually HIRED into,\n  set by the conduct flow at\
    \ decision time.\n- Template__c (Template__c): the question template used when\
    \ Launch mode =\n  \"Template\" (stamped by the conduct flow).\n- Recruiter__c\
    \ / \"Employee\" (Interviewer__c): the internal employee conducting\n  the interview.\
    \ 301 of 302 populated.\n- Internal_Interview__c (Previous_internal_interview__c,\
    \ self-lookup): the\n  earlier interview this one replaced (reschedule chain)\
    \ - 20 records.\n- Session__c (Session__c, lookup on this object): a session\
    \ link that is\n  NEVER populated in data (0 of 302). The real link runs the\
    \ OTHER way -\n  Session__c.Internal_Interview__c points at this object."
- title: Internal_Interview__c — Connected Objects (3)
  keywords:
  - internal
  - interview
  - each
  - relationship
  - means
  text: "CHILDREN (all master-detail, sharing inherited from this record):\n- Internal_Interview_Section_Log__c:\
    \ per-section execution log (score,\n  comment, question source, errors).\n\
    - Internal_Interview_Question_Log__c: per-question log (text, criteria,\n  sequence,\
    \ source).\n- Interview_Evaluation__c: the evaluator's overall verdict. NOTE:\
    \ despite its\n  name, Interview_Evaluation__c belongs to INTERNAL_INTERVIEW__c,\
    \ not to\n  Interview__c.\n\nOTHER OBJECTS POINTING HERE (lookups):\n- Session__c.Internal_Interview__c:\
    \ the scheduled meeting(s) for this\n  interview (9 sessions currently link\
    \ back; shown as a related list).\n- Resume__c.Internal_Interview__c: the resume\
    \ version uploaded for this\n  interview (12 records; created/deleted by the\
    \ create/reschedule flow).\n- Account.Internal_Interview__c: a lookup on the\
    \ candidate Account back to an\n  internal interview - deployed but never populated\
    \ (0 records).\n\nEXPLICIT NON-RELATIONSHIP: no field connects Internal_Interview__c\
    \ to\nInterview__c (external interviews). They share only the candidate."
- title: Internal_Interview__c — Business Rules
  keywords:
  - internal
  - interview
  - validation
  text: "- Lock_Rescheduled_Session (active): once a record's status is already\n\
    \  \"Rescheduled\", EVERY further edit is blocked. Error shown on the Status\n\
    \  field: \"This record is locked because the session status is already\n  Rescheduled.\"\
    \ This freezes superseded interviews so history cannot be\n  rewritten - the\
    \ replacement record (created by the reschedule flow) is the\n  editable one."
- title: Internal_Interview__c — Automation
  keywords:
  - internal
  - interview
  - runs
  text: "RECORD-TRIGGERED FLOW:\n- internal_interview_Status_Update (on Session__c,\
    \ after save, active): when a\n  session with Purpose \"Internal Interview\"\
    \ changes status, copies the\n  session's Status__c, Start_Time_IST__c and End_Time_IST__c\
    \ onto the linked\n  internal interview. This is the ONLY thing that moves the\
    \ interview Status.\n\nSCREEN FLOWS / BUTTONS ON THE PAGE (record page \"Internal\
    \ Interview Record\nPage\" + classic layout carry all three):\n- \"Start Interview\"\
    \ -> Internal_Interview_Conduct_Interview: the whole\n  conduct-and-score experience\
    \ (see process step 3). Calls the AWS Lambda AI\n  question generator, Apex\
    \ GetResumeBase64 and Apex RandomizeQuestions;\n  creates the section/question\
    \ logs, the evaluation and section evaluations;\n  updates this record and the\
    \ session.\n- \"Reschedule Interview\" -> Interview_Create_Reschedule_Flow:\
    \ also the CREATE\n  path - the same flow sits behind the \"Create Interview\"\
    \ buttons on Account\n  (Candidate) and Lead pages. Creates interview + session\
    \ + resume records;\n  in reschedule mode retires the old pair and links the\
    \ new interview via\n  Previous_internal_interview__c.\n- \"View logs of this\
    \ interview\" -> View_Interview_Log_Flow: read-only summary\n  of decision,\
    \ scores, logs and evaluations."
- title: Internal_Interview__c — Automation (2)
  keywords:
  - internal
  - interview
  - runs
  text: "APEX (invocable helpers called from the conduct flow - no trigger exists\
    \ on\nthis object):\n- GetResumeBase64: returns the resume file's base64 content;\
    \ rejects anything\n  that is not PDF/DOC/DOCX with a user-facing error.\n-\
    \ RandomizeQuestions: picks N random questions from the question-bank pool\n\
    \  using Crypto-grade randomness.\n\nEXTERNAL INTEGRATION:\n- InternalInterviewGenerateAiQuestions\
    \ (external service) via named credential\n  \"Internal Interview: Ai Resume\
    \ Based Questions Lambda\" - an AWS API Gateway\n  /Lambda endpoint (us-east-1,\
    \ anonymous/no-auth protocol) that generates\n  resume-based interview questions.\
    \ This powers the \"Techsara's Magic\" launch\n  mode. Unlike Interview__c's\
    \ COMPASS engine, this service only RETURNS\n  questions to the flow - it does\
    \ not write back to Salesforce on its own."
- title: Internal_Interview_Question_Log__c — What This Object Is
  keywords:
  - internal
  - interview
  - question
  - log
  text: 'One row per QUESTION actually asked (or queued to be asked) in an internal

    screening interview. When the interviewer clicks "Start Interview", the

    conduct flow assembles the question set - from the standard Question Bank,

    from a Template, or freshly generated by the AI resume-based Lambda - and

    writes every question here as a permanent audit record: its text, its

    evaluation criteria, where it came from, and the order it was asked in.


    This is the interview''s question-level "black box recorder": even for AI-

    generated questions (which exist nowhere else in Salesforce), this log is the

    only place the exact wording is preserved. The "View logs of this interview"

    button reads it back for review.'
- title: Internal_Interview_Question_Log__c — Kind Of Object
  keywords:
  - internal
  - interview
  - question
  - log
  text: "- Custom object, MASTER-DETAIL CHILD OF Internal_Interview__c. Sharing\
    \ is\n  \"Controlled By Parent\" - whoever sees the interview sees its question\
    \ log.\n  No owner of its own.\n- 8 custom fields, 0 record types, 0 validation\
    \ rules, 1 list view.\n- Auto-number Name in the format IIQL-XXXXX.\n- Scale:\
    \ 428 records in preprod (2026-06-03 to 2026-07-27)."
- title: Internal_Interview_Question_Log__c — Record Types
  keywords:
  - internal
  - interview
  - question
  - log
  text: 'None. Every question log row is the same shape; the Question Source Used

    picklist distinguishes standard vs AI questions.'
- title: Internal_Interview_Question_Log__c — How It Is Used — The Business Process
  keywords:
  - internal
  - interview
  - question
  - log
  text: "STEP 1 - CREATED DURING THE INTERVIEW. The Internal_Interview_Conduct_\n\
    \  Interview screen flow creates these rows as it builds each section's\n  question\
    \ list: standard sections get randomly-selected active Question Bank\n  questions\
    \ (Apex RandomizeQuestions), template sections get the template's\n  fixed questions,\
    \ and \"Techsara's Magic\" sections get brand-new questions\n  returned by the\
    \ AWS Lambda AI service. Each row is stamped with its parent\n  interview, its\
    \ section, its section-log row, its sequence position, the\n  question text\
    \ and (for bank questions) the evaluation criteria and the\n  Question Bank\
    \ source record.\n\nSTEP 2 - READ BACK FOR REVIEW. The View_Interview_Log_Flow\
    \ (the \"View logs of\n  this interview\" button) looks these rows up to display\
    \ what was asked.\n  Nothing updates or deletes them afterwards - they are write-once\
    \ audit data.\n\nNote: scores are NOT kept here - scoring happens at the SECTION\
    \ level (see\nInternal_Interview_Section_Log__c and Section_Evaluation__c)."
- title: Internal_Interview_Question_Log__c — Connected Objects
  keywords:
  - internal
  - interview
  - question
  - log
  - each
  - relationship
  - means
  text: "PARENT:\n- Internal_Interview__c (Internal_Interview__c, MASTER-DETAIL,\
    \ required,\n  100% populated): the interview this question belongs to. Sharing\
    \ parent.\n\nLOOKUPS:\n- Internal_Interview_Section_Log__c (Internal_Interview_Section_Log__c):\
    \ the\n  section-log row this question was asked under - questions are grouped\
    \ into\n  sections. 100% populated.\n- Section__c (Section__c): the master Section\
    \ definition (e.g. a topic block\n  with estimated time and question count).\
    \ 100% populated.\n- Question_Bank__c (Question_Bank__c): the bank question\
    \ this row came from -\n  filled ONLY for \"Standard\" source rows (338 of 428).\
    \ AI-generated questions\n  have no bank record, which is exactly why the text\
    \ is copied into this log.\n\nNo other object points at this one."
