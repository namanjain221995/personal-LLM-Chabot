- title: Interview_Evaluation__c — What This Object Is
  keywords:
  - interview
  - evaluation
  text: 'One evaluator''s OVERALL VERDICT on one INTERNAL screening interview: who
    (or

    what) evaluated it, the decision (Hire / NoHire / Pass / Fail / Retake /

    Needs Improvement), the total score, and a written summary. The data model

    allows two parallel verdicts per interview - a HUMAN evaluation (the

    interviewer''s) and an AI evaluation - distinguished by Evaluation Type, so
    an

    interview could eventually hold both and the two could be compared. Today

    only the Human kind is ever created.


    CRITICAL NAMING WARNING: despite its name, Interview_Evaluation__c is a

    master-detail child of INTERNAL_INTERVIEW__c - it has NO relationship

    whatsoever to Interview__c (external company interviews). When someone asks

    "where is the evaluation of an interview", check WHICH interview object they

    mean: external interviews (Interview__c) store outcomes in their own fields;

    evaluations live only on the internal side.'
- title: Interview_Evaluation__c — Kind Of Object
  keywords:
  - interview
  - evaluation
  text: "- Custom object, MASTER-DETAIL CHILD OF Internal_Interview__c. Sharing\n\
    \  \"Controlled By Parent\"; no owner of its own.\n- 6 custom fields, 0 record\
    \ types, 0 validation rules, 1 list view.\n- Auto-number Name in the format\
    \ IEQ-XXXXX.\n- Scale: 17 records in preprod (2026-06-03 to 2026-07-27) - exactly\
    \ one per\n  completed internal interview so far.\n- Metadata drift warning:\
    \ the Evaluator__c lookup exists in the source\n  snapshot but is NOT queryable\
    \ in the live preprod org (see section 8)."
- title: Interview_Evaluation__c — Record Types
  keywords:
  - interview
  - evaluation
  text: 'None. The Human-vs-AI distinction is carried by the Evaluation Type picklist,

    not by record types.'
- title: Interview_Evaluation__c — How It Is Used — The Business Process
  keywords:
  - interview
  - evaluation
  text: "STEP 1 - CREATED AT THE END OF THE INTERVIEW. When the interviewer finishes\n\
    \  the Internal_Interview_Conduct_Interview flow, it creates ONE evaluation\n\
    \  with Evaluation Type = \"Human\", the decision the interviewer chose, and\
    \ the\n  total score - and mirrors the same decision/score onto the parent\n\
    \  interview's Human_Decision__c / Human_Total_Score__c fields.\n\nSTEP 2 -\
    \ SECTION BREAKDOWN. The same flow can create child\n  Section_Evaluation__c\
    \ rows under the evaluation - one per section with its\n  score and comment\
    \ (in practice only a handful exist; see that object).\n\nSTEP 3 - REVIEW. The\
    \ \"View logs of this interview\" flow lists the\n  evaluations alongside the\
    \ section/question logs.\n\nFUTURE/PLANNED: the \"AI\" Evaluation Type (and\
    \ the parent interview's AI\n  Decision / AI Total score / Combined Score fields)\
    \ are modeled for an AI\n  evaluator that does not exist yet - nothing creates\
    \ AI evaluations today."
