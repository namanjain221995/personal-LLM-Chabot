- title: Template__c — What This Object Is
  keywords:
  - template
  text: 'Template__c is the top of the reusable INTERVIEW-TEMPLATE hierarchy that

    feeds the internal-interview subsystem. A template defines a ready-made

    question structure for internally screening candidates of a given skill

    niche and interview type: Template -> Template_Section__c (ordered sections)

    -> Template_Section_Question__c (ordered questions per section, pulled from

    the Question_Bank__c master). When an employee launches an

    Internal_Interview__c in "Template" mode (instead of "Techsara''s Magic" AI

    question generation), they pick one of these templates and the interview is

    conducted section by section, question by question, from this structure.'
- title: Template__c — Kind Of Object
  keywords:
  - template
  text: "- Custom object; parent of the 3-level template hierarchy. Org-wide sharing\n\
    \  ReadWrite; its children are master-detail (ControlledByParent), so access\n\
    \  to sections/questions follows the template.\n- 3 custom fields, no record\
    \ types, no validation rules, 1 list view.\n- Scale: 1 template in preprod (with\
    \ 5 sections, 4 questions) - the template\n  library is embryonic; most internal\
    \ interviews use the AI (\"Techsara's\n  Magic\") mode instead."
- title: Template__c — How It Is Used — The Business Process
  keywords:
  - template
  text: 'An admin/senior employee builds a template with the Template_Creation_Flow

    screen flow (creates the Template record) and structures it with the

    Template_Structure_Flow (reads the hierarchy). The template is tagged with

    the Niche (skill track) and Interview_Type it serves and flagged active.

    When an internal screening is launched in Template mode, the conduct-

    interview flow walks this structure: for each active Template_Section (in

    Sequence order) it presents the active Template_Section_Questions (in their

    Sequence order, each pointing at a Question_Bank__c entry), and the

    interviewer scores answers into the Internal_Interview_Section_Log__c /

    Internal_Interview_Question_Log__c records of that interview.'
- title: Template__c — Connected Objects
  keywords:
  - template
  - each
  - relationship
  - means
  text: "- Interview_Type__c (Interview_Type__c, Lookup): which kind of internal\n\
    \  interview this template is for (the small interview-type master object).\n\
    - Niche__c (Niche__c, Lookup): the skill niche/track the template screens\n\
    \  for (same niche master used by resumes and internal interviews).\n- Template_Section__c\
    \ (child, MASTER-DETAIL): the ordered sections of the\n  template.\n- Internal_Interview__c\
    \ (incoming lookup Internal_Interview__c.Template__c):\n  each internal interview\
    \ run in Template mode records which template it\n  used."
- title: Template__c — Automation
  keywords:
  - template
  text: "- Template_Creation_Flow (screen flow): guided creation of a template.\n\
    - Template_Structure_Flow (screen flow): reads/presents a template's\n  structure\
    \ (lookup only).\n- Consumed by the internal-interview flows (Internal_Interview_Conduct_\n\
    \  Interview) when Launch_mode = Template.\n- No record-triggered flows or triggers."
- title: Template_Section__c — What This Object Is
  keywords:
  - template
  - section
  text: 'One ordered SECTION inside an interview template - e.g. "Introduction",

    "Core coding", "System design", "Wrap-up". It ties the template to a

    Section__c master record (the reusable section definition shared with the

    rest of the interview-evaluation model) and gives it a position (Sequence)

    within this particular template.'
- title: Template_Section__c — Kind Of Object
  keywords:
  - template
  - section
  text: "- Custom object, MASTER-DETAIL CHILD of Template__c (sharing Controlled\
    \ By\n  Parent - it lives and dies with its template).\n- 4 custom fields, no\
    \ record types, no validation rules, 1 list view.\n- Scale: 5 records in preprod\
    \ (all under the single existing template)."
- title: Template_Section__c — How It Is Used — The Business Process
  keywords:
  - template
  - section
  text: 'Created when a template is being structured (Template_Creation_Flow /

    manual). At interview time, the conduct flow iterates the template''s active

    sections in Sequence order; each section groups the questions asked and maps

    to an Internal_Interview_Section_Log__c row where the interviewer''s per-

    section score lands.'
