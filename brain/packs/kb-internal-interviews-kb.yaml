  - evaluation
  text: "STEP 1 - CREATED WITH THE VERDICT. At the end of the Internal_Interview_\n\
    \  Conduct_Interview flow, after the Interview_Evaluation__c is created, the\n\
    \  flow creates one Section Evaluation per section carrying the section's\n\
    \  score and comment (the same numbers the interviewer typed into the section\n\
    \  screens).\n\nSTEP 2 - READ FOR REVIEW/REPORTING. The rows give reviewers\
    \ the section-level\n  picture behind a Pass/Fail without opening the raw section\
    \ logs.\n\nREALITY CHECK: only 6 rows exist against 17 evaluations and 104 section\
    \ logs\n  - the section-evaluation step has clearly only fired for a small subset\
    \ of\n  conducted interviews (likely only certain flow paths create them). Expect\n\
    \  most historical evaluations to have NO section breakdown; the raw\n  Internal_Interview_Section_Log__c\
    \ rows are the reliable per-section source."
