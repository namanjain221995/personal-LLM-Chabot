# Compiled 2026-08-16 from brain/sources/techsara-org-knowledge-base.txt (preprod org documentation, 71 objects) by the brain ingestion pipeline: deterministic section/field parsing, every field name validated against the production dictionary + warehouse table list, rules distilled and adversarially verified. Fields the production warehouse lacks are only ever mentioned as explicit not-synced caveats.
# Domain: PART 11 — verifier verdict: ship_with_fixes.
name: kb-internal-ops
description: 'TechSara''s internal operations layer: the Slack-threaded, deadline-driven
  candidate-ops Case ticket queue, machine-generated Task/Event activities (not
  synced to the warehouse), and the Files/ContentVersion store with DocuSign and
  portal-upload tagging.'
triggers:
- ticket
- tickets
- case
- cases
- case reason
- escalation
- escalations
- deadline
- deadlines
- waiting on
- missed session
- resume edit
- legal warning
- proxy exception
- policy breach
- slack
- activity
- activities
- task
- tasks
- call log
- call logs
- file
- files
- upload
- uploads
- attachment
- attachments
- docusign
- service agreement
tables:
- Case
- ContentVersion
rules: 'Internal-ops rules (Cases / activities / files):

  - Case is TechSara''s INTERNAL candidate-ops ticket, not customer support — standard
  Origin/Type/Reason and Supplied* fields are unused.

  - Classify by Case_Reason__c (Escalation, Legal Warning, Missed Session, Resume
  Edit...); live values outgrow the picklist and can be NULL — group raw values,
  never hardcode.

  - Open = Status IN (''New'',''In Progress'',''Waiting on Candidate''); done =
  Resolved/Closed — the queue is kept clean, so unfiltered counts measure history,
  not workload.

  - Deadline__c is required on every Case (worked deadline-first); Next_Action_Date__c
  paces follow-ups.

  - Lookups: Case.Interview__c -> Interview__c, Case.Marketing__c -> Marketing__c,
  Case.Onboarding__c -> Onboarding__c; the candidate is Case.AccountId (Person Account).

  - Case_Tags__c is multi-select (;-joined) — filter with LIKE, never equality.
  Waiting_On__c = who the ticket is blocked on.

  - Report owner names via Case_Owner_Name__c (formula). Slack_Thread_Ts__c maps
  a Case 1:1 to its Slack thread; Last_Priority_Change_Reason__c stores why priority
  changed.

  - Tasks/Events (Activities) are NOT synced to the warehouse — answer conceptually
  and say so; mostly Zoom call logs and calendar exhaust, not a to-do list.

  - Activity fields Employee_Leave__c and ShowAs__c exist in the sandbox only, not
  production.

  - A file = one ContentVersion row; its record link is the ContentDocumentLink
  junction (unverified in warehouse — check before joining), not ContentVersion
  itself.

  - Never filter files by File_Type__c (empty on all sandbox files; flows ignore
  it); find resumes by attachment context + recency (CreatedDate, Title, FileExtension).

  - Guest_Record_fileupload__c ties a candidate-portal upload to its record; dfsle__*
  naming fields (e.g. dfsle__GeneratedFileName__c) appear only on DocuSign agreements.'
glossary:
  ticket: 'A Case: TechSara''s internal candidate-ops work item (resume edit, missed
    session, payment pending, policy breach...) worked against a required deadline
    — not a customer-support case.'
  case reason: The Case_Reason__c picklist saying what kind of candidate-ops work
    a ticket is — the classifier that matters in this org (standard Type/Reason
    are unused).
  escalation: A Case reason marking a candidate or pipeline issue raised for urgent
    internal attention.
  proxy exception: A one-off, policy-bound allowance around the proxy-support rules,
    tracked as a Case with reason 'Proxy Exception (One-off)'.
  legal warning: A formal warning ticket raised against a candidate — the Case reason
    'Legal Warning'.
  missed session: A Case reason recording that a candidate skipped a scheduled session,
    usually anchored to their Marketing engagement.
  waiting on: 'Whose action a ticket is blocked on — the Waiting_On__c picklist:
    Candidate, Recruiter, Trainer, Support, Legal, Vendor/Client, or Internal Review.'
  deadline: The required due date (Deadline__c) on every ticket; the ops queue is
    worked deadline-first.
  slack thread: Each Case is posted once to Slack and every later update lands as
    a reply in that same thread; Slack_Thread_Ts__c is the unique 1:1 key.
  call log: A Task row written automatically by the ZVC Zoom package for a call
    — the bulk of activity volume; activity data is not synced to the warehouse.
  guest upload: A file uploaded through the candidate-facing portal, matched to
    its record by the Guest_Record_fileupload__c correlation key.
  service agreement: The signed agreement document generated by the DocuSign package
    and stored as a Salesforce File carrying the dfsle__ naming fields.
field_notes:
  Case:
    Case_Reason__c: 'THE operational classifier - what kind of candidate-ops work
      this ticket is. Values (with live counts of the busiest): Escalation (231),
      Availability (146), Legal Warning (140), Warning (Responsiveness) (117)'
    Case_Tags__c: 'Cross-cutting labels stackable on any reason: C2C | Full-Time
      | Urgent | Agreement Breach Risk | Referral | Delay | Support Exception |
      Payment Pending | Smart Team Directive | Training.'
    Waiting_On__c: 'Whose action the ticket is blocked on: Candidate | Recruiter
      | Trainer | Support | Legal | Vendor/Client | Internal Review. Keeps the queue
      honest about where delays sit.'
    Deadline__c: The date the ticket must be done by. Required on every Case - the
      interview-support flow sets it automatically; manual tickets must fill it.
      The queue is worked deadline-first.
    Next_Action_Date__c: When the owner should next touch the ticket (follow-up
      pacing between creation and deadline).
    Slack_Thread_Ts__c: The Slack message timestamp of the ticket's parent post
      - the key that lets every update land as a reply in the same Slack thread.
      Written by the post-to-Slack flow; unique + external-id so a Case maps 1:1
      to its thread.
    Interview__c: The interview this ticket is about (auto-set for interview-support
      Cases).
    Marketing__c: The marketing engagement this ticket is about.
    Onboarding__c: The onboarding this ticket is about.
    Case_Owner_Name__c: The owner's first + last name as text (report-friendly owner
      column that works across queues/users).
    Last_Priority_Change_Reason__c: Why the priority was last changed - written
      by the Case_Priority_Change_Screen_Flow. The Apex trigger separately Slacks
      the change.
    Subject: Ticket title and detail - set manually or by the interview-support
      flow.
    Description: Ticket title and detail - set manually or by the interview-support
      flow.
    Status: 'New -> In Progress -> Waiting on Candidate -> Resolved -> Closed. Live
      data: Closed 1,071, Resolved 502, New 13, In Progress 11, Waiting on Candidate
      6.'
    Priority: Standard priority; changes are governed by the screen flow + Slack
      notification.
    OwnerId: Working owner; the candidate Person Account and its contact.
    AccountId: Working owner; the candidate Person Account and its contact.
    ContactId: Working owner; the candidate Person Account and its contact.
    Origin: Standard classifiers, largely unused - Case_Reason__c is the field that
      matters in this org.
    Type: Standard classifiers, largely unused - Case_Reason__c is the field that
      matters in this org.
    Reason: Standard classifiers, largely unused - Case_Reason__c is the field that
      matters in this org.
    ParentId: Standard parent-case link for related tickets (rarely used).
    IsEscalated: Standard mechanics fields; no special behavior in this org.
    IsClosedOnCreate: Standard mechanics fields; no special behavior in this org.
    IsStopped: Standard mechanics fields; no special behavior in this org.
    StopStartDate: Standard mechanics fields; no special behavior in this org.
    ClosedDate: Standard mechanics fields; no special behavior in this org.
    Comments: Standard mechanics fields; no special behavior in this org.
    Language: Standard mechanics fields; no special behavior in this org.
    ContactEmail: Standard contact-info mirrors and web-to-case supply fields; unused
      (there is no external case intake).
    ContactFax: Standard contact-info mirrors and web-to-case supply fields; unused
