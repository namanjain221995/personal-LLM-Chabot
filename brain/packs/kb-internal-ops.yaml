  ContentVersion:
    File_Type__c: 'What the file is: Resume | Service Agreement. Intended to classify
      uploads; in practice unpopulated on the ~20 sandbox files - flows find resumes
      by recency/context instead. (Populate before relying on it.)'
    Guest_Record_fileupload__c: Correlation key stamped on files uploaded through
