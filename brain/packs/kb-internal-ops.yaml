  Task:
    ZVC__Schedule_a_Zoom_Meeting__c: 'Package feature: tick on an Event to have
      the Zoom package schedule a real Zoom meeting and put the join link on the
      calendar entry (from the package''s help text).'
    ZVC__Zoom_Meeting__c: The package's Zoom-meeting record behind this activity.
    ZVC__Zoom_Call_Log__c: The Zoom phone/call-log record this Task row documents
      - the source of the big Task volume.
    ZVC__Session_History__c: The package's session-history record for the activity.
    ZVC__Zoom_ZRA_Analysis__c: The package's recording-analysis record tied to the
      activity.
    ZVC__Zoom_Task_Type__c: The package's own type label for the activity row (call,
      meeting, etc.).
  Event:
    ZVC__Schedule_a_Zoom_Meeting__c: 'Package feature: tick on an Event to have
      the Zoom package schedule a real Zoom meeting and put the join link on the
      calendar entry (from the package''s help text).'
    ZVC__Zoom_Meeting__c: The package's Zoom-meeting record behind this activity.
    ZVC__Zoom_Call_Log__c: The Zoom phone/call-log record this Task row documents
