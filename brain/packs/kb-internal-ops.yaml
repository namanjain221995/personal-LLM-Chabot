knowledge:
- title: Case — What This Object Is
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: 'The standard Salesforce Case object, repurposed as Techsara''s INTERNAL

    candidate-operations ticket. It is NOT a customer-support inbox: no email-to-

    case, no external customers filing tickets. Instead, staff raise Cases about

    candidates and pipeline events - "edit this resume", "candidate missed a

    session", "payment pending", "policy breach warning", "one-off proxy

    exception", "interview support request" - and the team works them against a

    required Deadline, coordinated through Slack. Think of it as the org''s

    internal to-do/escalation queue anchored to whichever pipeline record the

    issue concerns (an Interview, a Marketing engagement, or an Onboarding).'
- title: Case — Kind Of Object
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: "- Standard object with 11 custom fields (47 fields total incl. standard).\n\
    - Org-wide sharing ReadWriteTransfer; no record types, no validation rules,\n\
    \  12 list views.\n- Scale: 1,603 records in preprod; 98% already Closed/Resolved\
    \ (a working\n  queue, kept clean)."
- title: Case — Record Types
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: 'None. One ticket process for everything; the Case_Reason__c picklist is
    what

    differentiates the work.'
- title: Case — How It Is Used — The Business Process
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: "CREATION. Two paths:\n  - Manual: a staff member raises a Case about a\
    \ candidate situation,\n    choosing the Case_Reason (what kind of operation\
    \ it is), tags, priority\n    and the required Deadline, and linking the relevant\
    \ pipeline record\n    (Interview / Marketing / Onboarding lookup).\n  - Automatic:\
    \ the Interview_Request_Case_Flow creates a Case whenever an\n    interview's\
    \ \"Request Raised\" support checkbox is turned on - the Case is\n    the tracked\
    \ ticket for that interview-support request (subject,\n    description, deadline,\
    \ owner, priority and tags are set by the flow).\n\nROUTING & SLACK. On creation\
    \ the Case_Assign_Owner_before_creation flow\nassigns the right owner. The Case_Post_parent_message_to_Slack\
    \ flow posts\nthe new ticket into the team's Slack channel and stores the message's\
    \ thread\ntimestamp on the Case (Slack_Thread_Ts__c); every later update posted\
    \ by\nCase_Post_Updates_to_Slack lands as a reply in that same Slack thread,\
    \ so\neach ticket has one continuous Slack conversation. The Apex CaseTrigger\
    \ ->\nCaseTriggerHandler adds one more notification: when a Case's Priority\n\
    changes, SlackCalloutHelper.sendCaseNotificationToSlack posts the change."
- title: Case — How It Is Used — The Business Process (2)
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: 'WORKING THE TICKET. The team drives the standard Status field (New -> In

    Progress -> Waiting on Candidate -> Resolved/Closed), uses Waiting_On__c to

    show whose court the ball is in, and Next_Action_Date__c for follow-up

    pacing. Priority changes go through the Case_Priority_Change_Screen_Flow,

    which records the justification into Last_Priority_Change_Reason__c.'
- title: Case — Connected Objects
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  - each
  - relationship
  - means
  text: "- Interview__c (Interview__c, Lookup): the interview the ticket is about\
    \ -\n  set by the auto-created interview-support Cases and by manual tickets\
    \ on\n  interview issues (scheduling problems, recording requests, proxy\n \
    \ exceptions).\n- Marketing__c (Marketing__c, Lookup): the candidate-marketing\
    \ engagement\n  the ticket concerns (resume edits, missed sessions, responsiveness\n\
    \  warnings - most candidate-management reasons anchor here).\n- Onboarding__c\
    \ (Onboarding__c, Lookup): the onboarding the ticket concerns\n  (payment pending,\
    \ signature pending, agreement issues).\n- Account/Contact (standard AccountId\
    \ / ContactId): the candidate the ticket\n  is ultimately about (Person Account\
    \ + its shadow contact).\n- Standard Owner (OwnerId): the staff member (or queue)\
    \ working the ticket."
- title: Case — Business Rules
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  - validation
  text: 'None as validation rules. The one hard requirement is field-level:

    Deadline__c is marked required, so every ticket must carry its due date.'
- title: Case — Automation
  keywords:
  - case
  - repurposed
  - candidate
  - ops
  - ticket
  text: "- Case_Assign_Owner_before_creation (record-triggered, on create): assigns\n\
    \  the proper owner for new tickets.\n- Case_Post_parent_message_to_Slack (record-triggered,\
    \ on create): posts the\n  ticket to Slack and saves the thread timestamp (Slack_Thread_Ts__c).\n\
    - Case_Post_Updates_to_Slack (record-triggered, on update): posts updates\n\
    \  into the existing Slack thread.\n- Case_Priority_Change_Screen_Flow (screen\
    \ flow): governed priority change\n  with a reason, written to Last_Priority_Change_Reason__c.\n\
    - Interview_Request_Case_Flow (on Interview__c): CREATES Cases for\n  interview-support\
    \ requests.\n- Apex CaseTrigger -> CaseTriggerHandler: on after-update, if Priority\n\
    \  changed, sends a Slack notification (SlackCalloutHelper). All other\n  handler\
    \ contexts are empty scaffolding."
- title: Activity — What This Object Is
  keywords:
  - activity
  - task
  - event
  text: '"Activity" is the shared field container for the standard Task and Event

    objects (custom Activity fields appear on both). In this org, activities are

    mostly MACHINE-GENERATED side effects of other subsystems rather than a

    hand-maintained to-do list: calendar Events created for sessions and

    employee leave, and Task/call-log rows created by the ZVC Zoom managed

    package. The 8 custom fields fall into exactly those two groups: employee-

    leave calendar wiring and Zoom-package wiring.'
- title: Activity — Kind Of Object
  keywords:
  - activity
  - task
  - event
  text: "- Standard Task/Event with 8 custom Activity fields; Private sharing\n\
    \  (activities are visible to their owner + up the role hierarchy), 5 list\n\
    \  views.\n- Scale: 10,000+ Tasks (query capped) and 814 Events in preprod.\
    \ The large\n  Task volume is dominated by Zoom-package call logging."
- title: Activity — How It Is Used — The Business Process
  keywords:
  - activity
  - task
  - event
  text: "- EMPLOYEE LEAVE CALENDAR: when an employee's leave request is approved\
    \ (see\n  Employee_Leave__c), the Leave_Event_Sync / Tentative_calendar_Event\
    \ flows\n  create calendar Events for the leave window, linked back via the\n\
    \  Employee_Leave__c lookup and marked with ShowAs__c (Tentative / Out of\n\
    \  Office) so colleagues see availability in calendars.\n- SESSION CALENDAR:\
    \ the Session_To_Calendar_Event flow creates an Event for\n  a training/meeting\
    \ Session__c so it appears on staff calendars.\n- ZOOM PACKAGE: the installed\
    \ ZVC Zoom package writes its own activity rows\n  - call logs, meeting links,\
    \ session history references - via its ZVC__*\n  fields; ticking ZVC__Schedule_a_Zoom_Meeting__c\
    \ on an Event makes the\n  package create a real Zoom meeting for it."
- title: Activity — Connected Objects
  keywords:
  - activity
  - task
  - event
  - each
  - relationship
  - means
  text: "- Employee_Leave__c (Employee_Leave__c, Lookup): the leave request this\n\
    \  calendar Event represents.\n- ZVC__Zoom_Meeting__c / ZVC__Zoom_Call_Log__c\
    \ / ZVC__Session_History__c /\n  ZVC__Zoom_ZRA_Analysis__c (Lookups): the Zoom\
    \ managed-package records an\n  activity row is tied to (its meetings, call\
    \ logs, session history and\n  recording analyses).\n- Plus the standard WhoId\
    \ (Lead/Contact) and WhatId (any object) polymorphic\n  links every Task/Event\
    \ carries."
- title: Activity — Automation
  keywords:
  - activity
  - task
  - event
  text: "- Leave_Event_Sync (flow): syncs approved leave to calendar Events.\n-\
    \ Tentative_calendar_Event (flow): creates the tentative-hold Event while a\n\
    \  leave request is pending decision.\n- Session_To_Calendar_Event (flow): creates\
    \ the Event for a Session__c.\n- Interview_support_person_Assign (obsolete flow)\
    \ looked up Events when\n  assigning support.\n- The ZVC Zoom managed package\
    \ writes Task/Event rows through its own logic."
- title: ContentVersion — What This Object Is
  keywords:
  - contentversion
  - files
  text: 'The standard Salesforce Files object - every uploaded file (a resume PDF,
    a

    signed agreement, a screenshot) is a ContentVersion row. The org adds 7

    custom fields in two groups: its own light file tagging (what kind of file

    is this, who uploaded it via the guest portal) and fields from the DocuSign

    eSignature managed package (dfsle__*) that control generated-document

    naming when agreements are produced for signature.'
- title: ContentVersion — Kind Of Object
  keywords:
  - contentversion
  - files
  text: "- Standard object (file version store); 19 fields in the snapshot of which\n\
    \  7 are custom (3 org-own + 4 DocuSign-package).\n- Scale: only ~20 files visible\
    \ in preprod (sandbox file content is often\n  trimmed during refresh - production\
    \ will hold far more)."
- title: ContentVersion — How It Is Used — The Business Process
  keywords:
  - contentversion
  - files
  text: 'Files get attached to pipeline records throughout: resumes on Leads and

    candidates (the Attached_Resume_To_Lead flow finds the resume file attached

    to a Lead; Approve_and_Submit_to_Client looks up the resume file when a Job

    Submission goes to the client; Internal_Interview_Conduct_Interview pulls

    the resume file during a screening), signed service agreements on

    onboarding/background-check records (generated and named by the DocuSign

    package fields), and guest uploads arriving through the candidate-facing

    upload path are stamped with Guest_Record_fileupload__c so they can be

    matched to the right record.'
- title: ContentVersion — Connected Objects
  keywords:
  - contentversion
  - files
  - each
  - relationship
  - means
  text: "- Files link to their records through the standard ContentDocumentLink\n\
    \  junction (any object can hold files) - there are no custom lookups here.\n\
    - The DocuSign package (dfsle__) reads/writes its four fields when\n  generating\
    \ agreement documents."
- title: ContentVersion — Automation
  keywords:
  - contentversion
  - files
  text: "- Attached_Resume_To_Lead, Approve_and_Submit_to_Client,\n  Internal_Interview_Conduct_Interview\
    \ (flows): look up resume files for\n  their processes (read-only - they find\
    \ the newest attached file).\n- The DocuSign managed package writes generated\
    \ agreement documents and\n  their dfsle__ naming fields.\n- The AWS candidate-upload\
    \ Lambda path (named credentials) brings portal\n  uploads in as files."
