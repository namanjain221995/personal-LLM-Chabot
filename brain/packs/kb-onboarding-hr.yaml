# Compiled 2026-08-16 from brain/sources/techsara-org-knowledge-base.txt (preprod org documentation, 71 objects) by the brain ingestion pipeline: deterministic section/field parsing, every field name validated against the production dictionary + warehouse table list, rules distilled and adversarially verified. Fields the production warehouse lacks are only ever mentioned as explicit not-synced caveats.
# Domain: PART 7 — verifier verdict: ship_with_fixes.
name: kb-onboarding-hr
description: How TechSara intakes enrolled candidates into its own service (Onboarding__c),
  runs post-offer verification and payment agreements (Background_Check__c + employment
  children), and tracks internal staff leave (Employee_Leave__c).
triggers:
- onboarding
- onboardings
- onboarded
- welcome call
- service agreement
- intake form
- onboarding form
- background check
- background checks
- employment verification
- reference check
- promissory note
- offer letter payment
- work authorization
- visa
- immigration
- opt
- cpt
- h1b
- green card
- passport
- ats score
- employee leave
- leave request
- on leave
- pto
- sick leave
- time off
- comp-off
- vacation
tables:
- Onboarding__c
- Background_Check__c
- Background_Check_Employment__c
- Employee_Leave__c
rules: 'Onboarding & HR rules:

  - Onboarding__c = intake into TechSara''s OWN service at the very START (auto-created
  per candidate Person Account); NOT employer onboarding — post-offer = Background_Check__c.

  - Onboarding__c.Account__c -> Account. Status__c: Welcome Call -> Service Agreement
  -> Resume Creation -> Onboarding Completed; Inactive = paused; NULL record type
  = legacy Active.

  - Salary__c is a PERCENT fee, not pay; Offer_letter_amount__c = salary basis;
  Upfront_Amount__c = upfront fee.

  - Visa filters: Visa_Status__c is the OLDER field, blank on most newer candidates
  — say so; the current Work Authorization field is unverified in the warehouse.

  - Use Declaration__c; I_confirm_that_all_the_above_information__c not synced to
  production.

  - ''Handed to marketing'': use Status__c=''Onboarding Completed''; Assigned_to_Marketing__c
  undercounts.

  - Background_Check__c = POST-OFFER verification + payment plan; Candidate__c ->
  Account, Interview__c -> Interview__c; new, low volume.

  - Background_Check_Status__c: Payment Verification Pending -> Documents Pending
  -> Candidate Details Pending -> Verification In Progress -> Completed. Its *_Date
  FORMULAS (Promissory_Note_Signed_Date__c etc.) show TODAY(), never real dates;
  Final_Confirmation_Date__c not in production.

  - Background_Check_Employment__c.Background_Check__c -> parent (master-detail);
  count via rollup Background_Check_Project_Count__c.

  - Send_Pending_Notifications__c label reads backwards: it means ''send reminders''.

  - Employee_Leave__c.Employee__c -> Recruiter__c: internal staff, never candidates;
  rows are hand-loaded test data so far.

  - Employee_Leave__c.Status__c wired: Submitted|Approved|Rejected|Cancelled; HR
  fields empty. Manager_Approver__c/Requested_By__c not synced — requester = Employee__c
  + CreatedById; approver via LastModifiedById.'
glossary:
  Onboarding: Intake into TechSara's own career service at the very start of the
    candidate lifecycle (welcome call, service agreement, data collection, resume)
    — not onboarding into an employer; tracked on Onboarding__c.
  Onboarding form: The token-secured web intake form emailed to the candidate that
    collects personal, immigration, EEO, education and work-history details onto
    the Onboarding record.
  Service agreement: The contract the candidate e-signs (DocuSign/PandaDoc) during
    onboarding; it must be signed before the onboarding status can reach Resume
    Creation.
  Background check: TechSara's post-offer process combining employment verification
    with the money gate (offer-letter payment, ACH authorization, promissory note),
    tracked on Background_Check__c with one employment child per past employer.
  Promissory note: The payment-plan agreement a candidate e-signs via DocuSign after
    an offer, committing to installments of the remaining fees; its terms live in
    the DS_* fields on the background check — those DS dates are real entered dates,
    unlike the TODAY()-formula status dates.
  Offer letter payment: 'The fee TechSara collects from the candidate once a job
    offer arrives — the first gate of the background-check pipeline (Offer_Letter_Payment_Status__c:
    Pending or Received).'
  OPT: Optional Practical Training — US work authorization for recent international
    graduates, the dominant status in the candidate base (legacy Visa_Status__c
    value 'OPT-EAD').
  CPT: Curricular Practical Training — work authorization for candidates still enrolled
    at a university; flagged by Active_CPT__c on the onboarding record.
  Work authorization: Which US jobs a candidate may legally take (OPT, CPT, H1B,
    Green Card...). In the warehouse, filter on the legacy Visa_Status__c (F1 |
    H1-B | CPT | OPT-EAD | H4-EAD | Green_Card | US_Citizen | Other) and match values
    loosely — data loads left off-list variants like 'Green Card' and 'US Citizen'
    — and note it is blank on most newer candidates; the current 'Work Authorization'
    picklist field is not verified in production.
  Bench marketing: The candidate-marketing team that applies to jobs on the candidate's
    behalf after onboarding completes; the Complete Onboarding flow creates the
    Marketing__c engagement hand-off.
  ATS score: Score of the candidate's created resume from an applicant-tracking-system
    checker (ATS_Score__c); a minimum-75 completion rule existed but is now deactivated.
  Leave request: An internal employee's absence request on Employee_Leave__c (PTO,
    sick, comp-off, marriage...), manager-approved and shown as an out-of-office
    calendar event; current warehouse rows are hand-loaded test data.
field_notes:
  Onboarding__c:
    Account__c: The candidate (Person Account) being onboarded. Set automatically
      by the creation flow; 99% populated (765/771). The data-sync flow uses this
      link to push onboarding answers back onto the Account.
    Status__c: 'THE lifecycle field, driven by the Path on the record page: Welcome
      Call | Service Agreement | Resume Creation | Onboarding Completed | Inactive.'
    Inactive_Reason__c: Why the onboarding was paused/made inactive - filled by
      the Pause Onboarding flow or manually. 24 records have one.
    Flow_Only_Field__c: 'Hidden technical switch: the Onboarding_Completion_Validation
      rule only allows Status = "Onboarding Completed" when this field changed in
      the same save, and only the Complete Onboarding flow flips it.'
    OwnerId: Standard owner - the Customer Success / onboarding employee working
      this candidate. On the layout; ownership matters because sharing is Read/Write
      org-wide, so the owner is a work-queue marker more than a security gate.
    Owner_Name_Formula__c: The owner's first + last name as plain text, for reports/list
      views that cannot show the Owner relationship nicely.
    Description__c: General free-form notes about this onboarding.
    Notes__c: Additional working notes (the layout shows it under "Other information").
    Candidate_form_filled__c: The candidate returned/completed the intake form.
      True on 719 (93%).
    Service_Agreement_Sent__c: The service agreement went out (email/DocuSign/PandaDoc).
      True on 717. Read by the service-agreement notification flow.
    Service_Agreement_Signed__c: The candidate signed the service agreement. True
      on 719 (93%). Checking it fires the Slack alert flow; required before Status
      can reach "Resume Creation" (validation rule).
    Resume_Created__c: The ATS-optimized resume has been produced. True on 682 (88%).
    Internal_Approval__c: Techsara's internal sign-off on the resume/profile. True
      on 682.
    Candidate_Approval__c: The CANDIDATE approved the resume. True on 681. Required
      before the onboarding can be completed (validation rule).
    LinkedIn_Optimization__c: The candidate's LinkedIn profile was optimized by
      the team. True on only 59 records (8%) - either rarely done or rarely recorded.
    Assigned_to_Marketing__c: The candidate has been handed off to the bench-marketing
      team (a Marketing__c engagement exists). True on 241 (31%). The Complete Onboarding
      flow handles the actual Marketing record creation.
    Account_information_collected__c: Candidate's account/billing information has
      been collected. (Exact operational meaning not fully documented - verify with
      team.)
    Welcome_Script__c: The welcome-call script/notes used for this candidate's kickoff
      call.
    Onboarding_Form_Status__c: 'Older form-status field: Sent | Opened | Draft |
      Submitted | Expired | Cancelled. Populated on exactly 1 record (Cancelled);
      effectively unused - the token''s own status field superseded it.'
    Latest_Onboarding_Form_Link__c: Link of the most recently sent form. Empty on
      all records so far.
    Latest_Onboarding_Status__c: Short text status of the newest form send, updated
      by the candidate intake flow (Onboarding_Candidate_Intake_1). Populated on
      98 records - the only "Latest" field actually in use.
    Candidate_Form_Additional_Details__c: Free-text catch-all the candidate can
      leave on the intake form ("anything else we should know").
    Declaration__c: 'The candidate''s accuracy declaration on the intake form. Help
      text: "I confirm that all the above information provided is accurate.'
    Upfront_Amount__c: The upfront payment amount for the plan. Populated on 678
      records (88%).
    Offer_letter_amount__c: Amount tied to the candidate's (future) offer letter
      - the salary basis the success-fee part of the agreement is calculated on.
      Populated on 678 records. (Exact contractual meaning - verify with team.)
    Salary__c: A PERCENT field despite the plain "Salary" label - the percentage-of-
      salary component of the candidate's fee agreement (income-share style). Populated
      on 678 records, copied from the Account at creation.
    Salary_Expectations_Picklist__c: 'The candidate''s target salary band: $60,000
      - $80,000 | $80,000 - $120,000 | $120,000 - $160,000 | $160,000 - $200,000
      | $200,000 +. Captured on the intake form; guides which roles marketing targets.'
    Secondary_Email__c: Backup email. 51 records.
    Phone__c: Primary phone. 95% populated (736).
    Secondary_Phone__c: Backup phone number.
    WhatsApp_Number__c: The candidate's WhatsApp contact (much of the candidate
      base communicates on WhatsApp). 92 records.
    Date_of_Birth__c: Candidate's date of birth (62% populated) - needed for background
      checks and some employer forms later in the journey.
    Last_4_digits_of_SSN__c: Last four digits of the candidate's US Social Security
      Number - collected for job applications that require it. Only 30 records (sensitive;
      rarely captured).
    Passport_Number__c: Passport number - identity anchor for international candidates;
      marked REQUIRED on the page layout. Populated on 432 records (56%).
    Current_Address__c: The candidate's current home address (full compound address
      field).
    Billing_Address__c: Billing address as plain text, copied from the Account's
      billing address by the creation flow.
    Shipping_Address__c: Shipping/mailing address as plain text (rarely relevant;
      legacy).
    Candidate_Time_Zone__c: 'Which timezone the candidate lives in: ET | PT | CT
      | MT | HT | AT | UTC (record-type default) | IST. Drives when the team schedules
      calls.'
    Race_Ethnicity__c: American Indian or Alaska Native | Asian | Black or African
      American | Hispanic or Latino | Native Hawaiian or Other Pacific Islander
      | Two or More Races | Other (please specify) | I choose not to disclose.
    Disability_Status__c: Yes, I have a disability or previously had a disability
      | No, I do not have a disability | Prefer not to say.
    Military_Status__c: Active Duty | Reserve or National Guard | Veteran | Retired
      Military | Military Spouse | No Military Service | Prefer not to say.
    Work_Authorization_Expiry_Date__c: 'When the authorization (e.g. the OPT EAD
      card) expires - drives urgency: the candidate must be placed before this date.'
    Visa_Status__c: 'OLDER visa-status field: F1 | H1-B | CPT | OPT-EAD | H4-EAD
      | Green_Card | US_Citizen | Other. Populated on 413 records, mostly legacy
      (OPT-EAD 275, F1 108)'
    Active_CPT__c: The candidate is currently on CPT (Curricular Practical Training
      - i.e. still enrolled at a university). True on 71 records.
    Authorized_To_Work_In_US__c: Blanket "can legally work in the US" flag from
      the intake form.
    Sponsorship_Required_For_VISA__c: The candidate will need employer visa sponsorship
      (e.g. an H1B transfer) - limits which employers marketing can target.
    Mention_your_Visa_dates_if_applicable__c: Free-text visa validity dates as the
      candidate wrote them on the form.
    Date_of_Arrival__c: Date the candidate arrived in the US. Never populated (0
      records) - the free-text field below is what actually gets filled.
    When_did_you_move_to_USA__c: Free-text answer to "when did you move to the USA".
      442 records (57%).
    Linkedin_URL__c: Second LinkedIn URL field (the one the creation and sync flows
      map to the Account). 114 records. Two URL fields exist for historic reasons
      - check both when looking for the profile.
    LinkedIn_Email_Id__c: The email address the candidate's LinkedIn account is
      registered under.
    LinkedIn_Username__c: LinkedIn login username.
    LinkedIn_Password__c: LinkedIn login password, stored ENCRYPTED (masked from
      most users). Deliberately excluded from the Account sync flow because encrypted
      fields cannot be flow-copied.
    LinkedIn_Password_Updated__c: Free-text note of when/whether the password was
      changed (e.g. after the engagement ends).
    Marketing_Email_Id__c: The dedicated email address created/used for marketing
      this candidate (job applications are sent from it). 432 records (56%).
    Marketing_Email_Password__c: Password for that marketing mailbox - stored as
      PLAIN text (unlike the LinkedIn password; a known data-hygiene risk). Excluded
      from Account sync.
    Professional_Profiles__c: Other professional links (GitHub, portfolio, Indeed,
      etc.) as free text.
    Years_of_Experience__c: Duplicate/legacy years-of-experience field on the "Information"
      section. Prefer Total_Years_of_Experience__c.
    Which_Experience_Level__c: 'Seniority band: Entry_Level | Associate | Mid-Senior_level
      | Director | Executive. 436 records (57%).'
    Industry__c: Target industry from the org-wide industry list (Agriculture, Banking,
      Consulting, Finance, Healthcare, Technology, ... 32 values). Copied from/synced
      to the Account.
    Niche__c: 'The candidate''s placement niche: AI ML Engineer | Python Developer/
      Engineer | Java Fullstack Developer/Engineer | Product/Project Manager | Marketing
      Manager | Finance Analyst | Other.'
    Niche_Other__c: Free-text niche when Niche = "Other".
    Technology__c: Primary technology/stack keywords (e.g. "Java, Spring, AWS").
