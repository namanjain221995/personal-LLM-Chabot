# Domain: PART 10 — verifier verdict: ship_with_fixes.
name: kb-zoom-recordings
description: 'Teaches the in-house S3 Zoom Recording Portal: who watched which recording
  (access logs), folder grants and recording departments, plus the separate vendor
  Zoom Phone call-log object.'
