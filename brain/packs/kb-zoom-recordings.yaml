- zoom recording
- zoom recordings
- recording portal
- zoom recording portal
- recording access
- recording access log
- viewer log
- viewer logs
- folder grant
- folder grants
- folder access
- recording department
- recording departments
- screen recording
- screen recording attempt
- signed url
- signed urls
- who watched
- watched recording
