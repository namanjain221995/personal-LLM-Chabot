- title: Save rules on Job_Requirement__c (validation rules, production)
  keywords:
  - job
  - requirement
  - validation
  - save
  - error
  - required
  - blocked
  text: 'Active validation rules on Job_Requirement__c — the reasons a save fails:

    - Client_Account_Cannot_Be_Candidate: blocks the save with "Client Account must be a B2B
    Client or Vendor Business Account, not a Candidate Person Account." (This validation rule
    ensures that the Client Account selected on the Job Requirement must be a B2B Client or
    Vendor Business Account. Person Accounts linked to Candidates are not allowed.)

    - Invalid_Status_Transition: blocks the save with "Invalid Job Status transition. Allowed
    transitions are: New → Open, Open → On Hold or Closed, and On Hold → Open or Closed. Only
    System Administrators can reopen a Closed Job Requirement." (Restricts invalid Job Status
    transitions by enforcing the approved Job Requirement lifecycle. Valid transitions are:
    New → Open, Open → On Hold/Closed, On Hold → Open/Closed. Reopening a Closed Job Requirement
    (Closed → Open) is permitted only for admins)

    - Max_Submissions_Allowed: blocks the save with "Max Submissions Allowed must be greater
    than the Number of Openings"

    - Open_Job_Needs_Deadline: blocks the save with "Submission Deadline is required when
    Job Status is Open." (Submission Deadline is required when Job Status is Open.)

    - Submission_After_Req_Received: blocks the save with "Submission Deadline must be later
    than the Requirement Received Date/Time." (Ensures Submission Deadline is later than Requirement
    Received Date/Time)

    - Submission_Deadline: blocks the save with "Submission Deadline is required when Job
    Status is Open. Please enter the date and time by which candidate profiles must be submitted
    to the client." (This validation rule ensures that Submission Deadline is mandatory when
    Job Status is set to Open. If the Submission Deadline is left blank, the system will block
    the save and display an error message.)

    - job_requirements_publish_status_is_open: blocks the save with "A job can only be published
    when Job Status is Open."

    - Inactive (defined but NOT enforced): Job_Requirement_Required_Fields, Published_Job_Needs_Description,
    Req_Received_Before_Submission, Require_One_Complete_Client_Pair, submissionDeadlineDateValidation'
