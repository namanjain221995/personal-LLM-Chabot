# The Training Module brain.
# Compiled from brain/sources/training-module.txt (the Training Module
# Handbook v1.0, 32 pages) and verified against THIS production warehouse on
# 2026-08-17: every table and field below was checked column by column, and
# every data claim was re-grounded with live queries. This pack deliberately
# does NOT restate the training rules that already live in org_brief.py
# (slots, Session purposes, module statuses, mock-kind-via-type-join) — it
# adds the layers the handbook documents on top of them: the deliverable
# lifecycle, Session-Window booking, the Program-Version mock governance
# knobs, the drop cascade, and the (not-yet-live) session AI analysis.
name: training-module
description: >
  How TechSara's training delivery engine works: Program Versions, Slots and
  Session Windows, enrolments, the deliverable submission + AI grading
  pipeline, mock governance, the drop cascade, and the candidate portal.

