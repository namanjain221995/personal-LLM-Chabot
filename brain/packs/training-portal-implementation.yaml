  text: |2
      THE EIGHT STATES [VERIFIED -- mockBooking.js lines 68-92]
        not-due          the mock is further out than the booking window
        book-now         inside the booking window, nothing booked -> slot picker
        no-slots         inside the window but every interviewer is full
        booked           booked, and still outside the reschedule lock
        booked-locked    booked, inside the reschedule lock -- no changes
