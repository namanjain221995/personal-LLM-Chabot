  text: |2
      Time_Zone__c  <- GLOBAL VALUE SET Candidate_Time_Zone (8 values)
        ET (Eastern Time)   <-- default=true on the GVS
        PT (Pacific Time)
        CT (Central Time)
        MT (Mountain Time)
        HT (Hawaii Time)
        UTC (Coordinated Universal Time)
        AT (Alaska Time)
        IST (India Standard Time)
      These exact strings are the KEYS in LockOverdueDeliverables.PICKLIST_TO_TZ_ID
      and in the IST-population flow's fOffsetMins CASE(). Add a value here and you
      must add it to EasternTimeUtil.ZONE_TO_IANA and the LWC ZONE_IANA map too, or
      it silently falls back to Eastern.

      Candidate_Time_Zone_Start_Time__c / _End_Time__c  <- GLOBAL VALUE SET "Times"
        96 values, every 15 minutes across 24 hours, running
        "12:00 AM", "12:15 AM" ... "11:45 AM", "12:00 PM" ... "11:45 PM".
        *** HOURS 1-9 ARE ZERO-PADDED: "01:00 AM", not "1:00 AM". ***
        This is load-bearing. formatTimeInTzForPicklist() in
        CandidatePortalController and AdminSessionAssignmentController must emit
        exactly this shape or the restricted-picklist write fails.

      D5.5  FIELD PURPOSE -- TRACED TO THE CODE THAT USES IT
      -----------------------------------------------------
      Format: FIELD -> who writes it -> who reads it.
