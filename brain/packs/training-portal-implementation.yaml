- title: "Dev9 repo \u2014 Orientation: A5. HOW TO READ THE FEATURE MAP"
  keywords:
  - orientation
  - read
  - map
  text: |
    PART C is the heart of this document. Every feature gets the same block so you
    can scan for the row you need without reading prose:

        FEATURE nn -- NAME
          WHAT          one paragraph: what it does and why it exists
          WHO           which persona uses it
          ENTRY POINT   the exact click path or URL
          UI            LWC / Aura / flow screens involved
          APEX          classes and the specific methods
          OBJECTS       records read and written
          AUTOMATION    flows, triggers, scheduled jobs
          CONFIG        the fields that change behaviour without code
          RULES         the domain logic worth knowing
          GOTCHAS       what has actually broken here
          STATUS        where it is deployed

    If you only want to know "where does behaviour X live", read the WHAT and the
    APEX/UI lines and skip the rest. If you are about to change something, read
    RULES and GOTCHAS first -- almost every one of them cost somebody an afternoon.
