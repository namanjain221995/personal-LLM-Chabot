- title: "Dev9 repo \u2014 Feature 18: Admin Training Dashboard (3/4)"
  keywords:
  - admin
  - dashboard
  - sequence__c
  - session_attendee__c
  - candidate__c
  - assigned_trainer_user__c
  - assigned_trainer__c
  - trainer__c
  - lead_trainer__c
  - start_date__c
  - started_at__c
  text: |
    PERMISSION SET
      Admin_Training_Dashboard_Access -- grants the Apex class access. Assign it to
      the specific users who should see the dashboard.

    DOMAIN RULES BAKED IN [MEMORY -- all validated in-session with the user]
      - cohortId = null in getSlotDashboard means "All slots": query every training,
        cohorted and uncohorted alike.
      - The Week filter is SEQUENCE-based, not calendar-based. Five working days per
        week; weeksInCohort = ceil(MAX(Step.Sequence__c) / 5). A prior calendar-based
        version systematically under-weighted Week 1.
      - Session counts MUST include Session_Attendee__c rows. Group programs put
        candidates on the attendee path rather than Session.Candidate__c. Deduplicate
        by Session Id when combining the two paths.
      - Trainer resolution is a four-step fallback chain:
            Assigned_Trainer_User__c            (User)
         -> Assigned_Trainer__c                 (Recruiter -> User)
         -> Session_Window__r.Trainer__c        (Recruiter -> User)
         -> Cohort__r.Lead_Trainer__c           (User)
      - Effective start date: if Candidate_Training.Start_Date__c is null, use the
        earliest CandidateTrainingStep.Started_At__c. This is what makes IRT
        trainings appear at all.
      - "Deliverables cleared" = approved deliverables / total in the week scope.
        The sub-label changes with the filter: "Week 1", "Weeks 1-2", "of N in
        training".
- title: "Dev9 repo \u2014 Feature 18: Admin Training Dashboard (4/4)"
  keywords:
  - admin
  - dashboard
  text: |
    USER PREFERENCES, LOCKED [MEMORY]
      - Program is a dropdown in the header, NOT a chip row.
      - The "Latest mock" column was removed from the list view; it appears only in
        the drill drawer.
      - Header and filters stay on ONE line at normal desktop width; wrapping is
        allowed only at narrow viewports.
      - Sort resets to default whenever ANY filter changes.
      - Four summary tiles only. No mocks-missed tile, no completed tile, no
        dropped tile.

    GOTCHAS -- both discovered here
      - N-03 overflow clipping: setting overflow-x: auto on .adm-controls to force
        filters onto one line made every dropdown's popover invisible. The aria
        state changed and clicks fired, but nothing rendered. Filter containers must
        use overflow: visible all the way up the ancestor chain; prefer flex-wrap
        over overflow for fitting.
      - N-04 per-row column shapes: <template lwc:if> around individual <th>/<td>
        inside one shared <table> does NOT render reliably -- the HTML parser
        normalises table structure and drops the template tags. Use TWO complete
        <table> elements gated by lwc:if. Add both isX and isNotX to the data,
        because LWC has no lwc:if={!x}. Accept the duplication.

    STATUS
      Live on all four orgs including production.
