- title: "Dev9 repo \u2014 LWC Catalogue: PART F -- LWC CATALOGUE (5/5)"
  keywords:
  - lwc
  - catalogue
  text: |
    LWC CONVENTIONS THAT ARE ACTUALLY ENFORCED HERE
      1. legacyMode rollback. Old designs live inside
         <template lwc:if={legacyMode}> with the new design in <template lwc:else>.
         Flip one boolean to roll back. Never delete the old design code. The bundle
         is bigger; the dormant template does not render.
      2. Controlled <select> needs selected={isOptionSelected} on EVERY <option>.
         LWC's renderer ignores the parent value= attribute.
      3. Date math: clone with new Date(x), mutate the clone, reassign. LWC
         reactivity is shallow, so in-place mutation does not re-render.
      4. Two requestAnimationFrames before getBoundingClientRect. One for layout,
         one for resolved styles.
      5. Read the session token as a CLASS FIELD INITIALIZER when the component uses
         @wire. Wires provision before connectedCallback runs.
      6. No lwc:if={!x}. Put both isX and isNotX on the data.
      7. Different column shapes per group means two complete <table> elements, not
         per-cell templates.
      8. overflow must stay visible on any ancestor of a form control's popover.
      9. CSS lives in the component's own .css file. dashboardStyles.css is for
         genuine cross-component tokens only.
     10. LWR suppresses ShowToastEvent. Portal components need an on-screen error
         banner (the loadError + extractWireError pattern in candidateAvailability)
         or failures are silent.
