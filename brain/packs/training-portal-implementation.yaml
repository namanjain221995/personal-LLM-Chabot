- title: "Dev9 repo \u2014 Org Topology And Deploy Playbook: K2. THE REPUBLISH RULE"
  keywords:
  - org
  - topology
  - deploy
  - playbook
  - republish
  - rule
  text: |2
      Deploying an LWC updates the ORG. The live Experience site keeps serving its
      LAST PUBLISHED BUNDLE until you republish.

          sf community publish --name "Talent Hub" --target-org <alias>
          sf community publish --name "Candidate Space" --target-org dev9

      Then wait for the publish confirmation email (2-5 minutes) and test in an
      incognito window or after a hard refresh.

      99 percent of "why isn't my portal change showing up" is a forgotten
      republish -- or a republish of the wrong site. To prove it is not the deploy:

          sf project retrieve start --metadata "LightningComponentBundle:training" `
             --target-org preprod
          # inspect the retrieved bundle for your change
          # if it IS there, the org is fine -- republish the site
- title: "Dev9 repo \u2014 Org Topology And Deploy Playbook: K3. STANDARD DEPLOY COMMANDS (1/2)"
  keywords:
  - org
  - topology
  - deploy
  - playbook
  - standard
  - commands
  - dashboardservice
  text: |2
      Preferred form: --metadata "Type:Name", piped through ConvertFrom-Json so the
      output is two lines instead of a 100 KB progress dump.

        # single class
        sf project deploy start --metadata "ApexClass:DashboardService" `
          --target-org dev9 --json | ConvertFrom-Json | ForEach-Object {
            "Status: $($_.result.status)"; "Deploy Id: $($_.result.id)" }

        # single LWC
        sf project deploy start --metadata "LightningComponentBundle:mockBooking" `
          --target-org dev9 --json | ConvertFrom-Json | ForEach-Object {
            "Status: $($_.result.status)"; "Deploy Id: $($_.result.id)" }

        # a manifest
        sf project deploy start --manifest manifest/deploy-package.xml `
          --target-org preprod --test-level NoTestRun

        # production, with named tests
        sf project deploy start --manifest manifest/prod-phase2.xml `
          --target-org TechSaraProf --test-level RunSpecifiedTests `
          --tests AvailabilityControllerTest --tests AvailabilityPortalControllerTest

        # assign a perm set
        sf org assign permset --name Training_Module_All_Access --target-org preprod

      Prefer --metadata over long comma-separated --source-dir lists: PowerShell has
      a parsing quirk with comma lists passed to the sf CLI.
