- title: "Dev9 repo \u2014 Feature 11: Candidate Availability Calendar (5/6)"
  keywords:
  - candidate
  - availability
  - calendar
  - availability__c
  text: |
    GOTCHAS -- this feature generated five of the sharpest lessons in the project
      G1  Guest license forbids Edit/Delete object permissions. The perm set can
          only declare Read + Create on Availability__c. Edit and delete still work
          because system-mode Apex ignores object CRUD; assertOwned is the real gate.
      G2  Never return raw sObjects to a Guest LWC. The first cut returned
          List<Availability__c> and the grid was empty in the portal while working
          as an admin -- FLS stripping at the Lightning boundary. Fixed with SlotDTO.
      G3  Read the session token as a FIELD INITIALIZER, not in connectedCallback.
          @wire keyed on $sessionId provisions BEFORE connectedCallback runs, so the
          wires fired once with undefined and never re-ran. Imperative calls still
          worked, which made the bug look like a data problem. Fix:
          sessionId = getSession(); as a class field.
      G4  Cacheable reads MUST use fromSessionReadOnly. fromSession's heartbeat DML
          throws "Too many DML statements: 1" in a cacheable context. Every wire
          errored; the page was blank. Found only via a Guest User debug log.
      G5  Publish the RIGHT site. dev9 has several candidate sites; the live one is
          "Candidate Space". On dev10/preprod/prod it is "Talent Hub". Publishing
          the wrong one looks exactly like a failed deploy.
