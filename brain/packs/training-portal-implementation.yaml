rules: "Candidate-portal IMPLEMENTATION rules (read these before answering \"how does\nit work\", and\
  \ before treating a documented field as data):\n- PROVENANCE: this pack is compiled from the Dev9 SANDBOX\
  \ repo documentation.\n  Apex classes, LWC bundles, flows, permission sets, layouts, tabs and deploy\n\
  \  IDs are repo metadata \u2014 never columns, never SELECTable. Answer them from\n  the documentation\
  \ and say you are describing the implementation, not data.\n- The portal runs as an unlicensed Salesforce\
  \ GUEST user, so candidates are\n  never User rows. Their auth data IS in the warehouse though:\n  Candidate_Portal_Credential__c\
  \ (310 rows, 132 with Last_Login_At__c, all\n  Is_Active__c 'true') and Candidate_Portal_Session__c\
  \ (878 rows). Portal\n  adoption IS answerable \u2014 never say the portal is \"not rolled out\".\n\
  - Never read out a credential or a session token even though both are synced:\n  Candidate_Portal_Credential__c.Username__c\
  \ is an email on all 310 rows and\n  Candidate_Portal_Session__c.Session_Id__c is populated on all 878.\n\
  - EVERY time-of-day column in this module is a DISPLAY STRING, not a time:\n  Candidate_Training__c.Candidate_Time_Zone_Start_Time__c\
  \ / _End_Time__c\n  (zero-padded, '01:00 AM'), Start_Tme_IST__c / End_Time_IST__c, and\n  Session__c.Selected_Time_Zone_Start_Time__c\
  \ / Selected_Time_Zone_ETim__c.\n  Never sort, range-compare, diff or average them. The two families\
  \ use\n  different formats (zero-padded vs not) so they can never be compared to\n  each other either.\n\
  - The IST display strings carry their OWN date, which disagrees with\n  Scheduled_Date__c on about a\
  \ third of the sessions that have one. Never\n  take a date from an IST field \u2014 use Scheduled_Date__c,\
  \ and note it is a\n  VARCHAR: cast it before comparing with a date.\n- Timezone picklists store the\
  \ FULL label: 'ET (Eastern Time)', 'IST (India\n  Standard Time)', 'CT (Central Time)'. Time_Zone__c\
  \ = 'ET' returns zero\n  rows \u2014 match with ILIKE 'ET%'.\n- Submitted deliverable files never enter\
  \ Salesforce; the browser PUTs them\n  to S3 with a pre-signed URL. Deliverable_Result__c.Deliverable_Path__c\
  \ and\n  Threshold_Score__c are empty on all 4,940 rows, so the warehouse can score\n  a submission\
  \ but can never produce, link or verify the artefact itself.\n- Session__c.Create_Meeting_Error__c is\
  \ NULL on all 3,263 production rows.\n  The Zoom-callout diagnostic was never populated here, so a missing\
  \ meeting\n  link cannot be explained from it.\n- Not synced \u2014 caveat, never query: Candidate_Training__c.Secret_Token__c\n\
  \  (dead metadata, nothing in the repo reads it), .Status_Message__c (a text\n  formula banner rendered\
  \ by an LWC) and .Updated_Trainer__c (one screen\n  flow). Trainer REASSIGNMENT is still answerable,\
  \ just not from that field:\n  Candidate_Training__History holds the Assigned_Trainer__c changes.\n\
  - Availability__c reached the warehouse with every field except Time_Zone__c\n  stripped by field-level\
  \ security, so \"when is candidate X available\" cannot\n  be answered from SQL at all \u2014 say so\
  \ rather than querying around it.\n- Session__c.Scheduled_Start__c and Scheduled_End__c \u2014 the doc\
  \ calls them the\n  only values safe for arithmetic \u2014 are NULL on all 3,263 production rows.\n\
  \  Session date maths uses TRY_CAST(Scheduled_Date__c AS DATE) (3,261 set).\n- Warehouse datetime TEXT\
  \ carries two suffixes in the SAME column: older rows\n  end 'Z', newer ones '+0000' (Deliverable__c.Due_Date_Sort__c\
  \ splits 3,701 /\n  1,940). Always TRY_CAST; never substring or string-compare a timestamp.\n- Because\
  \ every candidate acts as the one Guest User, CreatedById and OwnerId\n  never say who did something\
  \ on the portal: all 4,940 Deliverable_Result__c\n  rows share a single CreatedById. Attribute through\
  \ Candidate__c or the\n  parent training, and never present a created-by as the acting person.\n- A\
  \ group attendee's own zone is not the master's: 218 of 446\n  Session_Attendee__c rows carry a Time_Zone__c\
  \ and start time that differ\n  from their Session__c. Quote the attendee's row for the attendee's time;\n\
  \  status, date and link do read through to the master.\n- A field missing from our copy does not mean\
  \ the org lacks it \u2014 the\n  integration user's field-level security strips columns at the boundary.\n\
  \  Say \"the org records this but our warehouse copy cannot see it\", never\n  \"the org does not track\
  \ it\".\n"
glossary:
  guest user: |
    The unlicensed Salesforce user the whole candidate portal runs as. It is why no candidate is a User row and why every portal Apex class runs `without sharing` with the tenancy check written by hand instead.
  pre-signed URL: |
    The short-lived AWS S3 link the portal hands the browser so a deliverable file uploads straight to S3. The file never passes through Salesforce, which is why no warehouse column holds it.
  republish: "Re-publishing the LWR Experience site, which is REQUIRED before any LWC change is visible\
    \ on the portal. Deploying the component alone is not enough \u2014 this has been mistaken for a broken\
    \ feature more than once.\n"
  trainer dashboard: |
    The trainer-scoped LWC shipped 2026-08-13, showing only the trainings a trainer owns via Assigned_Trainer__c, Assigned_Trainer_User__c or the session window's Trainer__c. It shares one permission set with the admin dashboard, "Training Dashboards - Full Access" (Admin_Training_Dashboard_Access).
  stem portal: |
    The external Next.js front end that talks to Salesforce over a small REST facade rather than through the LWR portal. A second consumer of the same training data, not a separate data model.
