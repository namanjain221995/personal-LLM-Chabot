- title: "Dev9 repo \u2014 Feature 01: Candidate Authentication And Session Management (1/5)"
  keywords:
  - candidate
  - authentication
  - session
  - management
  - authservice
  text: |
    WHAT
      A complete custom auth system -- accounts, passwords, brute-force lockout,
      multi-device session caps, sliding expiry, logout and credential recovery --
      built entirely on two custom objects, because the candidates have no
      Salesforce licenses. It is the foundation every other portal feature stands on.

    WHO
      Every candidate. Also the Next.js Stem Portal, which shares the exact same
      credential and session records through a REST facade (feature 26).

    ENTRY POINT
      https://<host>/<siteslug>/login

    UI
      candidateLogin  (34 KB) -- username/password form, forgot-password flow,
                      sets sessionStorage 'justLoggedIn' for the welcome animation,
                      preserves the older design behind <template lwc:if={legacyMode}>
      sessionUtil     (1 KB)  -- getSession / setSession / clearSession / hasSession,
                      thin localStorage wrappers with try/catch

    APEX
      AuthService (281 lines, without sharing)
        @AuraEnabled login(String username, String password, String clientIp) -> String
        @AuraEnabled recoverLogin(String email) -> void
        @AuraEnabled logout(String sessionId) -> void
        loginInternal(...)          catchable variant for REST callers
        constantTimeEquals(...)     private, prevents timing side-channel
