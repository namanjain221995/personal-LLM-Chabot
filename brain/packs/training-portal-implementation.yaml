- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (1/13)"
  keywords:
  - gotchas
  - troubleshooting
  text: |
    Numbered so they can be cited. Each one has actually happened.

    --- PLATFORM AND SITE ---

      N-01  PORTAL SHOWS AN EMPTY STATE (no deliverables, no sessions)
            Cause: the Guest User does not have Candidate_Portal_Guest_Access -- or
            it is on the WRONG guest user. Verified in production once: the perm set
            was on "Talent Hub Site Guest User" while the portal ran as "Techsara
            Candidate Hub Site Guest User".
            Fix: Setup -> Digital Experiences -> your site -> Administration ->
            Guest User -> check the assigned permission sets.

      N-02  A DEPLOYED LWC CHANGE DOES NOT APPEAR
            Cause: the site was not republished, or the WRONG site was republished.
            Fix: sf community publish --name "<the right site>" --target-org <alias>.
            dev9 = "Candidate Space". dev10/preprod/prod = "Talent Hub".
            Prove the org is fine first by retrieving the bundle and inspecting it.

      N-03  EVERY PAGE RETURNS "INVALID PAGE"
            Cause: the Guest Profile is not in the Network's networkMemberGroups.
            Fix: add it via Network metadata or Workspaces -> Administration ->
            Members. Note the Guest User profile does not appear in the standard
            Members list UI.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (2/13)"
  keywords:
  - gotchas
  - troubleshooting
  text: |2
      N-04  /s/ PREFIX CONFUSION
            LWR sites have NO /s/ prefix. URLs are /<siteslug>/login and /<siteslug>/.
            Redirect logic must compute the prefix from window.location.pathname.

    --- PERMISSION SETS ---

      N-05  "You cannot deploy to a required field"
            Cause: an explicit <fieldPermissions> entry for a required field.
            Fix: remove it. Required fields get access via objectPermissions.

      N-06  "fieldPermissions duplicated"
            Cause: XML ordering. ALL fieldPermissions blocks must precede ALL
            objectPermissions blocks.

      N-07  A PERM SET SILENTLY REFUSES TO CHANGE ITS LICENSE
            Cause: once created with a <license>, Salesforce keeps the original
            forever on redeploy -- and a licensed perm set cannot go to a Guest User.
            Fix: remove assignments, delete the perm set, redeploy license-free.

      N-08  "The user license doesn't allow the permission"
            Cause: allowEdit or allowDelete declared for the Guest User.
            Fix: grant Read + Create only. Writes still work through system-mode
            Apex; guard them with an ownership assertion.

      N-09  A PERM SET REFERENCES A FIELD THAT DOES NOT EXIST IN THE TARGET
            Cause: it was generated against a different org's schema.
            Fix: regenerate against the target, or strip the stray references. This
            is routine when promoting from dev9 to the orgs behind it.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (3/13)"
  keywords:
  - gotchas
  - troubleshooting
  text: |
    --- APEX AND RUNTIME ---

      N-10  "Too many DML statements: 1" ON A CACHEABLE METHOD
            Cause: @AuraEnabled(cacheable=true) plus CandidateContext.fromSession,
            whose heartbeat is a DML.
            Fix: cacheable reads use fromSessionReadOnly. Writes keep fromSession.
            This does NOT reproduce locally, as an admin, or under System.runAs --
            only the live Lightning cacheable runtime enforces it. Diagnose with a
            TraceFlag on the site Guest User and read the ApexLog.

      N-11  A PORTAL GRID IS EMPTY BUT THE RECORDS EXIST
            Cause: the method returned raw sObjects and the Guest's missing FLS
            stripped the fields, so the LWC filtered every row out.
            Fix: return a DTO. Never sObjects across the Lightning boundary.

      N-12  A PORTAL LWC IS TOTALLY BLANK BUT IMPERATIVE WRITES WORK
            Cause: the session token was read in connectedCallback, but @wires keyed
            on $sessionId provision BEFORE connectedCallback runs, so they fired once
            with undefined and never re-ran.
            Fix: sessionId = getSession(); as a CLASS FIELD INITIALIZER.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (4/13)"
  keywords:
  - gotchas
  - troubleshooting
  - authservice
  - availabilitycontroller
  - niche__c
  - mockavailabilityservice
  text: |2
      N-13  "Can only throw this exception type from VisualForce or Aura context"
            Cause: AuraHandledException thrown from a @RestResource.
            Fix: use the catchable internal variants -- AuthService.loginInternal and
            CandidateContext.fromSessionRest. Unit tests are exempt from this rule,
            so only a live REST call reproduces it.

      N-14  ANONYMOUS APEX ON A FRESHLY DEPLOYED FIELD SAYS "field does not exist"
            Cause: the IDE has cached the schema.
            Fix: close and reopen the Developer Console, or run via
            sf apex run --file from the CLI to bypass the cache.

      N-15  "Method is not visible" AFTER A REFACTOR
            Cause: a helper in AvailabilityController was narrowed from public.
            The portal twin calls it cross-class.
            Fix: keep toInterviewInfo, toSessionInfo, buildRow, useViewZone and
            applyViewZone PUBLIC. Public already covers what @TestVisible gave.

      N-16  A NICHE ASSIGNMENT THROWS A TYPE ERROR
            Cause: Candidate_Training.Niche__c is a Picklist;
            Internal_Interview.Niche__c is a Lookup to Niche__c.
            Fix: MockAvailabilityService.lookupNicheId(String) resolves by NAME --
            which means the picklist label and the Niche record name must match
            exactly.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (5/13)"
  keywords:
  - gotchas
  - troubleshooting
  - time_zone__c
  text: |2
      N-17  A TIME IS SILENTLY 9.5 HOURS WRONG
            Cause: a zone picklist value exists that is missing from
            EasternTimeUtil.ZONE_TO_IANA or the LWC's ZONE_IANA, so it falls back to
            Eastern without throwing. This was IST.
            Fix: add new zone values to BOTH maps. Grep for both when adding one.

    --- TESTS ---

      N-18  PREPROD DEPLOY FAILS ON TESTS THAT ARE NOT YOURS
            Pre-existing failures live in AccountSchedulerJobTest,
            InterviewTriggerTest, InvoiceControllerTest and LockOverdueDeliverablesTest.
            Use --test-level NoTestRun for sandbox deploys, and RunSpecifiedTests
            when you want your own tests validated.

      N-19  PRODUCTION DEPLOY FAILS ON WITH SECURITY_ENFORCED
            Cause: prod runs tests (sandboxes do not) and the deploying user lacks
            FLS on the new fields -- while the FLS-granting perm set is in the same
            deploy.
            Fix: the two-phase deploy in PART K5.

      N-20  A TEST BREAKS BECAUSE A FEATURE IMPROVED
            Two real examples: a test used IST as its "unknown zone" example and IST
            became supported; a test asserted zone == 'PT' on an org where
            Account.Time_Zone__c does not exist. Fix: use a genuinely unmapped label
            like 'XYZ (Unmapped Zone)', and describe-guard org-specific assertions.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (6/13)"
  keywords:
  - gotchas
  - troubleshooting
  - selected_time_zone_start_time__c
  - selected_time_zone_etim__c
  - host_feedback__c
  - candidate_time_zone_start_time__c
  - candidate_time_zone_end_time__c
  - purpose__c
  text: |2
      N-21  PREPROD VALIDATION RULES REJECT TEST DATA
            Session insert needs Selected_Time_Zone_Start_Time__c and
            Selected_Time_Zone_ETim__c. Session update to Completed needs
            Host_Feedback__c. Candidate_Training insert needs
            Candidate_Time_Zone_Start_Time__c and Candidate_Time_Zone_End_Time__c.
            Purpose__c = 'Mock' is dev9-only.
            Fix: use TestDataFactory, which already satisfies all of these.

    --- FLOWS ---

      N-22  FLOW DEPLOY FAILS WITH A FIELD INTEGRITY EXCEPTION ON A BOOLEAN
            Fix: Boolean screen inputs need <isRequired>true</isRequired>.

      N-23  A DATATABLE SHOWS HEADERS BUT NO ROWS AND NO CHECKBOXES
            Cause: null booleans do not render as checkboxes.
            Fix: initialise the boolean to an explicit literal false on creation.

      N-24  A DATATABLE WILL NOT DEPLOY
            Fix: minRowSelection and maxRowSelection are BOTH required
            inputParameters, even for read-only tables. Use min=0, max=1.

      N-25  THE IDE SHOWS XML SCHEMA ERRORS ON Program_Creation
            False positives from a generic XML validator that does not know the
            Salesforce Flow schema. Salesforce's compiler accepts the file. Ignore.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (7/13)"
  keywords:
  - gotchas
  - troubleshooting
  - availability__c
  - resume__c
  text: |2
      N-26  A FLOW DEPLOYS TO PRODUCTION AS DRAFT
            Sandboxes activate a Flow whose metadata says <status>Active</status>.
            Production does not. Fix: deploy a FlowDefinition with the ACTUAL
            production version numbers, then verify with a Tooling API Flow query.

    --- LAYOUTS AND PAGES ---

      N-27  FIELDS DISAPPEAR FROM A RECORD PAGE AFTER A DEPLOY
            Cause: a Layout or FlexiPage deploy REPLACES the whole page, so anything
            the target had and your source lacked is gone. The fields still exist;
            they are just off the page.
            Fix: retrieve the target's page, Compare-Object, add only. Keep
            org-specific pages out of cross-org manifests.

      N-28  A DEPLOY FAILS ON A DANGLING PAGE REFERENCE
            Cause: Availability__c and Resume__c override their View action to a
            flexipage, so that page must ship in the SAME phase as the object.

    --- TOOLING AND ENCODING ---

      N-29  A SOURCE FILE IS SILENTLY CORRUPTED AFTER A POWERSHELL PASS
            Cause: -replace with a wide unicode or hex character class. This once ate
            every lowercase 'i' from a 530-line LWC HTML file.
            Fix: never do it. Target literal strings only. If it happens, rewriting
            the affected block from scratch is faster than un-mangling it.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (8/13)"
  keywords:
  - gotchas
  - troubleshooting
  - candidate__c
  text: |2
      N-30  APEX SOURCE SHOWS DOUBLE-ENCODED CHARACTERS
            A UTF-8 file re-read as Windows-1252 and re-saved turns a middle dot into
            two characters and an en-dash into three.
            Fix: stick to ASCII in Apex source, and in documents like this one.

      N-31  THE IDE LINTER REWRITES A CUSTOM FIELD API NAME
            Seen: Candidate__c rewritten to Account. That is the linter, not the
            user. Revert it manually.

      N-32  rollbackOnError HIDES A PARTIAL SUCCESS
            A "20 of 21 succeeded" message does not mean 20 persisted -- the whole
            deploy rolled back. Always verify org state with SOQL afterwards.

      N-33  RETRIEVE WRITES TO A TEMP PATH
            Fix: always use default paths. Never --output-dir; custom output
            directories with retrieved metadata are unreliable.

      N-34  HEADLESS CHROME EXITS WITH CODE 13 AND WRITES NO PDF
            Two causes, both required: --no-sandbox must be present, and the output
            must go to the scratchpad first and then be copied to the destination.

    --- INTEGRATION ---

      N-35  HTTP 403 "no access to Apex class" FROM A REST ENDPOINT
            Cause: the perm set grants the class but was never ASSIGNED to the ECA
            Run-As user. An admin Run-As user would mask this by bypassing class
            access entirely.
            Fix: assign the perm set to the Run-As user.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (9/13)"
  keywords:
  - gotchas
  - troubleshooting
  - result_status__c
  - create_meeting_error__c
  text: |2
      N-36  invalid_grant "no client credentials user enabled"
            Cause: no Run-As user is set in the External Client App's policies.

      N-37  AN AWS GRADING CALLBACK DOES NOT SHOW UP
            Cause (fixed 2026-07-30): the roll-up flow required
            ISCHANGED(Result_Status__c), so callbacks updating only score or
            feedback were ignored. That condition was removed.

      N-38  A SESSION IS STUCK AT "Unscheduled"
            The Zoom callout failed. Check Create_Meeting_Error__c. There is no
            automatic retry -- this is a known gap.

    --- UI ---

      N-39  A DROPDOWN OPENS BUT NOTHING APPEARS
            Cause: a non-visible overflow on an ancestor clips the popover.
            Fix: overflow: visible up the whole chain; prefer flex-wrap.

      N-40  CONDITIONAL TABLE COLUMNS DO NOT RENDER
            Cause: <template lwc:if> around th/td inside a shared table.
            Fix: two complete tables gated by lwc:if.

      N-41  A CONTROLLED <select> LOSES THE USER'S CHOICE ON RE-RENDER
            Fix: selected={getter} on every <option>. The parent value= is ignored.

      N-42  A DATE CHANGE DOES NOT RE-RENDER
            Fix: clone with new Date(x), mutate the clone, reassign. LWC reactivity
            is shallow.

      N-43  getBoundingClientRect OCCASIONALLY RETURNS 0x0
            Fix: two requestAnimationFrames before measuring.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (10/13)"
  keywords:
  - gotchas
  - troubleshooting
  - dashboardservice
  - scheduled_start__c
  text: |2
      N-44  AN ERROR IN THE PORTAL IS COMPLETELY INVISIBLE
            Cause: LWR suppresses ShowToastEvent.
            Fix: render an on-screen error banner (the loadError + extractWireError
            pattern).

      N-45  A GROUP-SESSION CANDIDATE SEES THE WRONG TIME
            Fixed 2026-07-20 by per-viewer conversion in DashboardService.mapSessions.
            If legacy sessions still have a null Scheduled_Start__c,
            PortalHelpers.sessionUtcFromLocal reconstructs it.

      ---- ADDED 2026-08-18, FROM THE TRAINER DASHBOARD BUILD (feature 29) ----

      N-46  "You do not have access to the Apex class named 'X'"
            Cause: the permission set granting that class is not assigned to the
            logged-in user.
            THE DIAGNOSTIC VALUE OF THIS ERROR: users holding "Author Apex" -- every
            System Administrator -- BYPASS Apex class security entirely. So an admin
            literally cannot produce this error. Seeing it proves you are logged in
            as a community/portal user, which is the correct way to test. Testing a
            community feature as an admin proves nothing.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (11/13)"
  keywords:
  - gotchas
  - troubleshooting
  - candidate_training__c
  - assigned_trainer_user__c
  - assigned_trainer__c
  - recruiter__c
  - recruiter_user__c
  text: |2
      N-47  A TRAINER-SCOPED FILTER RETURNS ALMOST NOTHING
            Cause: matching only Candidate_Training__c.Assigned_Trainer_User__c.
            On production only 2 trainings use that path; 503 reach their trainer
            through Assigned_Trainer__c -> Recruiter__c -> Recruiter_User__c.
            Always match all three trainer paths (see feature 29, SCOPE RULE).
            Related: only 13 of 74 prod Recruiter rows have Recruiter_User__c set at
            all, so a trainer whose Recruiter record lacks the link sees nothing.

      N-48  STAT TILES DO NOT ADD UP TO THE TOTAL
            Seen live: a dropped training showed 36 total / 15 approved / 0 awaiting
            / 0 overdue, with 21 dropped rows in no bucket at all.
            Fix: make the buckets exhaustive AND mutually exclusive, and surface a
            Dropped bucket. If tiles are also filters, the JS bucket function must
            mirror the Apex rollup exactly or a tile says 6 and the table shows 5.

      N-49  A PERMISSION SET DEPLOY FAILS WITH "data value too large"
            Cause: <description> exceeds 255 characters. XML entity escapes count --
            one apostrophe becomes &#39; and costs 5 characters. See PART H, P6.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (12/13)"
  keywords:
  - gotchas
  - troubleshooting
  text: |2
      N-50  DELETING AND RECREATING A PERMISSION SET SILENTLY DROPS ASSIGNMENTS
            Fix: when consolidating, ADD grants to the existing perm set instead.
            Renaming the API name has the same effect as delete/recreate, which is
            why Admin_Training_Dashboard_Access kept its name after being relabelled.

      N-51  A TOOLING-API CustomTab QUERY REPORTS A TAB AS MISSING WHEN IT EXISTS
            `SELECT DeveloperName FROM CustomTab` via --use-tooling-api returns blank
            rows. Use `sf org list metadata --metadata-type CustomTab`.

      N-52  `sf project deploy start` RETURNS AN EMPTY JSON RESULT
            Seen once against production: Status and Deploy Id both blank, and the
            deploy had not fully submitted. Confirm with a Tooling query on
            DeployRequest (ORDER BY CreatedDate DESC) or simply re-run. Never assume
            a blank result means success -- verify the org state.
- title: "Dev9 repo \u2014 Gotchas And Troubleshooting: PART N -- GOTCHAS AND TROUBLESHOOTING (13/13)"
  keywords:
  - gotchas
  - troubleshooting
  text: |2
      N-53  A COMPONENT THAT WORKS INTERNALLY SHOWS NOTHING ON AN EXPERIENCE SITE
            Two distinct causes, check both:
            a. The bundle lacks lightningCommunity__Page in its targets, so it never
               appears in the Experience Builder palette at all.
            b. The site runs visitors as the GUEST USER. Any component that
               identifies the user with UserInfo.getUserId() -- as the Trainer
               Dashboard does -- is meaningless there. It only works on a site whose
               users authenticate as real licensed users, like AIC Portal's Customer
               Community Plus logins. The candidate portal is guest-based and this
               component must never go on it.
