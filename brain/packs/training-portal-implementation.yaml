    This document mixes two kinds of statements. They are labelled throughout.

      [VERIFIED]  Read out of the repository on 2026-08-12. File names, class names,
                  method signatures, field API names, component lists, counts.

      [MEMORY]    Carried from the persistent memory files and prior handoff docs.
