- title: "Dev9 repo \u2014 Feature 23: Drop Cascade (1/2)"
  keywords:
  - drop
  - cascade
  - candidate_training__c
  - status__c
  - deliverable__c
  - candidatetrainingstep__c
  - drop_date__c
  text: |
    WHAT
      One field change tears down a candidate's entire training footprint
      consistently: deliverables, steps, sessions and group-session membership.
      Every other feature that needs to drop a training just sets the status and
      lets this run.

    TRIGGER
      Candidate_Training__c.Status__c becomes 'Dropped'.

    AUTOMATION
      Candidate_Training_Dropped_Cascade (record-triggered flow)
        1. All related Deliverable__c    -> Dropped
        2. All related CandidateTrainingStep__c -> Dropped
        3. Call CandidateTrainingDropHandler.handleDrop for session cleanup
      Candidate_Training_Auto_Set_Drop_Date  stamps Drop_Date__c

    APEX
      CandidateTrainingDropHandler (97 lines)
        @InvocableMethod handleDrop(List<Id> trainingIds)

      THE THREE CASES
        1. SOLO SESSION -- the dropping candidate is the only participant.
           Cancel the session.
        2. ATTENDEE -- the dropping candidate is a Session_Attendee, not the master.
           Delete only their attendee row. Everyone else keeps the session.
        3. MASTER WITH ATTENDEES -- the dropping candidate owns the Session record
           but others are attending.
           TRANSFER the master role to the first attendee (rewrite the Session's
           candidate/training/step fields to point at them), then delete that
           now-redundant attendee row. The Zoom meeting, calendar event and
           recording survive untouched.
