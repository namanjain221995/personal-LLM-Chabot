# The Candidate Portal / training-module IMPLEMENTATION brain.
#
# Compiled 2026-08-19 from brain/sources/training-module-feature-map.txt
# ("TECHSARA CANDIDATE PORTAL -- TRAINING MODULE, COMPLETE FEATURE MAP + FULL
# MEMORY DUMP", generated 2026-08-12, last updated 2026-08-18, md5
# 9df3fe641ca7f1f0c34b6e74dcdf2c5c) by the brain ingestion pipeline:
# deterministic section parsing -> 9 distillers -> 9 adversarial verifiers ->
# every field name checked against the production warehouse.
#
# PROVENANCE MATTERS HERE. That document describes the **Dev9 SANDBOX repo**:
# Apex classes, LWC bundles, flows, permission sets and deploy IDs. None of it
# is queryable data. This pack is therefore KNOWLEDGE-ONLY plus a short rules
# block whose entire job is to stop the model treating repo metadata as
# columns. The data-layer rules for this domain live in training-module.yaml,
# kb-training-lms.yaml and org_brief.TRAINING_RULES; this pack deliberately
# does not restate them.
#
# It answers the other half of the questions: how the portal actually works,
# why a field looks the way it does, what breaks, and which org has what.
