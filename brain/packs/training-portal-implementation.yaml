  - triggers_mock__c
  text: |
    GOTCHAS -- all four of these cost real time
      - A Boolean input field in a flow screen must have <isRequired>true</isRequired>
        or the deploy fails with a field-integrity exception.
      - A flow DataTable will render its header and then NO ROWS and NO CHECKBOXES
        if the boolean column is null. Initialise Triggers_Mock__c to an explicit
        literal false when the step record is created.
      - minRowSelection and maxRowSelection are BOTH required inputParameters on a
        DataTable, even read-only or edit-only ones. Use min=0, max=1 for the
        typical pattern.
      - The IDE will show XML schema errors on this flow after any edit. They are
        false positives from a generic XML validator that does not know the
        Salesforce Flow schema. Salesforce's own compiler accepts the file -- proven
        by many successful deploys. Ignore them.

