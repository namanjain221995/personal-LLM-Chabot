  text: |2
      THE AuraHandledException-FROM-REST BUG (2026-08-03, deploy 0AfO100000cqsfzKAA)
        AuthService.login and CandidateContext.fromSession signalled failures with
        AuraHandledException, which is ILLEGAL from a @RestResource context. The
        result was an uncatchable System.LimitException ("Can only throw this
        exception type from VisualForce or Aura context") that crashed the whole
        REST request. It surfaced through the device-cap path because testing had
        left two or more active sessions. Apex unit tests do NOT catch this -- the
        test context is exempt, so only a live REST call reproduces it.
        FIX: AuthService gained loginInternal() throwing a catchable
        AuthService.AuthException, with @AuraEnabled login() wrapping and rethrowing
        AuraHandledException so the LWC is unchanged. CandidateContext gained
        fromSessionRest() throwing a catchable SessionException, with
        fromSession/fromSessionReadOnly unchanged. StemPortalAuthRest calls the
        internal variants and returns HTTP 200 ok:false with the real message.
        33 tests green.
