- title: "Dev9 repo \u2014 Feature 29: Trainer Dashboard (1/20)"
  keywords:
  - trainer
  - dashboard
  text: |2
      Built 2026-08-13. Live on all four orgs. The newest feature in the module and
      the only one NOT described in any earlier handoff doc.

    WHAT
      The trainer-scoped sibling of the Admin Training Dashboard (feature 18). A
      trainer picks a slot, sees ONLY the trainings they are the assigned trainer
      on, clicks one, and gets that training's DELIVERABLES ONLY -- no modules, no
      sessions, no mocks.

      The whole point is subtraction. Feature 18 shows an admin every candidate in a
      cohort with four drill tabs. This shows a trainer their own handful of
      candidates and one drill. A trainer opening feature 18 would see 582 trainings
      and have to hunt for their 35.

    WHO
      [VERIFIED on prod 2026-08-13] 20 trainers, of whom 19 are Customer Community
      Plus users on the "AIC Portal" profile (UserType PowerCustomerSuccess). The
      20th is a System Administrator. This matters enormously -- see ACCESS MODEL.

    ENTRY POINT
      Internal Salesforce : the "Trainer Dashboard" tab (Trainer_Dashboard)
      Experience Cloud    : an Experience Builder page on AIC PORTAL SITE
                            (/AICPORTAL). NOT built yet -- see POST-DEPLOYMENT.

    UI
      trainerTrainingDashboard  (LWC, ~4 files)
        Targets: lightning__AppPage, lightning__Tab, lightning__HomePage,
                 lightningCommunity__Page, lightningCommunity__Default
        masterLabel "Trainer Dashboard"
- title: "Dev9 repo \u2014 Feature 29: Trainer Dashboard (2/20)"
  keywords:
  - trainer
  - dashboard
  text: |2
        Header      slot typeahead + Week + Status + Search + refresh,
                    plus a READ-ONLY scope badge ("All trainings" / "My trainings
                    only"). The badge is not a control -- see SCOPE RULE.
        List        4 summary tiles, then trainings grouped by Program, one table
                    shape (deliberately NOT the two-table IRT split feature 18 uses)
