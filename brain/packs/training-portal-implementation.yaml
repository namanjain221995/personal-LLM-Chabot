  - navigation
  text: |
    RULES
      - LWR sites have NO /s/ prefix. URLs are /<siteslug>/login and /<siteslug>/.
        Redirect logic computes the prefix from window.location.pathname at runtime
        so the same bundle works on sites with different slugs.
      - Theme [MEMORY]: the portal is deep INDIGO on white, not red. The CSS token
        is misleadingly named --up-red but its value is #1E2A78.
            --up-red    #1E2A78   primary indigo
            --up-red-dk #161E6B
            --up-red-lt #2D3A8C
            --up-text   #0F172A   ink
            --up-muted  #64748B   slate
            --up-line   #E2E8F0   border
            active tab  bg #EEF2FF, text #1E2A78
            tab hover   bg #F8F1E5 (the one warm cream accent left)
            avatar      gradient #E0E7FF -> #C7D2FE, text #1E2A78
            page bg     white
        The cream #FAF3EC in PROJECT_HANDOFF.md is the OLD demo-org design. Red is
        now only for error states. Source of truth is candidateHeader.css :host,
        kept in sync with candidateHome.css .up-page.
      - CSS convention [MEMORY]: component styles go in that component's own .css
        file. staticresources/dashboardStyles.css is ONLY for genuine cross-component
        tokens and utilities (.up-section*, .up-empty, .pill, .up-card-grid,
        .up-row*, .up-cta, .up-stat-strip*, ...). Default to per-LWC when in doubt;
        a rule can be promoted to the static resource later if a second component
        needs it.
