  text: |2
      BUILT AND DEPLOYED TO dev9 (2026-07-31)
        StemPortalAuthRest + StemPortalAuthRestTest (10 tests), deploy 0AfO100000cpWG5KAM.
        Named "Stem" to match the portal; originally deployed as PortalAuthRest then
        renamed and the old class deleted from dev9 and the repo.
        REST URL, kept generic and independent of the class name:
          /services/apexrest/v1/portal-auth/*
            POST /login  {username,password,clientIp} -> {ok, token, candidate}
            POST /logout {token}                      -> {ok}
            GET  /me     header Candidate-Session     -> {ok, candidate}
        CONTRACT QUIRK: bad credentials, lockout and expired session return HTTP 200
        with ok:false. Only 400/404/500 come from Apex; 401 only from the SF OAuth
        layer. This split stops the Next.js retry-on-401 from re-POSTing a failed
        login and double-incrementing the lockout counter.
