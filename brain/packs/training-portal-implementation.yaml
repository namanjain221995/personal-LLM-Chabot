  text: |
    WHAT
      The assignment lifecycle. A candidate sees their deliverables bucketed by
      status, uploads a file (or writes code in an embedded editor), the file goes
      straight to S3 through a pre-signed URL, AWS grades it with AI and posts the
      score back, and the score rolls up onto the deliverable. Overdue items lock
      themselves. Candidates can request an extension, which emails the trainer.

    WHO
      Candidates submit; trainers review and approve; AWS grades.

    ENTRY POINT
      Portal -> Deliverables tab.

    UI
