    \   loginInternal and fromSessionRest exist. Unit tests do NOT catch this --\n    the test context\
    \ is exempt, so only a live REST call reproduces it.\n  - Clearing stuck sessions during testing:\n\
    \      UPDATE Candidate_Portal_Session__c SET Is_Active__c = false\n      WHERE Is_Active__c = true\n\
    \    (anonymous Apex).\n  - The Guest User must have Candidate_Portal_Guest_Access assigned, and it\
    \ must\n    be the guest user OF THE SITE THE CANDIDATE IS ACTUALLY HITTING. This has\n    been mis-assigned\
    \ in production before -- see feature 02 and gotcha N-01.\n\nSTATUS\n  Live on all four orgs. Role__c\
    \ and the REST split are dev9-only pending\n  approval [MEMORY 2026-08-03] -- and they MUST ship together\
    \ with\n  StemPortalAuthRest, or REST login crashes on every failure path.\n"
