      POWERSHELL REMINDERS FOR THIS BOX
        $null not /dev/null; $env:VAR not $VAR; no && chaining (use ; or if ($?)).
        Do not redirect a native exe's stderr with 2>&1 -- in Windows PowerShell 5.1
        that wraps each line in an ErrorRecord and sets $? to false even on success.
