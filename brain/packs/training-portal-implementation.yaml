  - stem
  - rest
  - facade
  - candidate_portal_credential__c
  - role__c
  text: "NOT IN THE PRODUCTION WAREHOUSE (Dev9 repo/sandbox names \u2014 describe them, never query them):\n\
    Role__c\n\n  StemPortalDataRest (129 lines, @RestResource)\n    @HttpGet handleGet()\n    URL: /services/apexrest/v1/portal-data/*\n\
    \      GET /niches     -> {ok, count, niches:[{id, name, domainType, isActive}]}\n      GET /candidates\
    \ -> {ok, count, candidates:[{candidateId, name, email,\n                          phone, username,\
    \ role, isActive, lastLoginAt}]}\n\n  Tests: StemPortalAuthRestTest, StemPortalDataRestTest\n\nTHE\
    \ CONTRACT QUIRK THAT MATTERS\n  Bad credentials, a lockout, or an expired session return HTTP 200\
    \ with\n  ok:false -- NOT 401. Only 400/404/500 come out of Apex; a 401 can only come\n  from the\
    \ Salesforce OAuth layer.\n\n  Why: the Next.js client retries once on 401. If a failed login returned\
    \ 401,\n  the retry would re-POST the login and DOUBLE-INCREMENT the lockout counter.\n  Splitting\
    \ the two makes \"your password is wrong\" a normal outcome and \"your\n  app token expired\" the\
    \ only retryable one.\n\nROLE-BASED LOGIN\n  Candidate_Portal_Credential__c.Role__c -- restricted\
    \ picklist, Candidate\n  (default) / Manager. The login response carries a top-level lower-cased role\n\
    \  ('manager' | 'candidate'), resolved by an isolated roleFor(username) query and\n  falling back\
    \ to 'candidate' when blank or unknown.\n\n  THE CLIENT MUST NEVER ASSERT ITS OWN ROLE. Salesforce\
    \ decides.\n"
