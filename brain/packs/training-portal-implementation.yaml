      monacoEditorDemo(17 KB) standalone demo, exposed on the Monaco_Editor_Demo tab

    APEX
      CandidatePortalController
        requestExtension(sessionId, deliverableId)
        submitDeliverable(sessionId, deliverableId, filename) -> Id
        createPendingResult(sessionId, deliverableId) -> Id
        getUploadUrl(sessionId, deliverableId, fileName, resultId) -> UploadUrlDTO
        finalizeSubmission(sessionId, deliverableId, resultId) -> Id
        discardPendingResult(sessionId, deliverableId, resultId)
        getDeliverableHistory(sessionId, deliverableId) -> List<DeliverableResultDTO>
