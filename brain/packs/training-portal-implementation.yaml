- title: "Dev9 repo \u2014 Feature 04: Deliverables (5/6)"
  keywords:
  - deliverables
  - days_to_complete__c
  - result_status__c
  text: |
    RULES
      - THE UPLOAD NEVER PASSES THROUGH SALESFORCE. Apex issues a pre-signed URL;
        the browser PUTs directly to S3. This is what keeps large submissions from
        hitting the 6 MB heap and 12 MB request ceilings.
      - The sequence is strict: createPendingResult -> getUploadUrl -> browser PUT
        -> finalizeSubmission. discardPendingResult exists to clean up when the user
        abandons the upload halfway, so orphan Pending rows do not accumulate.
      - getUploadUrl must use fromSessionReadOnly, because a callout follows in the
        same transaction and Apex forbids DML before a callout.
      - Due dates are computed at BOOKING time, not enrolment time. See feature 06:
        due date = the step's Started_At date + Deliverable.Days_To_Complete__c,
        written into three fields (IST string, candidate-zone string, sort datetime
        at 18:30).
      - The AI callback flow used to require ISCHANGED(Result_Status__c). That was
        removed on 2026-07-30, so the roll-up now fires on every save carrying a
        Pass/Fail. Reason: AWS Lambda callbacks that only updated the score or the
        feedback (not the status) were being ignored, and the user was manually
        running sync code to compensate. That manual step is gone. [MEMORY]
