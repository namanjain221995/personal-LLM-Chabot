# TechSara's platform-neutral application and data plane. The host launcher
# selects one runtime overlay (plus a platform modifier where needed) and
# passes generated.env both to interpolation and to application containers.
name: sf-local-ai

x-runtime-env: &runtime-env
  - path: .env
    required: false
  - path: ${TECHSARA_SECRET_ENV:-.runtime/secrets.env}
    required: false
  - path: ${TECHSARA_GENERATED_ENV:-.runtime/generated.env}
    required: true

x-generated-env: &generated-env
  - path: ${TECHSARA_GENERATED_ENV:-.runtime/generated.env}
    required: true

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techsara}
      POSTGRES_USER: ${POSTGRES_USER:-techsara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      # A client that opens connections and never closes them will otherwise
      # take the whole server down with it: pgAdmin holds one backend per
      # query tab, and on 2026-09-04 it had accumulated 55 idle sessions —
      # 60 of 60 slots — so nothing new could connect, pgAdmin included.
      # Measured that day: pgAdmin opens a BATCH of connections when it
      # reconnects (34 within a minute of a restart) and then holds them
      # idle forever — so the window has to be short enough that its
      # steady-state footprint plus the app's 16-connection pool clears 60.
      # These reap the abandoned ones. The orchestrator's pool is unaffected
      # in practice: it checks a connection's liveness before handing it out
      # (db.py, ConnectionPool check), so a reaped idle connection is
      # replaced silently rather than surfacing as a failed request.
      - -c
      - idle_session_timeout=10min
      # An abandoned OPEN TRANSACTION is worse than an idle session: it also
      # holds locks and stops vacuum reclaiming rows.
      - -c
      - idle_in_transaction_session_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=on
      - -c
      - track_io_timing=on
      # ---- Diagnostics (2026-09-14, database-speed programme) ----------------
      # CHANGING ANY LINE OF THIS COMMAND RECREATES THE POSTGRES CONTAINER on the
      # next `techsara up`, and every push to main auto-deploys one. Land edits
      # here only inside an owner maintenance window. NONE of the settings below
      # are on the live server before that recreate: production was checked
      # untouched on 2026-09-14 (every one at its default; postgresql.auto.conf
      # holds only idle_session_timeout and idle_in_transaction_session_timeout).
      # They all take effect when this container is recreated —
      # shared_preload_libraries needs the restart anyway. Note that a `-c` here
      # OVERRIDES postgresql.auto.conf, so once these lines are live ALTER SYSTEM
      # can no longer change them (verified on 18.4).
      #
      # Per-statement attribution. Production had none: the exporter's
      # pg_locks_count and pg_long_running_transactions are not lock waits or
      # transaction ages (measure-metrics 2026-09-13). `top` + no utility keeps
      # the hash table to the application's statements; the extension itself
      # is created by the orchestrator at start-up (db._ensure_pg_stat_statements:
      # CREATE EXTENSION IF NOT EXISTS, tolerant of a missing library or
      # privilege, never fails start-up) — no manual step. Measured on
      # the 18.4 image with production settings and production-shaped data: no
      # overhead distinguishable from run-to-run noise on the chat-turn
      # sequence, the durable flush or the /metrics queries.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      # A lock wait longer than deadlock_timeout (1 s) is logged with the
      # holder's pid and the statement, which no metric here can show.
      - -c
      - log_lock_waits=on
      # Slow statements, WITHOUT their bind parameters: parameters carry chat
      # text, recall keywords and e-mail addresses, and container logs are not
      # a place for them (verified: 18.4 logs `DETAIL: Parameters: $3 =
      # '%pipeline%'` unless log_parameter_max_length=0). 250 ms is above every
      # hot-path statement's p95 at 1x and catches the lexical tail (p90 1.0 s).
      - -c
      - log_min_duration_statement=250ms
      - -c
      - log_parameter_max_length=0
      - -c
      - log_temp_files=0
      - -c
      - log_autovacuum_min_duration=1s
      # jit: the server default is unchanged here; the orchestrator's pool
      # turns JIT off per session (db._server_options), because the analytics
      # leaderboard crosses jit_above_cost at about 20x today's data and would
      # then pay tens of milliseconds of compilation per call.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - application
    restart: unless-stopped
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@techsarasolutions.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    networks:
      - application
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  searxng:
    image: searxng/searxng@sha256:75e3528c976a0ba311d8d870f029466e7b74636057a654bf3e09d1c0e3a11ed3
    profiles: [search]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-please-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - application
    # Resolve upstream engines through public resolvers instead of the host's
    # systemd-resolved stub. Measured on this host 2026-09-04: the identical
    # `www.bing.com A` query took 5.05 s and returned "no servers could be
    # reached" via 127.0.0.53, and 0.03-0.09 s via 8.8.8.8, 1.1.1.1 and
    # 9.9.9.9. Containers inherit the stub through Docker's embedded resolver,
    # so that blip lands INSIDE SearXNG's 3.0 s outgoing.request_timeout: the
    # engine records a timeout and benches itself for 180 s. Bing is the
    # fastest engine here once resolved (0.23 s to /search) and it was being
    # lost for three minutes at a time on a name lookup, not on anything Bing
    # did. Seen twice, on two consecutive restarts: an 8.01 s A-record failure
    # from a cold cache, after which bing went 0/8 on a query set it had just
    # answered 8/8.
    #
    # This does NOT affect service discovery: Docker's embedded DNS at
    # 127.0.0.11 still answers container names (`orchestrator`, `postgres`)
    # itself and only forwards names it does not own to this list. Three
    # independent operators so one provider's outage is not ours.
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy=off http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m
    logging: *default-logging

  orchestrator:
    image: sf-local-ai-orchestrator:cpu
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.cpu
    env_file: *runtime-env
    environment:
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      SF_API_VERSION: ${SF_API_VERSION:-v61.0}
      SF_LIVE_ENABLED: ${SF_LIVE_ENABLED:-true}
      SF_LIGHTNING_BASE_URL: ${SF_LIGHTNING_BASE_URL:-https://techsara.lightning.force.com}
      SF_PRIVATE_KEY_FILE: /data/sf_jwt_key.pem
      SF_PRIVATE_KEY_B64: ${SF_PRIVATE_KEY_B64:-}
      APP_DATABASE_URL: postgresql://${POSTGRES_USER:-techsara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-techsara}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      DUCKDB_PATH: /data/warehouse.duckdb
      LANCEDB_DIR: /data/lancedb
      PARQUET_DIR: /data/parquet
      REPORTS_DIR: /reports
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/cache
      # Speech to text. Unlike the other model services these are passed
      # EXPLICITLY, because the engine does not live on this Compose network:
      # scripts/whisper.sh puts it on whichever node has room (the worker, in
      # dual mode) and writes the resolved address into .env. Defaults keep
      # the feature off, so a deployment that has never run that script
      # behaves exactly as it did before.
      #
      # ASR_BASE_URLS IS LISTED HERE ON PURPOSE, even though `env_file` would
      # carry it: `environment:` OVERRIDES `env_file`, so naming one of a
      # pair here and not the other is how the single URL and the fleet list
      # silently disagree about which engines exist.
      ASR_ENABLED: ${ASR_ENABLED:-false}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_BASE_URLS: ${ASR_BASE_URLS:-}
      ASR_MODEL: ${ASR_MODEL:-openai/whisper-large-v3}
      ASR_BACKEND: ${ASR_BACKEND:-whisper}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-auto}
      ASR_TIMEOUT_S: ${ASR_TIMEOUT_S:-240}
      ASR_MAX_AUDIO_SECONDS: ${ASR_MAX_AUDIO_SECONDS:-600}
      ASR_MAX_UPLOAD_BYTES: ${ASR_MAX_UPLOAD_BYTES:-33554432}
      ASR_MAX_CONCURRENT: ${ASR_MAX_CONCURRENT:-2}
      ASR_RATE_PER_MIN: ${ASR_RATE_PER_MIN:-20}
      # Document OCR. OCR_BASE_URL IS LISTED HERE ON PURPOSE, even though
      # `env_file` carries the generated one: scripts/ocr.sh can move the
      # engine to the worker and records where in .env (OCR_REMOTE_BASE_URL),
      # and that address must win over the head's `vllm-ocr` address in
      # generated.env -- which, as the LAST env_file, would otherwise outrank
      # it. `environment:` OVERRIDES `env_file`, so naming it here is what
      # lets the remote engine take effect on a plain recreate of this
      # service, before `./techsara up` has regenerated anything. With the
      # key unset or empty the generated address governs, exactly as before.
      OCR_BASE_URL: ${OCR_REMOTE_BASE_URL:-${OCR_BASE_URL:-http://disabled.invalid/v1}}
      # Video understanding (2026-09-09). Off unless .env says otherwise: the
      # composer hides the picker when this is false (folded into /auth/me).
      # Every other VIDEO_* knob reaches the container through env_file.
      VIDEO_ANALYSIS_ENABLED: ${VIDEO_ANALYSIS_ENABLED:-false}
      # NEVER THE WORKER SENTINEL'S RESTART TOKEN. `env_file` above feeds
      # `.env` to this service wholesale, and an operator may set
      # CLUSTER_SENTINEL_TOKEN there to bring their own (the launcher copies
      # it into .runtime/controller.env, the one layer the engine-controller
      # service reads). `environment:` OVERRIDES `env_file`, so this literal
      # blank is what keeps the value that authorises POST /restart of the
      # worker rank out of the process that handles untrusted input --
      # `docker inspect` of this container shows the key empty whatever .env
      # says (review round 2). Nothing in the orchestrator reads it.
      CLUSTER_SENTINEL_TOKEN: ""
      # The developer platform: `/v1`, API keys, the console (CONTRACT-3,
      # docs/developer-platform/). Documented one by one in .env.example.
      #
      # WIRED EXPLICITLY, 2026-09-13, because a setting nobody lists is a
      # setting nobody sets: the wave-3 re-verifier found
      # PUBLIC_API_TRUSTED_PROXIES in config.py and NOWHERE in a deployment,
      # so the ip_allowlist saw the frontend container for every call through
      # the edge. Every one defaults to BLANK here, never to a number: blank
      # makes the code use its own default (config.py `_int`/`_float`,
      # main.py `_positive_int_setting`, console_api `_env_limit`), so there
      # is ONE copy of each default and a change to it cannot be silently
      # overridden by a stale literal in this file.
      #
      # API_KEY_PEPPER IS DELIBERATELY NOT LISTED. It lives in
      # .runtime/secrets.env and reaches this container through `env_file`
      # above. `environment:` OVERRIDES `env_file`, so `${API_KEY_PEPPER:-}`
      # here would be BLANK on any recreate whose interpolation lacks the
      # secrets layer (a plain `docker compose up` reads only .env) -- and a
      # blank pepper switches HMAC keys to the in-database fallback, which
      # stops every existing API key verifying at once, with no error beyond
      # a wall of 401 invalid_api_key.
      PUBLIC_API_TRUSTED_PROXIES: ${PUBLIC_API_TRUSTED_PROXIES:-}
      # Who may send the v1-gateway's X-TechSara-* attach headers: the
      # gateway's own address on v1relay, exact addresses only (T3-wire,
      # 2026-09-14). Not PUBLIC_API_TRUSTED_PROXIES, which names every proxy
      # allowed to set X-Forwarded-For and is documented as a network range.
      PUBLIC_API_GATEWAY_PEERS: ${PUBLIC_API_GATEWAY_PEERS:-}
      PUBLIC_API_MAX_BODY_BYTES: ${PUBLIC_API_MAX_BODY_BYTES:-}
      PUBLIC_API_IDEMPOTENCY_TTL_HOURS: ${PUBLIC_API_IDEMPOTENCY_TTL_HOURS:-}
      PUBLIC_API_IDEMPOTENCY_IN_FLIGHT_LEASE_SECONDS: ${PUBLIC_API_IDEMPOTENCY_IN_FLIGHT_LEASE_SECONDS:-}
      PUBLIC_API_KEY_ROTATION_OVERLAP_HOURS: ${PUBLIC_API_KEY_ROTATION_OVERLAP_HOURS:-}
      PUBLIC_API_DEFAULT_RPM: ${PUBLIC_API_DEFAULT_RPM:-}
      PUBLIC_API_DEFAULT_INPUT_TPM: ${PUBLIC_API_DEFAULT_INPUT_TPM:-}
      PUBLIC_API_DEFAULT_OUTPUT_TPM: ${PUBLIC_API_DEFAULT_OUTPUT_TPM:-}
      PUBLIC_API_DEFAULT_MAX_CONCURRENCY: ${PUBLIC_API_DEFAULT_MAX_CONCURRENCY:-}
      PUBLIC_API_DEFAULT_DAILY_TOKEN_QUOTA: ${PUBLIC_API_DEFAULT_DAILY_TOKEN_QUOTA:-}
      PUBLIC_API_RATELIMIT_JITTER_SECONDS: ${PUBLIC_API_RATELIMIT_JITTER_SECONDS:-}
      PUBLIC_API_DEFAULT_MAX_OUTPUT_TOKENS: ${PUBLIC_API_DEFAULT_MAX_OUTPUT_TOKENS:-}
      PUBLIC_API_QUOTA_GATE_WAIT_SECONDS: ${PUBLIC_API_QUOTA_GATE_WAIT_SECONDS:-}
      API_PLAYGROUND_RPM: ${API_PLAYGROUND_RPM:-}
      API_PLAYGROUND_INPUT_TPM: ${API_PLAYGROUND_INPUT_TPM:-}
      API_PLAYGROUND_OUTPUT_TPM: ${API_PLAYGROUND_OUTPUT_TPM:-}
      API_PLAYGROUND_MAX_CONCURRENCY: ${API_PLAYGROUND_MAX_CONCURRENCY:-}
      API_PLAYGROUND_DAILY_TOKEN_QUOTA: ${API_PLAYGROUND_DAILY_TOKEN_QUOTA:-}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-}
      CHAT_MAX_REQUEST_BODY_BYTES: ${CHAT_MAX_REQUEST_BODY_BYTES:-}
      ORCHESTRATOR_DEV_DOCS: ${ORCHESTRATOR_DEV_DOCS:-}
      # Serving-process CPU (orchestrator/app/core/cpu_pool.py, 2026-09-15).
      # BLANK here on purpose, like the /v1 knobs above: blank means the code
      # default (0 worker processes = threads; the interpreter's own 5 ms GIL
      # switch interval; the loop-lag probe on). An operator opts in from .env.
      CPU_POOL_WORKERS: ${CPU_POOL_WORKERS:-}
      CPU_POOL_SLOTS: ${CPU_POOL_SLOTS:-}
      PY_SWITCH_INTERVAL_S: ${PY_SWITCH_INTERVAL_S:-}
      EVENT_LOOP_LAG_PROBE: ${EVENT_LOOP_LAG_PROBE:-}
      # libuv's worker pool, which uvloop uses for EVERY hostname lookup made
      # by httpx/anyio connects (vllm-router, searxng, Salesforce, Tavily...).
      # Default 4. Measured 2026-09-15 in this image with a blackholing
      # resolver: 2 hung lookups stalled an unrelated /etc/hosts lookup for
      # 19.8 s (4 hung: >30 s); with 16 threads the stall starts at 8. The
      # stdlib asyncio path was unaffected (0.001 s). A number, not blank:
      # libuv reads it once, before the pool starts, and ignores blank.
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
    volumes:
      - data:/data
      # The Salesforce brain packs, read-only and LIVE: core/brain.py re-reads
      # on file change, so dropping a new pack into brain/packs/ takes effect
      # on the next question — no rebuild, no restart.
      - ./brain/packs:/data/brain:ro
      - reports:/reports
      - hf-cache:/root/.cache/huggingface
    ports:
      - "${TECHSARA_BIND_ADDRESS:-127.0.0.1}:${ORCHESTRATOR_PORT:-8080}:8080"
    networks:
      # Map form with EMPTY values, not `{}`: Compose hashes `{}` differently
      # from the list form, and the v1relay entry below is meant to be the
      # only change to this service's definition.
      application:
      inference:
      # The v1-gateway's upstream path (network v1relay below). The alias
      # exists on this network only, so the gateway's connection always
      # arrives from its pinned address, never from its application address.
      v1relay:
        aliases: [orchestrator-v1relay]
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=8) as response:
              payload = json.load(response)
          if not isinstance(payload, dict) or payload.get("status") not in {"ok", "healthy", "degraded"}:
              raise SystemExit(1)
          checks = payload.get("checks")
          if not isinstance(checks, dict):
              raise SystemExit(1)
          app_db = checks.get("app_db")
          if not isinstance(app_db, dict) or app_db.get("status") != "ok":
              raise SystemExit(1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 4m
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  sync-worker:
    image: sf-local-ai-sync-worker:portable
    build:
      context: ./sync-worker
    environment:
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      SF_API_VERSION: ${SF_API_VERSION:-v61.0}
      SF_PRIVATE_KEY_FILE: /data/sf_jwt_key.pem
      SF_PRIVATE_KEY_B64: ${SF_PRIVATE_KEY_B64:-}
      EMBED_VIA: ${EMBED_VIA:-http://disabled.invalid/v1}
      EMBED_MODEL: ${EMBED_MODEL:-disabled}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-5}
      SYNC_AUTO_FIELDS: ${SYNC_AUTO_FIELDS:-true}
      SYNC_AUTO_OBJECTS: ${SYNC_AUTO_OBJECTS:-true}
      SYNC_MAX_FIELDS: ${SYNC_MAX_FIELDS:-4000}
      SYNC_REPORT_NEW_OBJECTS: ${SYNC_REPORT_NEW_OBJECTS:-true}
      DUCKDB_PATH: /data/warehouse.duckdb
      LANCEDB_DIR: /data/lancedb
      PARQUET_DIR: /data/parquet
      SYNC_CONFIG_PATH: /app/config.yaml
    volumes:
      - data:/data
      - ./sync-worker/config.yaml:/app/config.yaml:ro
    networks:
      - application
      - inference
    init: true
    restart: unless-stopped
    stop_grace_period: 10m
    logging: *default-logging

  frontend:
    image: sf-local-ai-frontend:portable
    build:
      context: ./frontend
    env_file: *generated-env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8080
      MOCK_MODE: ${MOCK_MODE:-false}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TechSara AI}
      # The public edge (frontend/app/v1, lib/proxy.ts), 2026-09-13. This
      # service's only env_file is generated.env, so NOTHING in .env reaches
      # it unless it is named here -- before this, TRUSTED_CLIENT_IP_HEADER
      # could not be set in any deployment at all. Blank is the safe default
      # for all three (see .env.example, "Developer platform").
      #
      # PUBLIC_API_MAX_BODY_BYTES is the SAME variable the orchestrator gets
      # above, on purpose: the edge cap and the server cap must be equal
      # (app/v1 route.ts `publicApiBodyBytes`), and one source is how they
      # stay equal.
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      TRUSTED_FORWARDED_PROTO: ${TRUSTED_FORWARDED_PROTO:-}
      PUBLIC_API_MAX_BODY_BYTES: ${PUBLIC_API_MAX_BODY_BYTES:-}
      # The per-path caps of the /v1 edge (route.ts reads the media and audio
      # caps; the pooling cap for embeddings/rerank arrives with T5's route.ts
      # and the Files routes' two with the Files wave), handed over
      # like the one above so the frontend edge, the v1-gateway and the
      # orchestrator refuse at the same byte when an operator raises one in
      # .env: the frontend's env_file is generated.env only (review 2026-09-14).
      PUBLIC_API_MAX_MEDIA_BODY_BYTES: ${PUBLIC_API_MAX_MEDIA_BODY_BYTES:-}
      PUBLIC_API_MAX_AUDIO_BODY_BYTES: ${PUBLIC_API_MAX_AUDIO_BODY_BYTES:-}
      PUBLIC_API_MAX_POOLING_BODY_BYTES: ${PUBLIC_API_MAX_POOLING_BODY_BYTES:-}
      PUBLIC_API_FILES_MAX_BODY_BYTES: ${PUBLIC_API_FILES_MAX_BODY_BYTES:-}
      PUBLIC_API_FILES_PART_MAX_BYTES: ${PUBLIC_API_FILES_PART_MAX_BYTES:-}
      # OPT-IN relay of the frontend's /v1 route through the v1-gateway
      # (app/v1 route.ts). Blank by default: the route then goes straight to
      # the orchestrator, as it did before the gateway existed.
      #
      # WHY NOT ON BY DEFAULT (release review 2026-09-14, high). Public /v1
      # traffic arrives through the tunnel at THIS service today, so a fixed
      # value here put every public call on the gateway hop at the deploy
      # that shipped it -- before anyone had set PUBLIC_API_GATEWAY_PEERS or
      # PUBLIC_API_TRUSTED_PROXIES. The orchestrator then saw every caller at
      # the gateway's address (a project's ip_allowlist evaluated against the
      # wrong address) and ignored the gateway's re-attach headers. Set it in
      # .env to http://v1-gateway:8090 in the same change as those two
      # settings (gateway/README.md, "Settings the operator owns");
      # scripts/deploy.sh reports which path /v1 takes and warns when the
      # relay is on without them.
      V1_GATEWAY_URL: ${V1_GATEWAY_URL:-}
    ports:
      - "${TECHSARA_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - application
    # docker-init (tini) is PID 1 and forwards SIGTERM to its direct child;
    # the image's CMD is exec form, so that child is `node server.js` itself.
    # Next 16's standalone server installs its own SIGTERM handler, which
    # calls server.close() and only then exits — in production it does NOT
    # call closeAllConnections(), so in-flight requests are allowed to
    # finish, and Node >= 19 closes IDLE keep-alive sockets on close() so a
    # quiet proxy still exits immediately. The chain works; what was missing
    # was the time to use it.
    init: true
    restart: unless-stopped
    # WHY 5m, when this service had nothing at all (Docker's 10 s default).
    #
    # On 2026-09-09 four deploys between 20:47 and 22:52 IST SIGKILLed this
    # proxy ten seconds after SIGTERM, cutting in-flight chunked part PUTs
    # and proxied SSE mid-frame (.runtime/logs/deploy-*.log; INF-1).
    #
    # The longest request this proxy legitimately carries BYTES for is one
    # 64 MiB part (frontend/lib/uploadDocument.CHUNK_PART_BYTES), streamed
    # through app/api/upload/chunked. Node's own `server.requestTimeout` —
    # 300 s, left at its default in this image — is the hard ceiling on
    # receiving one complete request body, so a part still arriving after
    # five minutes is dropped by Node with a 408 whatever Docker does. Five
    # minutes is therefore the largest grace that can still save a byte, and
    # it covers 64 MiB down to ~219 KB/s (~1.75 Mbit/s) of client upstream.
    #
    # It deliberately does NOT cover a proxied SSE stream, which may
    # legitimately run GEN_WALL_CLOCK_S (4,200 s): waiting seventy minutes
    # for a deploy is not a trade anyone would take. A cut stream is the
    # recoverable case — the browser re-asks GET /chat/requests/{intent_id}
    # and re-attaches, and the orchestrator's shutdown hook has marked the
    # request `interrupted` so that answer is true (docs/upload-reliability
    # /CONTRACT.md, "Connection knowledge").
    #
    # This is a CEILING, not a delay. Compose recreates this service after
    # the orchestrator (depends_on), so by the time SIGTERM lands here the
    # upstream SSE responses have already ended and a quiet proxy exits in
    # well under a second. Only a frontend-ONLY recreate with a live stream
    # pays the full five minutes; see docs/upload-reliability/OPERATIONS.md
    # for the `docker compose stop -t` escape hatch.
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    depends_on:
      orchestrator:
        condition: service_healthy
    logging: *default-logging

  # The public developer API's relay (gateway/README.md), 2026-09-13.
  #
  # WHY A SEPARATE CONTAINER. Every routine deploy recreates the orchestrator
  # and the frontend, and a client socket held by a process that restarts is a
  # client call that fails. This process holds the developer's connection
  # instead: before the first byte it retries the orchestrator for up to 110 s,
  # and after it it heartbeats and re-attaches to the durable run. That only
  # works if a routine deploy never recreates THIS container, so its
  # definition is built to change only when the gateway itself changes:
  #
  #   * the image tag is the digest of the image's own inputs (Dockerfile,
  #     server.cjs, lib/) -- V1_GATEWAY_CODE_SHA, which the launcher computes
  #     and exports to Compose on every `up`, and scripts/deploy.sh exports for
  #     its helpers. A README or test edit under gateway/ is not an input.
  #   * NO env_file. Compose folds every key of an env_file into the service
  #     definition, and generated.env gains or changes keys on ordinary
  #     deploys; a single one would recreate this container. Everything it
  #     reads is named below, from values an operator changes on purpose.
  #     For the same reason V1_GATEWAY_CODE_SHA is never written to .env,
  #     secrets.env or generated.env: those fold into the orchestrator and the
  #     frontend, and would recreate THEM whenever the gateway changed.
  #   * NO depends_on, so recreating the orchestrator never touches it.
  #
  # It takes no public traffic until the operator routes ^/v1 to it in the
  # Cloudflare tunnel (gateway/README.md, "Operating it"). The launcher starts
  # it with `up -d --no-deps v1-gateway`, never --force-recreate.
  v1-gateway:
    image: sf-local-ai-v1-gateway:${V1_GATEWAY_CODE_SHA:-unpinned}
    build:
      context: ./gateway
    environment:
      # The orchestrator's name on v1relay ONLY (see the network below), so the
      # connection always leaves from this container's pinned address.
      ORCHESTRATOR_URL: http://orchestrator-v1relay:8080
      V1_GATEWAY_PORT: "8090"
      V1_GATEWAY_SPOOL_DIR: /spool
      # The same variables, with the same blank-means-default rule, as the
      # frontend edge and the orchestrator, so all three refuse at the same byte
      # and trust the same client-address header.
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      TRUSTED_FORWARDED_PROTO: ${TRUSTED_FORWARDED_PROTO:-}
      PUBLIC_API_MAX_BODY_BYTES: ${PUBLIC_API_MAX_BODY_BYTES:-}
      PUBLIC_API_MAX_MEDIA_BODY_BYTES: ${PUBLIC_API_MAX_MEDIA_BODY_BYTES:-}
      PUBLIC_API_MAX_AUDIO_BODY_BYTES: ${PUBLIC_API_MAX_AUDIO_BODY_BYTES:-}
      PUBLIC_API_MAX_POOLING_BODY_BYTES: ${PUBLIC_API_MAX_POOLING_BODY_BYTES:-}
      PUBLIC_API_FILES_MAX_BODY_BYTES: ${PUBLIC_API_FILES_MAX_BODY_BYTES:-}
      PUBLIC_API_FILES_PART_MAX_BYTES: ${PUBLIC_API_FILES_PART_MAX_BYTES:-}
      # Spooled request bodies: a total quota across relays, and the free-space
      # floor the orchestrator's disk guard uses (blank = 2 GiB and 20 GiB).
      V1_GATEWAY_SPOOL_MAX_BYTES: ${V1_GATEWAY_SPOOL_MAX_BYTES:-}
      PUBLIC_API_MIN_FREE_DISK_BYTES: ${PUBLIC_API_MIN_FREE_DISK_BYTES:-}
      # Request bodies held in memory, summed over every relay (blank =
      # 256 MiB); past it new bodies spill to the spool above.
      V1_GATEWAY_MEMORY_BUDGET_BYTES: ${V1_GATEWAY_MEMORY_BUDGET_BYTES:-}
    # tini as PID 1 forwards SIGTERM straight to node (exec-form CMD), whose
    # drain closes the listener and cuts relays still open 2 s later so their
    # clients resume; 30 s is a ceiling, an idle gateway exits at once.
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # RESOURCE GUARDS. Deliberately no cgroup memory limit: none of this
    # stack has one (launcher/tests/test_oom_score_adj.py records why), and an
    # OOM kill here would cut every public connection at once. What is bounded:
    #   * file descriptors, pinned rather than inherited from the daemon: two
    #     per relay plus a spool file, and the gateway refuses new /v1 work
    #     with 503 Retry-After 30 at 70% of this, while /healthz keeps answering;
    #   * processes: node's own threads plus the healthcheck, far below this;
    #   * disk: the spool quota and free-space floor above, on a named volume;
    #   * request bodies in memory: V1_GATEWAY_MEMORY_BUDGET_BYTES in total.
    #     Past it a new body spills to the spool, and past the spool quota it
    #     is refused 503 Retry-After 30 (lib/guards.cjs MemoryBudget). WHY
    #     (review 2026-09-14, measured): with the orchestrator refusing
    #     connections, as during every deploy, 400 unauthenticated 1 MiB
    #     bodies held +914 MiB of RSS, and only the fd guard -- tens of
    #     thousands of relays -- stood between that and the 128 GB the model
    #     shares. What remains per relay is its sockets and bookkeeping.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 256
    volumes:
      - v1gateway_spool:/spool
    networks:
      # cloudflared and the frontend reach it as v1-gateway:8090 here.
      application:
      v1relay:
        ipv4_address: 10.231.231.2
    # No `ports:`. It is reached over the Docker network only.
    healthcheck:
      # Answers from the process itself (never the orchestrator), so an
      # orchestrator restart does not mark the gateway unhealthy; 503 while
      # draining. Exec form: no shell in the probe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

networks:
  application:
  inference:
    internal: true
  # v1-gateway -> orchestrator, 2026-09-13. Its own internal network with a
  # fixed subnet, so the gateway has ONE stable address the orchestrator can
  # name in PUBLIC_API_GATEWAY_PEERS (the attach headers are honoured only
  # from a listed peer) instead of a range that other containers share.
  # Members: v1-gateway at the pinned .2 and the orchestrator (alias
  # orchestrator-v1relay). Dynamic addresses come from ip_range only, so
  # nothing started before the gateway can take .2; the bridge keeps .1.
  #
  # WHERE (2026-09-14, review finding). Outside Docker's default address
  # pools (172.17-31.0.0/16 and 192.168.0.0/16): Docker hands those out to
  # every network any project creates, and refuses to create a network that
  # overlaps one ("networks have overlapping IPv4"), so a subnet inside them
  # works until the day another network takes the covering /16. Also clear of
  # this host's own RoCE, LAN and VPN ranges. The launcher checks Docker's networks and the
  # host's routes before the first `up` that creates it, and stops with what
  # overlaps (cli.py _check_v1relay_subnet). Changing this block needs every
  # member stopped and the network removed first; change the gateway's
  # ipv4_address, PUBLIC_API_GATEWAY_PEERS and PUBLIC_API_TRUSTED_PROXIES with it.
  v1relay:
    internal: true
    ipam:
      config:
        - subnet: 10.231.231.0/28
          ip_range: 10.231.231.8/29
          gateway: 10.231.231.1

volumes:
  data:
    name: sf-local-ai_data
  reports:
    name: sf-local-ai_reports
  pgdata:
    name: sf-local-ai_pgdata
  pgadmin:
    name: sf-local-ai_pgadmin
  hf-cache:
    name: sf-local-ai_hf-cache
  v1gateway_spool:
    name: sf-local-ai_v1gateway_spool
