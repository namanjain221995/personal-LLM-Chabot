# Two-node DGX Spark cluster — HEAD overlay (Node 1).
#
# Layered LAST by the launcher (cli._compose_files) only when CLUSTER_MODE=dual
# is set in .env on a dgx-spark profile. It turns the existing `vllm` service
# into node-rank 0 of a two-node vLLM multiprocessing ("mp") executor and leaves
# every other service exactly as compose.yaml / compose.dgx-spark.yaml define
# them (router, embed, reranker, OCR, postgres, ... stay local to Node 1).
#
# The matching worker (node-rank 1) is compose/compose.cluster-worker.yaml,
# started on Node 2 as its own Compose project (sf-local-ai-worker) by
# scripts/cluster-worker.sh. Both nodes receive the SAME engine arguments from
# the launcher-generated CLUSTER_ENGINE_ARGS (tensor/pipeline parallel sizes,
# context, memory utilisation, master address/port, quantisation, spec-decode);
# only the frontend flags (--host/--port/parsers) and --node-rank differ.
#
# Why host networking: NCCL over RoCE and vLLM's cross-node message queue need
# the head process to be reachable at the RoCE-link address (CLUSTER_HEAD_IP)
# and to see the ConnectX-7 netdevs for RoCE v2 GIDs. A bridged container has
# neither. Consequences, all handled here:
#   * the OpenAI API listens on the host at CLUSTER_API_BIND_ADDRESS:VLLM_PORT,
#     which the launcher sets to 0.0.0.0 in dual mode, published or not. It
#     MUST cover every network a caller dials from, and --host takes one
#     address: the WORKER's vllm-worker healthcheck curls
#     http://CLUSTER_HEAD_IP:8000/health over rail A and kill -9s its own rank
#     after 8 misses, the interview-analysis tenant on the worker posts to
#     CLUSTER_HEAD_IP:8000/v1, the orchestrator/sync-worker/Prometheus dial
#     the bridge gateway, and the scripts and CI dial 127.0.0.1. Commit
#     229031c (2026-09-13) narrowed it to the bridge gateway, which would have
#     taken the two-node engine down on its next recreate; the owner chose
#     option A: keep the bind production runs, and close the office-LAN and
#     tailnet exposure (audit F050/F042) with the host packet filter
#     (scripts/host-guard.sh, operator actions OA-4/OA-6). Do not narrow it
#     without first moving those cross-node callers;
#   * `networks`, `expose` and `ports` inherited from the base overlays are
#     reset (host-mode containers cannot carry them);
#   * orchestrator and sync-worker resolve the service name `vllm` to the host
#     via extra_hosts, so OPENAI_BASE_URL=http://vllm:${VLLM_PORT}/v1 keeps
#     working without any application change;
#   * /dev/infiniband is passed through and memlock is unlimited so NCCL can
#     register RDMA memory (otherwise it silently falls back to TCP sockets).
services:
  vllm:
    network_mode: host
    networks: !reset []
    expose: !reset []
    ports: !reset []
    command: >
      ${MAIN_MODEL_CONTAINER_PATH:?MAIN_MODEL_CONTAINER_PATH must be generated}
      --served-model-name ${MAIN_MODEL:?MAIN_MODEL must be generated}
      --host ${CLUSTER_API_BIND_ADDRESS:?CLUSTER_API_BIND_ADDRESS must be generated}
      --port ${VLLM_PORT:?VLLM_PORT must be generated}
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      ${CLUSTER_ENGINE_ARGS:?CLUSTER_ENGINE_ARGS must be generated (CLUSTER_MODE=dual)}
      --node-rank 0
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      # Address the remote worker uses to reach this node's engine (message
      # queue + torch.distributed master). Must be the RoCE-link address.
      VLLM_HOST_IP: ${CLUSTER_HEAD_IP:?CLUSTER_HEAD_IP must be generated}
      # NCCL out-of-band bootstrap + gloo CPU groups: pin to the RoCE link so
      # nothing rides the 1 GbE LAN by accident.
      NCCL_SOCKET_IFNAME: ${CLUSTER_NCCL_SOCKET_IFNAME:?CLUSTER_NCCL_SOCKET_IFNAME must be generated}
      GLOO_SOCKET_IFNAME: ${CLUSTER_NCCL_SOCKET_IFNAME:?CLUSTER_NCCL_SOCKET_IFNAME must be generated}
      # Both ConnectX-7 RoCE HCAs (multi-rail): measured 22 Gb/s vs 11 Gb/s
      # single-rail vs 14.6 Gb/s TCP on this hardware (docs/CLUSTER.md).
      NCCL_IB_HCA: ${CLUSTER_NCCL_IB_HCA}
      NCCL_IB_DISABLE: "0"
      # INIT,NET at INFO logs only the transport selection at start-up; the
      # status/doctor scripts read those lines to prove RDMA (not TCP) is used.
      NCCL_DEBUG: ${CLUSTER_NCCL_DEBUG:-INFO}
      NCCL_DEBUG_SUBSYS: ${CLUSTER_NCCL_DEBUG_SUBSYS:-INIT,NET}
    # THE PER-RANK PROCESS ENVIRONMENT (candidate B). VLLM_ALLREDUCE_USE_FLASHINFER
    # and VLLM_USE_V2_MODEL_RUNNER are read by vLLM as int(...) -- an empty
    # string is a crash at import -- so they are never listed under
    # `environment:` with an empty default. The launcher renders ONLY the keys
    # that are set (CLUSTER_VLLM_* in .env) into .runtime/engine.env, and
    # scripts/cluster-sync.sh ships the identical bytes to the worker, which
    # reads its copy the same way: both ranks get the same variables or none.
    env_file:
      - path: ${TECHSARA_ENGINE_ENV:-.runtime/engine.env}
        required: false
    devices:
      - /dev/infiniband:/dev/infiniband
    cap_add:
      - IPC_LOCK
    # `core: 1` (no core dumps, contract §6.5) comes from the base overlay;
    # Compose merges the two `ulimits` maps, so it is not repeated here.
    ulimits:
      memlock: -1
    stop_grace_period: 2m
    # REPORT-ONLY, WITH ONE LAST-RESORT TIER (contract §6, v2). Exactly one
    # actor restarts the pair: the engine controller (`engine-controller`
    # below). It confirms a dead engine (/health 5xx) in one observation, a
    # dead worker rank through the sentinel in <= 5 s, and restarts the PAIR
    # in order under the recovery lock, typically within 10 s. This
    # healthcheck therefore does NOT act on 5xx any more: in round 1 its
    # immediate kill landed in the 7-17 s the controller needs to capture
    # diagnostics and restart the worker first, so the head was restarted
    # twice -- the second time under a worker that had already joined the
    # first restart's rendezvous, i.e. a stale rank and a burned budget
    # unit. Tiering now:
    #   * /health 200                              -> healthy, counter reset
    #   * anything else (000, 5xx)                 -> exit 1 (docker ps shows
    #     unhealthy; the controller has the real verdict) and count the miss
    #   * VLLM_HEALTHCHECK_KILL_AFTER consecutive misses (default 8 = 4 min
    #     at this interval) on a process older than VLLM_HEALTHCHECK_MIN_AGE_S
    #     -> kill the vllm process so Docker restarts the container. Four
    #     minutes is long after a live controller would have acted (10 s)
    #     and after its whole cold-start budget would NOT have, so this
    #     fires only when the controller is down or wrong -- the case it
    #     exists for. The age guard keeps a cold start (4-7 min) from ever
    #     being interrupted: it is the launcher-resolved
    #     VLLM_HEALTHCHECK_MIN_AGE_S (default = the controller's
    #     ENGINE_COLD_START_BUDGET_S, itself 900 by default), so a raised
    #     budget for a slower image reaches this check too instead of a
    #     hard-wired 15 min killing a head that is still legitimately
    #     loading (review round 2). The same knob is shipped to the worker.
    # Why a kill at all: /v1/models and /health are answered by the API
    # server even when the engine behind it is dead (2026-08-25), and after
    # vLLM's 300 s cross-node RPC timeout the API closes its listener but the
    # process does not exit, so `restart: unless-stopped` never fires.
    # `init: true` puts tini at PID 1 so killing the real `vllm serve`
    # process ends the container (PID 1 ignores signals it has no handler
    # for, which is why `kill 1` is not used). The pgrep patterns use [ ] so
    # they never match this healthcheck's own shell.
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          main=$$(pgrep -o -f '/usr/local/bin/vl[l]m serve');
          [ -n "$$main" ] || exit 1;
          code=$$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://${CLUSTER_API_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8000}/health);
          if [ "$$code" = 200 ]; then rm -f /tmp/health-missed; exit 0; fi;
          n=$$(( $$(cat /tmp/health-missed 2>/dev/null || echo 0) + 1 )); echo $$n > /tmp/health-missed;
          age=$$(ps -o etimes= -p "$$main" | tr -d ' ');
          echo "vLLM /health=$$code (miss $$n of ${VLLM_HEALTHCHECK_KILL_AFTER:-8}; the engine controller decides, this check only reports)";
          if [ "$${age:-0}" -gt "${VLLM_HEALTHCHECK_MIN_AGE_S:-${ENGINE_COLD_START_BUDGET_S:-900}}" ] && [ "$$n" -ge "${VLLM_HEALTHCHECK_KILL_AFTER:-8}" ]; then echo "vLLM /health failed $$n consecutive checks after $${age}s (age guard ${VLLM_HEALTHCHECK_MIN_AGE_S:-${ENGINE_COLD_START_BUDGET_S:-900}}s) and no controller acted: LAST RESORT, restarting the head"; kill -9 "$$main"; fi;
          exit 1
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 30m

  # Dual mode: the head is host-network on CLUSTER_API_BIND_ADDRESS:VLLM_PORT
  # (every interface; see the note at the top of this file), and the worker
  # sentinel (compose.cluster-worker.yaml) listens on the worker's RoCE rail-A
  # address, which only this host can reach. The sentinel token comes from
  # .runtime/controller.env (base overlay, env_file): scripts/cluster-sync.sh
  # ships that same value in the worker's env and checks the two agree
  # without printing either.
  #
  # The controller's own /state and /metrics listen on loopback (the
  # healthcheck, scripts/cluster-status.sh, and POST /recover, which is
  # loopback-only) AND on the Docker bridge gateway: the orchestrator polls
  # http://vllm:9838/state through `vllm:host-gateway`, and Prometheus scrapes
  # host.docker.internal:9838. It listened on 0.0.0.0 until 2026-09-13, which
  # published the engine's state, the recovery budget and the incident
  # timeline to the office LAN (developer-platform audit, beside F050); no
  # caller is off-host, so this narrow bind is kept (live since the 02:54:50Z
  # recreate, every consumer connected).
  #
  # Both values below read CLUSTER_BRIDGE_GATEWAY, the launcher's own key, and
  # NOT CLUSTER_API_BIND_ADDRESS. 229031c derived them from the head's bind;
  # with the head back on 0.0.0.0 that rendered "127.0.0.1,0.0.0.0", which
  # the controller collapses to a wildcard 9838 -- silently re-widening it on
  # the next controller recreate. HEAD_API_URL dials the head through the
  # same gateway the orchestrator's chat traffic uses, so the canary follows
  # the serving path, and it renders exactly what the running controller
  # carries (http://172.17.0.1:8000), so regenerating the env recreates
  # nothing. An unreadable gateway renders loopback, never a wildcard.
  # ENGINE_HEAD_API_URL / ENGINE_CONTROLLER_BIND in .env still override.
  engine-controller:
    environment:
      HEAD_API_URL: ${ENGINE_HEAD_API_URL:-http://${CLUSTER_BRIDGE_GATEWAY:-127.0.0.1}:${VLLM_PORT:-8000}}
      CONTROLLER_BIND: ${ENGINE_CONTROLLER_BIND:-127.0.0.1,${CLUSTER_BRIDGE_GATEWAY:-127.0.0.1}}
      SENTINEL_URL: http://${CLUSTER_WORKER_IP:?CLUSTER_WORKER_IP must be generated}:9839

  orchestrator:
    extra_hosts:
      - "vllm:host-gateway"

  sync-worker:
    extra_hosts:
      - "vllm:host-gateway"
