# DGX Spark: the existing, measured four-service layout with immutable runtime
# images. Model paths are produced by the launcher and resolve under /models.
x-model-logging: &model-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nvidia-devices: &nvidia-devices
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  orchestrator:
    image: sf-local-ai-orchestrator:cuda
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.cuda
    environment:
      HF_HUB_OFFLINE: "1"
      RERANKER_MODEL: ${RERANKER_MODEL_CONTAINER_PATH:?RERANKER_MODEL_CONTAINER_PATH must be generated}
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
    deploy: *nvidia-devices

  vllm:
    # CANDIDATE B (docs/availability/CANDIDATE-B.md): only the MAIN engine's
    # image may move, and only to a digest the launcher has validated
    # (MAIN_MODEL_IMAGE in .env; environment.main_model_image). The router
    # and the OCR engine below stay on the pinned digest -- one variable at
    # a time. In dual mode scripts/cluster-sync.sh reads the image THIS
    # service renders to and ships the same reference to the worker, so the
    # two ranks cannot run different builds.
    image: ${MAIN_MODEL_IMAGE:-vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6}
    command: >
      ${MAIN_MODEL_CONTAINER_PATH:?MAIN_MODEL_CONTAINER_PATH must be generated}
      --served-model-name ${MAIN_MODEL:?MAIN_MODEL must be generated}
      --host 0.0.0.0
      --port 30000
      --max-model-len ${MODEL_MAX_CONTEXT:-262144}
      ${MAIN_MODEL_ROPE_OVERRIDE:-}
      --gpu-memory-utilization ${MAIN_GPU_MEMORY_UTILIZATION:-0.35}
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --trust-remote-code
      ${MAIN_STARTUP_ARGUMENTS:-}
      ${MAIN_MODEL_GDN_PREFILL_ARGUMENT:-}
      --enable-chunked-prefill
      ${MAIN_MODEL_PREFIX_CACHING_ARGUMENT:-}
      ${MAIN_MODEL_SPECULATIVE_ARGUMENT:-}
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --max-num-batched-tokens 8192
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
      # COMPILED-KERNEL CACHE (contract §6.6). vLLM keeps its torch.compile
      # artefacts (and, via TORCHINDUCTOR_CACHE_DIR / TRITON_CACHE_DIR, the
      # Inductor and Triton caches) under VLLM_CACHE_ROOT = /root/.cache/vllm;
      # FlashInfer JIT-compiles into FLASHINFER_WORKSPACE_BASE/.cache/flashinfer
      # = /root/.cache/flashinfer (both verified inside the pinned image and
      # the candidate: vllm.envs.VLLM_CACHE_ROOT, flashinfer.jit.env). In a
      # container's writable layer they die with every recreate, so every
      # recovery paid the 50 s compile (2026-09-11 head log: "torch.compile
      # took 50.20 s") and a FlashInfer GDN JIT would cost more. ONE named
      # volume, mounted at both paths: the two trees never collide
      # (torch_compile_cache/ vs <flashinfer version>/ and cubins/), one
      # name per node is what `scripts/cluster-recover.sh --clear-kernel-cache`
      # empties, and a stale cache is a cold_start_timeout the controller
      # reports, never something it deletes on its own. The worker mounts
      # its own (compose.cluster-worker.yaml); each rank compiles for its
      # own GPU on its own node.
      - vllm-kernel-cache:/root/.cache/vllm
      - vllm-kernel-cache:/root/.cache/flashinfer
    expose:
      - "30000"
    networks:
      - inference
    shm_size: 32g
    ipc: host
    # CORE DUMPS OFF, THE ONLY WAY THAT WORKS WITH APPORT (contract §6.5).
    # The host's core_pattern is a PIPE to apport, and apport 2.28.3 reads the
    # whole core into its report regardless of the limit -- `core: 0` does
    # NOT stop it. RLIMIT_CORE == 1 does: the kernel aborts a pipe dump
    # ("RLIMIT_CORE is set to 1, aborting core", fs/coredump.c) BEFORE apport
    # is spawned. Measured on the same image and a 1.5 GB heap: unlimited =
    # 18.3 s held + a 4.2 MB report; 1 = 1.28 s, no report. On 2026-09-11 the
    # 25 GiB worker rank was held for 3 min 59 s writing a 3.5 GB report,
    # which is why its executor noticed the dead rank five minutes late.
    ulimits:
      core:
        soft: 1
        hard: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 30m
    deploy: *nvidia-devices
    logging: *model-logging

  # --- Engine controller ---------------------------------------------------
  # Replaces the shell `vllm-watchdog` (2026-09-12). The watchdog probed one
  # 2-token completion a minute and restarted the head after two 120 s
  # timeouts; on 2026-09-11 that was 4 min 51 s of a dead worker rank that
  # nobody noticed while /health, /v1/models and /metrics all answered 200,
  # then a head restart the still-running worker could never rejoin. The
  # controller (monitoring/engine-controller/controller.py) is a state
  # machine over twenty signals -- Docker process tables on BOTH nodes, a
  # streaming canary with TTFT, token-counter freshness, the worker
  # sentinel -- that publishes a state (/state, /metrics on :9838) the
  # orchestrator and Grafana read, restarts the PAIR in the right order
  # (worker first, then the head) under a host flock, keeps a budget of
  # three recoveries an hour, and captures diagnostics before it touches
  # anything. docs/availability/ARCHITECTURE.md is the design;
  # docs/availability/CONTRACT.md is the binding contract for every name
  # below. It always runs (no profile), like the watchdog it replaces.
  #
  # The Docker socket is mounted WRITABLE, which is root-equivalent on this
  # host -- it is the price of being able to restart the engine, it is the
  # only thing this container does with it, and the image is digest-pinned.
  #
  # Host networking because the head is host-network in dual mode and the
  # worker sentinel lives on the RoCE address only the head can reach.
  # Consequence: every URL below is generated by the launcher from where the
  # listener ACTUALLY binds (environment.engine_head_api_url,
  # router_health_url) and never assumed to be loopback -- in round 1 a
  # hard-wired 127.0.0.1 with PUBLISH_MODEL_PORTS=false (the .env.example
  # default) left the controller unable to connect and publishing DOWN for a
  # healthy engine, which the orchestrator then acted on. An EMPTY head URL
  # means "not observable": the launcher does not start this service at all
  # (cli._start_main_engine_and_controller) rather than let it publish
  # STARTING/DOWN it cannot prove (contract §2). The router (bridge network)
  # is reachable from here only through its PUBLISHED port; empty = the
  # controller reports the router as not configured, never as unhealthy --
  # and in strict one-model mode (v2) the router is an internal classifier
  # whose health is a DEGRADED signal, never a serving path.
  engine-controller:
    image: python@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    command: ["python", "-u", "/app/controller.py"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/engine-controller:/app:ro
      # The recovery lock and the incident evidence live on the HOST, under
      # .runtime/, so scripts/lib/engine-lock.sh (cluster-up/down/recover,
      # deploy.sh), the launcher's own `techsara up` and the controller
      # contend for the same inode, and an incident's `docker logs` capture
      # survives the controller itself being recreated.
      - ./.runtime/locks:/run/techsara/locks
      - ./.runtime/incidents:/run/techsara/incidents
    # THE SENTINEL TOKEN COMES FROM ITS OWN LAYER, not from secrets.env:
    # compose.yaml feeds secrets.env wholesale into the orchestrator (the
    # service that handles untrusted input), and the restart secret must
    # not sit in that process's environment. The launcher writes
    # .runtime/controller.env (0600, prepare_controller_secrets) and
    # scripts/cluster-sync.sh ships the same value to the worker sentinel;
    # .env's CLUSTER_SENTINEL_TOKEN wins on both nodes through that one
    # file, so the two can never disagree. Not listed under `environment:`
    # on purpose -- `environment:` overrides `env_file`, and an empty
    # default here would blank the token.
    env_file:
      - path: ${TECHSARA_CONTROLLER_ENV:-.runtime/controller.env}
        required: false
    environment:
      HEAD_CONTAINER: ${ENGINE_HEAD_CONTAINER:-sf-local-ai-vllm-1}
      HEAD_API_URL: ${ENGINE_HEAD_API_URL:-${TECHSARA_ENGINE_HEAD_API_URL:-}}
      # No worker sentinel on one node; the cluster overlay sets it.
      SENTINEL_URL: ""
      ROUTER_HEALTH_URL: ${TECHSARA_ROUTER_HEALTH_URL:-}
      # The GPU exporters sampled during the readiness sequence's
      # participation probe (contract §5 step 4): the head's is published on
      # loopback by compose.monitoring.yaml, the worker's is on its
      # management address (CLUSTER_WORKER_MGMT_IP). Dual mode only; empty =
      # not observable, recorded as unproven rather than failed.
      HEAD_GPU_EXPORTER_URL: ${TECHSARA_HEAD_GPU_EXPORTER_URL:-}
      WORKER_GPU_EXPORTER_URL: ${TECHSARA_WORKER_GPU_EXPORTER_URL:-}
      PARTICIPATION_MIN_UTIL: ${ENGINE_PARTICIPATION_MIN_UTIL:-30}
      CONTROLLER_PORT: "9838"
      LOCK_DIR: /run/techsara/locks
      INCIDENTS_DIR: /run/techsara/incidents
      CANARY_INTERVAL_S: ${ENGINE_CANARY_INTERVAL_S:-30}
      CANARY_TIMEOUT_S: ${ENGINE_CANARY_TIMEOUT_S:-60}
      COLD_START_BUDGET_S: ${ENGINE_COLD_START_BUDGET_S:-900}
      RECOVERY_BUDGET: ${ENGINE_RECOVERY_BUDGET:-3}
      RECOVERY_WINDOW_S: ${ENGINE_RECOVERY_WINDOW_S:-3600}
      RECOVERY_COOLDOWN_S: ${ENGINE_RECOVERY_COOLDOWN_S:-120}
    # python:3.12-slim has no curl; the probe is the same stdlib one-liner the
    # dgx-gpu exporter uses (compose.monitoring.yaml).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9838/healthz', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *model-logging

  vllm-router:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    command: >
      ${ROUTER_MODEL_CONTAINER_PATH:?ROUTER_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-VL-8B-Instruct-FP8
      --host 0.0.0.0
      --port 30002
      --max-model-len ${ROUTER_MAX_CONTEXT:-49152}
      --gpu-memory-utilization ${ROUTER_GPU_MEMORY_UTILIZATION:-0.17}
      --kv-cache-dtype fp8
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30002"
    networks:
      - inference
    # CORE DUMPS OFF, THE ONLY WAY THAT WORKS WITH APPORT (contract §6.5).
    # The host's core_pattern is a PIPE to apport, and apport 2.28.3 reads the
    # whole core into its report regardless of the limit -- `core: 0` does
    # NOT stop it. RLIMIT_CORE == 1 does: the kernel aborts a pipe dump
    # ("RLIMIT_CORE is set to 1, aborting core", fs/coredump.c) BEFORE apport
    # is spawned. Measured on the same image and a 1.5 GB heap: unlimited =
    # 18.3 s held + a 4.2 MB report; 1 = 1.28 s, no report. On 2026-09-11 the
    # 25 GiB worker rank was held for 3 min 59 s writing a 3.5 GB report,
    # which is why its executor noticed the dead rank five minutes late.
    ulimits:
      core:
        soft: 1
        hard: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30002/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 15m
    deploy: *nvidia-devices
    logging: *model-logging

  # EXPLICIT KV BUDGETS for the two 0.6B pooling engines. Without one, vLLM
  # profiles "free GPU memory" at start-up, and on GB10 unified memory that is
  # free SYSTEM memory, which moves while the main model and the router are
  # loading beside it: on 2026-09-09 the embed engine computed a NEGATIVE KV
  # budget three starts in a row ("Available KV cache memory: -16.18 GiB ...
  # No available memory for the cache blocks") before the fourth start found
  # 1.55 GiB. 2 GiB holds ~19,000 tokens for a 4,096-token window (measured
  # 14,528 tokens at 1.55 GiB), which is more than every real batch needs and
  # makes the start deterministic. The same lesson as the main model's
  # --kv-cache-memory-bytes (launcher/techsara_cli/cluster.py) and the OCR
  # engine's (compose.ocr.yaml).
  vllm-embed:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [embeddings]
    command: >
      vllm serve ${EMBED_MODEL_CONTAINER_PATH:?EMBED_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-Embedding-0.6B
      --host 0.0.0.0
      --port 30003
      --max-model-len 4096
      --gpu-memory-utilization ${EMBED_GPU_MEMORY_UTILIZATION:-0.04}
      --kv-cache-memory-bytes ${EMBED_KV_CACHE_MEMORY_BYTES:-2147483648}
      --runner pooling
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30003"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Embedding-0.6B","input":["health"]}'
          http://127.0.0.1:30003/v1/embeddings -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-reranker:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [reranker]
    command: >
      vllm serve ${RERANKER_MODEL_CONTAINER_PATH:-/models/reranker-disabled}
      --served-model-name Qwen/Qwen3-Reranker-0.6B
      --host 0.0.0.0
      --port 30005
      --max-model-len ${RERANKER_MAX_CONTEXT:-4096}
      --gpu-memory-utilization ${RERANKER_GPU_MEMORY_UTILIZATION:-0.04}
      --kv-cache-memory-bytes ${RERANKER_KV_CACHE_MEMORY_BYTES:-2147483648}
      --runner pooling
      --convert classify
      --hf-overrides '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30005"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Reranker-0.6B","text_1":"health","text_2":["health"]}'
          http://127.0.0.1:30005/score -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-ocr:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    profiles: [ocr]
    command: >
      ${OCR_MODEL_CONTAINER_PATH:-/models/ocr-disabled}
      --served-model-name baidu/Unlimited-OCR
      --host 0.0.0.0
      --port 30004
      --max-model-len ${OCR_MAX_CONTEXT:-8192}
      --gpu-memory-utilization ${OCR_GPU_MEMORY_UTILIZATION:-0.14}
      --enforce-eager
      --trust-remote-code
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30004"
    networks:
      - inference
    shm_size: 8g
    ipc: host
    # CORE DUMPS OFF, THE ONLY WAY THAT WORKS WITH APPORT (contract §6.5).
    # The host's core_pattern is a PIPE to apport, and apport 2.28.3 reads the
    # whole core into its report regardless of the limit -- `core: 0` does
    # NOT stop it. RLIMIT_CORE == 1 does: the kernel aborts a pipe dump
    # ("RLIMIT_CORE is set to 1, aborting core", fs/coredump.c) BEFORE apport
    # is spawned. Measured on the same image and a 1.5 GB heap: unlimited =
    # 18.3 s held + a 4.2 MB report; 1 = 1.28 s, no report. On 2026-09-11 the
    # 25 GiB worker rank was held for 3 min 59 s writing a 3.5 GB report,
    # which is why its executor noticed the dead rank five minutes late.
    ulimits:
      core:
        soft: 1
        hard: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30004/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

volumes:
  # The head's compiled-kernel cache (contract §6.6; see the vllm service).
  # Named like hf-cache in compose.yaml so `docker volume ls` reads the same
  # way on both nodes (the worker's is sf-local-ai-worker_kernel-cache).
  vllm-kernel-cache:
    name: sf-local-ai_vllm-kernel-cache
