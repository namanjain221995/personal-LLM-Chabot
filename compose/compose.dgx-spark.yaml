# DGX Spark: the existing, measured four-service layout with immutable runtime
# images. Model paths are produced by the launcher and resolve under /models.
x-model-logging: &model-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nvidia-devices: &nvidia-devices
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  orchestrator:
    image: sf-local-ai-orchestrator:cuda
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.cuda
    environment:
      HF_HUB_OFFLINE: "1"
      RERANKER_MODEL: ${RERANKER_MODEL_CONTAINER_PATH:?RERANKER_MODEL_CONTAINER_PATH must be generated}
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
    deploy: *nvidia-devices

  vllm:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    command: >
      ${MAIN_MODEL_CONTAINER_PATH:?MAIN_MODEL_CONTAINER_PATH must be generated}
      --served-model-name ${MAIN_MODEL:?MAIN_MODEL must be generated}
      --host 0.0.0.0
      --port 30000
      --max-model-len ${MODEL_MAX_CONTEXT:-262144}
      ${MAIN_MODEL_ROPE_OVERRIDE:-}
      --gpu-memory-utilization 0.35
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --trust-remote-code
      ${MAIN_STARTUP_ARGUMENTS:-}
      --enable-chunked-prefill
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --max-num-batched-tokens 8192
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30000"
    networks:
      - inference
    shm_size: 32g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 30m
    deploy: *nvidia-devices
    logging: *model-logging

  # --- Engine watchdog ----------------------------------------------------
  # The ONE failure nothing else catches: the worker on Spark 2 dies, its
  # container restarts and waits at the rendezvous -- but the head's rank 0
  # cannot re-admit a fresh rank 1, so it spins in NCCL at ~100% GPU forever.
  # /health keeps answering 200 in 2ms throughout (the API process is fine;
  # the engine behind it is not), the head logs NOTHING, and every real
  # request hangs. Found live 2026-09-01: spark-1 pinned at 96%, spark-2 at
  # 0%, RoCE at 0 B/s, generations timing out, health green.
  #
  # So the probe is FUNCTIONAL: a 2-token completion. Three rules, each paid
  # for the same night with a live outage caused by the versions without it:
  #
  #   ARM ONLY AFTER PROOF. Nothing counts until one completion has
  #   SUCCEEDED since the API last came up. "Ready" is demonstrated, not
  #   inferred -- and a probe that is itself broken (as the first one was,
  #   see the extraction note below: every probe 404'd) can then never fire
  #   at all: it never proves anything, so it never arms, so it never
  #   restarts. The three restarts of a healthy engine on 2026-09-01
  #   (21:06, 21:22, 21:35) are what this rule buys.
  #
  #   ONLY TIMEOUTS COUNT. A fast HTTP error is an error, not a hang -- the
  #   container healthcheck below already kills the process on 5xx, and
  #   counting fast failures is how a loading engine got shot at 60-second
  #   intervals. The watchdog's whole mandate is one signature: a PROVEN
  #   engine whose generations stop returning.
  #
  #   NEVER LOOP. At most one restart per 45 minutes; a second trigger
  #   stands down loudly instead. Even a detection bug can now cost at most
  #   one reload per window, not an evening.
  #
  # The worker needs no watchdog of its own: it exits and retries the
  # rendezvous in a loop, so a freshly restarted head pairs with it within
  # minutes. That same dance covers a reboot of either Spark end to end.
  #
  # The Docker socket is mounted WRITABLE, which is root-equivalent on this
  # host -- it is the price of being able to restart the engine, it is the
  # only thing this container does with it, and the image is digest-pinned.
  vllm-watchdog:
    image: docker@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHDOG_TARGET: ${VLLM_WATCHDOG_TARGET:-sf-local-ai-vllm-1}
      WATCHDOG_PORT: ${VLLM_WATCHDOG_PORT:-8000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[watchdog] guarding $${WATCHDOG_TARGET}: arms only after a PROVEN completion, only timeouts count, max one restart per 45 min"
        ARMED=0
        FAILS=0
        LAST_RESTART=0
        while true; do
          sleep 60
          models="$$(wget -q -O- -T 5 "http://127.0.0.1:$${WATCHDOG_PORT}/v1/models" 2>/dev/null)" || { ARMED=0; FAILS=0; continue; }
          # FIRST id, not last: sed's greedy .* here once matched the LAST
          # "id" in the payload -- a modelperm-* permission id -- so every
          # probe POSTed a nonexistent model, 404'd in 0s, and the counting
          # logic turned a broken probe into three restarts of a perfectly
          # healthy engine (2026-09-01, the whole evening). grep -o takes
          # matches in order; head -1 is the model.
          model="$$(printf %s "$$models" | grep -oE '"id": ?"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$$/\1/')"
          [ -z "$$model" ] && continue
          body="{\"model\":\"$$model\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":2,\"temperature\":0,\"chat_template_kwargs\":{\"enable_thinking\":false}}"
          T0="$$(date +%s)"
          if wget -q -O /dev/null -T 120 --header 'Content-Type: application/json' --post-data "$$body" "http://127.0.0.1:$${WATCHDOG_PORT}/v1/chat/completions" 2>/dev/null; then
            [ "$$ARMED" = 0 ] && echo "[watchdog] engine PROVEN ready - armed"
            ARMED=1; FAILS=0; continue
          fi
          EL="$$(( $$(date +%s) - T0 ))"
          if [ "$$ARMED" = 0 ]; then
            echo "[watchdog] probe failed while unarmed ($${EL}s) - engine still warming; not counted"
            continue
          fi
          if [ "$$EL" -lt 100 ]; then
            echo "[watchdog] fast HTTP error ($${EL}s) - an error, not a hang; not counted (the container healthcheck owns 5xx)"
            continue
          fi
          FAILS="$$((FAILS+1))"
          echo "[watchdog] generation TIMED OUT ($${EL}s) on a proven-ready engine ($$FAILS/2)"
          if [ "$$FAILS" -ge 2 ]; then
            NOW="$$(date +%s)"
            if [ "$$((NOW - LAST_RESTART))" -lt 2700 ]; then
              echo "[watchdog] STANDING DOWN: already restarted within 45 min - refusing to loop; needs a human"
              ARMED=0; FAILS=0; continue
            fi
            echo "[watchdog] hung engine: restarting $${WATCHDOG_TARGET}"
            docker restart -t 30 "$${WATCHDOG_TARGET}" || echo "[watchdog] restart FAILED"
            LAST_RESTART="$$NOW"; ARMED=0; FAILS=0
          fi
        done
    logging: *model-logging

  vllm-router:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    command: >
      ${ROUTER_MODEL_CONTAINER_PATH:?ROUTER_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-VL-8B-Instruct-FP8
      --host 0.0.0.0
      --port 30002
      --max-model-len ${ROUTER_MAX_CONTEXT:-49152}
      --gpu-memory-utilization ${ROUTER_GPU_MEMORY_UTILIZATION:-0.17}
      --kv-cache-dtype fp8
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30002"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30002/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 15m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-embed:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [embeddings]
    command: >
      vllm serve ${EMBED_MODEL_CONTAINER_PATH:?EMBED_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-Embedding-0.6B
      --host 0.0.0.0
      --port 30003
      --max-model-len 4096
      --gpu-memory-utilization 0.04
      --runner pooling
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30003"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Embedding-0.6B","input":["health"]}'
          http://127.0.0.1:30003/v1/embeddings -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-reranker:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [reranker]
    command: >
      vllm serve ${RERANKER_MODEL_CONTAINER_PATH:-/models/reranker-disabled}
      --served-model-name Qwen/Qwen3-Reranker-0.6B
      --host 0.0.0.0
      --port 30005
      --max-model-len ${RERANKER_MAX_CONTEXT:-4096}
      --gpu-memory-utilization ${RERANKER_GPU_MEMORY_UTILIZATION:-0.04}
      --runner pooling
      --convert classify
      --hf-overrides '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30005"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Reranker-0.6B","text_1":"health","text_2":["health"]}'
          http://127.0.0.1:30005/score -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-ocr:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    profiles: [ocr]
    command: >
      ${OCR_MODEL_CONTAINER_PATH:-/models/ocr-disabled}
      --served-model-name baidu/Unlimited-OCR
      --host 0.0.0.0
      --port 30004
      --max-model-len ${OCR_MAX_CONTEXT:-8192}
      --gpu-memory-utilization ${OCR_GPU_MEMORY_UTILIZATION:-0.14}
      --enforce-eager
      --trust-remote-code
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30004"
    networks:
      - inference
    shm_size: 8g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30004/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging
