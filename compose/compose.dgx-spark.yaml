# DGX Spark: the existing, measured four-service layout with immutable runtime
# images. Model paths are produced by the launcher and resolve under /models.
x-model-logging: &model-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nvidia-devices: &nvidia-devices
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  orchestrator:
    image: sf-local-ai-orchestrator:cuda
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.cuda
    environment:
      HF_HUB_OFFLINE: "1"
      RERANKER_MODEL: ${RERANKER_MODEL_CONTAINER_PATH:?RERANKER_MODEL_CONTAINER_PATH must be generated}
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
    deploy: *nvidia-devices

  vllm:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    command: >
      ${MAIN_MODEL_CONTAINER_PATH:?MAIN_MODEL_CONTAINER_PATH must be generated}
      --served-model-name ${MAIN_MODEL:?MAIN_MODEL must be generated}
      --host 0.0.0.0
      --port 30000
      --max-model-len ${MODEL_MAX_CONTEXT:-262144}
      ${MAIN_MODEL_ROPE_OVERRIDE:-}
      --gpu-memory-utilization 0.35
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --trust-remote-code
      ${MAIN_STARTUP_ARGUMENTS:-}
      --enable-chunked-prefill
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --max-num-batched-tokens 8192
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30000"
    networks:
      - inference
    shm_size: 32g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 30m
    deploy: *nvidia-devices
    logging: *model-logging

  # --- Engine watchdog ----------------------------------------------------
  # The ONE failure nothing else catches: the worker on Spark 2 dies, its
  # container restarts and waits at the rendezvous -- but the head's rank 0
  # cannot re-admit a fresh rank 1, so it spins in NCCL at ~100% GPU forever.
  # /health keeps answering 200 in 2ms throughout (the API process is fine;
  # the engine behind it is not), the head logs NOTHING, and every real
  # request hangs. Found live 2026-09-01: spark-1 pinned at 96%, spark-2 at
  # 0%, RoCE at 0 B/s, generations timing out, health green.
  #
  # So the probe is FUNCTIONAL: a 2-token completion. The hung state has a
  # precise signature -- /v1/models answers but generation does not -- and
  # only on that signature, twice in a row, is the head restarted. The worker
  # needs no watchdog of its own: it already exits and retries the rendezvous
  # in a loop, so a freshly restarted head pairs with it within minutes. That
  # same dance covers a reboot of either Spark end to end.
  #
  # While the model is LOADING, /v1/models refuses connections, so the
  # watchdog counts nothing and cannot restart-loop a starting engine; after
  # a restart it also sleeps out the load time explicitly.
  #
  # The Docker socket is mounted WRITABLE, which is root-equivalent on this
  # host -- it is the price of being able to restart the engine, it is the
  # only thing this container does with it, and the image is digest-pinned.
  vllm-watchdog:
    image: docker@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHDOG_TARGET: ${VLLM_WATCHDOG_TARGET:-sf-local-ai-vllm-1}
      WATCHDOG_PORT: ${VLLM_WATCHDOG_PORT:-8000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[watchdog] probing 127.0.0.1:$${WATCHDOG_PORT} every 60s; two hung generations restart $${WATCHDOG_TARGET}"
        FAILS=0
        while true; do
          sleep 60
          models="$$(wget -q -O- -T 5 "http://127.0.0.1:$${WATCHDOG_PORT}/v1/models" 2>/dev/null)" || { FAILS=0; continue; }
          model="$$(printf %s "$$models" | sed -n 's/.*"id": *"\([^"]*\)".*/\1/p' | head -1)"
          [ -z "$$model" ] && { FAILS=0; continue; }
          body="{\"model\":\"$$model\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":2,\"temperature\":0,\"chat_template_kwargs\":{\"enable_thinking\":false}}"
          if wget -q -O /dev/null -T 120 --header 'Content-Type: application/json' --post-data "$$body" "http://127.0.0.1:$${WATCHDOG_PORT}/v1/chat/completions" 2>/dev/null; then
            FAILS=0
          else
            FAILS=$$((FAILS+1))
            echo "[watchdog] generation probe hung ($$FAILS/2) while /v1/models answers"
            if [ "$$FAILS" -ge 2 ]; then
              echo "[watchdog] engine is hung -- restarting $${WATCHDOG_TARGET}"
              docker restart -t 30 "$${WATCHDOG_TARGET}" || echo "[watchdog] restart FAILED"
              FAILS=0
              echo "[watchdog] sleeping 600s for the model to load"
              sleep 600
            fi
          fi
        done
    logging: *model-logging

  vllm-router:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    command: >
      ${ROUTER_MODEL_CONTAINER_PATH:?ROUTER_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-VL-8B-Instruct-FP8
      --host 0.0.0.0
      --port 30002
      --max-model-len ${ROUTER_MAX_CONTEXT:-49152}
      --gpu-memory-utilization ${ROUTER_GPU_MEMORY_UTILIZATION:-0.17}
      --kv-cache-dtype fp8
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30002"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30002/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 15m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-embed:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [embeddings]
    command: >
      vllm serve ${EMBED_MODEL_CONTAINER_PATH:?EMBED_MODEL_CONTAINER_PATH must be generated}
      --served-model-name Qwen/Qwen3-Embedding-0.6B
      --host 0.0.0.0
      --port 30003
      --max-model-len 4096
      --gpu-memory-utilization 0.04
      --runner pooling
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30003"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Embedding-0.6B","input":["health"]}'
          http://127.0.0.1:30003/v1/embeddings -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-reranker:
    image: nvcr.io/nvidia/vllm@sha256:654e563e727be1968487d453de0733fb074cb59adf424c779d0f9e7cfcb2b6b6
    profiles: [reranker]
    command: >
      vllm serve ${RERANKER_MODEL_CONTAINER_PATH:-/models/reranker-disabled}
      --served-model-name Qwen/Qwen3-Reranker-0.6B
      --host 0.0.0.0
      --port 30005
      --max-model-len ${RERANKER_MAX_CONTEXT:-4096}
      --gpu-memory-utilization ${RERANKER_GPU_MEMORY_UTILIZATION:-0.04}
      --runner pooling
      --convert classify
      --hf-overrides '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30005"
    networks:
      - inference
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -H 'Content-Type: application/json'
          --data '{"model":"Qwen/Qwen3-Reranker-0.6B","text_1":"health","text_2":["health"]}'
          http://127.0.0.1:30005/score -o /dev/null || exit 1
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging

  vllm-ocr:
    image: vllm/vllm-openai@sha256:24f2f8975d011ea7f7066a547886a08a1fd3c4bf0880463487fae4f01ce723c6
    profiles: [ocr]
    command: >
      ${OCR_MODEL_CONTAINER_PATH:-/models/ocr-disabled}
      --served-model-name baidu/Unlimited-OCR
      --host 0.0.0.0
      --port 30004
      --max-model-len ${OCR_MAX_CONTEXT:-8192}
      --gpu-memory-utilization ${OCR_GPU_MEMORY_UTILIZATION:-0.14}
      --enforce-eager
      --trust-remote-code
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${TECHSARA_MODEL_CACHE:?TECHSARA_MODEL_CACHE must be generated}
        target: /models
        read_only: true
      - hf-cache:/root/.cache/huggingface
    expose:
      - "30004"
    networks:
      - inference
    shm_size: 8g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30004/v1/models -o /dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 10m
    deploy: *nvidia-devices
    logging: *model-logging
