# OPT-IN ONLY — layered after compose.dgx-spark.yaml when PUBLISH_MODEL_PORTS
# is true in .env. Without it the model APIs stay on the internal `inference`
# network and are reachable only by the orchestrator and sync worker.
#
# These endpoints have NO authentication. Publishing them on a non-loopback
# address exposes unauthenticated model inference — and, through it, whatever
# those models can be asked to do — to every host that can reach this machine.
#
# EVERY model below therefore follows TECHSARA_MODEL_BIND_ADDRESS (default
# 127.0.0.1), NOT TECHSARA_BIND_ADDRESS. The two were one variable until
# 2026-09-01, which meant opening the app to the LAN also opened four
# unauthenticated model APIs to it — measured: `curl 192.168.9.54:8002/v1/models`
# answered 200 from any host on the office network. That split left the MAIN
# engine behind on TECHSARA_BIND_ADDRESS, the most expensive API of the five;
# the developer-platform audit (F050, 2026-09-13) found it and it moved too.
# Nothing in the application needs these published: the orchestrator reaches
# them by service name over the `inference` network
# (ROUTER_BASE_URL=http://vllm-router:30002/v1), Prometheus scrapes them the
# same way, and on a single node the engine controller dials the head at
# TECHSARA_MODEL_BIND_ADDRESS (environment.engine_head_api_url) -- which the
# port below now agrees with. Publishing is for debugging only.
#
# Publishing also attaches these services to the routable `application`
# network. Docker records a port binding for a container that is only on an
# `internal: true` network but never actually publishes it, so without this the
# mapping appears in `docker inspect` and is unreachable from the host.
services:
  vllm:
    networks:
      - inference
      - application
    ports:
      - "${TECHSARA_MODEL_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8000}:30000"

  vllm-router:
    networks:
      - inference
      - application
    ports:
      - "${TECHSARA_MODEL_BIND_ADDRESS:-127.0.0.1}:${VLLM_ROUTER_PORT:-8002}:30002"

  vllm-embed:
    networks:
      - inference
      - application
    ports:
      - "${TECHSARA_MODEL_BIND_ADDRESS:-127.0.0.1}:${VLLM_EMBED_PORT:-8003}:30003"

  vllm-ocr:
    networks:
      - inference
      - application
    ports:
      - "${TECHSARA_MODEL_BIND_ADDRESS:-127.0.0.1}:${VLLM_OCR_PORT:-8004}:30004"

  vllm-reranker:
    networks:
      - inference
      - application
    ports:
      - "${TECHSARA_MODEL_BIND_ADDRESS:-127.0.0.1}:${VLLM_RERANKER_PORT:-8005}:30005"
