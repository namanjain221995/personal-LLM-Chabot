# Whisper Large-v3 on a Spark's CPU cores: the overflow replica. Its own Compose project
# (sf-local-ai-whisper-cpu), on the WORKER (spark-476e) and, by the owner's exception of
# 2026-09-30, on the HEAD (spark-0e68) as well, started by scripts/whisper-cpu.sh.
#
# WHAT IT IS FOR. The two GPU replicas (compose.whisper.yaml, one per Spark) serve speech. The
# orchestrator sends this copy a clip only when every GPU replica is already decoding one, and only
# a clip that can finish inside its deadline at this copy's measured speed (ASR_CPU_* in
# orchestrator/app/config.py, `RoutedProvider` in orchestrator/app/asr.py). The same model, the
# same decode settings, the same HTTP contract as compose/whisper/server.py; see
# docs/voice/CPU-REPLICA.md for the measurements behind all of it.
#
# THE HEAD ONLY BY EXCEPTION. The head's memory is off limits for new services (owner,
# 2026-09-16). On 2026-09-30 the owner allowed this one copy there, on the condition that chat
# decode drops by no more than 5 % while it is busy, measured first
# (docs/voice/CPU-REPLICA-HEAD.md). scripts/whisper-cpu.sh starts it there only when asked
# (WHISPER_CPU_NODE=head) and refuses when the head has less than 20 GiB available.
#
# NO GPU, ON PURPOSE. A GPU speech replica on either Spark slows the chat model on both (it is
# tensor-parallel across them). This one uses eight of a Spark's cores and none of its GPU.
#
# BINDING, bound by the process itself with host networking, exactly like compose.whisper.yaml.
# On the worker, the MANAGEMENT address (a published port does not survive a reboot there, and the
# RoCE addresses belong to the main model's fabric). The host packet filter must accept 30008 from
# the head only (scripts/host-guard.sh), as it does 30007. On the head, the Docker bridge gateway
# 172.17.0.1, where the head's GPU replica listens on 30007: the orchestrator reaches it from its
# compose bridge, and the office LAN does not. WHISPER_BIND is required on both.

services:
  whisper-cpu:
    build:
      context: ./whisper-cpu
      dockerfile: Dockerfile
      target: service
    image: sf-local-ai-whisper-cpu:wcpp-927cfce3-cap443-q8_0
    environment:
      WHISPER_BIND: "${WHISPER_BIND:?WHISPER_BIND must be set; scripts/whisper-cpu.sh derives it on the worker}"
      WHISPER_PORT: "${WHISPER_CPU_PORT:-30008}"
      WHISPER_MAX_AUDIO_SECONDS: "${WHISPER_MAX_AUDIO_SECONDS:-600}"
      WHISPER_CPU_THREADS: "${WHISPER_CPU_THREADS:-8}"
      WHISPER_CPU_MODEL_FILE: /models/ggml-large-v3-q8_0.bin
      # OpenMP threads sleep when there is nothing to decode instead of spinning on the cores the
      # chat model's worker rank may be scheduled on.
      OMP_WAIT_POLICY: PASSIVE
    network_mode: host
    # THE TEN CORTEX-X925 CORES, AND EIGHT CORES' WORTH OF TIME ON THEM. cpus 0-4 and 10-14 are the
    # slower A725 cluster. Nothing pins the chat model's worker rank to them (its container has no
    # cpuset), so its threads may run on these ten too; the measured chat cost includes that.
    # The quota leaves two X925 cores' worth of time free inside the set as well. These are the
    # WORKER's values and the defaults. The head's copy is given its own
    # (WHISPER_CPU_CPUSET/_CPUS/_THREADS, set by scripts/whisper-cpu.sh): eight X925 cores without
    # 5-6, where the chat model's rank-0 engine loop ran on 2026-09-30.
    cpuset: "${WHISPER_CPU_CPUSET:-5-9,15-19}"
    cpus: ${WHISPER_CPU_CPUS:-8}
    # A MEMORY CEILING, AND NO SWAP: the one service with a hard limit, decided on purpose
    # (launcher/tests/test_oom_score_adj.py DECIDED_MEMORY_LIMITS). No GPU code runs here, so all
    # of its memory is host RSS the cgroup charges. Measured peak 2.0 GiB (the q8_0 model, the
    # decoder state and a 600 s clip); the ceiling is twice that. Without it, a leak would reach
    # the global OOM killer, which takes the OCR engine (900) BEFORE this replica (850), and would
    # press on the unified memory the chat model's rank 1 uses. With it, only this overflow copy
    # is killed and the router falls back to the GPU replicas. No swap, because a swapped-out model
    # decodes slower than the router's estimate.
    mem_limit: 4g
    memswap_limit: 4g
    # ONE READ-ONLY FILE IN, NOTHING WRITTEN. The model is the q8_0 file scripts/whisper-cpu.sh
    # converted from the pinned Hugging Face revision (server.py checks its SHA-256 at start).
    read_only: true
    tmpfs:
      # Starlette spools any multipart part over 1 MiB here for the length of one request; a
      # 600 s WAV is 19.2 MB and a legacy upload is at most ASR_MAX_UPLOAD_BYTES (32 MiB).
      - /tmp:size=128m,mode=1777
    volumes:
      - "${WHISPER_CPU_MODEL_DIR:?WHISPER_CPU_MODEL_DIR must be set; scripts/whisper-cpu.sh derives it}:/models:ro"
    user: "10008:10008"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    restart: unless-stopped
    # OOM ORDER (docs/developer-platform/OPERATIONS.md section 14): after the OCR engine (900),
    # before the GPU speech replica (800). This copy is overflow capacity, so it goes before the
    # replica that serves speech normally; the OCR engine goes first because it frees ~15 GiB of
    # the unified memory a UVM-driven OOM is short of, and this frees ~2.3 GiB of host memory.
    # Applied when scripts/whisper-cpu.sh up next CREATES the container.
    oom_score_adj: 850
    healthcheck:
      # The address the server ACTUALLY binds, and `ready`, not just the status: the GPU
      # replica's check, word for word.
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request,json,sys; h=os.environ.get('WHISPER_BIND','127.0.0.1'); p=os.environ.get('WHISPER_PORT','30008'); b=json.load(urllib.request.urlopen(f'http://{h}:{p}/health', timeout=5)); sys.exit(0 if b.get('ready') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The model is read from the page cache and checked against its SHA-256 (1.7 GB) at start.
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
