[pytest]
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider -p techsara_conformance.plugin
pythonpath = .
# A planned feature's tests run and are expected to fail. If one passes, the
# feature exists but its marker/detection disagrees — that is a FAILURE the
# release manager must look at, never a quiet XPASS (2026-09-13).
xfail_strict = true
markers =
    feature(name): the test exercises a feature named in techsara_conformance/features.py; when that feature is "planned" on the target the test is XFAIL(strict)
    long: generates many output tokens with the client timeout disabled (sized by --long-output-tokens)
    capacity_probe: deliberately fills a capacity gate; runs only with --capacity-probe, never against a shared production engine
    limited_key: uses only the limited (models.read) key, so it is never skipped for a scope the main key lacks
    main_long_gate: takes the one shared public main.long slot (CONTRACT-3 §12.3) for a moment; deselect with -m "not main_long_gate" on a target where a customer's long job must never wait
