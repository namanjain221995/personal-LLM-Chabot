# TechSara Local AI Analysis Platform — docker-compose (spec §6, model serving per
# the vLLM design: owner override of spec §4 on 2026-07-22 — all models on vLLM).
# Secrets come ONLY from .env via ${VAR} interpolation. Never hardcode them here.

name: sf-local-ai

volumes:
  hf-cache:
  data:
  reports:
  # App state (users, conversations, messages, …) lives in PostgreSQL as of
  # 2026-08-10. Its own volume, deliberately NOT a directory inside `data`:
  # that volume is mounted READ-WRITE into the sync worker too, and a stray
  # write into PGDATA corrupts the cluster in ways nothing here would notice.
  pgdata:
  # pgAdmin's own state: its user database, saved layouts, and the pgpass file
  # that lets the pre-registered connection open without typing a password.
  pgadmin:

services:
  # --------------------------------------------------------------------------
  # vLLM model services — all OpenAI-compatible, all on nvcr.io/nvidia/vllm
  # (arm64 verified on this box). Models auto-download from Hugging Face into
  # the shared hf-cache volume on first start.
  #
  # GPU memory budget: --gpu-memory-utilization fractions of the 121 GB
  # UNIFIED memory (this is not a discrete GPU — the fraction comes out of the
  # same pool as the OS and every other container).
  #   0.35 (vllm: 22 GB weights + ~10.5 GB KV at 262144 with fp8)
  # + 0.17 (vllm-router/agent: 10 GB weights + ~3.4 GB KV at 49152 — raised
  #         from 0.14 on 2026-08-11; see the service comment, it could not
  #         cold-start alongside the other three at 0.14)
  # + 0.04 (vllm-embed)
  # + 0.09 (vllm-ocr: 6.4 GB weights + eager overhead + KV at 8192)  ≈ 0.65,
  # leaving ~42 GB for the orchestrator's in-process reranker, DuckDB/LanceDB,
  # the frontend and the OS.
  # Over-reserving here took the box to 0 GB free once. The ceiling was 0.62
  # until 2026-08-11, when vllm-router turned out not to fit at 0.14 on a cold
  # start and had to go to 0.17 (see its comment). 0.65 IS THE CEILING NOW —
  # do not add another resident model, and if free memory gets tight this is
  # the number to walk back down.
  # --------------------------------------------------------------------------

  vllm:
    # vLLM 0.23.x (official nightly, arm64). The NGC 26.05 image ships vLLM
    # 0.20.1, whose Qwen3.6 loader cannot read a QUANTIZED Qwen3.6 checkpoint:
    # NVIDIA's NVFP4 build dies on `layers.*.mlp.experts.w2_input_scale` and the
    # compressed-tensors build on `lm_head.weight_scale`. 0.23 adds the missing
    # parameter definitions (plus modelopt_mixed / nvfp4_per_token).
    # NOTE: this image's ENTRYPOINT is already ["vllm","serve"], so `command`
    # supplies ARGUMENTS ONLY — no leading "vllm serve".
    image: vllm/vllm-openai:nightly
    # MAIN model (2026-07-28): Qwen3.6-35B-A3B in NVIDIA NVFP4 (~22 GB), served
    # from the local weights directory rather than the HF cache. MoE
    # (35B total / 3B active), MULTIMODAL, with a reasoning stream — it serves
    # every heavy path: chat, SQL, RAG, reports, vision, PDF, and the agent's
    # planning + synthesis.
    #
    # Context: the native window is 262144 and this architecture has only TWO
    # KV heads (head_dim 256, 40 layers) → ~80 KiB/token, halved again by
    # --kv-cache-dtype fp8. The full 256K window therefore costs ~10 GB of KV,
    # which is why it is affordable here where the old 4-KV-head model was not.
    #
    # --served-model-name keeps a stable, readable id in the API and in the
    # trust metadata even though the weights load from a path.
    #
    # Performance flags (2026-07-28, from interview-analysis-v2 serve_model.sh,
    # NVIDIA's DGX Spark recipe for this NVFP4 checkpoint): modelopt quant kernels,
    # flashinfer attention + marlin MoE backends, chunked prefill and prefix
    # caching. These speed up prefill/decode WITHOUT changing the memory budget
    # (gpu-mem-util stays 0.35) or the context window (stays 262144), so the
    # shared stack (router+embed) is unaffected.
    # --max-num-batched-tokens 8192 is REQUIRED here: this is a hybrid-Mamba model,
    # and --enable-prefix-caching forces "Mamba align" mode whose block_size (2096)
    # must be <= max-num-batched-tokens (default 2048 → engine-core assertion fail).
    # NOTE: --max-num-seqs is deliberately left at the vLLM default (NOT set to 4
    # like serve_model.sh) — 4 would cap concurrency and throttle this shared,
    # multi-consumer server. max-num-batched-tokens does not limit concurrency.
    command: >
      /models/Qwen3.6-35B-A3B-NVFP4
      --served-model-name Qwen/Qwen3.6-35B-A3B-NVFP4
      --host 0.0.0.0
      --port 30000
      --max-model-len 262144
      --gpu-memory-utilization 0.35
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --trust-remote-code
      --quantization modelopt
      --attention-backend flashinfer
      --moe-backend marlin
      --enable-chunked-prefill
      --enable-prefix-caching
      --max-num-batched-tokens 8192
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
      # Local weights, read-only: nothing in the container may modify them.
      - ${VLLM_MODELS_DIR:-/home/techsphere/Documents/projects/vllm_models}:/models:ro
    ports:
      - "8000:30000"
    shm_size: 32g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 30s
      retries: 60
      start_period: 30m # ~65 GB download on first start
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-vision:
    image: nvcr.io/nvidia/vllm:26.05-py3
    # Vision model right-sized for this box (2026-07-23). Journey: the spec's
    # Qwen3-VL-8B (16.6 GB) never fit; the 4B (8.9 GB) LOADED at
    # gpu-mem 0.10 but crashed while actually processing an image — with
    # gpt-oss-120b holding ~64 GB, the ~5 GB left was too little for the vision
    # encoder's activation spike. Settled on the 2B (4.3 GB): it leaves enough
    # headroom to run image inference reliably without swap. Still a solid
    # OCR/document VL for invoices, contracts and screenshots.
    # Opt-in via profile so a plain `up -d` never starts it:
    #     docker compose --profile vision up -d vllm-vision
    # The orchestrator does not wait on it; /health shows "degraded" while off,
    # and only image-upload answers are affected.
    profiles: ["vision"]
    # --enforce-eager: Qwen3-VL's "deepstack" visual tokens overflow the
    # CUDA-graph-captured buffer on real images ("Requested more deepstack
    # tokens than available in buffer"); running eager avoids the fixed-size
    # capture. Bonus: no graph capture → a little less memory on this tight box.
    command: >
      vllm serve Qwen/Qwen3-VL-2B-Instruct
      --host 0.0.0.0
      --port 30001
      --max-model-len 8192
      --gpu-memory-utilization 0.11
      --enforce-eager
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:30001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30001/health || exit 1"]
      interval: 30s
      retries: 60
      start_period: 20m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The AGENT model (2026-07-28): Qwen3-VL-8B-Instruct-FP8 (~10 GB, local).
  # The agent fans out several sub-steps per task, so running them on the
  # small multimodal model keeps a heavy request from monopolising the main
  # model's KV pool — planning and final synthesis still happen on the 35B.
  # It also serves the cheap classification calls (route, auto-orchestration),
  # where its INSTRUCT (non-thinking) nature is exactly what you want.
  # Same nightly runtime as the main service; ENTRYPOINT is ["vllm","serve"].
  #
  # 2026-08-11 — THIS SERVICE COULD NOT SURVIVE A COLD START, and the failure
  # only appears when all four model services start TOGETHER, i.e. on every
  # reboot, which is exactly when nobody is watching. Found by tearing the
  # whole stack down and bringing it back:
  #
  #     ValueError: To serve at least one request with the model's max seq len
  #     (65536), (4.5 GiB KV cache is needed, which is larger than the
  #     available KV cache memory (4.2 GiB)
  #
  # …then the container exits 0 and restart-loops forever.
  #
  # THE TRAP: "available KV cache memory" is NOT a fixed share of the 121 GB.
  # vLLM measures the memory actually free when IT profiles, so this service's
  # budget shrinks as the other three finish loading — observed falling 4.2 →
  # 1.84 → 1.68 GiB over a single cold start as vllm/-embed/-ocr settled.
  # Shrinking --max-model-len alone therefore chases a moving target: 49152
  # (3.38 GiB) still did not fit once the others were resident.
  #
  # So BOTH levers, for margin rather than a knife edge:
  #   * --max-model-len 49152 instead of 65536 → needs ~3.4 GiB, not ~4.5.
  #     48K is far more than this service's jobs use (routing and
  #     classification are a few hundred tokens; an agent web step tops out
  #     around 15K), and REPORT_MAX_CONTEXT=65536 is unaffected — report
  #     planning runs on the MAIN model, not this one.
  #   * --gpu-memory-utilization 0.14 → 0.17, which is what actually raises the
  #     ceiling this measures against. That takes the resident sum to ~0.65,
  #     above the 0.62 noted at the top of this file — a deliberate, measured
  #     exception: a router stuck in a restart loop costs more than 3.6 GB, and
  #     there was ~23 GB free at the time. If you ever add another resident
  #     model, this is the first place to look.
  vllm-router:
    image: vllm/vllm-openai:nightly
    command: >
      /models/qwen3-vl-8b-fp8
      --served-model-name Qwen/Qwen3-VL-8B-Instruct-FP8
      --host 0.0.0.0
      --port 30002
      --max-model-len 49152
      --gpu-memory-utilization 0.17
      --kv-cache-dtype fp8
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ${VLLM_MODELS_DIR:-/home/techsphere/Documents/projects/vllm_models}:/models:ro
    ports:
      - "8002:30002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30002/health || exit 1"]
      interval: 30s
      retries: 60
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-embed:
    image: nvcr.io/nvidia/vllm:26.05-py3
    # vLLM v0.20 (26.05 image) uses `--runner pooling` for embedding models
    # (the older `--task embed` flag was removed upstream).
    command: >
      vllm serve Qwen/Qwen3-Embedding-0.6B
      --host 0.0.0.0
      --port 30003
      --max-model-len 4096
      --gpu-memory-utilization 0.04
      --runner pooling
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8003:30003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30003/health || exit 1"]
      interval: 30s
      retries: 60
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-ocr:
    # Unlimited-OCR (2026-08-06): baidu's 3.3B document-OCR VLM
    # (hf.co/baidu/Unlimited-OCR, MIT). vLLM 0.26 nightly has NATIVE
    # UnlimitedOCRForCausalLM support — same image as the main model, so no
    # new runtime. The orchestrator OCRs uploaded images and rendered PDF
    # pages here first, then hands the transcript + pixels to the main model
    # (engines/ocr.py). If this service is down the pipeline silently falls
    # back to pixels-only — answers degrade, nothing breaks.
    # NOTE: this image's ENTRYPOINT is ["vllm","serve"] → ARGUMENTS ONLY.
    image: vllm/vllm-openai:nightly
    # Tuning (measured 2026-08-06, two crash-loops):
    #   0.08 + CUDA graphs @16384 → "No available memory for the cache blocks";
    #   0.08 + eager @8192 → weights+overhead left 0.04 GiB KV of the 0.47
    #   needed. 0.09 (≈10.9 GB) gives ~1.2 GB of KV headroom. --enforce-eager
    #   stays: OCR calls are single-image, eager latency is fine, and graph
    #   capture memory is what broke the first attempt.
    command: >
      /models/unlimited-ocr
      --served-model-name baidu/Unlimited-OCR
      --host 0.0.0.0
      --port 30004
      --max-model-len 8192
      --gpu-memory-utilization 0.09
      --enforce-eager
      --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ${VLLM_MODELS_DIR:-/home/techsphere/Documents/projects/vllm_models}:/models:ro
    ports:
      - "8004:30004"
    shm_size: 8g
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30004/health || exit 1"]
      interval: 30s
      retries: 60
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --------------------------------------------------------------------------
  # App-state database (2026-08-10 — replaces /data/app.sqlite3).
  #
  # WHY: the SQLite layer opened a fresh connection per operation and re-ran
  # the whole schema script plus migrate() every time, and one writer at a time
  # meant a 9 ms fsync on the critical path of every chat turn — executed
  # inline on the event loop, so it stalled every concurrent SSE stream.
  # Measured on this box: add_message 8.9 ms → 2.2 ms, and history search went
  # from 1.9 ms over 378 messages to 2.1 ms over 200,000 (pg_trgm GIN instead
  # of a full LIKE scan).
  #
  # NOT in scope: the DuckDB warehouse and LanceDB. DuckDB is a columnar
  # analytics engine and is *faster* than PostgreSQL for the SQL engine's
  # scan-and-aggregate queries — moving that would be a downgrade.
  #
  # Bound to 127.0.0.1 only. There is no authentication in front of the app
  # (see auth.py), so the database must not be reachable off-box either.
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techsara}
      POSTGRES_USER: ${POSTGRES_USER:-techsara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic byte-order collation: the C locale makes ORDER BY and
      # LIKE index behaviour independent of the container's ICU/glibc version,
      # so an image upgrade can never silently invalidate an index.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      PGDATA: /var/lib/postgresql/18/docker
    # Tuning for a single-node box whose 121 GB is UNIFIED memory shared with
    # the GPU: PostgreSQL is capped at roughly 1 GB resident so it never
    # competes with the vLLM services. effective_cache_size is an estimate the
    # planner uses, not an allocation.
    #   synchronous_commit stays ON: this is the user's chat history, and 2.2 ms
    #   is already 4x faster than what SQLite was doing. Set it to `off` only if
    #   you accept losing the last ~200 ms of writes on a hard crash.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      - -c
      - random_page_cost=1.1          # NVMe, not spinning rust
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=on
      - -c
      - track_io_timing=on
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      # Loopback ONLY — enough for the host-side migration script and psql,
      # never reachable from the LAN.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      # -U/-d matter: the default `pg_isready` probes the `postgres` role and
      # would report ready against a cluster whose app database is still
      # initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techsara} -d ${POSTGRES_DB:-techsara} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --------------------------------------------------------------------------
  # pgAdmin — web UI for the app-state database. http://127.0.0.1:5050
  #
  # LOOPBACK ONLY, and that binding matters more here than anywhere else in
  # this file: pgAdmin is a full SQL client. Anyone who reaches it can DROP the
  # conversation history, which is strictly more damage than the app itself
  # allows. That is also why it keeps its login even though the app has none.
  #
  # The PostgreSQL connection is pre-registered from ./pgadmin/servers.json and
  # its password comes from a pgpass file inside the `pgadmin` volume, written by
  # `./pgadmin/setup-passfile.sh` — so the server is just there in the tree when
  # you log in, with nothing to type. Re-run that script if you ever delete the
  # volume or change POSTGRES_PASSWORD.
  #
  # Admin tool, not part of serving a request. Comment out `profiles` below —
  # or run `docker compose --profile admin up -d pgadmin` after adding
  # `profiles: ["admin"]` — if you would rather it not start with everything
  # else. It costs ~200 MB of HOST RAM (not GPU memory, so the vLLM budget at
  # the top of this file is unaffected).
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      # NOT a .local / .test / example.com address: pgAdmin validates this with
      # `email_validator` and rejects special-use domains outright, crash-looping
      # the container. Nothing is ever sent to it (Postfix is disabled below).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@techsarasolutions.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set in .env}
      # Import the server definition on first start.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Without this pgAdmin demands a SECOND "master password" on every login
      # before it will decrypt saved connection credentials — a pointless extra
      # secret for a single-user tool already behind its own login on loopback.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Quieter startup: no upgrade-check call out to the internet.
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:5050:80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build: ./orchestrator
    environment:
      # Live, READ-ONLY Salesforce lookups for data newer than the last sync
      # or on objects the warehouse does not carry. Same read-only integration
      # user as the sync worker; the client-credentials grant needs the org's
      # My Domain URL.
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      SF_API_VERSION: ${SF_API_VERSION:-v61.0}
      SF_LIVE_ENABLED: ${SF_LIVE_ENABLED:-true}
      # RAG citation links open records in this Lightning org. Without it the
      # code default (techsara's org) silently produces wrong links elsewhere.
      SF_LIGHTNING_BASE_URL: ${SF_LIGHTNING_BASE_URL:-https://techsara.lightning.force.com}
      OPENAI_BASE_URL: http://vllm:30000/v1
      OPENAI_API_KEY: local-no-key
      MAIN_MODEL: Qwen/Qwen3.6-35B-A3B-NVFP4
      DEFAULT_MAX_CONTEXT: "32768"
      # Cheap classification + agent sub-steps run on the small model.
      ROUTER_BASE_URL: http://vllm-router:30002/v1
      ROUTER_MODEL: Qwen/Qwen3-VL-8B-Instruct-FP8
      AGENT_BASE_URL: http://vllm-router:30002/v1
      AGENT_MODEL: Qwen/Qwen3-VL-8B-Instruct-FP8
      # Vision runs on the multimodal main model (same endpoint).
      VISION_BASE_URL: http://vllm:30000/v1
      VISION_MODEL: Qwen/Qwen3.6-35B-A3B-NVFP4
      EMBED_BASE_URL: http://vllm-embed:30003/v1
      EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      # Unlimited-OCR (2026-08-06): document transcripts for images + PDFs.
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_BASE_URL: http://vllm-ocr:30004/v1
      OCR_MODEL: baidu/Unlimited-OCR
      RERANKER_MODEL: Qwen/Qwen3-Reranker-0.6B
      RERANK_ENABLED: "true"
      DUCKDB_PATH: /data/warehouse.duckdb
      LANCEDB_DIR: /data/lancedb
      PARQUET_DIR: /data/parquet
      REPORTS_DIR: /reports
      # App state (users/conversations/messages/uploads/documents/repos).
      # Built from the same three vars the postgres service uses, so there is
      # one place to change the credentials.
      APP_DATABASE_URL: postgresql://${POSTGRES_USER:-techsara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-techsara}
      APP_DB_POOL_MIN: ${APP_DB_POOL_MIN:-2}
      APP_DB_POOL_MAX: ${APP_DB_POOL_MAX:-16}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Phase 1 web search + Phase 6 token budget.
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-100}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-8000}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-5000000}
      MODEL_MAX_CONTEXT: ${MODEL_MAX_CONTEXT:-262144}
      MODEL_MAX_OUTPUT: ${MODEL_MAX_OUTPUT:-8192}
      URL_ANALYSIS_ENABLED: ${URL_ANALYSIS_ENABLED:-true}
      URL_MAX_PAGES: ${URL_MAX_PAGES:-5}
      REPO_ANALYSIS_ENABLED: ${REPO_ANALYSIS_ENABLED:-true}
      REPO_MAX_MB: ${REPO_MAX_MB:-300}
      REPO_MAX_FILES: ${REPO_MAX_FILES:-20000}
      WORKSPACE_TTL_HOURS: ${WORKSPACE_TTL_HOURS:-24}
      WORKSPACE_QUOTA_GB: ${WORKSPACE_QUOTA_GB:-20}
    volumes:
      - data:/data
      - reports:/reports
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # /health answers 200 even when a dependency is degraded, which is what
      # we want here: this asks "is the process serving?", not "is every model
      # up?". Tying it to overall status would flap every time the sync worker
      # holds the DuckDB write lock.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: after a reboot this waits for PostgreSQL before it serves.
      start_period: 4m
    depends_on:
      # PostgreSQL is the ONE hard dependency: the lifespan applies the schema,
      # so a database that is not accepting connections yet should fail the
      # deploy rather than the first request. service_healthy, not started.
      postgres:
        condition: service_healthy
      # The MODELS are deliberately service_started, not service_healthy.
      #
      # Requiring healthy here made `docker compose up -d` abort on a cold
      # start: the four vLLM servers load ~40 GB of weights simultaneously into
      # 121 GB of memory SHARED with the OS, and under that pressure vllm-embed
      # and vllm-ocr get knocked over and restart. Compose treats a restarting
      # dependency as failed — "dependency failed to start: container
      # sf-local-ai-vllm-embed-1 is unhealthy" — and then never starts the
      # orchestrator, frontend or sync worker at all. One slow model took down
      # the entire app layer, including history and the UI, which need no model.
      #
      # It also bought nothing real: after a REBOOT the Docker daemon restarts
      # containers by policy and honours no depends_on whatsoever, so this
      # ordering never applied in the case that matters most.
      #
      # Nothing here calls a model at startup. /health reports each backend
      # separately and answers "degraded" while one is still loading.
      vllm:
        condition: service_started
      vllm-router:
        condition: service_started
      # vllm-vision is intentionally NOT a dependency — it runs under the
      # "vision" profile (see above) and must never gate the app layer.
      vllm-embed:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sync-worker:
    build: ./sync-worker
    environment:
      # AWS Secrets Manager was REMOVED (2026-07-28) — nothing here calls a
      # cloud service. Salesforce credentials come from .env plus the signing
      # key file below.
      # Direct Salesforce JWT credentials (owner override): with the three
      # identity vars plus EITHER key form below, Secrets Manager is skipped.
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_USERNAME: ${SF_USERNAME:-}
      # For the client-credentials grant this MUST be the org's My Domain
      # (https://<org>.my.salesforce.com) — Salesforce refuses that grant
      # on login.salesforce.com.
      SF_LOGIN_URL: ${SF_LOGIN_URL:-}
      # Consumer Secret: simplest auth, no key or certificate needed.
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
      # The JWT signing key. It lives in the data volume (mode 600), NOT in
      # .env — an .env value ends up in `docker inspect`, shell history and
      # screenshots. Override with SF_PRIVATE_KEY_HOST_FILE to mount a key
      # from the host instead.
      SF_PRIVATE_KEY_FILE: ${SF_PRIVATE_KEY_HOST_FILE:+/run/secrets/sf_jwt_key.pem}
      SF_PRIVATE_KEY_B64: ${SF_PRIVATE_KEY_B64:-}
      # Owner request (2026-08-06): retry every 5 minutes after the full
      # migration. The sleep is BETWEEN cycles (a pass itself takes ~3 min),
      # so changes land within ~5-8 minutes. The client warns at 80% of the
      # org's daily API limit if this ever gets too hungry.
      SYNC_INTERVAL_MINUTES: "5"
      # Owner request: anything new in the org joins the warehouse by itself —
      # new FIELDS (SYNC_AUTO_FIELDS, default on) and new OBJECTS: any custom
      # object, plus Task/Event/EmailMessage the moment read access is granted.
      SYNC_AUTO_OBJECTS: "true"
      # Above the org's widest business object (Account: 275 fields) so the
      # full org export syncs whole objects; the default (80) silently
      # truncated Interview__c (264) and Onboarding__c (174).
      SYNC_MAX_FIELDS: "4000"
      EMBED_VIA: http://vllm-embed:30003/v1
      EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      DUCKDB_PATH: /data/warehouse.duckdb
      LANCEDB_DIR: /data/lancedb
      PARQUET_DIR: /data/parquet
    volumes:
      - data:/data
      # The object/field config, read-only and LIVE: without this it is baked
      # into the image, so choosing a new object would need a rebuild rather
      # than a restart.
      - ./sync-worker/config.yaml:/app/config.yaml:ro
      # The Salesforce JWT signing key, read-only. `:-/dev/null` keeps the
      # mount valid (and compose parseable) when no key file is configured —
      # the key then comes from SF_PRIVATE_KEY_B64 or AWS Secrets Manager.
      - ${SF_PRIVATE_KEY_HOST_FILE:-/dev/null}:/run/secrets/sf_jwt_key.pem:ro
    restart: unless-stopped
    depends_on:
      # service_started, for the same reason as the orchestrator: a model still
      # loading must not stop the worker from being created. Each cycle already
      # retries with backoff, and an embedding failure is caught per batch.
      vllm-embed:
        condition: service_started

  # Phase 1: self-hosted metasearch for web search. Internal-only (no host
  # port); only the orchestrator reaches it at http://searxng:8080. Enabling
  # search means queries leave the machine — SEARCH_ENABLED gates that.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-please-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    # Started only when web search is in use. SEARCH_ENABLED=true on its own is
    # NOT enough — the orchestrator would call a searxng that is not running.
    # `.env` sets COMPOSE_PROFILES=search so a plain `docker compose up -d`
    # includes it; drop that variable to leave it out.
    profiles: ["search"]

  frontend:
    build: ./frontend
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8080
      NEXT_PUBLIC_APP_NAME: "TechSara AI"
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      orchestrator:
        # healthy, not started: `service_started` returns the moment the
        # process exists, so on a cold boot the UI came up pointing at an
        # orchestrator that was still waiting for its database.
        condition: service_healthy
