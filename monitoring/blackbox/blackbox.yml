# Blackbox exporter: the ONLY job here is liveness for the three services
# that expose no Prometheus metrics of their own — the orchestrator, the
# frontend and SearXNG. Everything else in this stack is scraped directly.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # These are loopback/bridge targets on the same machine; no proxy, and
      # IPv4 because the published ports are IPv4.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_ssl: false
      fail_if_not_ssl: false
