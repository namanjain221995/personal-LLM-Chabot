# Prometheus for the DGX Spark fleet.
#
# TOPOLOGY LIVES HERE, NOT IN THE EXPORTERS. Every exporter is byte-identical
# on every Spark; the `node`, `role` and `cluster` labels are attached by the
# scrape config. The head is listed below because it is reached through Docker's
# gateway. EVERY OTHER SPARK comes from file_sd targets that scripts/lib/fleet.py
# renders into .runtime/prometheus/: it finds Sparks over mDNS, so a new machine
# joins within a minute with no edit to this file (docs/MONITORING.md, "Adding
# a Spark"). A Spark stays in those files after it dies, so it reads as DOWN
# instead of vanishing.
#
# SCRAPING GOES OVER THE MANAGEMENT LAN (192.168.9.0/22, interface enP7s7) and
# never over 10.100.184.0/24 or 10.100.185.0/24. Those two are the RoCE fabric
# carrying NCCL tensor-parallel traffic between the Sparks; putting monitoring
# on them would measure the thing it perturbs.

global:
  # 5s keeps GPU/vLLM panels genuinely live. Measured cost of one GPU scrape
  # on this hardware: 60 ms (two nvidia-smi calls), so ~1.2% duty cycle.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    cluster: dgx-spark-cluster

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Prometheus itself -------------------------------------------------
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: ["localhost:9090"]
        labels: { node: spark-1, role: head }

  # --- GPU telemetry, one target per physical Spark ----------------------
  # A custom nvidia-smi exporter rather than dcgm-exporter. DCGM does RUN on
  # GB10, but returns no framebuffer memory (N/A at the library level), cannot
  # load its profiling module, and at its default interval reported load that
  # had already finished. docs/MONITORING.md records the comparison. Fields the
  # GB10 driver reports as N/A are absent here rather than exported as zero.
  - job_name: dgx-gpu
    scrape_interval: 5s
    static_configs:
      - targets: ["dgx-gpu-exporter:9835"]
        labels: { node: spark-1, role: head }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/sparks-gpu.json"]
        refresh_interval: 30s
    # Bounds what a machine can cost this Prometheus: over a limit the scrape
    # fails, visibly, instead of growing the head's memory. Only Sparks proven
    # over SSH are targets, but a compromised one should still not reach the model
    # through this. New series per scrape are not bounded by any of these.
    sample_limit: 2000
    body_size_limit: 2MB
    label_limit: 30
    label_name_length_limit: 128
    label_value_length_limit: 512
    target_limit: 64
    follow_redirects: false

  # --- Host telemetry, one target per physical Spark ---------------------
  # On a unified-memory machine these ARE the memory metrics that matter:
  # the GB10 driver reports no framebuffer capacity, so model weights and KV
  # cache show up in the host's own memory counters.
  - job_name: node
    scrape_interval: 10s
    static_configs:
      # Via the host gateway, not a container name: node-exporter runs with
      # host networking (mandatory - its netdev collector is namespace-scoped
      # and would otherwise report the container's eth0 instead of the RoCE
      # links), so it is not on the bridge DNS.
      - targets: ["host.docker.internal:9100"]
        labels: { node: spark-1, role: head }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/sparks-node.json"]
        refresh_interval: 30s
    # This job also carries spark-probe and spark-local (node-exporter's textfile
    # collector), so containers, databases and kernel events arrive here. The
    # limits have the same purpose as on dgx-gpu.
    sample_limit: 20000
    body_size_limit: 16MB
    label_limit: 30
    label_name_length_limit: 128
    label_value_length_limit: 1024
    target_limit: 64
    follow_redirects: false
    metric_relabel_configs:
      # One per core, never plotted, and they cost as much as CPU time itself:
      # 240 series for governors, per-core softnet and scheduler counters, and
      # idle-state detail.
      - source_labels: [__name__]
        regex: "node_cpu_scaling_governor|node_softnet_.*|node_schedstat_.*|node_cpu_guest_seconds_total|node_scrape_collector_duration_seconds"
        action: drop
      # Five series per service per Spark would be about 750 each. Keep the failed
      # state of every service, so a failure is seen by name, and whether the ones
      # this platform depends on are active.
      - source_labels: [__name__, name]
        regex: "node_systemd_unit_state;(docker|containerd|ssh|avahi-daemon|NetworkManager|systemd-timesyncd|chrony|tailscaled|nvidia-.*|dgx-.*|techsara-.*)[.]service"
        target_label: __tmp_named
        replacement: "1"
      - source_labels: [__name__, state]
        regex: "node_systemd_unit_state;(activating|deactivating|inactive)"
        action: drop
      - source_labels: [__name__, state, __tmp_named]
        regex: "node_systemd_unit_state;active;"
        action: drop
      - regex: __tmp_named
        action: labeldrop

  # --- vLLM: ONE endpoint describes the WHOLE distributed engine ---------
  # Spark 2 runs `--headless --node-rank 1` and has no API server at all
  # (verified: connection refused on 8000/8001/8080). The head's EngineCore
  # schedules both TP ranks, so these counters are cluster-wide. They are
  # deliberately NOT labelled per-node — that would be a lie.
  - job_name: vllm-main
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { service: main, role: head, engine_scope: cluster }
    metric_relabel_configs:
      # Prometheus client `_created` gauges are one timestamp per family that
      # never changes — 64 useless series per scrape here.
      - source_labels: [__name__]
        regex: ".*_created$"
        action: drop

  # --- The engine controller: the ONLY source of "is inference working" ----
  # monitoring/engine-controller/controller.py, on the head, host network.
  # It is the thing that runs the real canary completion, watches the worker
  # rank through the sentinel, and drives recovery — so techsara_vllm_state_code
  # is the top-level engine state and every availability alert keys on it
  # (docs/availability/CONTRACT.md §2, §7.1). Same `service`/`role`/
  # `engine_scope` labels as vllm-main because it describes the same one
  # distributed engine, not a node.
  #
  # 5 s because the state must be visible within one canary interval: on
  # 2026-09-11 the engine was wedged for five minutes while /health, /metrics
  # and `up` all said fine (docs/availability/INCIDENT-2026-09-11-vllm.md).
  #
  # THE WORKER SENTINEL (:9839 on Spark 2) IS DELIBERATELY NOT SCRAPED. It
  # binds to the RoCE rail-A address, which is the NCCL fabric this file's
  # header says monitoring must never touch, and the controller already
  # folds everything it reports into the techsara_vllm_worker_* gauges.
  - job_name: engine-controller
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9838"]
        labels: { service: main, role: head, engine_scope: cluster }

  # --- The single-node model services -------------------------------------
  # Scraped over the internal `application` network by SERVICE NAME, not via
  # the host's published ports. Those ports are debug-only and now bind to
  # loopback (they are unauthenticated model APIs and were reachable from the
  # whole office LAN until 2026-09-01); scraping through them would have made
  # monitoring depend on that exposure staying open.
  - job_name: vllm-aux
    scrape_interval: 15s
    static_configs:
      - targets: ["vllm-router:30002"]
        labels: { service: router, node: spark-1, role: head }
      - targets: ["vllm-embed:30003"]
        labels: { service: embed, node: spark-1, role: head }
      - targets: ["vllm-reranker:30005"]
        labels: { service: reranker, node: spark-1, role: head }
    # OCR IS NOT LISTED ABOVE ON PURPOSE. The engine moves between nodes
    # (scripts/ocr.sh runs it on the worker to take 17 GB off the head, and
    # `down` brings it back), so its address comes from a file that
    # scripts/ocr.sh and scripts/monitoring.sh render from the same .env
    # key the orchestrator follows — .runtime/prometheus/ocr.json, mounted
    # at /etc/prometheus/targets. Same job and `service` label, so every
    # panel keyed on them keeps working; the `node`/`role` labels say where
    # it is today. A static target here showed OCR DOWN for an hour on
    # 2026-09-09 while the engine answered from the other node.
    file_sd_configs:
      - files: ["/etc/prometheus/targets/ocr.json"]
        refresh_interval: 30s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: ".*_created$"
        action: drop

  # SPEECH TO TEXT HAS NO SCRAPE JOB, AND THAT IS NOT AN OVERSIGHT.
  #
  # There was a `vllm-asr` job here pointed at 192.168.9.68:30006, from when
  # dictation ran on Qwen3-ASR under vLLM and inherited vLLM's /metrics for
  # free. whisper-large-v3 is served by compose/whisper/server.py, a small
  # FastAPI app that exposes /health, /v1/models and /v1/audio/transcriptions
  # and NOTHING ELSE — there is no /metrics on any port, so a scrape job for
  # it could only ever report a target that is permanently down. A red target
  # that is red by construction trains people to ignore red targets, so the
  # job was removed rather than repointed.
  #
  # What replaces it, and it is enough:
  #   * the ORCHESTRATOR's own /metrics (job techsara-orchestrator below)
  #     carries asr_requests_total, asr_request_duration_seconds,
  #     asr_errors_total, asr_queue_depth, asr_active_requests and
  #     asr_detected_language_total — every request goes through it, so its
  #     view is complete;
  #   * GET /audio/health reports each engine's liveness on demand;
  #   * dgx-gpu-exporter already shows what the speech engine is doing to both
  #     GPUs, which is the number that actually matters (see docs/VOICE.md,
  #     "What it costs the chat model").
  # If the engine ever grows a /metrics endpoint, add the job back here.

  # --- The living knowledge layer ----------------------------------------
  # The orchestrator's own /metrics (app/metrics.py, stdlib-only). Public like
  # /health so the scrape needs no session; it exposes counters and histograms
  # only — every label comes from a closed set, so no query text, URL or user
  # id can reach Prometheus.
  - job_name: orchestrator
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { node: spark-1, role: head, service: orchestrator }

  # --- Databases and data stores -----------------------------------------
  - job_name: postgres
    scrape_interval: 15s
    metric_relabel_configs:
      # 360 pg_settings_* gauges a dashboard has never read. Connection limits
      # stay: alerts divide by them.
      - source_labels: [__name__]
        regex: "pg_settings_(max_connections|superuser_reserved_connections|shared_buffers_bytes)"
        target_label: __tmp_keep
        replacement: "1"
      - source_labels: [__name__, __tmp_keep]
        regex: "pg_settings_.*;"
        action: drop
      - regex: __tmp_keep
        action: labeldrop
    # Not the global 4 s. The database collector runs pg_database_size() over
    # every database on the instance (about 20 test databases share it today),
    # and while nvme0n1 sat at 80-90% utilisation on 2026-09-13 that walk
    # overran 4 s eleven times (max scrape 4.27 s): each overrun is a whole
    # missing scrape, pg_up included. Quiet-disk cost with 24 databases and
    # the custom queries: p95 83 ms (dbperf2 observability, 2026-09-14).
    scrape_timeout: 10s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { node: spark-1, role: head, service: postgres }

  # DuckDB warehouse, both LanceDB indexes, Parquet, reports, workspaces.
  # Walked from disk, so a slower interval - these move on the scale of a
  # sync cycle, not a scrape.
  - job_name: data-stores
    scrape_interval: 30s
    static_configs:
      - targets: ["data-stores-exporter:9836"]
        labels: { node: spark-1, role: head }

  # --- Application liveness ----------------------------------------------
  # The orchestrator, frontend and SearXNG expose no /metrics, so their
  # availability is probed rather than scraped. This is the only thing
  # blackbox is used for.
  - job_name: blackbox-http
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8080/health
        labels: { service: orchestrator, node: spark-1 }
      - targets:
          - http://host.docker.internal:3000/
        labels: { service: frontend, node: spark-1 }
      - targets:
          - http://searxng:8080/healthz
        labels: { service: searxng, node: spark-1 }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_url
      - target_label: __address__
        replacement: blackbox-exporter:9115
