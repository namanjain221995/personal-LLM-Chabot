# Recording rules: the cluster-level aggregates the dashboards read.
#
# These exist so a panel is one cheap series lookup instead of a sum() over
# every node evaluated on every refresh of every open dashboard. Names follow
# the Prometheus convention level:metric:operation.

groups:
  # ------------------------------------------------------------------ GPU
  - name: dgx-gpu
    interval: 5s
    rules:
      # COMBINED ACCELERATOR POWER. This is the sum of what each GB10's
      # driver reports for the GPU/accelerator rail. It is NOT whole-machine
      # AC draw: no wall-socket telemetry exists on this hardware, and the
      # driver reports no power LIMIT either, so there is no headroom figure.
      - record: cluster:gpu_power_watts:sum
        expr: sum(dgx_gpu_power_watts)

      - record: node:gpu_power_watts:sum
        expr: sum by (node) (dgx_gpu_power_watts)

      - record: cluster:gpu_temperature_celsius:max
        expr: max(dgx_gpu_temperature_celsius)

      - record: cluster:gpu_temperature_celsius:avg
        expr: avg(dgx_gpu_temperature_celsius)

      - record: node:gpu_temperature_celsius:max
        expr: max by (node) (dgx_gpu_temperature_celsius)

      - record: cluster:gpu_utilization_percent:avg
        expr: avg(dgx_gpu_utilization_percent)

      - record: node:gpu_utilization_percent:avg
        expr: avg by (node) (dgx_gpu_utilization_percent)

      # Any throttle reason active anywhere, as one number to alert on.
      - record: cluster:gpu_throttle_active:max
        expr: max(dgx_gpu_throttle_active{reason!~"idle|app_clocks_setting|display_clock_setting"})

  # ----------------------------------------------------------------- host
  - name: dgx-host
    interval: 10s
    rules:
      # UNIFIED MEMORY. On GB10 the GPU has no separate framebuffer, so this
      # host figure is the real memory pressure signal for the LLM.
      - record: node:memory_used_bytes:current
        expr: node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes

      - record: node:memory_used_percent:current
        expr: >-
          100 * (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes

      - record: node:cpu_utilization_percent:avg
        expr: >-
          100 * (1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[1m])))

      - record: cluster:cpu_utilization_percent:avg
        expr: avg(node:cpu_utilization_percent:avg)

      # ETHERNET. The LAN / internet path, and deliberately NOT the same thing
      # as the RoCE rules below: RDMA bypasses the network stack, so the
      # InfiniBand counters and these netdev counters measure disjoint traffic.
      # Adding them together would be meaningless.
      #
      # The device filter is the whole correctness story. Summing every device
      # counts container traffic THREE times -- once on the veth, once on the
      # bridge, once on the physical NIC -- and measured here that inflated
      # spark-1 from 19.4 to 67.4 KiB/s, a 3.5x overstatement. Excluded:
      #   lo                  the orchestrator talking to itself
      #   veth* br-* docker*  the container side of traffic already counted
      #   tailscale*          an overlay; its bytes ride out over enP7s7 too
      #   *np[0-9]            the four RoCE fabric NICs, counted by RoCE rules
      # What survives is the real physical egress: enP7s7 and the wifi.
      - record: node:ethernet_receive_bytes_per_second:sum
        expr: >-
          sum by (node) (rate(node_network_receive_bytes_total{device!~"lo|veth.*|br-.*|docker.*|tailscale.*|.*np[0-9]"}[1m]))

      - record: node:ethernet_transmit_bytes_per_second:sum
        expr: >-
          sum by (node) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*|br-.*|docker.*|tailscale.*|.*np[0-9]"}[1m]))

      - record: cluster:ethernet_receive_bytes_per_second:sum
        expr: sum(node:ethernet_receive_bytes_per_second:sum)

      - record: cluster:ethernet_transmit_bytes_per_second:sum
        expr: sum(node:ethernet_transmit_bytes_per_second:sum)

      # ROCE FABRIC. These read the INFINIBAND counters, not netdev, and that
      # distinction is the whole game: RoCE/RDMA traffic bypasses the network
      # stack entirely. Measured during one 300-token generation, the IB
      # counters moved 335 MB and 76 MB while netdev on the very same
      # interfaces moved 170 kB and EXACTLY ZERO. A netdev-based interconnect
      # panel would have read flat-zero forever and looked like a dead fabric.
      #
      # Only the two ACTIVE ports are matched: rocep1s0f0 and roceP2p1s0f0 are
      # DOWN on both nodes and would drag any average to zero.
      #   rocep1s0f1   -> enp1s0f1np1   -> 10.100.184.x -> NCCL NET/IB/0
      #   roceP2p1s0f1 -> enP2p1s0f1np1 -> 10.100.185.x -> NCCL NET/IB/1
      - record: node:roce_receive_bytes_per_second:sum
        expr: >-
          sum by (node) (rate(node_infiniband_port_data_received_bytes_total{device=~"rocep1s0f1|roceP2p1s0f1"}[1m]))

      - record: node:roce_transmit_bytes_per_second:sum
        expr: >-
          sum by (node) (rate(node_infiniband_port_data_transmitted_bytes_total{device=~"rocep1s0f1|roceP2p1s0f1"}[1m]))

      # Per rail, because the split is NOT even: one measured generation was
      # 81.5% rail 1 / 18.5% rail 2, so a sum would hide a dead rail.
      - record: node:roce_receive_bytes_per_second:rail
        expr: >-
          sum by (node, device) (rate(node_infiniband_port_data_received_bytes_total{device=~"rocep1s0f1|roceP2p1s0f1"}[1m]))

      - record: node:roce_transmit_bytes_per_second:rail
        expr: >-
          sum by (node, device) (rate(node_infiniband_port_data_transmitted_bytes_total{device=~"rocep1s0f1|roceP2p1s0f1"}[1m]))

      - record: cluster:roce_receive_bytes_per_second:sum
        expr: sum(node:roce_receive_bytes_per_second:sum)

      - record: cluster:roce_transmit_bytes_per_second:sum
        expr: sum(node:roce_transmit_bytes_per_second:sum)

      # Every standard IB error counter reads zero on a healthy fabric here,
      # so any non-zero rate is worth an alert.
      - record: node:roce_errors_per_second:sum
        expr: >-
          sum by (node) (
            rate(node_infiniband_port_errors_received_total{device=~"rocep1s0f1|roceP2p1s0f1"}[5m])
            + rate(node_infiniband_port_discards_transmitted_total{device=~"rocep1s0f1|roceP2p1s0f1"}[5m])
            + rate(node_infiniband_link_downed_total{device=~"rocep1s0f1|roceP2p1s0f1"}[5m])
          )

  # ----------------------------------------------------------------- vLLM
  # NO `by (node)` ANYWHERE IN THIS GROUP. The head's EngineCore schedules
  # both tensor-parallel ranks, so every counter below already describes the
  # whole distributed engine. Splitting it per node would invent a
  # distinction the metric does not have.
  - name: vllm
    interval: 5s
    rules:
      - record: cluster:vllm_generation_tokens_per_second:rate1m
        expr: sum(rate(vllm:generation_tokens_total{service="main"}[1m]))

      - record: cluster:vllm_prompt_tokens_per_second:rate1m
        expr: sum(rate(vllm:prompt_tokens_total{service="main"}[1m]))

      - record: cluster:vllm_tokens_per_second:rate1m
        expr: >-
          cluster:vllm_generation_tokens_per_second:rate1m
          + cluster:vllm_prompt_tokens_per_second:rate1m

      - record: cluster:vllm_requests_running:current
        expr: sum(vllm:num_requests_running{service="main"})

      - record: cluster:vllm_requests_waiting:current
        expr: sum(vllm:num_requests_waiting{service="main"})

      - record: cluster:vllm_requests_per_second:rate5m
        expr: sum(rate(vllm:request_success_total{service="main"}[5m]))

      - record: cluster:vllm_kv_cache_usage_percent:current
        # vLLM reports this as a 0..1 fraction; ×100 once, here, so no panel
        # has to remember to do it.
        expr: max(vllm:kv_cache_usage_perc{service="main"}) * 100

      - record: cluster:vllm_prefix_cache_hit_ratio:rate5m
        expr: >-
          sum(rate(vllm:prefix_cache_hits_total{service="main"}[5m]))
          / clamp_min(sum(rate(vllm:prefix_cache_queries_total{service="main"}[5m])), 1)

  # --------------------------------------------------------- availability
  # The engine's top-level state (docs/availability/CONTRACT.md §2, §7.3 —
  # v2, strict one-model mode: only the main model answers a person, and
  # while it is not READY their requests are durably QUEUED, never answered
  # by anything else).
  #
  # ABSENCE IS A STATE OF ITS OWN HERE. None of these rules ends in
  # `or vector(0)`: when the controller is not being scraped the rule produces
  # NO sample, Grafana renders its `noValue` text (MONITORING_UNKNOWN) and
  # VllmMonitoringUnknown fires on absent_over_time(). Filling the gap with a
  # zero would turn "we cannot see" into "READY"/"DOWN"-shaped numbers, which
  # is exactly the lie up{job="vllm-main"}==1 told for five minutes on
  # 2026-09-11 while the engine was wedged.
  #
  # A STALE VERDICT IS ABSENCE TOO (v2). The controller stamps every snapshot
  # with techsara_vllm_generated_at_seconds. Its tick is 5 s, the scrape 5 s
  # and this group 5 s, so a fresh verdict is never more than ~15 s old; one
  # that is > 30 s old means the tick stopped (an exception before publish, a
  # blocked observe) while the HTTP thread keeps serving the LAST snapshot
  # with fresh scrape timestamps — the same "process alive, answers stale"
  # blind spot the programme exists to remove, one level up. The derived
  # state and the state name drop their sample in that case (the three age
  # rules deliberately do not — a frozen snapshot is exactly when an age
  # must keep climbing), and a controller that exports no stamp at all is
  # treated the same way: an unproven verdict is MONITORING_UNKNOWN (§2:
  # "inference status unproven"), never READY.
  #
  # Named differently from the alert group of the same purpose in alerts.yml
  # (`vllm-availability`) on purpose: promtool orders groups by NAME when a
  # test pins group_eval_order, and two groups with one name evaluate in an
  # unstable order.
  - name: vllm-state
    interval: 5s
    rules:
      # How long since Prometheus last got a sample of the main engine's
      # token counter. Not the same thing as "tokens are moving" — a wedged
      # engine keeps serving a FROZEN counter with a fresh timestamp (signal
      # 12 lives in the controller for that reason). Note what this can and
      # cannot see: a scrape that fails or a family that disappears writes a
      # staleness marker, so this series goes ABSENT rather than growing
      # (VllmScrapeTargetDown owns that); it only climbs when Prometheus
      # itself stops ingesting. The dashboard tile and VllmMetricsStale's
      # `prometheus_age` branch read it with that in mind.
      - record: cluster:vllm_metrics_age_seconds
        expr: time() - max(timestamp(vllm:generation_tokens_total{service="main"}))
        labels: { service: main }

      # THE DERIVED TOP-LEVEL STATE, one number for the whole platform (§7.3):
      #   7 (QUEUEING) when the controller's state is not READY/BUSY/DOWN
      #                and the orchestrator holds ≥ 1 accepted generation
      #                durably queued for the main model
      #   otherwise    the controller's own code. DOWN stays 8 with a queue:
      #                nobody is being answered and nobody will be until an
      #                operator acts, which is a page, not a wait
      #   no sample    when the controller's verdict is stale (> 30 s) or
      #                carries no freshness stamp (see the group comment)
      #
      # Written as a chain of `and`/`or` over selectively matched series so
      # that presence is preserved exactly:
      #   * controller absent            -> no sample at all (never 0)
      #   * orchestrator absent          -> the controller code passes through
      #     (`or on()` keeps the right-hand side only when the left is empty)
      # clamp(x, 7, 7) is "the constant 7, but only where x exists" — the
      # `and`/`unless` filters decide WHEN, the clamp decides WHAT.
      #
      # Everything is max()'d because each input is a single series by
      # construction (one controller, one orchestrator) and the join must not
      # care about instance/job labels; `service="main"` is put back below.
      # Proven by monitoring/prometheus/tests/recording_availability.yml.
      - record: cluster:vllm_service_state:code
        expr: >-
          (
            (
              clamp(max(techsara_vllm_state_code), 7, 7)
                and on() (max(techsara_vllm_state_code) < 2 or max(techsara_vllm_state_code) > 3)
                and on() (max(llm_queued_generations) > 0)
                unless on() (max(techsara_vllm_state_code) == 8)
            )
            or on()
            max(techsara_vllm_state_code)
          )
          and on() ((time() - max(techsara_vllm_generated_at_seconds)) <= 30)
        labels: { service: main }

      # Seconds since the last REAL completion the controller saw succeed.
      # The only "is it alive" number that cannot be faked by a process that
      # is merely running; the overview's tile, and VllmReadyUnproven's
      # evidence that a READY verdict is a lie. The controller exports 0
      # until its first success after a start, and 0 is "none yet", not
      # 1970 — so the `> 0` keeps that as an absent series (the tile reads
      # `no data`) instead of a 56-year age. Deliberately NOT gated on
      # freshness: a frozen controller snapshot is exactly when this number
      # must keep climbing.
      - record: cluster:vllm_last_success_age_seconds
        expr: time() - (max(techsara_vllm_last_success_timestamp_seconds) > 0)
        labels: { service: main }

      # Duration of the CURRENT incident. The controller exports 0 when there
      # is none, so the `> 0` filter makes "no incident" an absent series
      # rather than a 1.7-billion-second one; Grafana shows `none`.
      - record: cluster:vllm_incident_duration_seconds
        expr: >-
          time() - (max(techsara_vllm_incident_start_timestamp_seconds) > 0)
        labels: { service: main }

      # THE STATE NAME AS A LABEL: one series, value 1, whose `state` label
      # is the controller's current state name — for `scripts/monitoring.sh
      # verify`, ad-hoc queries and anyone who wants the name without decoding
      # the number. The name is the controller's one-hot while the verdict is
      # fresh; if the one-hot is missing or the verdict is stale it is
      # MONITORING_UNKNOWN (the contract's own name for "cannot vouch",
      # never a value outside the nine of §2); with no controller at all it
      # is absent.
      #
      # NO ALERT JOINS ON THIS SERIES, and none may: a `* on() group_left(state)`
      # join makes the live name part of the alert's IDENTITY, so every
      # READY<->BUSY flip (81 in six hours, measured) resets `for:` and a
      # critical alert never reaches firing; and after a Prometheus restart
      # two recorded names can coexist for the 5-minute lookback and turn the
      # join into a many-to-many error. Alerts carry the FIXED state they
      # speak for as a label and the live name as the `state_now` annotation
      # (read straight from the one-hot, which has no restart artefact).
      # Not part of CONTRACT §7.3 — a helper owned by the monitoring workstream.
      - record: cluster:vllm_state_name:current
        expr: >-
          (
            (techsara_vllm_state == 1)
              and on() ((time() - max(techsara_vllm_generated_at_seconds)) <= 30)
          )
          or on()
          label_replace(clamp(techsara_vllm_state_code, 1, 1), "state", "MONITORING_UNKNOWN", "", "")
