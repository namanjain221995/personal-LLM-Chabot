      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '4x60'
      - series: 'techsara_vllm_state{state="READY",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_state{state="DEGRADED",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
    alert_rule_test:
