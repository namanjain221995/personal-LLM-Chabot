      - series: 'techsara_vllm_state{state="DOWN",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x24 stale'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: VllmWorkerRankAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: DOWN
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM worker rank (Spark 2) is absent and no recovery is running"
              description: >-
