# promtool unit tests for the vllm-availability alert group, the renamed
# VllmScrapeTargetDown, VllmQueueBacklog and PrometheusRuleEvaluationFailing
# (docs/availability/CONTRACT.md §7.4 v2, monitoring/prometheus/rules/alerts.yml).
# Run the same way as recording_availability.yml (see its header — list the
# two test files explicitly).
#
# promtool compares labels AND every annotation of each expected alert, so
# these tests also prove the annotation templates render ($value, $labels,
# and the `state_now` / `queued` templates that run a query) and pin their
# wording. `alertname` is added by promtool and not listed.
#
# Time starts at Unix 0; `time()` in a rule is the eval_time in seconds, so a
# since-stamp of 0 means "in this state since the start of the test", and a
# fresh controller stamp is the series '0+5xN' (see the recording tests).
#
# Label sets are the real ones (prometheus.yml job labels) so the
# `and on()` / `unless on()` gates run against what production will scrape.
#
# WHAT THE STATE-CHURN CASES PROVE. The v1 rules joined the controller's
# live state name into five alerts' labels; every state change mid-incident
# reset `for:` and the review reproduced VllmGenerationFrozen never firing
# on the 2026-09-11 progression. Each of those alerts now has a case where
# the state flips while the alert is pending and firing, and the alert must
# fire on schedule regardless.
#
# WHAT THE STALE-MARKER CASES PROVE. A firing critical alert must clear when
# the controller disappears (a scrape failure writes staleness markers), not
# linger for the 5-minute lookback — so no rule may wrap a controller gauge
# in last_over_time() or `or vector()`.

rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 5s

# Recording groups first, then the alert groups that read their output, so an
# alert always sees the sample recorded at the SAME timestamp. Without this
# promtool's tie-break between groups is unstable and an alert can read the
# previous evaluation's value (5 s older).
group_eval_order:
  - dgx-gpu
  - dgx-host
  - vllm
  - vllm-state
  - availability
  - vllm-health
  - vllm-availability
  - monitoring-self

# ---------------------------------------------------------------------------
# Shorthand for the label sets (YAML anchors are not allowed inside `series:`
# strings, so they are spelled out; keep them identical to prometheus.yml.)
#   controller:   instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"
#   vllm-main:    instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"
#   orchestrator: instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"
#   prometheus:   instance="localhost:9090",job="prometheus",node="spark-1",role="head"

tests:
  # ================================================ VllmMonitoringUnknown
  - interval: 5s
    name: "MonitoringUnknown fires when the controller series is absent, labelled with what is missing"
    input_series:
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: main
              state: MONITORING_UNKNOWN
              missing: controller_state
            exp_annotations:
              summary: "vLLM engine state cannot be observed (controller_state)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "controller_state: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"

  - interval: 5s
    name: "MonitoringUnknown fires on a missing vllm-main scrape job, labelled vllm_scrape_target"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '2x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: main
              state: MONITORING_UNKNOWN
              missing: vllm_scrape_target
              job: vllm-main
            exp_annotations:
              summary: "vLLM engine state cannot be observed (vllm_scrape_target)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "vllm_scrape_target: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"

  - interval: 5s
    name: "MonitoringUnknown does NOT fire when the controller reports DOWN with a fresh stamp — that is observed, not unknown"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x60'
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 4m
        alertname: VllmMonitoringUnknown
        exp_alerts: []

  - interval: 5s
    name: "MonitoringUnknown clears once the controller is scraped again"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '_x40 2x30'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '_x40 200+5x30'
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '1x70'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels: { severity: warning, service: main, state: MONITORING_UNKNOWN, missing: controller_state }
            exp_annotations:
              summary: "vLLM engine state cannot be observed (controller_state)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "controller_state: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"
      - eval_time: 5m
        alertname: VllmMonitoringUnknown
        exp_alerts: []

  # The controller is present and says it cannot observe (state 0) — the
  # v1 rules had no branch for this and the tile sat grey with an empty
  # alert list. Six minutes of 0 with a fresh stamp and the scrape target up.
  - interval: 5s
    name: "MonitoringUnknown fires when the controller itself reports MONITORING_UNKNOWN (code 0)"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x72'
      - series: 'techsara_vllm_state{state="MONITORING_UNKNOWN",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x72'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x72'
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '1x72'
      - series: 'llm_queued_generations{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0x72'
    alert_rule_test:
      - eval_time: 30s
        alertname: VllmMonitoringUnknown
        exp_alerts: []
      - eval_time: 6m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: main
              state: MONITORING_UNKNOWN
              missing: controller_observation
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM engine state cannot be observed (controller_observation)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "controller_observation: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"
      # ...and the derived state is 0 (the tile says MONITORING_UNKNOWN), and
      # nothing else in the group mistakes it for DOWN.
      - eval_time: 6m
        alertname: VllmPrimaryDown
        exp_alerts: []

  # The frozen-snapshot case: the controller's HTTP thread keeps serving a
  # READY snapshot whose stamp stopped at t=60. From t=90 the verdict is
  # stale; the alert fires a minute later, and the derived state has no
  # sample so the tile is grey at the same moment.
  - interval: 5s
    name: "MonitoringUnknown fires on a stale controller stamp (controller_stale), carrying the age"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '2x60'
      - series: 'techsara_vllm_state{state="READY",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x12 60x48'
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 1m20s
        alertname: VllmMonitoringUnknown
        exp_alerts: []
      - eval_time: 3m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: main
              state: MONITORING_UNKNOWN
              missing: controller_stale
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM engine state cannot be observed (controller_stale)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: READY
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "controller_stale: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"

  - interval: 5s
    name: "MonitoringUnknown fires when the controller exports no freshness stamp (controller_stamp)"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '2x60'
      - series: 'up{instance="host.docker.internal:8000",job="vllm-main",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmMonitoringUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: main
              state: MONITORING_UNKNOWN
              missing: controller_stamp
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM engine state cannot be observed (controller_stamp)"
              description: >-
                Inference may be fine. Nothing on this page can vouch for the
                engine either way, so the overview shows MONITORING_UNKNOWN
                rather than guessing. controller_state / vllm_scrape_target: a
                scrape is missing. controller_observation: the controller
                itself cannot see the engine. controller_stale: the controller's
                snapshot is frozen (its tick stopped; the state it still serves
                is the last one it computed). controller_stamp: the controller
                exports no freshness stamp. Fix the telemetry, then read the
                state — and do not restart anything on the strength of this.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the absence branches add their 2m absent_over_time window"
              reason: "controller_stamp: no samples for 2m (controller_state, vllm_scrape_target), state code 0 (controller_observation), snapshot stamp > 30s old (controller_stale), or no stamp exported (controller_stamp)"
              runbook: docs/availability/RUNBOOK.md#monitoring-unknown
              safe_command: "curl -s http://127.0.0.1:9838/healthz; curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.reason'; docker ps --filter name=engine-controller; curl -s http://127.0.0.1:9090/api/v1/targets | jq '.data.activeTargets[] | select(.labels.job==\"engine-controller\" or .labels.job==\"vllm-main\") | {job:.labels.job,health,lastError}'"

  # ==================================================== VllmEngineWedged
  - interval: 5s
    name: "EngineWedged fires after 30s of state 5, carrying the time in state"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '5x60'
      - series: 'techsara_vllm_state{state="WEDGED",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_state_since_timestamp_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
    alert_rule_test:
      # 20s in: pending, not firing.
      - eval_time: 20s
        alertname: VllmEngineWedged
        exp_alerts: []
      - eval_time: 45s
        alertname: VllmEngineWedged
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: WEDGED
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM engine WEDGED for 45s — requests in flight, no tokens moving"
              description: >-
                The head still answers /health, /v1/models and /metrics, but the
                engine is not completing anything. Every in-flight request will
                fail when vLLM's own 300 s execute timeout fires. The controller
                is about to run a coordinated recovery (or already is — check
                .recovery in /state); do not restart containers by hand while it
                holds the lock. New requests are being queued by the orchestrator
                and resume on the same generation when READY returns.
              state_now: WEDGED
              since: "45s in WEDGED (controller since-stamp); confirmed ≥ 30s before this fired"
              reason: "controller state WEDGED: token counters frozen with requests running, or the canary outstanding ≥ 60s while /health answers 200"
              runbook: docs/availability/RUNBOOK.md#wedged
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.reason,.incident,.signals.engine,.recovery'"

  - interval: 5s
    name: "EngineWedged does not fire for READY, and stops when the controller moves on to RECOVERING"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '2x12 5x12 6x24'
      - series: 'techsara_vllm_state_since_timestamp_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x12 60x12 120x24'
    alert_rule_test:
      - eval_time: 55s
        alertname: VllmEngineWedged
        exp_alerts: []
      - eval_time: 2m30s
        alertname: VllmEngineWedged
        exp_alerts: []

  # Stale-marker case (CONTRACT §10): firing at 1m45s, gone at 3m once the
  # controller's series carry staleness markers — nothing lingers for the
  # 5-minute lookback.
  - interval: 5s
    name: "EngineWedged clears when the controller goes stale"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '5x24 stale'
      - series: 'techsara_vllm_state{state="WEDGED",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x24 stale'
      - series: 'techsara_vllm_state_since_timestamp_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x24 stale'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: VllmEngineWedged
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: WEDGED
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM engine WEDGED for 1m 45s — requests in flight, no tokens moving"
              description: >-
                The head still answers /health, /v1/models and /metrics, but the
                engine is not completing anything. Every in-flight request will
                fail when vLLM's own 300 s execute timeout fires. The controller
                is about to run a coordinated recovery (or already is — check
                .recovery in /state); do not restart containers by hand while it
                holds the lock. New requests are being queued by the orchestrator
                and resume on the same generation when READY returns.
              state_now: WEDGED
              since: "1m 45s in WEDGED (controller since-stamp); confirmed ≥ 30s before this fired"
              reason: "controller state WEDGED: token counters frozen with requests running, or the canary outstanding ≥ 60s while /health answers 200"
              runbook: docs/availability/RUNBOOK.md#wedged
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.reason,.incident,.signals.engine,.recovery'"
      - eval_time: 3m
        alertname: VllmEngineWedged
        exp_alerts: []

  # ====================================================== VllmPrimaryDown
  - interval: 5s
    name: "PrimaryDown fires when DOWN with a fresh verdict and an empty queue"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x60'
      - series: 'techsara_vllm_state{state="DOWN",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x60'
      - series: 'llm_queued_generations{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmPrimaryDown
        exp_alerts:
          - exp_labels: { severity: critical, service: main, state: DOWN }
            exp_annotations:
              summary: "Primary model DOWN — nothing answers users; queued requests are held"
              description: >-
                The main model is not serving and the controller has stopped
                restarting it: the recovery budget is exhausted
                (VllmRecoveryBudgetExhausted will be firing too) or the last
                recovery failed. There is no fallback model. Requests people
                send are accepted and queued (`queued` below) and resume on
                their own generation once READY returns; until an operator acts
                nobody gets an answer.
              state_now: DOWN
              queued: "0"
              since: "≥ 1m before this fired (the alert's for:); the controller's DOWN transition is techsara_vllm_state_since_timestamp_seconds"
              reason: "controller state DOWN (fresh verdict); the failure category is on the overview's Reason tile and in /state .incident.category"
              runbook: docs/availability/RUNBOOK.md#primary-down
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.reason,.incident,.recovery'; curl -s http://127.0.0.1:8080/metrics | grep -E '^llm_queued_generations'"

  # DOWN with people waiting is still DOWN (the derived state never turns 8
  # into 7); the queue is the head-count in the annotation.
  - interval: 5s
    name: "PrimaryDown fires when DOWN with queued requests, and carries the count"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x60'
      - series: 'techsara_vllm_state{state="DOWN",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x60'
      - series: 'llm_queued_generations{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmPrimaryDown
        exp_alerts:
          - exp_labels: { severity: critical, service: main, state: DOWN }
            exp_annotations:
              summary: "Primary model DOWN — nothing answers users; queued requests are held"
              description: >-
                The main model is not serving and the controller has stopped
                restarting it: the recovery budget is exhausted
                (VllmRecoveryBudgetExhausted will be firing too) or the last
                recovery failed. There is no fallback model. Requests people
                send are accepted and queued (`queued` below) and resume on
                their own generation once READY returns; until an operator acts
                nobody gets an answer.
              state_now: DOWN
              queued: "4"
              since: "≥ 1m before this fired (the alert's for:); the controller's DOWN transition is techsara_vllm_state_since_timestamp_seconds"
              reason: "controller state DOWN (fresh verdict); the failure category is on the overview's Reason tile and in /state .incident.category"
              runbook: docs/availability/RUNBOOK.md#primary-down
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.reason,.incident,.recovery'; curl -s http://127.0.0.1:8080/metrics | grep -E '^llm_queued_generations'"

  - interval: 5s
    name: "PrimaryDown fires when DOWN and the orchestrator is not scraped at all (queued: unknown)"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmPrimaryDown
        exp_alerts:
          - exp_labels: { severity: critical, service: main, state: DOWN }
            exp_annotations:
              summary: "Primary model DOWN — nothing answers users; queued requests are held"
              description: >-
                The main model is not serving and the controller has stopped
                restarting it: the recovery budget is exhausted
                (VllmRecoveryBudgetExhausted will be firing too) or the last
                recovery failed. There is no fallback model. Requests people
                send are accepted and queued (`queued` below) and resume on
                their own generation once READY returns; until an operator acts
                nobody gets an answer.
              state_now: MONITORING_UNKNOWN
              queued: unknown
              since: "≥ 1m before this fired (the alert's for:); the controller's DOWN transition is techsara_vllm_state_since_timestamp_seconds"
              reason: "controller state DOWN (fresh verdict); the failure category is on the overview's Reason tile and in /state .incident.category"
              runbook: docs/availability/RUNBOOK.md#primary-down
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.reason,.incident,.recovery'; curl -s http://127.0.0.1:8080/metrics | grep -E '^llm_queued_generations'"

  - interval: 5s
    name: "PrimaryDown does not fire with no controller (absence is MonitoringUnknown's)"
    input_series:
      - series: 'llm_queued_generations{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmPrimaryDown
        exp_alerts: []

  # A DOWN whose stamp froze is not a DOWN we can vouch for: the derived
  # state drops out and MonitoringUnknown (controller_stale) carries it.
  - interval: 5s
    name: "PrimaryDown does not fire on a stale DOWN verdict"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x60'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: VllmPrimaryDown
        exp_alerts: []

  # ===================================================== VllmReadyUnproven
  # The controller says READY with a fresh stamp but its last real success
  # was at t=30 and nothing since: the canary thread is dead. Age exceeds
  # 120 from t=155, for: 1m -> firing from 3m35s; a success at t=240 clears it.
  - interval: 5s
    name: "ReadyUnproven fires when READY is claimed with no success for over 2m, and clears on the next success"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '2x72'
      - series: 'techsara_vllm_state{state="READY",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x72'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x72'
      - series: 'techsara_vllm_last_success_timestamp_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '30x48 240x24'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmReadyUnproven
        exp_alerts: []
      - eval_time: 3m45s
        alertname: VllmReadyUnproven
        exp_alerts:
          - exp_labels: { severity: critical, service: main, state: MONITORING_UNKNOWN }
            exp_annotations:
              summary: "Controller claims READY but has proven nothing for 3m 15s — treat the state as unknown"
              description: >-
                No real completion has succeeded on the primary for over two
                minutes while the controller reports READY/BUSY. The canary is
                stuck, dead, or its result is not reaching the state machine.
                Do not trust the engine tile until a completion succeeds; run
                a real probe, and read the controller's log before its state.
              state_now: READY
              since: "last success 3m 15s ago; ≥ 1m before this fired (the alert's for:)"
              reason: "cluster:vllm_last_success_age_seconds > 120 while techsara_vllm_state_code is 2 or 3"
              runbook: docs/availability/RUNBOOK.md#ready-unproven
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.state,.generated_at,.signals.canary'; docker logs --tail 50 sf-local-ai-engine-controller-1; scripts/cluster-verify-engine.sh --probe"
      - eval_time: 4m30s
        alertname: VllmReadyUnproven
        exp_alerts: []

  - interval: 5s
    name: "ReadyUnproven is silent while the controller is honest (DEGRADED with an old success)"
    input_series:
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '4x72'
      - series: 'techsara_vllm_generated_at_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0+5x72'
      - series: 'techsara_vllm_last_success_timestamp_seconds{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '30x72'
    alert_rule_test:
      - eval_time: 5m
        alertname: VllmReadyUnproven
        exp_alerts: []

  # ========================================= VllmRecoveryBudgetExhausted
  - interval: 5s
    name: "RecoveryBudgetExhausted fires on the category while DOWN, and clears when the engine comes back by itself"
    input_series:
      - series: 'techsara_vllm_last_failure_category{category="budget_exhausted",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_last_failure_category{category="none",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '8x30 2x30'
      - series: 'techsara_vllm_state{state="DOWN",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x30 0x30'
      - series: 'techsara_vllm_state{state="READY",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x30 1x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: VllmRecoveryBudgetExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: DOWN
              category: budget_exhausted
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM recovery budget exhausted — automatic restarts stopped"
              description: >-
                Something is failing faster than a restart fixes it. Evidence for
                every attempt is under .runtime/incidents/<id>/. A human decides
                whether to restart again; the controller will not. Queued
                requests stay queued until it does.
              state_now: DOWN
              since: "≥ 15s before this fired; the budget window is .recovery.window_s in /state"
              reason: "failure category budget_exhausted: RECOVERY_BUDGET recoveries started inside RECOVERY_WINDOW_S and the engine is still DOWN"
              runbook: docs/availability/RUNBOOK.md#recovery-budget-exhausted
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.recovery'; ls -t .runtime/incidents | head -3"
      - eval_time: 3m
        alertname: VllmRecoveryBudgetExhausted
        exp_alerts: []

  # ================================================ VllmWorkerRankAbsent
  - interval: 5s
    name: "WorkerRankAbsent fires after 1m with the sentinel reachable and the engine not restarting; the live name is an annotation"
    input_series:
      - series: 'techsara_vllm_worker_rank_alive{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
      - series: 'techsara_vllm_worker_reachable{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '4x60'
      - series: 'techsara_vllm_state{state="DEGRADED",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_state{state="READY",instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmWorkerRankAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: DOWN
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM worker rank (Spark 2) is absent and no recovery is running"
              description: >-
                The sentinel reports no VLLM::Worker_TP1 process in the worker
                container and no recovery is in progress. The head will hang on
                its next collective. If the controller has budget it acts within
                one observation; if this persists, the budget is gone.
              state_now: DEGRADED
              since: "≥ 1m before this fired (the alert's for:); the sentinel's own record is .signals.worker.last_fault in /state"
              reason: "worker rank process not alive per the sentinel, sentinel reachable, controller not in STARTING/RECOVERING"
              runbook: docs/availability/RUNBOOK.md#worker-rank-absent
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.signals.worker,.recovery'"

  - interval: 5s
    name: "WorkerRankAbsent is silent during RECOVERING, and when the sentinel is unreachable"
    input_series:
      - series: 'techsara_vllm_worker_rank_alive{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
      # first two minutes: recovering (reachable); last three: sentinel gone
      - series: 'techsara_vllm_worker_reachable{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x24 0x36'
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '6x24 4x36'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmWorkerRankAbsent
        exp_alerts: []
      - eval_time: 4m30s
        alertname: VllmWorkerRankAbsent
        exp_alerts: []

  # State churn: the controller walks READY -> DEGRADED -> DOWN -> DEGRADED
  # every 20 s while the rank stays dead. With the v1 join every hop was a
  # new alert instance and `for:` never completed; now the label set is
  # fixed and the alert fires at for + one evaluation.
  - interval: 5s
    name: "WorkerRankAbsent fires on schedule while the controller state churns"
    input_series:
