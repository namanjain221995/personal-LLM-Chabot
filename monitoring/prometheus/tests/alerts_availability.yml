              since: "≥ 1m before this fired (the alert's for:); the sentinel's own record is .signals.worker.last_fault in /state"
              reason: "worker rank process not alive per the sentinel, sentinel reachable, controller not in STARTING/RECOVERING"
              runbook: docs/availability/RUNBOOK.md#worker-rank-absent
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.signals.worker,.recovery'"

  - interval: 5s
    name: "WorkerRankAbsent still fires when the controller exports the code but not the one-hot (state_now MONITORING_UNKNOWN)"
    input_series:
      - series: 'techsara_vllm_worker_rank_alive{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x60'
      - series: 'techsara_vllm_worker_reachable{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x60'
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '4x60'
    alert_rule_test:
      - eval_time: 2m
        alertname: VllmWorkerRankAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              service: main
              state: DOWN
              instance: host.docker.internal:9838
              job: engine-controller
              role: head
              engine_scope: cluster
            exp_annotations:
              summary: "vLLM worker rank (Spark 2) is absent and no recovery is running"
              description: >-
                The sentinel reports no VLLM::Worker_TP1 process in the worker
                container and no recovery is in progress. The head will hang on
                its next collective. If the controller has budget it acts within
                one observation; if this persists, the budget is gone.
              state_now: MONITORING_UNKNOWN
              since: "≥ 1m before this fired (the alert's for:); the sentinel's own record is .signals.worker.last_fault in /state"
              reason: "worker rank process not alive per the sentinel, sentinel reachable, controller not in STARTING/RECOVERING"
              runbook: docs/availability/RUNBOOK.md#worker-rank-absent
              safe_command: "curl -s http://127.0.0.1:9838/state | jq '.signals.worker,.recovery'"

  # Stale-marker case: firing at 1m45s, gone at 3m.
  - interval: 5s
    name: "WorkerRankAbsent clears when the controller goes stale"
    input_series:
      - series: 'techsara_vllm_worker_rank_alive{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '0x24 stale'
      - series: 'techsara_vllm_worker_reachable{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
        values: '1x24 stale'
      - series: 'techsara_vllm_state_code{instance="host.docker.internal:9838",job="engine-controller",service="main",role="head",engine_scope="cluster"}'
