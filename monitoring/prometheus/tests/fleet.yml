# promtool unit tests for monitoring/prometheus/rules/fleet.yml. Every alert has
# a case that fires; the ones that could plausibly fire on normal behaviour also
# have one that must not.
#
#   IMG=$(grep -o 'prom/prometheus@sha256:[0-9a-f]*' compose/compose.monitoring.yaml | head -1)
#   docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool "$IMG" \
#     test rules /p/tests/fleet.yml

rule_files:
  - ../rules/fleet.yml

evaluation_interval: 1m

group_eval_order:
  - fleet-recording

tests:
  # ==================================================== recording rules
  - interval: 1m
    name: "fleet health is 0 when nothing fires"
    input_series:
      - series: 'node_load1{instance="192.168.9.68:9100",job="node",node="spark-2",role="worker"}'
        values: '1x10'
    promql_expr_test:
      - expr: fleet:health:code
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:health:code'
            value: 0

  - interval: 1m
    name: "an info alert does not change fleet health"
    input_series:
      - series: 'ALERTS{alertname="SparkRebooted",alertstate="firing",severity="info"}'
        values: '1x10'
    promql_expr_test:
      - expr: fleet:health:code
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:health:code'
            value: 0

  - interval: 1m
    name: "a warning makes fleet health 1, a critical makes it 2"
    input_series:
      - series: 'ALERTS{alertname="NodeSwapNearlyExhausted",alertstate="firing",severity="warning"}'
        values: '1x20'
      - series: 'ALERTS{alertname="GpuXidError",alertstate="firing",severity="critical"}'
        values: '_x10 1x10'
    promql_expr_test:
      - expr: fleet:health:code
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:health:code'
            value: 1
      - expr: fleet:health:code
        eval_time: 15m
        exp_samples:
          - labels: 'fleet:health:code'
            value: 2

  - interval: 1m
    name: "a pending alert does not change fleet health"
    input_series:
      - series: 'ALERTS{alertname="GpuXidError",alertstate="pending",severity="critical"}'
        values: '1x10'
    promql_expr_test:
      - expr: fleet:health:code
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:health:code'
            value: 0

  - interval: 1m
    name: "fleet counts follow however many Sparks exist"
    input_series:
      - series: 'up{instance="a",job="node",node="spark-1",role="head"}'
        values: '1x10'
      - series: 'up{instance="b",job="node",node="spark-2",role="worker"}'
        values: '1x10'
      - series: 'up{instance="c",job="node",node="spark-3",role="member"}'
        values: '0x10'
    promql_expr_test:
      - expr: fleet:sparks:total
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:sparks:total'
            value: 3
      - expr: fleet:sparks:up
        eval_time: 5m
        exp_samples:
          - labels: 'fleet:sparks:up'
            value: 2

  - interval: 1m
    name: "a node with no swap configured reads 0, not NaN"
    input_series:
      - series: 'node_memory_SwapTotal_bytes{instance="a",job="node",node="spark-3",role="member"}'
        values: '0x10'
      - series: 'node_memory_SwapFree_bytes{instance="a",job="node",node="spark-3",role="member"}'
        values: '0x10'
    promql_expr_test:
      - expr: node:swap_used_percent:current
        eval_time: 5m
        exp_samples:
          - labels: 'node:swap_used_percent:current{instance="a",job="node",node="spark-3",role="member"}'
            value: 0

  - interval: 1m
    name: "kernel fault total leaves out link changes and application crashes"
    input_series:
      - series: 'spark_kernel_events_total{instance="a",job="node",node="spark-2",role="worker",kind="link_down"}'
        values: '0+1x90'
      - series: 'spark_kernel_events_total{instance="a",job="node",node="spark-2",role="worker",kind="segfault"}'
        values: '0+1x90'
      - series: 'spark_kernel_events_total{instance="a",job="node",node="spark-2",role="worker",kind="pcie_aer"}'
        values: '0x30 1x60'
    promql_expr_test:
      - expr: round(node:kernel_faults:increase1h)
        eval_time: 50m
        exp_samples:
          - labels: '{node="spark-2"}'
            value: 1

  # ======================================================== alerts
  - interval: 1m
    name: "a Spark that booted five minutes ago says so"
    input_series:
      - series: "node_boot_time_seconds{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: SparkRebooted
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "info"
            exp_annotations:
              description: "Compare spark_nvme_unsafe_shutdowns_total: if it rose, this was a power cut or a hard reset, not a clean reboot. A worker reboot also wedges the head's engine until the controller recovers it."
              summary: "spark-2 booted 5m 0s ago"

  - interval: 1m
    name: "and stops saying so after fifteen minutes"
    input_series:
      - series: "node_boot_time_seconds{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkRebooted
        exp_alerts: []

  - interval: 1m
    name: "an unsafe shutdown means a power cut or hard reset"
    input_series:
      - series: "spark_nvme_unsafe_shutdowns_total{device=\"nvme0\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '5x10 6x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkUncleanShutdown
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              device: "nvme0"
            exp_annotations:
              description: "The drive counted a shutdown it was not warned about. Databases on this Spark went through crash recovery; check the web index, which a power cut has corrupted before (2026-10-29)."
              summary: "spark-2 lost power or was hard-reset"

  - interval: 1m
    name: "a steady power-loss count is history, not news"
    input_series:
      - series: "spark_nvme_unsafe_shutdowns_total{device=\"nvme0\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '28x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SparkUncleanShutdown
        exp_alerts: []

  - interval: 1m
    name: "all tasks stalled on memory a fifth of the time"
    input_series:
      - series: "node_pressure_memory_stalled_seconds_total{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+12x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkMemoryStalling
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              description: "All tasks were blocked waiting for memory. On a unified-memory machine this delays the model directly, even when the free figure still looks fine."
              summary: "spark-2 stalled on memory 20% of the time"

  - interval: 1m
    name: "the head baseline of 3 percent does not fire"
    input_series:
      - series: "node_pressure_memory_stalled_seconds_total{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+1.8x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SparkMemoryStalling
        exp_alerts: []

  - interval: 1m
    name: "all tasks stalled on disk"
    input_series:
      - series: "node_pressure_io_stalled_seconds_total{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+24x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: SparkIoStalling
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              summary: "spark-2 stalled on disk 40% of the time"

  - interval: 1m
    name: "swapping far above the usual pressure"
    input_series:
      - series: "node_vmstat_pswpin{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+600000x60'
      - series: "node_vmstat_pswpout{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: SparkSwapThrashing
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              description: "Sustained swap traffic slows everything on the node and wears the NVMe. Find the consumer on the Spark dashboard, Memory row."
              summary: "spark-2 swapping 10000 pages/s"

  - interval: 1m
    name: "the head baseline of 3000 pages per second does not fire"
    input_series:
      - series: "node_vmstat_pswpin{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+90000x60'
      - series: "node_vmstat_pswpout{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+90000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: SparkSwapThrashing
        exp_alerts: []

  - interval: 1m
    name: "a filesystem goes read-only"
    input_series:
      - series: "node_filesystem_readonly{device=\"/dev/nvme0n1p2\",fstype=\"ext4\",mountpoint=\"/\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x3 1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: SparkFilesystemReadOnly
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "critical"
              device: "/dev/nvme0n1p2"
              fstype: "ext4"
              mountpoint: "/"
            exp_annotations:
              description: "The kernel does this after a filesystem error. Every write on this mount now fails."
              summary: "/ on spark-2 went read-only"

  - interval: 1m
    name: "a read-only EFI partition is normal"
    input_series:
      - series: "node_filesystem_readonly{device=\"/dev/nvme0n1p1\",fstype=\"vfat\",mountpoint=\"/boot/efi\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: SparkFilesystemReadOnly
        exp_alerts: []

  - interval: 1m
    name: "inodes running out"
    input_series:
      - series: "node_filesystem_files_free{device=\"/dev/nvme0n1p2\",fstype=\"ext4\",mountpoint=\"/\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '5x60'
      - series: "node_filesystem_files{device=\"/dev/nvme0n1p2\",fstype=\"ext4\",mountpoint=\"/\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '100x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: SparkInodesLow
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              device: "/dev/nvme0n1p2"
              fstype: "ext4"
              mountpoint: "/"
            exp_annotations:
              summary: "/ on spark-2 has 5% of its inodes left"

  - interval: 1m
    name: "the disk is on course to fill within a week"
    input_series:
      - series: "node_filesystem_avail_bytes{device=\"/dev/nvme0n1p2\",fstype=\"ext4\",mountpoint=\"/\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1000000000000-1000000000x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkDiskWillFillWithinAWeek
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              device: "/dev/nvme0n1p2"
              fstype: "ext4"
              mountpoint: "/"
            exp_annotations:
              summary: "spark-2 root filesystem fills within a week at the current rate"

  - interval: 1m
    name: "a flat disk never fires"
    input_series:
      - series: "node_filesystem_avail_bytes{device=\"/dev/nvme0n1p2\",fstype=\"ext4\",mountpoint=\"/\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1000000000000x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkDiskWillFillWithinAWeek
        exp_alerts: []

  - interval: 1m
    name: "the clock stops being synchronised"
    input_series:
      - series: "node_timex_sync_status{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1x3 0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: SparkClockNotSynced
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              summary: "spark-2 clock is not synchronised"

  - interval: 1m
    name: "the clock is far off"
    input_series:
      - series: "node_timex_offset_seconds{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0.2x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkClockOffset
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              summary: "spark-2 clock is off by 200ms"

  - interval: 1m
    name: "the worker usual swing of 54 ms does not fire"
    input_series:
      - series: "node_timex_offset_seconds{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0.054x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkClockOffset
        exp_alerts: []

  - interval: 1m
    name: "a link keeps flapping"
    input_series:
      - series: "node_network_carrier_changes_total{device=\"enP7s7\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkLinkFlapping
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              device: "enP7s7"
            exp_annotations:
              description: "A clean reboot of a peer is two changes. More means a cable, a port or a switch."
              summary: "enP7s7 on spark-2 is flapping"

  - interval: 1m
    name: "one peer reboot is two carrier changes and does not fire"
    input_series:
      - series: "node_network_carrier_changes_total{device=\"enp1s0f1np1\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x5 2x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SparkLinkFlapping
        exp_alerts: []

  - interval: 1m
    name: "a NIC reports errors"
    input_series:
      - series: "node_network_receive_errs_total{device=\"enP7s7\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+120x30'
      - series: "node_network_transmit_errs_total{device=\"enP7s7\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: SparkNicErrors
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              device: "enP7s7"
            exp_annotations:
              summary: "enP7s7 on spark-2: 2.0 errors/s"

  - interval: 1m
    name: "a tenth of TCP segments are retransmitted"
    input_series:
      - series: "node_netstat_Tcp_RetransSegs{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+1200x40'
      - series: "node_netstat_Tcp_OutSegs{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+12000x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: SparkTcpRetransmitsHigh
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              summary: "spark-2 retransmits 10% of TCP segments"

  - interval: 1m
    name: "retransmits on an idle machine mean nothing"
    input_series:
      - series: "node_netstat_Tcp_RetransSegs{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+6x40'
      - series: "node_netstat_Tcp_OutSegs{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: SparkTcpRetransmitsHigh
        exp_alerts: []

  - interval: 1m
    name: "connection tracking is nearly full"
    input_series:
      - series: "node_nf_conntrack_entries{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '90x30'
      - series: "node_nf_conntrack_entries_limit{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '100x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SparkConntrackNearlyFull
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              description: "At the limit the kernel drops new connections, Docker's included."
              summary: "spark-2 connection tracking table 90% full"

  - interval: 1m
    name: "file descriptors are nearly used up"
    input_series:
      - series: "node_filefd_allocated{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '90x30'
      - series: "node_filefd_maximum{instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '100x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SparkFileDescriptorsHigh
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
            exp_annotations:
              summary: "spark-2 used 90% of its file descriptors"

  - interval: 1m
    name: "a failed service is named in the alert"
    input_series:
      - series: "node_systemd_unit_state{name=\"ssh.service\",state=\"failed\",type=\"notify\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              name: "ssh.service"
              state: "failed"
              type: "notify"
            exp_annotations:
              description: "On that machine: systemctl status ssh.service"
              summary: "ssh.service failed on spark-2"

  - interval: 1m
    name: "a service that has not failed does not fire"
    input_series:
      - series: "node_systemd_unit_state{name=\"ssh.service\",state=\"failed\",type=\"notify\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: SystemdUnitFailed
        exp_alerts: []

  - interval: 1m
    name: "docker stopped"
    input_series:
      - series: "node_systemd_unit_state{name=\"docker.service\",state=\"active\",type=\"notify\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CoreServiceNotActive
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "critical"
              name: "docker.service"
              state: "active"
              type: "notify"
            exp_annotations:
              summary: "docker.service is not active on spark-2"

  - interval: 1m
    name: "the host guard stopped"
    input_series:
      - series: "node_systemd_unit_state{name=\"techsara-host-guard.service\",state=\"active\",type=\"oneshot\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostGuardNotActive
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              name: "techsara-host-guard.service"
              state: "active"
              type: "oneshot"
            exp_annotations:
              description: "scripts/host-guard.sh verify --role <role>, as root on that machine."
              summary: "The host packet filter is not active on spark-2"

  - interval: 1m
    name: "a new Spark has no host guard"
    input_series:
      - series: "spark_node_info{dgx_os=\"7.2.3\",hostname=\"spark-abcd\",product=\"DGX Spark\",serial=\"1\",instance=\"192.168.9.68:9100\",job=\"node\",node=\"spark-2\",role=\"worker\"}"
        values: '1x100'
    alert_rule_test:
      - eval_time: 90m
        alertname: HostGuardNotInstalled
        exp_alerts:
          - exp_labels:
              instance: "192.168.9.68:9100"
              job: "node"
              node: "spark-2"
              role: "worker"
              severity: "warning"
              dgx_os: "7.2.3"
              hostname: "spark-abcd"
              product: "DGX Spark"
              serial: "1"
            exp_annotations:
              description: "Its exporters are readable from the office LAN. See docs/MONITORING.md, Adding a Spark."
              summary: "spark-2 has no host packet filter"

  - interval: 1m
    name: "a Spark with the unit is not reported as missing it"
    input_series:
