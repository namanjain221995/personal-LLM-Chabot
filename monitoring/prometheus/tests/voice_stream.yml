# promtool unit tests for monitoring/prometheus/rules/voice-stream.yml (live
# dictation, 2026-09-29). Run from the repo root with the pinned image:
#
#   IMG=$(grep -o 'prom/prometheus@sha256:[0-9a-f]*' compose/compose.monitoring.yaml | head -1)
#   docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool "$IMG" \
#     test rules /p/tests/voice_stream.yml
#
# promtool compares labels AND every annotation, so these tests also pin the
# rendered wording. Label sets are the real scrape labels (prometheus.yml):
#   orchestrator: instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"
#   stt-stream:   instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream"
# (the engine's instance is a placeholder for the worker's management address;
# no rule joins on it). Buckets use the gateway's float spelling (le="1.0"),
# which is also what Prometheus 3 normalises `le` to when it scrapes. Counters
# start at 0 because the gateway and the engine register every label value at
# zero, so the first event after a restart is visible to increase().
#
# Every "does not fire" case is a shape the design produces with nothing
# wrong: one reconnect replaying its buffered audio, one quiet dictation, the
# wide-profile final latency, a one-minute engine restart, a frontend deploy,
# people cancelling recordings, live dictation switched off, a near-idle
# profile, a tail decoded after its audio stopped, one person refused twice.

rule_files:
  - ../rules/voice-stream.yml

evaluation_interval: 15s

group_eval_order:
  - voice-stream-recording
  - voice-stream

tests:
  # ======================================================== recording rules
  - name: The gateway's latencies, speaking load and open streams are recorded
    interval: 15s
    input_series:
      # First partials all in (0.3, 0.5]: p95 = 0.3 + 0.2 * 0.95.
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.3"}'
        values: '0x40'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.5"}'
        values: '0+4x40'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+4x40'
      # Finals all in (0.75, 1.0]: p95 = 0.75 + 0.25 * 0.95.
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.75"}'
        values: '0x40'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="1.0"}'
        values: '0+4x40'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+4x40'
      # Partial lag in (0.2, 0.3], final lag in (0.75, 1.0].
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="partial",le="0.2"}'
        values: '0x40'
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="partial",le="0.3"}'
        values: '0+12x40'
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="partial",le="+Inf"}'
        values: '0+12x40'
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="final",le="0.75"}'
        values: '0x40'
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="final",le="1.0"}'
        values: '0+4x40'
      - series: 'voice_stream_event_lag_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",event="final",le="+Inf"}'
        values: '0+4x40'
      # Two people speaking: 30 s of audio arrives every 15 s.
      - series: 'voice_stream_audio_received_seconds_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+30x40'
      - series: 'voice_stream_sessions_active{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '2x40'
    promql_expr_test:
      - expr: round(cluster:voice_stream_first_partial_seconds:p95_5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0.49
      - expr: round(cluster:voice_stream_final_seconds:p95_5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0.9875
      - expr: round(event:voice_stream_event_lag_seconds:p95_5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{event="partial"}'
            value: 0.295
          - labels: '{event="final"}'
            value: 0.9875
      - expr: round(cluster:voice_stream_audio_received_seconds:rate5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 2
      - expr: cluster:voice_stream_sessions_active:sum
        eval_time: 8m
        exp_samples:
          - labels: 'cluster:voice_stream_sessions_active:sum'
            value: 2

  - name: The engine's real-time factor, audio rate and open streams are recorded per profile
    interval: 15s
    input_series:
      # en-fast: one stream, 3 s of decoding per 15 s of audio (RTF 0.2).
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-fast"}'
        values: '0+3x40'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-fast"}'
        values: '0+15x40'
      # multi-wide: two streams, RTF 0.3.
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-wide"}'
        values: '0+9x40'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-wide"}'
        values: '0+30x40'
      # multi-fast: idle, so it has no real-time factor at all (not NaN).
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-fast"}'
        values: '0x40'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-fast"}'
        values: '0x40'
      - series: 'stt_stream_active_streams{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-fast"}'
        values: '1x40'
      - series: 'stt_stream_active_streams{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-wide"}'
        values: '2x40'
      - series: 'stt_stream_active_streams{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-fast"}'
        values: '0x40'
    promql_expr_test:
      - expr: round(profile:stt_stream_real_time_factor:ratio_rate5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{profile="en-fast"}'
            value: 0.2
          - labels: '{profile="multi-wide"}'
            value: 0.3
      # (3 + 9) / (15 + 30) of the whole engine.
      - expr: round(cluster:stt_stream_real_time_factor:ratio_rate5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0.2667
      - expr: round(profile:stt_stream_audio_seconds:rate5m, 0.0001)
        eval_time: 8m
        exp_samples:
          - labels: '{profile="en-fast"}'
            value: 1
          - labels: '{profile="multi-wide"}'
            value: 2
          - labels: '{profile="multi-fast"}'
            value: 0
      - expr: profile:stt_stream_active_streams:sum
        eval_time: 8m
        exp_samples:
          - labels: 'profile:stt_stream_active_streams:sum{profile="en-fast"}'
            value: 1
          - labels: 'profile:stt_stream_active_streams:sum{profile="multi-wide"}'
            value: 2
          - labels: 'profile:stt_stream_active_streams:sum{profile="multi-fast"}'
            value: 0

  - name: A tail decoded after its audio stopped records no real-time factor, never +Inf
    interval: 15s
    input_series:
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-wide"}'
        values: '0+1x40'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-wide"}'
        values: '0x40'
    promql_expr_test:
      - expr: profile:stt_stream_real_time_factor:ratio_rate5m
        eval_time: 8m
        exp_samples: []
      - expr: cluster:stt_stream_real_time_factor:ratio_rate5m
        eval_time: 8m
        exp_samples: []
    alert_rule_test:
      - eval_time: 8m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts: []

  # ========================================= VoiceStreamFirstPartialSlow
  - name: First words slower than 1.5 s for one utterance in ten, held 10 minutes, warns
    interval: 15s
    input_series:
      # 20 first partials per 15 s: 18 in (0.3, 0.5], 2 in (2.0, 3.0]. The
      # p95 falls halfway into (2.0, 3.0]: 2.5 s.
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.5"}'
        values: '0+18x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="2.0"}'
        values: '0+18x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="3.0"}'
        values: '0+20x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+20x100'
      - series: 'voice_stream_first_partial_seconds_count{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+20x100'
    alert_rule_test:
      # Pending since 15 s (the first evaluation with two samples).
      - eval_time: 10m
        alertname: VoiceStreamFirstPartialSlow
        exp_alerts: []
      - eval_time: 11m
        alertname: VoiceStreamFirstPartialSlow
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream }
            exp_annotations:
              summary: "Live dictation: the first words of an utterance take 2.5 s to appear (p95, 5 minutes)"
              description: >-
                More than one utterance in twenty waited over 1.5 s between its
                first audio reaching the orchestrator and its first words reaching
                the browser, for 10 minutes with at least 20 utterances per 5
                minutes. The design target is a few hundred milliseconds. With
                VoiceStreamEngineFallingBehind the engine is short of CPU; with
                VoiceStreamDisconnectsAbnormal this is audio replayed after
                reconnects; with neither, compare the event-lag panel with the
                engine RTF to see which side is slow.
              runbook: monitoring/developer-api/README.md#live-dictation-latency
              safe_command: "scripts/stt-stream.sh status"
      - eval_time: 11m
        alertname: VoiceStreamFinalSlow
        exp_alerts: []

  - name: One reconnect replaying a minute of audio does not warn about first words
    interval: 15s
    input_series:
      # For the first minute every first partial is replayed audio decoded in
      # a burst (2-3 s after its samples arrived); after that, live speech at
      # 0.3-0.5 s. The burst holds the 5-minute p95 above 1.5 s for about
      # five and a half minutes, never the ten the alert needs.
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.3"}'
        values: '0x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="0.5"}'
        values: '0x4 20+20x95'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="2.0"}'
        values: '0x4 20+20x95'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="3.0"}'
        values: '0+20x4 100+20x95'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+20x4 100+20x95'
      - series: 'voice_stream_first_partial_seconds_count{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+20x4 100+20x95'
    promql_expr_test:
      # Inside the burst's window the p95 is in (2.0, 3.0]: at 4m, 80 replayed
      # and 240 live, so rank 304 lands 64 of 80 into it. Once the burst has
      # left the window it is back in (0.3, 0.5].
      - expr: round(cluster:voice_stream_first_partial_seconds:p95_5m, 0.0001)
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 2.8
      - expr: round(cluster:voice_stream_first_partial_seconds:p95_5m, 0.0001)
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0.49
    alert_rule_test:
      - eval_time: 5m
        alertname: VoiceStreamFirstPartialSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: VoiceStreamFirstPartialSlow
        exp_alerts: []

  - name: A quiet dictation with slow first words is below the floor
    interval: 15s
    input_series:
      # One utterance a minute, every one slow: about 5 per 5 minutes, and the
      # alert needs 20 before a p95 means anything.
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="2.0"}'
        values: '0x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="3.0"}'
        values: '0+0.25x100'
      - series: 'voice_stream_first_partial_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+0.25x100'
      - series: 'voice_stream_first_partial_seconds_count{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+0.25x100'
    alert_rule_test:
      - eval_time: 15m
        alertname: VoiceStreamFirstPartialSlow
        exp_alerts: []

  # ================================================ VoiceStreamFinalSlow
  - name: Finals slower than 2 s for one utterance in ten, held 10 minutes, warn
    interval: 15s
    input_series:
      # 18 finals per 15 s in (0.75, 1.0], 2 in (3.0, 5.0]: p95 4.0 s.
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="1.0"}'
        values: '0+18x100'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="3.0"}'
        values: '0+18x100'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="5.0"}'
        values: '0+20x100'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+20x100'
      - series: 'voice_stream_final_seconds_count{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+20x100'
    alert_rule_test:
      - eval_time: 10m
        alertname: VoiceStreamFinalSlow
        exp_alerts: []
      - eval_time: 11m
        alertname: VoiceStreamFinalSlow
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream }
            exp_annotations:
              summary: "Live dictation: utterances commit 4.0 s after their last word (p95, 5 minutes)"
              description: >-
                More than one final in twenty came over 2 s after the utterance's
                last audio reached the orchestrator, for 10 minutes with at least
                20 finals per 5 minutes. The design is 0.5-1 s: the engine waits
                0.6 s of silence (STT_ENDPOINT_S), and finals measured 0.68-0.83 s
                at p50 on the worker. Same triage as the first-words alert.
              runbook: monitoring/developer-api/README.md#live-dictation-latency
              safe_command: "scripts/stt-stream.sh status"

  - name: Finals at the wide profile's normal 1.0-1.5 s do not warn
    interval: 15s
    input_series:
      # Every final in (1.0, 1.5]: p95 1.475 s, an overflow stream on a
      # 560 ms profile waiting its extra chunk.
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="1.0"}'
        values: '0x100'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="1.5"}'
        values: '0+20x100'
      - series: 'voice_stream_final_seconds_bucket{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",le="+Inf"}'
        values: '0+20x100'
      - series: 'voice_stream_final_seconds_count{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator"}'
        values: '0+20x100'
    promql_expr_test:
      - expr: round(cluster:voice_stream_final_seconds:p95_5m, 0.0001)
        eval_time: 15m
        exp_samples:
          - labels: '{}'
            value: 1.475
    alert_rule_test:
      - eval_time: 15m
        alertname: VoiceStreamFinalSlow
        exp_alerts: []

  # ====================================== VoiceStreamEngineFallingBehind
  - name: A profile decoding at 0.9 of real time for 5 minutes warns for that profile only
    interval: 15s
    input_series:
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-fast"}'
        values: '0+13.5x100'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-fast"}'
        values: '0+15x100'
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-fast"}'
        values: '0+3x100'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-fast"}'
        values: '0+15x100'
      - series: 'voice_stream_rejections_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="capacity"}'
        values: '0x100'
    alert_rule_test:
      # rate() divides by the whole 5 minutes, so a stream that started at 0
      # reads 0.5 audio-s/s only at 2m30s: pending from there, firing at 7m30s.
      - eval_time: 7m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts: []
      - eval_time: 8m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream, profile: en-fast, cause: decode_rtf }
            exp_annotations:
              summary: "Live dictation engine: profile en-fast spends 0.90 s decoding per second of audio"
              description: >-
                decode_rtf: a profile has needed more than 0.8 s of decoding per
                second of audio for 5 minutes; one more stream can push it past
                real time, and then every stream on it falls behind.
                capacity_refusals: streams were refused because every engine
                profile for their language was full, or the gateway reached
                VOICE_LIVE_MAX_STREAMS; the refusals panel shows the engine's own
                count beside the gateway's. The engine is held to eight of the
                worker's cores so that chat does not pay for it: 12 streams cost
                chat nothing measurable, while 48 streams with every core busy cost
                it 11-16% of its decode speed. More capacity trades against chat
                and is the owner's decision.
              runbook: monitoring/developer-api/README.md#live-dictation-engine
              safe_command: "scripts/stt-stream.sh status"

  - name: Streams refused at capacity warn, whichever side was full
    interval: 15s
    input_series:
      # A browser refused at capacity retries with backoff while it records:
      # one refusal per 15 s at the 15 s cap.
      - series: 'voice_stream_rejections_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="capacity"}'
        values: '0+1x100'
      - series: 'voice_stream_rejections_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="voice_off"}'
        values: '0+4x100'
    alert_rule_test:
      # Three refusals by 45 s, so pending from there.
      - eval_time: 5m30s
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts: []
      - eval_time: 7m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream, cause: capacity_refusals }
            exp_annotations:
              summary: "Live dictation refused 28 stream(s) at capacity in 10 minutes"
              description: >-
                decode_rtf: a profile has needed more than 0.8 s of decoding per
                second of audio for 5 minutes; one more stream can push it past
                real time, and then every stream on it falls behind.
                capacity_refusals: streams were refused because every engine
                profile for their language was full, or the gateway reached
                VOICE_LIVE_MAX_STREAMS; the refusals panel shows the engine's own
                count beside the gateway's. The engine is held to eight of the
                worker's cores so that chat does not pay for it: 12 streams cost
                chat nothing measurable, while 48 streams with every core busy cost
                it 11-16% of its decode speed. More capacity trades against chat
                and is the owner's decision.
              runbook: monitoring/developer-api/README.md#live-dictation-engine
              safe_command: "scripts/stt-stream.sh status"

  - name: A near-idle profile, a healthy busy one and one person refused twice do not warn
    interval: 15s
    input_series:
      # en-wide: RTF 0.9 on a tenth of a stream (warm-up and short clips).
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-wide"}'
        values: '0+1.35x100'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="en-wide"}'
        values: '0+1.5x100'
      # multi-wide: three streams at RTF 0.2.
      - series: 'stt_stream_compute_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-wide"}'
        values: '0+9x100'
      - series: 'stt_stream_audio_seconds_total{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream",profile="multi-wide"}'
        values: '0+45x100'
      # Two capacity refusals, then room again.
      - series: 'voice_stream_rejections_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="capacity"}'
        values: '0x10 1x10 2x79'
    alert_rule_test:
      - eval_time: 10m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts: []
      - eval_time: 20m
        alertname: VoiceStreamEngineFallingBehind
        exp_alerts: []

  # =========================================== VoiceStreamErrorRatioHigh
  - name: Half the live streams failing on the server for 10 minutes warns
    interval: 15s
    input_series:
      # A recording browser retrying a dead engine at the 15 s backoff cap,
      # beside healthy streams, beside a capacity storm that must not dilute
      # the ratio.
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="engine_unavailable"}'
        values: '0+1x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="error"}'
        values: '0x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+1x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="rejected"}'
        values: '0+5x100'
    alert_rule_test:
      # Three failures by 45 s, so pending from there.
      - eval_time: 10m30s
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream }
            exp_annotations:
              summary: "Live dictation: 50% of live streams failed on the server side (5 minutes)"
              description: >-
                Streams ending engine_unavailable (no engine answered, or it went
                away mid-stream) or error (the gateway failed), over 10% of the
                streams that ran with at least 3 per 5 minutes, for 10 minutes.
                Browsers retry these with backoff while recording, so one broken
                engine is a steady stream of failures; an engine restart of a
                minute is not. People still get the transcript after Stop; they
                lose the live words. The errors-by-reason panel says which side
                failed.
              runbook: monitoring/developer-api/README.md#live-dictation-failures-and-drops
              safe_command: "scripts/stt-stream.sh status"
      - eval_time: 11m
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts: []

  - name: A one-minute engine restart does not warn about failed streams
    interval: 15s
    input_series:
      # Eight streams fail during the first minute, then none; people keep
      # finishing recordings throughout.
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="engine_unavailable"}'
        values: '0+2x4 8x96'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+1x100'
    alert_rule_test:
      # 11m is the one that matters: over a 15-minute window this burst would
      # still be above 10% of the streams and firing then (checked by
      # mutation, 2026-09-29).
      - eval_time: 5m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []
      - eval_time: 11m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []

  - name: One failed stream among many is below the floor
    interval: 15s
    input_series:
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="error"}'
        values: '0x10 1x90'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+0.25x100'
    alert_rule_test:
      - eval_time: 15m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []

  # ======================================= VoiceStreamDisconnectsAbnormal
  - name: Half the live streams dropping for 10 minutes warns
    interval: 15s
    input_series:
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="disconnected"}'
        values: '0+1x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="superseded"}'
        values: '0+1x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="idle"}'
        values: '0x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+2x100'
    alert_rule_test:
      # Six drops by 45 s (the floor is five), so pending from there.
      - eval_time: 10m30s
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts: []
      - eval_time: 11m
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream }
            exp_annotations:
              summary: "Live dictation: 50% of live streams dropped (disconnected, idle or superseded, 5 minutes)"
              description: >-
                Over a quarter of the streams that ran ended without either side
                closing them, went silent, or were taken over by a reconnect, with
                at least 5 per 5 minutes, for 10 minutes. A deploy drops every open
                stream once and does not hold that long. The metrics name no
                person, so one person's bad network and a broken tunnel look alike
                here; the gateway's per-stream close log line (outcome, reconnect)
                and the frontend relay's ws_close lines tell them apart.
              runbook: monitoring/developer-api/README.md#live-dictation-failures-and-drops
              safe_command: "scripts/stt-stream.sh status"
      - eval_time: 11m
        alertname: VoiceStreamErrorRatioHigh
        exp_alerts: []

  - name: A frontend deploy dropping six open streams at once does not warn
    interval: 15s
    input_series:
      # The relay destroys every socket at the deploy (5m15s); the browsers
      # reconnect and finish normally. One completion a minute around it.
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="disconnected"}'
        values: '0x20 6x80'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+0.25x100'
    alert_rule_test:
      - eval_time: 8m
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts: []
      - eval_time: 20m
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts: []

  - name: People cancelling recordings from the browser is not a drop
    interval: 15s
    input_series:
      # Real drops above the floor (20 per 5 minutes), but only 1 in 8 of the
      # streams: 12.5%. Counting the cancels (a close frame, 1000/1001) as
      # drops would make it 50%.
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="client_closed"}'
        values: '0+3x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="completed"}'
        values: '0+4x100'
      - series: 'voice_stream_sessions_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",outcome="disconnected"}'
        values: '0+1x100'
    alert_rule_test:
      - eval_time: 15m
        alertname: VoiceStreamDisconnectsAbnormal
        exp_alerts: []

  # ================================================ VoiceStreamEngineDown
  - name: The engine unscrapeable while the gateway cannot reach it warns
    interval: 15s
    input_series:
      - series: 'up{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream"}'
        values: '0x40'
      - series: 'voice_stream_errors_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="engine_unavailable"}'
        values: '0+1x40'
      - series: 'voice_stream_errors_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="engine_timeout"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: VoiceStreamEngineDown
        exp_alerts: []
      - eval_time: 3m
        alertname: VoiceStreamEngineDown
        exp_alerts:
          - exp_labels: { severity: warning, service: stt-stream, instance: "worker:30009", job: stt-stream, node: spark-2, role: worker }
            exp_annotations:
              summary: "Live dictation engine on spark-2 is not answering, and the orchestrator failed to reach it"
              description: >-
                Prometheus cannot scrape the engine's /metrics, and the gateway
                counted engine_unavailable or engine_timeout in the last 15
                minutes: live dictation is configured, in use, and gives nobody
                live words. Recordings still transcribe after Stop, since whisper
                does not depend on this engine. Starting or recreating it is an
                operator's decision; it never involves the main model.
              runbook: monitoring/developer-api/README.md#live-dictation-engine
              safe_command: "scripts/stt-stream.sh status"

  - name: A down target with live dictation switched off does not warn
    interval: 15s
    input_series:
      # Before the engine is deployed, or after scripts/stt-stream.sh down:
      # the static target reads down by design and the gateway, with no
      # engine configured, never tries one.
      - series: 'up{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream"}'
        values: '0x80'
      - series: 'voice_stream_errors_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="engine_unavailable"}'
        values: '0x80'
      - series: 'voice_stream_errors_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="engine_timeout"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 20m
        alertname: VoiceStreamEngineDown
        exp_alerts: []

  - name: Gateway engine failures with the engine scrapeable are not this alert
    interval: 15s
    input_series:
      # The engine answers /metrics but refuses streams: the error ratio
      # alert's business, not "down".
      - series: 'up{instance="worker:30009",job="stt-stream",node="spark-2",role="worker",service="stt-stream"}'
        values: '1x40'
      - series: 'voice_stream_errors_total{instance="host.docker.internal:8080",job="orchestrator",node="spark-1",role="head",service="orchestrator",reason="engine_unavailable"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: VoiceStreamEngineDown
        exp_alerts: []
