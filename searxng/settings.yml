# SearXNG configuration for the TechSara platform (Phase 1 web search).
# Self-hosted, private metasearch. Only the orchestrator talks to it (internal
# docker network); it is never exposed to the host. The JSON output format is
# enabled so the orchestrator's SearxngProvider can consume results.
#
# The literal "ultrasecretkey" below is replaced at container start by the
# SEARXNG_SECRET env var (the official image's entrypoint does this sed swap) —
# set SEARXNG_SECRET in .env.
use_default_settings:
  engines:
    # Onion engines: no Tor here, so they fail to register and print an
    # ERROR at every container start. Removed, not disabled — disabled
    # engines still attempt registration.
    remove:
      - ahmia
      - torch
      # 403 from this host's egress IP even with a browser UA — an IP/ASN
      # block that no setting here can undo (probed 2026-08-30). Left in the
      # pool they fail every query and self-bench for 180 s forever.
      - mojeek
      - dogpile

server:
  secret_key: "ultrasecretkey"
  limiter: false          # single trusted internal caller
  image_proxy: false

search:
  safe_search: 1
  formats:
    - html
    - json               # <- required by SearxngProvider

ui:
  static_use_hash: true

# Engine supply is the real ceiling on how many sources a research answer can
# read — not any cap in the orchestrator. Out of the box only four general
# engines are live, and two of them (DuckDuckGo, Startpage) serve a CAPTCHA
# almost immediately, while Brave suspends after a handful of queries. Once all
# four are suspended, search returns ZERO results and the app quietly answers
# from model knowledge instead of the web.
#
# Widening the pool spreads the same queries across many independent upstream
# quotas, so no single engine is hit hard enough to suspend, and a suspension
# that does happen costs a fraction of the results instead of all of them.
# These all ship with SearXNG and need no API key and no account.
engines:
  # DuckDuckGo CAPTCHAs this host with suspended_time=0 — same never-bench
  # pathology as qwant below: it fails on EVERY query instead of suspending
  # itself the way startpage (3600s) does (logged 2026-08-30 post-restart).
  - name: duckduckgo
    disabled: true
  # Inherited from SearXNG's defaults and NEVER answers from this host.
  # Measured 2026-09-04 over eight varied queries: google cse 0/8,
  # startpage 0/8, brave 1/8 — and because a dead engine is waited on rather
  # than skipped, the three of them cost 533 ms of the 1.57 s a search took:
  # 34% of every query, spent waiting for nothing.
  #
  # DISABLED, NOT REMOVED. `remove` looks tidier and takes the whole instance
  # down: other engines declare `network: brave` and SearXNG resolves those
  # names at boot, so removing brave raises KeyError('brave') in
  # network.initialize and every worker exits. A disabled engine keeps its
  # network registered and is simply never queried, which is the part that
  # costs time.
  - name: google cse
    disabled: true
  - name: startpage
    disabled: true
  # The news-category sibling of the startpage engine above, and it fails the
  # same way: `categories=news` returned ('startpage news','Suspended: CAPTCHA')
  # on 2026-09-04. A CAPTCHA is an anti-bot decision by the upstream, not
  # something to work around, so the engine is simply not asked. The news pool
  # is healthy without it — the same query returned 58 results from duckduckgo
  # news, reuters, bing news and wikinews.
  - name: startpage news
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: false
  # Qwant CAPTCHAs this host and raises suspended_time=0, so SearXNG never
  # benches it — unlike DDG/Startpage it fails on EVERY query, spending part
  # of the result window on a guaranteed error (logged 2026-08-30).
  - name: qwant
    disabled: true
  # Yahoo's search endpoint answers "500 INKApi Error" to EVERY query from this
  # host — measured 0/8 on 2026-09-04 (the same nine queries bing/yandex/
  # duckduckgo-web all answered), and again after the suspension expired. The
  # homepage returns 200 from this container, so it is not DNS, egress or TLS:
  # it is Yahoo's own search backend refusing this traffic. Nothing in this
  # file can undo that, and while enabled it costs a guaranteed error per
  # query plus the 180 s suspension churn that follows it.
  - name: yahoo
    disabled: true
  # Inherited enabled from SearXNG's defaults and TIMES OUT on every general
  # query — 0/8 on 2026-09-04, and it is the reason a general search cost
  # 3.02 s instead of the ~0.9 s it costs once wikidata has benched itself.
  # The whole query waits on the 3.0 s outgoing.request_timeout for an engine
  # that never answers. query.wikidata.org itself responds 200 in 1.27 s from
  # this container, so the SPARQL endpoint behind the engine is what is slow,
  # not the network. Wikipedia (enabled, in the same general pool) already
  # covers the encyclopaedic angle.
  - name: wikidata
    disabled: true
  # Noise, measured 2026-09-04. For "who is the CEO of OpenAI" mwmbl returned
  # SEVENTY-SIX results led by openai.com/blog/openai-gym-beta (2016), an
  # OpenAIRE guidelines page and a Hustle piece about Uber scooters. Volume of
  # the wrong kind is not supply: every one of those competes for a slot in
  # the candidate pool the reranker then has to sift.
  - name: mwmbl
    disabled: true
  # Enabled here since 2026-08-30 and contributing NOTHING to the application
  # until now. SearXNG ships wikipedia with `display_type: ["infobox"]`, so a
  # normal article is emitted as an infobox and the `results` array stays
  # empty — measured 2026-09-04: "Alan Turing", "photosynthesis" and
  # "NVIDIA DGX Spark" each returned results=0, infoboxes=1, and NO error, so
  # nothing in any log ever said the engine was being ignored. The
  # orchestrator's SearxngProvider reads `data["results"]` only, so every one
  # of those summaries was dropped on the floor.
  #
  # Adding "list" (the upstream file documents this exact knob: "add 'list' to
  # the array to get results in the results list") puts the same summary in
  # `results` where the provider can see it, and KEEPS "infobox" so the HTML
  # UI still renders the panel. The payload is a clean encyclopaedic paragraph
  # with the canonical wikipedia URL — better evidence for a factual question
  # than a 140-character SERP snippet.
  - name: wikipedia
    disabled: false
    display_type: ["infobox", "list"]
  - name: github
    disabled: false
  # RATE LIMITED, not slow — so a bigger timeout would not have helped and was
  # not the fix. Probed directly against export.arxiv.org from this container
  # on 2026-09-04: HTTP 429 on 3 of 4 requests, and the ones that did answer
  # took 14.9 s and 15.7 s. arXiv's API asks for one request every 3 s, and
  # deep research fans several science queries out at once, so it trips the
  # limit immediately. Live effect: `categories=science` reported
  # ('arxiv','timeout') on 2/2 queries and both pinned to exactly 5.02 s —
  # arxiv WAS the science-pool tail.
  #
  # Disabling costs nothing measurable: the same two queries still returned 41
  # and 52 results from google scholar, semantic scholar, pubmed and openaire,
  # and Semantic Scholar indexes arXiv preprints anyway, so the preprints are
  # still reachable — just through an upstream that will talk to us.
  - name: arxiv
    disabled: true
  # Engine supply, measured 2026-08-30. The four engines that answer a default
  # general query here (google cse, bing, mwmbl, yahoo) are one Google IP-block
  # away from two, and google cse DID block this host during testing — the
  # block outlived SearXNG's 180 s bench and every retry re-armed it. These
  # These four ship disabled, need no key and no account, and each returned
  # results from this host on the day they were enabled; with the existing
  # pool they measured 70 unique URLs in 3.07 s. Independent quotas are the
  # whole point: no single upstream can take search down any more.
  #
  # "duckduckgo web" is a DIFFERENT engine from "duckduckgo" (disabled above
  # for its suspended_time=0 CAPTCHA); this one answered cleanly.
  #
  # NOT enabled: `marginalia` — it is absent from this SearXNG build's engine
  # set entirely (verified against the container's /config), so `disabled:
  # false` on it silently does nothing. Also seznam (Czech) and naver (Korean),
  # which DO work but are region search engines. They are
  # region search engines, and on the first live query after enabling them a
  # Korean blog and a Korean product page took two of the eight source slots
  # for an English question about DGX Spark. Volume is not the goal — usable
  # sources are. yandex stays because its index is general-web rather than
  # region-locked.
  # KEPT despite failing intermittently, and the reason is the failure MODE.
  # Measured 2026-09-04 it answers roughly half the time; the rest return
  # KeyError('results') in duckduckgo_web.py — DDG serving a shape that is not
  # the expected JSON, i.e. an anti-bot response. That is upstream behaviour we
  # cannot configure away.
  #
  # It stays because a FAST failure is nearly free, unlike the timeouts that
  # got yahoo/wikidata/arxiv/semantic-scholar disabled above. General queries
  # where duckduckgo web errored took 0.60-1.12 s — indistinguishable from the
  # ones where it succeeded — because the error comes back immediately instead
  # of burning the 3.0 s request budget. So it costs no latency and adds
  # results whenever it does answer. Disable it only if it starts timing out
  # rather than erroring.
  - name: duckduckgo web
    disabled: false
  - name: yandex
    disabled: false
  # Both index by DESIGN the part of the web this workspace never asks about.
  # Same probe, same query: searchmysite returned ten personal blogs, wiby
  # returned a blog collection, a transhumanism site and
  # philosophicalanthropology.net. Neither has any path to answering "who is
  # the CEO of OpenAI" — they are indexes of personal and old-style sites.
  #
  # They stay in the file rather than being removed because the 2026-08-30
  # note above is still true: engine supply IS the ceiling, and if the four
  # general engines are ever all suspended at once these are the fallback to
  # turn back on. Today all four answer 8/8, so the pool does not need them.
  - name: searchmysite
    disabled: true
  - name: wiby
    disabled: true

  # --- Category-pool engines (news / science). Same rule as the general pool:
  # an engine that never answers is not supply, it is latency. ---
  #
  # RATE LIMITED UPSTREAM, exactly like arxiv above, and confirmed against the
  # API rather than inferred: probed from this container 2026-09-04, the first
  # request took 19.31 s and the next two returned HTTP 429 with the body
  # "Too Many Requests. Please wait and try again or apply for a key for higher
  # rate limits." Live, it was 0/8 over eight science queries (timeout x2,
  # Suspended x3, parsing error x3) and it WAS the science tail: the queries it
  # had not yet benched itself on pinned to exactly 5.02 s.
  #
  # The pool is unaffected by removing it — the same eight queries still
  # answered 8/8 from google scholar, pubmed and openaire publications
  # (19-50 results each). Re-enable if an S2 API key is ever configured.
  - name: semantic scholar
    disabled: true
  # 429 "Too Many Requests" on both direct probes of search.brave.com/news
  # (2026-09-04), and 0/6 live over six news queries. Brave's general engine is
  # already disabled a few lines above for the same reason — this is the news
  # sibling of it and shares the same upstream quota, so it fails the same way.
  # The news pool is healthy without it: bing news 6/6, duckduckgo news 6/6,
  # reuters 5/6, mean 1.02 s.
  #
  # NOTE: `wikinews` is deliberately NOT disabled despite appearing alongside
  # brave.news as "too many requests" in the same run. That was a transient
  # burst, not a block: the exact URL SearXNG had just failed on returned
  # HTTP 200 three times in a row from this container, and once the 180 s
  # suspension expired the engine answered normally (5 results). Benching an
  # engine that recovers on its own would be throwing away working supply.
  - name: brave.news
    disabled: true

# Upstreams occasionally drop HTTP/2 streams mid-response, which httpx surfaces
# as RemoteProtocolError("Server disconnected") and costs that engine's whole
# result set for the query (logged 2026-08-30). HTTP/1.1 is the boring path
# that doesn't have this failure mode; one retry covers a flaky connection.
outgoing:
  enable_http2: false
  retries: 1
  # NO request_timeout override here, and that is a decision, not an omission.
  # SearXNG's own default is already request_timeout: 3.0 (verified in the
  # image's /usr/local/searxng/searx/settings.yml, line 179), so writing 3.0
  # here would change nothing and writing less would only cut good engines off.
  #
  # CORRECTION to the note that used to stand here. It read that a 3.0 s cap
  # "made things measurably worse: bing went from answering 8/8 to timing out
  # on 8/8". The observation was real; the diagnosis was wrong, and it was not
  # the timeout. Bing was failing on NAME RESOLUTION: `www.bing.com A` took
  # 5.05-8.01 s through the host's systemd-resolved stub and sometimes returned
  # "no servers could be reached", while the same query against 8.8.8.8 /
  # 1.1.1.1 / 9.9.9.9 answered in 0.03-0.09 s. A DNS stall longer than the 3.0 s
  # budget is recorded as an engine timeout, which benches bing for 180 s — so
  # it looked exactly like a timeout problem. The fix is the explicit `dns:`
  # list on the searxng service in compose.yaml; with it, bing resolves in
  # 0.02 s cold and went straight back to 8/8. Bing is in fact the FASTEST
  # engine here (0.23 s to /search once resolved), which is why it was worth
  # chasing rather than disabling.
  # Wikimedia's user-agent policy REJECTS a UA with no contact: query.wikidata.org
  # answered 403 "Please respect our user-agent policy" to the default
  # "SearXNG/2026.7.30", and 200 to the same request with a contact appended
  # (probed in-container 2026-08-30). That 403 is why the wikidata engine failed
  # to REGISTER at boot, not just to answer. The suffix is appended to the UA of
  # every outgoing request, so it is deliberately an organisation URL and
  # nothing personal.
  useragent_suffix: "+https://techsarasolutions.com"
