[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "sf-assistant"
version = "0.1.0"
description = "Salesforce assistant: knowledge agent, record agent over a local DuckDB snapshot, merge and checks."
requires-python = "==3.11.*"
# exactly web/requirements.lock (install with --no-deps from that lock; these pins document the same set)
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "cffi==2.1.1",
    "click==8.5.0",
    "cryptography==50.0.2",
    "duckdb==1.5.6",
    "fastapi==0.148.0",
    "h11==0.16.0",
    "httpcore2==2.13.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "jiter==0.17.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "numpy==2.4.6",
    "openai==3.27.0",
    "opentelemetry-api==1.45.1",
    "pandas==3.0.6",
    "pycparser==3.0",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "pyjwt==2.15.1",
    "python-dateutil==2.9.0.post0",
    "python-multipart==0.0.32",
    "rank-bm25==0.2.2",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sse-starlette==3.5.0",
    "starlette==1.9.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "iniconfig==2.3.1",
    "pluggy==1.7.0",
    "packaging==26.3",
    "pygments==2.21.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "certifi==2026.10.18",
]

[project.scripts]
sf-ask = "sf_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/parity stays out of this repository; a local copy is not collected either.
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "parity"]
