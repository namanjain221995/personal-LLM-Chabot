# Salesforce sync configuration — the eight standard objects synced in Phase 1 (spec §7).
#
# Per object:
#   fields:     columns pulled from Salesforce. Must include Id and SystemModstamp
#               (Id drives the DuckDB upsert, SystemModstamp drives the incremental
#               watermark). The loader rejects configs missing either.
#   rag_fields: long-text fields that are chunked (~800 tokens, 100 overlap),
#               embedded via the vLLM OpenAI-compatible /embeddings endpoint
#               and stored in the LanceDB `chunks` table.
#               Every rag_field must also be listed in fields.
#
# ── Adding a custom object later ─────────────────────────────────────────────
# Append an entry like the one below (uncommented). No code change is needed:
# the sync loop, Parquet/DuckDB storage and RAG indexing are driven entirely by
# this file. The first sync after adding it performs a Bulk API full extract,
# after which it switches to incremental SystemModstamp syncs automatically.
#
#   - name: Project__c
#     fields:
#       - Id
#       - Name
#       - Status__c
#       - Account__c
#       - Notes__c
#       - SystemModstamp
#     rag_fields:
#       - Notes__c
# ─────────────────────────────────────────────────────────────────────────────

